# =============================================================================
# Deployment manifest for ssl-service itself, read by the admin platform.
#
# Flow on a target node:
#   git clone (or pull) bitsfactor/ssl-service into /opt/ssl-service
#   write a fresh .env from `defaults` + per-deploy overrides + secrets
#   docker compose up -d --build
#   poll healthcheck until OK
#
# After this, `docker compose ps` shows the `ssl-service` container running
# and the probe in the admin UI flips to "running".
# =============================================================================

service: ssl-service
runtime: compose

compose_file: docker-compose.yml
install_dir_template: /opt/{name}

# Required at deploy time. ADMIN_TOKEN is intentionally NOT required —
# the deployed instance only starts its HTTP admin server when
# SSL_SERVICE_ENABLE_WEB_UI=true. Default deploys are headless workers
# (sync loop + Caddy reload) with no public-facing UI to harden.
required_env:
  - SSL_SERVICE_MODE
  - SSL_SERVICE_PG_DSN

# Sensible defaults. Operator typically saves these once into
# service.default_env via the Services > Edit dialog and forgets them.
defaults:
  SSL_SERVICE_MODE: readonly
  SSL_SERVICE_ENABLE_WEB_UI: "false"
  SSL_SERVICE_ADMIN_TOKEN: ""
  SSL_SERVICE_LOG_LEVEL: INFO
  SSL_SERVICE_ADMIN_BIND: 0.0.0.0
  SSL_SERVICE_ADMIN_PORT: "8088"
  SSL_SERVICE_ACME_EMAIL: domain@bitsfactor.com
  SSL_SERVICE_ACME_STAGING: "false"
  SSL_SERVICE_ACME_DNS_PROVIDER: cloudflare
  SSL_SERVICE_RENEW_BEFORE_DAYS: "30"
  SSL_SERVICE_POLL_INTERVAL_SECONDS: "30"
  TZ: Asia/Shanghai

# Container ports. The admin UI surfaces these in the deploy preview and
# can offer to wire up Caddy routes for them.
exposed_ports:
  - 80
  - 443
  - 8088

# Healthcheck — the admin polls this from inside the target node after
# `compose up` finishes. We hit Caddy's local admin port (always
# running regardless of SSL_SERVICE_ENABLE_WEB_UI) rather than the
# Python admin HTTP server (which is only up when WEB_UI=true).
healthcheck:
  url: http://localhost:2019/config/
  expect_status: 200
  timeout_seconds: 60
  retries: 12
  interval_seconds: 5

# Persistent dirs the platform pre-creates (used as bind mounts in
# docker-compose.yml). config/ is gone — env-only now.
volumes:
  - /opt/{name}/state
  - /opt/{name}/logs

depends_on: []
hooks: {}
