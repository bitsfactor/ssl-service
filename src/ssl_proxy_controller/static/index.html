    // Group-filter pill bar — populated after nodes load. Always present
    // in the DOM so we can patch its contents without re-rendering the page.
    card.appendChild(h("div", { id: "nodes-group-filter",
      style: "display: none; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 16px; background: var(--surface-alt); border-bottom: 1px solid var(--border); font-size: 12px;" }));
    // Bulk action bar — shows up only after rows have been selected.
    if (App.mode === "readwrite") {
      const bar = h("div", { id: "nodes-bulk-bar",
        style: "display: none; gap: 8px; align-items: center; padding: 8px 16px; background: var(--surface-alt); border-bottom: 1px solid var(--border); font-size: 13px;" });
      bar.appendChild(h("span", { id: "nodes-bulk-count", class: "muted" }, "0 selected"));
      bar.appendChild(h("div", { style: "flex: 1" }));
      bar.appendChild(h("button", { class: "btn btn-sm",
        onclick: () => bulkProbeSelected() }, "Probe"));
      bar.appendChild(h("button", { class: "btn btn-sm",
        title: "Run the Initialize wizard's flow on every selected node in parallel",
        onclick: () => bulkInitializeSelected() }, "Initialize"));
      bar.appendChild(h("button", { class: "btn btn-sm",
        onclick: () => bulkClearSelection() }, "Clear"));
      card.appendChild(bar);
    }
    const body = h("div", { class: "card-body tight", id: "nodes-body" });
    // Render the page shell with a non-blocking skeleton so the user sees
    // the page structure instantly. Data loads asynchronously below.
    body.appendChild(h("div", { class: "muted", style: "padding: 24px; text-align: center" }, "Loading nodes…"));
    card.appendChild(body);
    root.appendChild(card);

    // Kick off the actual data load (does not await — keeps the page reactive).
    loadNodesIntoBody();
  }

  // Re-fetch the node list and render it into the existing #nodes-body
  // container. Fires the (cheap) /api/nodes call and the (slower)
  // /api/node-statuses call in parallel — rows render the moment node
  // metadata arrives, then status badges fill in when statuses arrive.
  async function loadNodesIntoBody() {
    const body = document.getElementById("nodes-body");
    if (!body) return;
    const nodesPromise = api("GET", "/api/nodes");
    const statusesPromise = api("GET", "/api/node-statuses").catch((err) => {
      // Backend may be on the old build that doesn't have this endpoint.
      // Fall back to legacy behaviour: ask /api/nodes?with_status=1.
      if (err.status === 404) {
        return api("GET", "/api/nodes?with_status=1").then((r) => {
          const map = {};
          for (const n of (r.nodes || [])) {
            if (n.status) map[n.name] = n.status;
          }
          return { statuses: map, _legacy_nodes: r.nodes };
        });
      }
      throw err;
    });
    try {
      const resp = await nodesPromise;
      const allNodes = resp.nodes || [];
      // Refresh the group filter pill (the union of all groups across all
      // nodes — recomputed every load so newly-added groups show up).
      renderNodeGroupFilterBar(allNodes);
      // Apply the active group filter, if any.
      const filter = App.nodeGroupFilter || "";
      let nodes = allNodes;
      if (filter) {
        nodes = allNodes.filter((n) => Array.isArray(n.groups) && n.groups.includes(filter));
      }
      const counter = document.getElementById("nodes-count");
      if (counter) {
        if (filter) counter.textContent = `${nodes.length} of ${allNodes.length} (group: ${filter})`;
        else counter.textContent = `${nodes.length} node${nodes.length === 1 ? "" : "s"}`;
      }
      body.innerHTML = "";
      if (!nodes.length) {
        body.appendChild(h("div", { class: "empty" },
          h("div", { class: "title" }, filter ? `No nodes in group "${filter}"` : "No nodes registered"),
          h("div", { class: "sub" }, filter
            ? "Clear the group filter above to see all nodes."
            : (App.mode === "readwrite" ? "Add your first node above." : "This is a read-only admin.")),
        ));
        return;
      }
      // Render rows immediately with whatever status info /api/nodes
      // happened to return (none, on the new fast path).
      body.appendChild(renderNodesTable(nodes));
      // When statuses arrive, patch each row in place — no full re-render.
      statusesPromise.then((sresp) => {
        const statusMap = (sresp && sresp.statuses) || {};
        // Legacy shim: if the fallback came back, refresh the node list too.
        const legacyNodes = sresp && sresp._legacy_nodes;
        const nodeList = legacyNodes || nodes;
        for (const n of nodeList) {
          const status = statusMap[n.name] || null;
          const merged = Object.assign({}, n, { status });
          const tbody = findNodeTbody(n.name);
          if (tbody) tbody.replaceWith(renderNodeRow(merged));
        }
      }).catch((err) => {
        // Show a small inline note rather than blocking the whole view.
        toast("error", "Statuses unavailable", err.message || "");
      });
    } catch (err) {
      body.innerHTML = "";
      body.appendChild(h("div", { class: "muted", style: "padding: 16px; color: var(--danger)" },
        "Failed to load nodes: " + (err.message || "unknown error")));
      if (err.status === 401) showLogin();
    }
  }

  // Track the currently-open action menu so global click can close it.
  let _openActionMenu = null;
  document.addEventListener("click", (e) => {
    if (_openActionMenu && !_openActionMenu.contains(e.target)) {
      _openActionMenu.classList.remove("open");
      _openActionMenu = null;
    }
  });

  function buildNodeActionMenu(n) {
    const host = h("div", { class: "menu-host" });
    const trigger = h("button", { class: "btn btn-sm", title: "More actions",
      onclick: (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (_openActionMenu && _openActionMenu !== host) {
          _openActionMenu.classList.remove("open");
        }
        host.classList.toggle("open");
        _openActionMenu = host.classList.contains("open") ? host : null;
      } }, "Actions ▾");
    host.appendChild(trigger);
    const pop = h("div", { class: "menu-pop" });
    const closeMenu = () => { host.classList.remove("open"); _openActionMenu = null; };

    // Group: Inspect
    pop.appendChild(h("div", { class: "group-label" }, "Inspect"));
    pop.appendChild(h("button", { onclick: () => { closeMenu(); openNodeFullInfoModal(n.name); } }, "View full info"));
    pop.appendChild(h("button", { onclick: () => {
      closeMenu();
      openNodeModal(n, async (info) => {
        if (info && info.isEdit) {
          try { await refreshNodeRow(info.name, info.oldName); }
          catch (err) { toast("error", "Refresh failed", err.message); }
        } else {
          // Newly added node — fall back to full list refresh.
          loadNodesIntoBody();
        }
      });
    } }, "Edit details"));
    pop.appendChild(h("button", { onclick: () => { closeMenu(); openInitHistoryModal(n); } }, "Init history"));
    pop.appendChild(h("hr"));

    // Group: Lifecycle (readwrite only)
    if (App.mode === "readwrite") {
      pop.appendChild(h("div", { class: "group-label" }, "Lifecycle"));
      pop.appendChild(h("button", { onclick: () => { closeMenu(); openInitializeWizard(n, () => refreshNodeRow(n.name).catch(() => {})); } }, "Initialize…"));
      pop.appendChild(h("button", { onclick: () => { closeMenu(); openNodeRunModal(n, "deploy"); } }, "Run free-form deploy…"));
      pop.appendChild(h("button", { onclick: () => { closeMenu(); openNodeRunModal(n, "update"); } }, "Run free-form update…"));
      pop.appendChild(h("hr"));

      pop.appendChild(h("div", { class: "group-label" }, "Danger"));
      pop.appendChild(h("button", { class: "danger",
        onclick: () => { closeMenu(); openUninstallServicesModal(n); } },
        "Uninstall all services…"));
      pop.appendChild(h("button", { class: "danger",
        onclick: () => { closeMenu(); openClearServerModal(n); } },
        "Clear server…"));
      pop.appendChild(h("button", { class: "danger", onclick: () => { closeMenu(); confirmDeleteNode(n); } }, "Delete node"));
    }
    host.appendChild(pop);
    return host;
  }

  function renderNodesTable(nodes) {
    const table = h("table", { class: "data", id: "nodes-table" });
    const masterCheckbox = h("input", {
      type: "checkbox", id: "node-select-all", title: "Select all",
      onchange: (e) => {
        const checked = e.target.checked;
        document.querySelectorAll('input[data-bulk-node]').forEach((cb) => {
          cb.checked = checked;
        });
        updateBulkBar();
      },
    });
    table.appendChild(h("thead", null,
      h("tr", null,
        App.mode === "readwrite" ? h("th", { style: "width: 28px" }, masterCheckbox) : null,
        h("th", null, "Node"),
        h("th", null, "Groups"),
        h("th", null, "Host"),
        h("th", null, "Reachability"),
        h("th", { title: "Services this node has had a state row for. Each badge shows container state (running / exited / absent / etc.); hover for details." },
          "Services"),
        h("th", null, "Init"),
        h("th", null, "Uptime"),
        h("th", null, "Last probed"),
        h("th", null, ""),
      ),
    ));
    for (const n of nodes) {
      table.appendChild(renderNodeRow(n));
    }
    const wrap = h("div", { class: "table-wrap" });
    wrap.appendChild(table);
    return wrap;
  }

  function updateBulkBar() {
    const checked = document.querySelectorAll('input[data-bulk-node]:checked');
    const count = checked.length;
    const bar = document.getElementById("nodes-bulk-bar");
    const countEl = document.getElementById("nodes-bulk-count");
    if (countEl) countEl.textContent = `${count} selected`;
    if (bar) bar.style.display = count > 0 ? "flex" : "none";
    // Sync master checkbox state.
    const all = document.querySelectorAll('input[data-bulk-node]');
    const master = document.getElementById("node-select-all");
    if (master) {
      master.checked = all.length > 0 && count === all.length;
      master.indeterminate = count > 0 && count < all.length;
    }
  }
  function getBulkSelected() {
    return Array.from(document.querySelectorAll('input[data-bulk-node]:checked'))
      .map((cb) => cb.getAttribute("data-bulk-node"));
  }
  function bulkClearSelection() {
    document.querySelectorAll('input[data-bulk-node]').forEach((cb) => { cb.checked = false; });
    updateBulkBar();
  }
  async function bulkProbeSelected() {
    const names = getBulkSelected();
    if (!names.length) return;
    toast("info", "Probing", `${names.length} node${names.length === 1 ? "" : "s"}…`);
    // Run probes in parallel and let probeNode patch each row in place.
    await Promise.all(names.map((n) => probeNode(n).catch(() => {})));
  }

  // Bulk Initialize: fan out the same init flow as the per-node wizard
  // (step 1-5) across N selected nodes. Uses each node's own saved
  // init defaults (git key, codex key, port, etc.) — operator can edit
  // those per-node first if they want overrides.
  async function bulkInitializeSelected() {
    const names = getBulkSelected();
    if (!names.length) return;
    if (!confirm(
      `Initialize ${names.length} node${names.length === 1 ? "" : "s"}?\n\n` +
      `${names.join(", ")}\n\n` +
      `Each will: install git/python/node/go/docker, set up the git deploy key, install Codex, change SSH port, etc. ` +
      `Re-running on already-initialized nodes is safe (steps detect already-done state).`
    )) return;
    let r;
    try {
      r = await api("POST", "/api/nodes/init/start-bulk", { nodes: names });
    } catch (err) { toast("error", "Bulk init failed", err.message); return; }
    const startedN = (r.started || []).length;
    const skippedN = (r.skipped || []).length;
    if (skippedN) {
      const reasons = r.skipped.slice(0, 5).map((s) => `${s.node}: ${s.error}`).join("\n");
      toast("warn", `Init queued: ${startedN}/${r.total}`, `Skipped ${skippedN}.\n${reasons}`);
    } else {
      toast("success", `Init queued: ${startedN} node${startedN === 1 ? "" : "s"}`,
        "Open Actions → Init history on each row to follow progress.");
    }
    bulkClearSelection();
  }

  async function bulkDeploySslService() {
    const names = getBulkSelected();
    if (!names.length) return;

    // Step 1: ask backend which selected nodes have actually been initialised
    // (= bfs.sh setup run, docker installed, etc.). Falls back to "treat all
    // as ready" on old admin builds that don't have this endpoint.
    let statusMap = {};
    try {
      const r = await api("POST", "/api/nodes/init-status-bulk", { nodes: names });
      statusMap = (r && r.status) || {};
    } catch (err) {
      if (err.status !== 404) {
        toast("error", "Pre-deploy check failed", err.message);
        return;
      }
      // Old backend — treat everyone as ready and rely on the legacy confirm.
      for (const n of names) statusMap[n] = { initialized: true, last_run_status: "unknown" };
    }

    const ready = names.filter((n) => statusMap[n] && statusMap[n].initialized);
    const needInit = names.filter((n) => !statusMap[n] || !statusMap[n].initialized);

    // Common: actually fire the deploy + handle the response.
    const runDeploy = async (targetNames) => {
      if (!targetNames.length) return;
      const bar = document.getElementById("nodes-bulk-bar");
      if (bar) bar.querySelectorAll("button").forEach((b) => b.setAttribute("disabled", "true"));
      try {
        const r = await api("POST", "/api/services/ssl-service/deploy", { nodes: targetNames });
        toast(r.fail === 0 ? "success" : "info", "Deploy complete",
          `${r.success}/${r.total} ok · ${r.fail} failed`);
        openDeployResultModal(r);
        targetNames.forEach((n) => refreshNodeRow(n).catch(() => {}));
        bulkClearSelection();
      } catch (err) {
        if (err.code === "service_not_found") {
          toast("error", "ssl-service not registered",
            "Add it in Services tab first (or run scripts/register-ssl-service.sh)");
        } else if (err.code === "manifest_missing") {
          toast("error", "Manifest not synced", "Services → ssl-service → Sync manifest");
        } else {
          toast("error", "Deploy failed", err.message);
        }
      } finally {
        if (bar) bar.querySelectorAll("button").forEach((b) => b.removeAttribute("disabled"));
      }
    };

    // Fast path: everyone is already initialised — go straight to deploy.
    if (!needInit.length) {
      if (!confirm(`Deploy ssl-service to ${names.length} node(s)?\n\n${names.join(", ")}\n\nEach will git pull, docker compose up -d --build, then healthcheck.`)) return;
      return runDeploy(names);
    }

    // Slow path: open a pre-deploy modal that lays out ready vs needs-init.
    openPreDeployInitModal({ ready, needInit, statusMap, runDeploy });
  }

  // Modal that appears when some selected nodes haven't been initialised
  // yet. Offers three paths: init-then-deploy / deploy-ready-only / cancel.
  function openPreDeployInitModal({ ready, needInit, statusMap, runDeploy }) {
    const body = h("div");
    body.appendChild(h("p", { class: "muted" },
      "Some selected nodes haven't been bootstrapped yet (no successful init run on record). ",
      "Initialising installs docker, git, python, etc. before the service deploy can succeed."));

    if (needInit.length) {
      body.appendChild(h("div", { style: "font-weight: 600; margin: 14px 0 4px" },
        `Need init (${needInit.length})`));
      const tbl = h("table", { class: "data" });
      const tb = h("tbody");
      for (const n of needInit) {
        const s = statusMap[n] || {};
        const last = s.last_run_status || "never";
        tb.appendChild(h("tr", null,
          h("td", { class: "mono" }, n),
          h("td", { class: "muted" }, last === "never" ? "never initialised" : `last run: ${last}`),
        ));
      }
      tbl.appendChild(tb);
      body.appendChild(tbl);
    }

    if (ready.length) {
      body.appendChild(h("div", { style: "font-weight: 600; margin: 14px 0 4px" },
        `Ready to deploy (${ready.length})`));
      body.appendChild(h("div", { class: "mono muted", style: "font-size: 12.5px" },
        ready.join(", ")));
    }

    const footer = h("div", { class: "row", style: "gap: 8px" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("div", { style: "flex: 1" }),
      ready.length
        ? h("button", { class: "btn",
            onclick: () => { Modal.close(); runDeploy(ready); } },
            `Deploy ${ready.length} ready only`)
        : null,
      h("button", { class: "btn btn-primary",
        onclick: () => {
          Modal.close();
          openInitProgressModal({
            initNodes: needInit,
            onAllDone: (initSucceeded) => runDeploy([...ready, ...initSucceeded]),
          });
        } }, `Init ${needInit.length} then deploy`),
    );

    Modal.open({ title: "Pre-deploy check", body, footer });
  }

  // Modal that kicks off init on the supplied nodes, polls each one's
  // latest run, and calls onAllDone with the names that finished
  // successfully once everything settles.
  async function openInitProgressModal({ initNodes, onAllDone }) {
    const body = h("div");
    body.appendChild(h("p", { class: "muted" },
      "Each node uses its stored init defaults (Edit details → Initialization defaults). ",
      "This installs docker + base toolchain and may take a few minutes per node."));
    const list = h("table", { class: "data" });
    const lt = h("tbody");
    list.appendChild(lt);
    body.appendChild(list);

    // Per-node UI rows + state.
    const stateByNode = {};   // name → {status, runId, stepText, logTail}
    const rowByNode = {};
    for (const n of initNodes) {
      const tr = h("tr", null,
        h("td", { class: "mono", style: "width: 140px" }, n),
        h("td", { "data-status": "1" }, "queued"),
        h("td", { class: "muted mono", style: "font-size: 11.5px", "data-step": "1" }, ""),
      );
      rowByNode[n] = tr;
      lt.appendChild(tr);
      stateByNode[n] = { status: "queued", runId: null, step: "" };
    }

    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Run in background"),
    );
    Modal.open({ title: "Initializing nodes…", body, footer });

    // Kick off init for each node concurrently.
    await Promise.all(initNodes.map(async (n) => {
      try {
        const r = await api("POST", `/api/nodes/${encodeURIComponent(n)}/init/start`, {});
        stateByNode[n].runId = r.id;
        stateByNode[n].status = r.status || "running";
        rowByNode[n].querySelector('[data-status]').textContent = r.status || "running";
      } catch (err) {
        stateByNode[n].status = "failed_to_start";
        rowByNode[n].querySelector('[data-status]').textContent = "start failed";
        rowByNode[n].querySelector('[data-step]').textContent = err.message || "";
      }
    }));

    // Poll every 4s. Stop when all terminal (success/failed).
    const succeeded = [];
    const terminal = (s) => s === "completed" || s === "success" || s === "failed" || s === "failed_to_start";
    const isOk = (s) => s === "completed" || s === "success";
    const poll = async () => {
      const pending = initNodes.filter((n) => !terminal(stateByNode[n].status));
      if (!pending.length) {
        // All done — gather successes and chain into deploy.
        for (const n of initNodes) {
          if (isOk(stateByNode[n].status)) succeeded.push(n);
        }
        Modal.close();
        if (succeeded.length) {
          toast("success", "Init complete",
            `${succeeded.length}/${initNodes.length} nodes ready`);
        }
        const failed = initNodes.length - succeeded.length;
        if (failed) toast("error", "Init failed", `${failed} node(s); skipping their deploy`);
        if (onAllDone) onAllDone(succeeded);
        return;
      }
      await Promise.all(pending.map(async (n) => {
        const runId = stateByNode[n].runId;
        if (!runId) return;
        try {
          const r = await api("GET", `/api/nodes/${encodeURIComponent(n)}/init/runs/${runId}`);
          stateByNode[n].status = r.status;
          stateByNode[n].step = r.current_step || "";
          rowByNode[n].querySelector('[data-status]').textContent = r.status;
          rowByNode[n].querySelector('[data-step]').textContent = r.current_step || "";
        } catch (_) { /* keep going */ }
      }));
      setTimeout(poll, 4000);
    };
    poll();
  }

  // Render a single node as its own <tbody> so it can be replaced atomically
  // (one tbody per node groups the main row + optional detail rows).
  function renderNodeRow(n) {
    const tbody = h("tbody", { "data-node": n.name });
    const status = n.status || null;
    const actions = h("td", { class: "actions" });
    actions.appendChild(h("button", {
      class: "btn btn-sm",
      "data-probe-btn": "1",
      onclick: async (e) => { e.preventDefault(); await probeNode(n.name); },
    }, "Probe"));
    actions.appendChild(buildNodeActionMenu(n));
    const tr = h("tr", null,
      App.mode === "readwrite"
        ? h("td", { style: "width: 28px" }, h("input", {
            type: "checkbox", "data-bulk-node": n.name,
            onchange: () => updateBulkBar(),
          }))
        : null,
      h("td", { class: "domain" }, n.name),
      h("td", null, renderNodeGroupsBadges(n.groups)),
      h("td", { class: "mono" }, `${n.ssh_user}@${n.host}:${n.ssh_port}`),
      h("td", null, nodeReachBadge(status)),
      h("td", null, nodeServicesBadges(n.services)),
      h("td", null, nodeInitBadge(n.init)),
      h("td", { class: "muted" }, status ? fmtUptime(status.uptime_seconds) : "—"),
      h("td", { class: "muted" }, status && status.last_probed_at ? fmtRelative(status.last_probed_at) : "never"),
      actions,
    );
    tbody.appendChild(tr);
    // Only keep the error row — failed probes need to be visible. All
    // other sub-lines are available via "View full info".
    if (status && status.last_probe_error) {
      const cspan = App.mode === "readwrite" ? "10" : "9";
      tbody.appendChild(h("tr", { style: "background: var(--danger-bg)" },
        h("td", { colspan: cspan, class: "mono", style: "color: var(--danger); font-size: 11.5px; padding: 6px 16px" }, status.last_probe_error)));
    }
    return tbody;
  }

  // Look up the <tbody> for a node by name. CSS attribute selectors don't
  // need escaping for our node-name charset (alphanumeric + dashes).
  function findNodeTbody(name) {
    const tbl = document.getElementById("nodes-table");
    if (!tbl) return null;
    return tbl.querySelector(`tbody[data-node="${name.replace(/"/g, '\\"')}"]`);
  }

  // Re-fetch a single node and replace just its row group in the DOM.
  // ``oldName`` is provided when the node may have been renamed; defaults
  // to ``newName``.
  async function refreshNodeRow(newName, oldName) {
    const target = findNodeTbody(oldName || newName);
    try {
      const node = await api("GET", `/api/nodes/${encodeURIComponent(newName)}`);
      const replacement = renderNodeRow(node);
      if (target) target.replaceWith(replacement);
      else {
        // Node row not in DOM yet (e.g. just added) — append to table.
        const tbl = document.getElementById("nodes-table");
        if (tbl) tbl.appendChild(replacement);
      }
      return node;
    } catch (err) {
      // If the node disappeared (rename or delete), drop the stale row.
      if (err.status === 404 && target) target.remove();
      throw err;
    }
  }

  async function probeNode(name) {
    const tbody = findNodeTbody(name);
    let originalLabel = "Probe";
    let probeBtn = null;
    if (tbody) {
      probeBtn = tbody.querySelector('button[data-probe-btn]');
      if (probeBtn) {
        originalLabel = probeBtn.textContent;
        probeBtn.disabled = true;
        probeBtn.textContent = "Probing…";
      }
    }
    try {
      const status = await api("POST", `/api/nodes/${encodeURIComponent(name)}/probe`);
      // Pull the full node detail so the row reflects fresh status.
      try { await refreshNodeRow(name); }
      catch (_) { /* keep going — toast still informs the user */ }
      if (status.reachable) toast("success", "Probe complete", `${name} is reachable`);
      else toast("error", "Unreachable", status.last_probe_error || name);
    } catch (err) {
      toast("error", "Probe failed", err.message);
      if (probeBtn) {
        probeBtn.disabled = false;
        probeBtn.textContent = originalLabel;
      }
    }
  }

  // Read-only "View full info" modal — shows every node field plus the
  // last-probe status (including the full raw_probe shell output by
  // section). Useful for debugging without leaving the Nodes view.
  async function openNodeFullInfoModal(name) {
    Modal.open({
      title: `Node · ${name}`,
      body: h("div", { class: "muted", style: "padding: 24px; text-align: center" }, "Loading…"),
      footer: h("div", { class: "row" }, h("button", { class: "btn", onclick: () => Modal.close() }, "Close")),
    });
    let node;
    try { node = await api("GET", `/api/nodes/${encodeURIComponent(name)}`); }
    catch (err) {
      Modal.close();
      toast("error", "Failed to load node", err.message);
      return;
    }
    const body = h("div");
    const renderRows = (rows) => {
      const tbl = h("table", { class: "data kv" });
      const tb = h("tbody");
      for (const [k, v] of rows) {
        if (v === undefined || v === null || v === "") continue;
        tb.appendChild(h("tr", null,
          h("td", { class: "muted", style: "white-space: nowrap; padding-right: 12px; vertical-align: top; width: 1%;" }, k),
          h("td", { class: "mono", style: "word-break: break-all; vertical-align: top;" }, String(v)),
        ));
      }
      tbl.appendChild(tb);
      return tbl;
    };
    const section = (title, rows) => {
      const card = h("div", { style: "margin-bottom: 14px;" });
      card.appendChild(h("div", { style: "font-weight: 600; margin: 6px 0 4px 0;" }, title));
      card.appendChild(renderRows(rows));
      return card;
    };

    body.appendChild(section("Identity", [
      ["Name", node.name],
      ["Description", node.description],
      ["Groups", (node.groups || []).join(", ")],
      ["Tags", (node.tags || []).join(", ")],
      ["Created", fmtDate(node.created_at)],
      ["Updated", fmtDate(node.updated_at)],
    ]));
    body.appendChild(section("SSH connection", [
      ["Host", node.host],
      ["Port", node.ssh_port],
      ["User", node.ssh_user],
      ["Auth method", node.auth_method],
      ["Password set", node.ssh_password ? "yes" : "no"],
      ["Inline private key", node.ssh_private_key ? "yes (legacy)" : "no"],
      ["Inline key passphrase", node.ssh_key_passphrase ? "yes" : "no"],
    ]));
    if ((node.linked_keys || []).length) {
      const tbl = h("table", { class: "data" });
      tbl.appendChild(h("thead", null, h("tr", null,
        h("th", null, "Name"), h("th", null, "Type"),
        h("th", null, "Fingerprint"), h("th", null, "Priority"))));
      const tb = h("tbody");
      for (const k of node.linked_keys) {
        tb.appendChild(h("tr", null,
          h("td", { class: "mono" }, k.name),
          h("td", null, `${k.key_type}${k.bits ? "·" + k.bits : ""}`),
          h("td", { class: "mono", style: "font-size: 11.5px;" }, k.fingerprint_sha256 || "—"),
          h("td", { class: "muted" }, String(k.priority)),
        ));
      }
      tbl.appendChild(tb);
      const wrap = h("div", { style: "margin-bottom: 14px;" });
      wrap.appendChild(h("div", { style: "font-weight: 600; margin: 6px 0 4px 0;" },
        `Linked SSH keys (${node.linked_keys.length})`));
      wrap.appendChild(tbl);
      body.appendChild(wrap);
    }

    const status = node.status || null;
    if (status) {
      body.appendChild(section("Last probe", [
        ["Reachable", status.reachable ? "yes" : "no"],
        ["Last probed", fmtDate(status.last_probed_at)],
        ["Probe error", status.last_probe_error],
        ["OS", fmtOs(status) || status.os_release],
        ["Uptime", fmtUptime(status.uptime_seconds)],
        ["Load", fmtLoadAvg(status) || status.load_avg],
        ["Memory", fmtMemory(status) || status.memory],
        ["Disk (/)", fmtDiskRoot(status) || status.disk_usage],
        ["Service installed", status.service_installed === null ? null : (status.service_installed ? "yes" : "no")],
        ["Service running", status.service_running === null ? null : (status.service_running ? "yes" : "no")],
        ["Service mode", status.service_mode],
        ["Service version", status.service_version],
      ]));
      const raw = status.raw_probe || null;
      const sections = raw && raw.sections;
      if (sections && Object.keys(sections).length) {
        const wrap = h("div", { style: "margin-bottom: 14px;" });
        wrap.appendChild(h("div", { style: "font-weight: 600; margin: 6px 0 4px 0;" }, "Raw probe output"));
        for (const key of Object.keys(sections)) {
          const val = sections[key];
          if (!val) continue;
          wrap.appendChild(h("div", { class: "muted", style: "font-size: 11.5px; margin-top: 8px;" }, key));
          wrap.appendChild(h("pre", {
            class: "mono",
            style: "background: var(--surface-alt); padding: 8px 10px; border-radius: 4px; font-size: 11.5px; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto; margin: 2px 0;",
          }, val));
        }
        if (raw.exit_code !== undefined && raw.exit_code !== null) {
          wrap.appendChild(h("div", { class: "muted", style: "font-size: 11.5px; margin-top: 8px;" }, `exit_code: ${raw.exit_code}`));
        }
        body.appendChild(wrap);
      }
    } else {
      body.appendChild(h("div", { class: "muted", style: "padding: 8px 0;" }, "Not yet probed."));
    }

    // Services on this node — managed (matched against registered services)
    // and unmanaged (other containers visible on the box).
    const hasContainerData = !!(status && status.raw_probe
      && status.raw_probe.containers !== undefined);
    const containers = hasContainerData ? (status.raw_probe.containers || []) : [];
    const servicesWrap = h("div", { style: "margin-bottom: 14px;" });
    servicesWrap.appendChild(h("div", { style: "font-weight: 600; margin: 6px 0 4px 0;" },
      hasContainerData
        ? `Services on this node (${containers.length} container${containers.length === 1 ? "" : "s"})`
        : "Services on this node"));
    if (!hasContainerData) {
      // Old probe data (or never probed). Don't claim "0 containers".
      servicesWrap.appendChild(h("div", { class: "muted", style: "padding: 4px 0;" },
        "Probe this node to enumerate containers."));
    } else if (!containers.length) {
      servicesWrap.appendChild(h("div", { class: "muted", style: "padding: 4px 0;" },
        "No containers on this node."));
    } else {
      try {
        const sresp = await api("GET", "/api/services").catch(() => ({ services: [] }));
        const known = new Set((sresp.services || []).map((s) => s.name));
        const managed = containers.filter((c) => known.has(c.name));
        const unmanaged = containers.filter((c) => !known.has(c.name));
        if (managed.length) {
          const tbl = h("table", { class: "data" });
          const tb = h("tbody");
          for (const c of managed) {
            // Capture service + node name in scope; closing over `c.name`
            // and `name` ensures each row's button targets the right pair.
            const svcName = c.name;
            const nodeNameForRow = name;
            tb.appendChild(h("tr", null,
              h("td", { class: "mono" }, c.name),
              h("td", null, c.state === "running"
                ? h("span", { class: "badge ok" }, h("span", { class: "dot" }), "running")
                : h("span", { class: "badge warn" }, c.state || "?")),
              h("td", { class: "mono", style: "font-size: 11.5px" }, c.image),
              h("td", { class: "muted", style: "font-size: 11.5px" }, c.status_str),
              h("td", { style: "text-align: right;" },
                h("button", {
                  class: "btn",
                  style: "font-size: 11.5px; padding: 2px 8px;",
                  onclick: () => openServiceNodeEnvModal(svcName, nodeNameForRow),
                }, "Env"),
              ),
            ));
          }
          tbl.appendChild(tb);
          servicesWrap.appendChild(h("div", { class: "muted", style: "font-size: 11.5px; margin-top: 6px;" },
            `Managed (${managed.length})`));
          servicesWrap.appendChild(tbl);
        }
        if (unmanaged.length) {
          servicesWrap.appendChild(h("div", { class: "muted", style: "font-size: 11.5px; margin-top: 10px;" },
            `Unmanaged (${unmanaged.length}) — not registered as services`));
          servicesWrap.appendChild(h("div", { class: "mono muted", style: "font-size: 11.5px;" },
            unmanaged.map((c) => `${c.name} (${c.state})`).join(", ")));
        }
        if (!managed.length && !unmanaged.length) {
          servicesWrap.appendChild(h("div", { class: "muted", style: "padding: 4px 0;" }, "—"));
        }
      } catch (_) {
        servicesWrap.appendChild(h("div", { class: "muted", style: "padding: 4px 0;" },
          containers.map((c) => `${c.name} (${c.state})`).join(", ")));
      }
    }
    body.appendChild(servicesWrap);

    body.appendChild(section("Initialization defaults", [
      ["Desired SSH port", node.init_desired_ssh_port],
      ["Timezone", node.init_timezone],
      ["Git user.name", node.init_git_user_name],
      ["Git user.email", node.init_git_user_email],
      ["Install Codex CLI", node.init_install_codex === false ? "no" : "yes"],
      ["OPENAI_BASE_URL", node.init_codex_base_url],
      ["OPENAI_API_KEY set", node.init_codex_api_key ? "yes" : "no"],
      ["Git deploy key set", node.init_git_private_key ? "yes" : "no"],
    ]));
    body.appendChild(section("Commands", [
      ["Deploy command", node.deploy_command],
      ["Update command", node.update_command],
    ]));

    Modal.open({
      title: `Node · ${node.name}`,
      body,
      footer: h("div", { class: "row" },
        h("button", { class: "btn", onclick: async () => {
          Modal.close();
          await probeNode(node.name);
          // Re-open with fresh data so the user sees the new probe in the same modal flow.
          openNodeFullInfoModal(node.name);
        } }, "Probe & refresh"),
        h("button", { class: "btn btn-primary", onclick: () => Modal.close() }, "Close"),
      ),
    });
  }

  function confirmDeleteNode(node) {
    const body = h("div", null,
      h("p", null, "Delete node ", h("span", { class: "mono" }, node.name), "? This removes the SSH credentials and probe history."),
    );
    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("button", { class: "btn btn-danger", onclick: async () => {
        try {
          await api("DELETE", `/api/nodes/${encodeURIComponent(node.name)}`);
          Modal.close();
          toast("success", "Node deleted", node.name);
          // Remove just the affected row instead of re-rendering everything.
          const tbody = findNodeTbody(node.name);
          if (tbody) tbody.remove();
          // Update the count badge.
          const tbl = document.getElementById("nodes-table");
          const counter = document.getElementById("nodes-count");
          if (tbl && counter) {
            const remaining = tbl.querySelectorAll('tbody[data-node]').length;
            counter.textContent = `${remaining} node${remaining === 1 ? "" : "s"}`;
            if (remaining === 0) loadNodesIntoBody();
          }
        } catch (err) { toast("error", "Delete failed", err.message); }
      } }, "Delete"),
    );
    Modal.open({ title: `Delete ${node.name}?`, body, footer });
  }

  function openNodeModal(existing, onSaved) {
    const form = h("form");
    const isEdit = !!existing;
    form.appendChild(h("div", { class: "form-row" },
      h("div", { class: "field" },
        h("label", null, "Name"),
        h("input", { id: "node-name", class: "input mono", value: existing ? existing.name : "", required: true, placeholder: "edge-sg-1" }),
      ),
      h("div", { class: "field" },
        h("label", null, "Groups",
          h("span", { class: "hint" },
            " — comma-separated; used as filters and bulk-action targets")),
        h("input", { id: "node-groups", class: "input",
          value: existing ? (existing.groups || []).join(", ") : "",
          placeholder: "us-edge, kr, experiment" }),
      ),
    ));
    form.appendChild(h("div", { class: "field", style: "margin-top: -8px" },
      h("label", null, "Tags",
        h("span", { class: "hint" }, " — free-form labels (legacy field)")),
      h("input", { id: "node-tags", class: "input",
        value: existing ? (existing.tags || []).join(", ") : "",
        placeholder: "tag1, tag2" }),
    ));
    form.appendChild(h("div", { class: "form-row" },
      h("div", { class: "field" },
        h("label", null, "Host / IP"),
        h("input", { id: "node-host", class: "input mono", value: existing ? existing.host : "", required: true, placeholder: "1.2.3.4 or edge.example.com" }),
      ),
      h("div", { class: "field" },
        h("label", null, "SSH port"),
        h("input", { id: "node-port", class: "input mono", type: "number", min: "1", max: "65535", value: existing ? existing.ssh_port : 22 }),
      ),
    ));
    form.appendChild(h("div", { class: "form-row" },
      h("div", { class: "field" },
        h("label", null, "SSH user"),
        h("input", { id: "node-user", class: "input mono", value: existing ? existing.ssh_user : "root" }),
      ),
      h("div", { class: "field" },
        h("label", null, "Auth method"),
        (() => {
          const sel = h("select", { id: "node-auth", class: "select" });
          for (const v of [
            ["password", "Password"],
            ["key", "Private key"],
            ["auto", "Auto"],
          ]) {
            const opt = h("option", { value: v[0] }, v[1]);
            if (existing && existing.auth_method === v[0]) opt.selected = true;
            sel.appendChild(opt);
          }
          return sel;
        })(),
      ),
    ));

    const pwdWrap = h("div", { class: "field", id: "node-pwd-wrap" },
      h("label", null, "SSH password"),
      h("input", { id: "node-pwd", class: "input mono", type: "text",
        value: isEdit && existing.ssh_password ? existing.ssh_password : "" }),
    );
    // SSH keys: pick from the registered SSH Keys table (multi-select).
    // Any number of keys can be linked; the platform tries each one
    // in priority order at connection time. The legacy inline textarea
    // is kept under a disclosure for one-off / un-registered keys.
    const linkedKeyIds = new Set((existing && existing.ssh_key_ids) || []);
    const keyListWrap = h("div", { id: "node-keys-list",
      style: "max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 4px; background: var(--surface);" },
      h("div", { class: "muted", style: "padding: 6px;" }, "Loading SSH keys…"),
    );
    const keyToolsRow = h("div", { class: "row", style: "gap: 6px; margin-bottom: 6px; align-items: center;" },
      h("button", { type: "button", class: "btn btn-sm",
        onclick: (e) => { e.preventDefault();
          keyListWrap.querySelectorAll('input[type="checkbox"][data-ssh-key]').forEach(c => c.checked = true);
          updateLinkedCount();
        } }, "Select all"),
      h("button", { type: "button", class: "btn btn-sm",
        onclick: (e) => { e.preventDefault();
          keyListWrap.querySelectorAll('input[type="checkbox"][data-ssh-key]').forEach(c => c.checked = false);
          updateLinkedCount();
        } }, "Clear"),
      h("a", { href: "#/ssh-keys",
        style: "font-size: 12px; margin-left: auto;",
        onclick: () => Modal.close() }, "Manage SSH Keys →"),
      h("span", { class: "muted", id: "node-keys-count",
        style: "font-size: 12px;" }, "0 selected"),
    );
    function updateLinkedCount() {
      const n = keyListWrap.querySelectorAll('input[type="checkbox"][data-ssh-key]:checked').length;
      const el = document.getElementById("node-keys-count");
      if (el) el.textContent = `${n} selected`;
    }
    // Async populate from /api/ssh-keys
    api("GET", "/api/ssh-keys").then(r => {
      const keys = (r && r.ssh_keys) || [];
      keyListWrap.innerHTML = "";
      if (!keys.length) {
        keyListWrap.appendChild(h("div", { class: "muted", style: "padding: 8px;" },
          "No SSH keys registered yet. ",
          h("a", { href: "#/ssh-keys", onclick: () => Modal.close() },
            "Generate or import one →")));
        return;
      }
      for (const k of keys) {
        const id = `nk-${k.id}`;
        const checked = linkedKeyIds.has(k.id);
        const row = h("label", { for: id, class: "row",
          style: "gap: 8px; padding: 4px 6px; cursor: pointer; align-items: center; font-size: 12.5px;" },
          h("input", { type: "checkbox", id, "data-ssh-key": String(k.id),
            checked: checked, onchange: updateLinkedCount }),
          h("span", { class: "mono" }, k.name),
          h("span", { class: "badge" },
            `${k.key_type}${k.bits ? "·" + k.bits : ""}`),
          h("span", { class: "mono muted",
            style: "font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" },
            (k.fingerprint_sha256 || "").slice(0, 30) + "…"),
          k.comment ? h("span", { class: "muted", style: "font-size: 11px;" }, k.comment) : null,
        );
        keyListWrap.appendChild(row);
      }
      updateLinkedCount();
    }).catch(err => {
      keyListWrap.innerHTML = "";
      keyListWrap.appendChild(h("div", { class: "muted", style: "padding: 8px;" },
        "Could not load SSH keys: ", err.message));
    });

    // Ad-hoc inline key (collapsed by default unless one is set)
    const inlineKey = (isEdit && existing.ssh_private_key) ? existing.ssh_private_key : "";
    const adhocOpen = !!inlineKey;
    const adhocSection = h("details", { style: "margin-top: 6px;" });
    if (adhocOpen) adhocSection.setAttribute("open", "");
    adhocSection.appendChild(h("summary", { class: "muted",
      style: "cursor: pointer; font-size: 12px; padding: 4px 0;" },
      "Ad-hoc private key"));
    adhocSection.appendChild(h("textarea", { id: "node-key", class: "textarea mono", rows: "6",
      placeholder: "-----BEGIN OPENSSH PRIVATE KEY-----" },
      inlineKey));
    adhocSection.appendChild(h("div", { class: "field", style: "margin-top: 6px;" },
      h("label", null, "Passphrase"),
      h("input", { id: "node-keypass", class: "input mono", type: "text",
        value: isEdit && existing.ssh_key_passphrase ? existing.ssh_key_passphrase : "" }),
    ));

    const keyWrap = h("div", { id: "node-key-wrap" },
      h("div", { class: "field" },
        h("label", null, "Linked SSH keys"),
        keyToolsRow,
        keyListWrap,
      ),
      adhocSection,
    );
    form.appendChild(pwdWrap);
    form.appendChild(keyWrap);

    // No more visibility toggle — both blocks are always shown so the
    // operator can populate them in advance. Kept the no-op function
    // around so the existing setTimeout call below doesn't ReferenceError.
    const updateAuthVisibility = () => {};

    form.appendChild(h("div", { class: "field" },
      h("label", null, "Description"),
      h("input", { id: "node-desc", class: "input", value: existing && existing.description ? existing.description : "" }),
    ));
    form.appendChild(h("div", { class: "field" },
      h("label", null, "Deploy command"),
      h("textarea", { id: "node-deploy", class: "textarea mono", rows: "3",
        value: existing && existing.deploy_command ? existing.deploy_command : "" }),
    ));
    form.appendChild(h("div", { class: "field" },
      h("label", null, "Update command"),
      h("textarea", { id: "node-update", class: "textarea mono", rows: "3",
        value: existing && existing.update_command ? existing.update_command : "" }),
    ));

    // Initialization defaults — used by the Initialize wizard, editable here directly.
    const initSection = h("details", { style: "margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px" });
    initSection.appendChild(h("summary", { style: "cursor: pointer; font-weight: 600; margin-bottom: 12px" },
      "Initialization defaults",
    ));
    initSection.appendChild(h("div", { class: "form-row" },
      h("div", { class: "field" },
        h("label", null, "Desired SSH port"),
        h("input", { id: "node-init-port", class: "input mono", type: "number", min: "1", max: "65535",
          value: existing && existing.init_desired_ssh_port != null ? existing.init_desired_ssh_port : 60101 }),
      ),
      h("div", { class: "field" },
        h("label", null, "Timezone"),
        h("input", { id: "node-init-tz", class: "input mono",
          value: existing && existing.init_timezone ? existing.init_timezone : "Asia/Shanghai" }),
      ),
    ));
    initSection.appendChild(h("div", { class: "form-row" },
      h("div", { class: "field" },
        h("label", null, "Git user.name"),
        h("input", { id: "node-init-gitname", class: "input",
          value: existing && existing.init_git_user_name ? existing.init_git_user_name : "" }),
      ),
      h("div", { class: "field" },
        h("label", null, "Git user.email"),
        h("input", { id: "node-init-gitemail", class: "input",
          value: existing && existing.init_git_user_email ? existing.init_git_user_email : "" }),
      ),
    ));
    initSection.appendChild(h("div", { class: "field" },
      h("label", null, "Git deploy key"),
      h("textarea", { id: "node-init-gitkey", class: "textarea mono", rows: "6",
        placeholder: "-----BEGIN OPENSSH PRIVATE KEY-----" },
        existing && existing.init_git_private_key ? existing.init_git_private_key : ""),
    ));
    initSection.appendChild(h("div", { class: "field inline-checkbox" },
      h("input", { type: "checkbox", id: "node-init-codex",
        checked: !existing || existing.init_install_codex !== false }),
      h("label", { for: "node-init-codex", style: "margin: 0" }, "Install Codex CLI"),
    ));
    initSection.appendChild(h("div", { class: "form-row" },
      h("div", { class: "field" },
        h("label", null, "OPENAI_BASE_URL"),
        h("input", { id: "node-init-codexurl", class: "input mono",
          value: existing && existing.init_codex_base_url ? existing.init_codex_base_url : "" }),
      ),
      h("div", { class: "field" },
        h("label", null, "OPENAI_API_KEY"),
        h("input", { id: "node-init-codexkey", class: "input mono", type: "text",
          value: existing && existing.init_codex_api_key ? existing.init_codex_api_key : "" }),
      ),
    ));
    form.appendChild(initSection);

    // Wire visibility toggle now that elements exist.
    setTimeout(updateAuthVisibility, 0);
    setTimeout(() => document.getElementById("node-auth").addEventListener("change", updateAuthVisibility), 0);

    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("button", { class: "btn btn-primary", onclick: async (e) => {
        e.preventDefault();
        const auth = document.getElementById("node-auth").value;
        const payload = {
          host: document.getElementById("node-host").value.trim(),
          ssh_port: parseInt(document.getElementById("node-port").value || "22", 10),
          ssh_user: document.getElementById("node-user").value.trim() || "root",
          auth_method: auth,
          description: document.getElementById("node-desc").value.trim() || null,
          tags: document.getElementById("node-tags").value.split(",").map(s => s.trim()).filter(Boolean),
          groups: document.getElementById("node-groups")
            ? document.getElementById("node-groups").value.split(",").map(s => s.trim()).filter(Boolean)
            : [],
          deploy_command: document.getElementById("node-deploy").value.trim() || null,
          update_command: document.getElementById("node-update").value.trim() || null,
        };
        // Secrets — always send what's in the textarea since fields are now plaintext.
        const pwd = document.getElementById("node-pwd").value;
        const key = document.getElementById("node-key") ? document.getElementById("node-key").value : "";
        const keypass = document.getElementById("node-keypass") ? document.getElementById("node-keypass").value : "";
        payload.ssh_password = pwd || null;
        payload.ssh_private_key = key || null;
        payload.ssh_key_passphrase = keypass || null;

        // Linked SSH key ids from the multi-select picker
        const linkedIds = Array.from(
          document.querySelectorAll('#node-keys-list input[type="checkbox"][data-ssh-key]:checked')
        ).map(cb => parseInt(cb.getAttribute("data-ssh-key"), 10)).filter(Number.isFinite);
        payload.ssh_key_ids = linkedIds;
        const haveAnyKey = key || linkedIds.length > 0;

        if (auth === "password" && !pwd) { toast("error", "Password required"); return; }
        if (auth === "key" && !haveAnyKey) {
          toast("error", "No SSH key", "Pick at least one from the list, or paste an ad-hoc key");
          return;
        }
        if (auth === "auto" && !pwd && !haveAnyKey) {
          toast("error", "Need at least one credential",
            "Provide password, link a key, or paste one for Auto mode");
          return;
        }

        // Init defaults section — only push when the section is open OR
        // we already have an existing record (so values are pre-populated).
        // Always include them on edit; we send the current values regardless.
        const initPort = parseInt(document.getElementById("node-init-port").value || "60101", 10);
        payload.init_desired_ssh_port = initPort;
        payload.init_timezone = document.getElementById("node-init-tz").value.trim() || "Asia/Shanghai";
        payload.init_git_user_name = document.getElementById("node-init-gitname").value.trim() || null;
        payload.init_git_user_email = document.getElementById("node-init-gitemail").value.trim() || null;
        payload.init_git_private_key = document.getElementById("node-init-gitkey").value.trim() || null;
        payload.init_install_codex = document.getElementById("node-init-codex").checked;
        payload.init_codex_base_url = document.getElementById("node-init-codexurl").value.trim() || null;
        payload.init_codex_api_key = document.getElementById("node-init-codexkey").value.trim() || null;
        try {
          const enteredName = document.getElementById("node-name").value.trim();
          if (isEdit) {
            // If user changed the name, send it as `new_name` so the backend
            // routes through the rename path.
            if (enteredName && enteredName !== existing.name) {
              payload.new_name = enteredName;
            }
            await api("PATCH", `/api/nodes/${encodeURIComponent(existing.name)}`, payload);
          } else {
            payload.name = enteredName;
            await api("POST", "/api/nodes", payload);
          }
          Modal.close();
          const finalName = enteredName || (existing && existing.name);
          toast("success", isEdit ? "Node updated" : "Node added", finalName);
          if (onSaved) {
            await onSaved({
              name: finalName,
              oldName: isEdit ? existing.name : finalName,
              isEdit,
            });
          }
        } catch (err) { toast("error", "Save failed", err.message); }
      } }, isEdit ? "Save" : "Add node"),
    );
    Modal.open({ title: isEdit ? `Edit ${existing.name}` : "Add node",
                 body: form, footer, size: "wide" });
  }

  // Modal that runs deploy/update with a previewable command + streams the
  // result inline.
  function openNodeRunModal(node, kind) {
    const defaultCmd = kind === "deploy"
      ? (node.deploy_command || "")
      : (node.update_command || "");
    const form = h("div");
    form.appendChild(h("div", { class: "field" },
      h("label", null, kind === "deploy" ? "Deploy command" : "Update command",
        h("span", { class: "hint" }, " — leave blank to use the configured default")),
      h("textarea", { id: "run-cmd", class: "textarea mono", rows: "4",
        value: defaultCmd, placeholder: "Will use the built-in default if left empty" }),
    ));
    form.appendChild(h("div", { class: "muted", style: "font-size: 12px; margin-top: 6px" },
      `Connects to ${node.ssh_user}@${node.host}:${node.ssh_port} via ${node.auth_method} auth`));
    const out = h("pre", { class: "log-viewer", style: "margin-top: 12px; max-height: 360px;" },
      h("span", { class: "dim" }, "(no output yet — click Run to execute)"));
    form.appendChild(out);

    let running = false;
    const runBtn = h("button", { class: "btn btn-primary", onclick: async (e) => {
      e.preventDefault();
      if (running) return;
      running = true;
      runBtn.disabled = true;
      runBtn.textContent = "Running…";
      out.innerHTML = "";
      out.appendChild(h("span", { class: "dim" }, "Running on " + node.host + " …\n"));
      const command = document.getElementById("run-cmd").value.trim();
      const path = `/api/nodes/${encodeURIComponent(node.name)}/${kind}`;
      try {
        const r = await api("POST", path, command ? { command } : {});
        out.innerHTML = "";
        out.appendChild(h("div", { class: "dim" }, `$ ${r.command}\n`));
        if (r.stdout) out.appendChild(document.createTextNode(r.stdout));
        if (r.stderr) {
          const e = h("span", { style: "color: #ff8c5c" }, "\n" + r.stderr);
          out.appendChild(e);
        }
        out.appendChild(h("div", { class: "dim", style: "margin-top: 8px" },
          `\n[exit ${r.exit_code} · ${r.duration_seconds}s]`));
        toast(r.exit_code === 0 ? "success" : "error",
          (kind === "deploy" ? "Deploy" : "Update") + (r.exit_code === 0 ? " complete" : " failed"),
          `exit ${r.exit_code}`);
      } catch (err) {
        out.innerHTML = "";
        out.appendChild(h("span", { style: "color: var(--danger)" }, err.message));
        toast("error", (kind === "deploy" ? "Deploy" : "Update") + " failed", err.message);
      } finally {
        running = false;
        runBtn.disabled = false;
        runBtn.textContent = "Run";
      }
    } }, "Run");

    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
      runBtn,
    );
    Modal.open({ title: `${kind === "deploy" ? "Deploy" : "Update"} on ${node.name}`, body: form, footer });
  }

  // ----- Init runs history -----

  function initRunBadge(status) {
    if (status === "success") return h("span", { class: "badge ok" }, h("span", { class: "dot" }), "success");
    if (status === "failed") return h("span", { class: "badge danger" }, h("span", { class: "dot" }), "failed");
    if (status === "cancelled") return h("span", { class: "badge" }, "cancelled");
    if (status === "running") return h("span", { class: "badge info" }, h("span", { class: "dot" }), "running");
    return h("span", { class: "badge" }, status || "queued");
  }

  function fmtDuration(start, end) {
    if (!start) return "—";
    const a = new Date(start);
    const b = end ? new Date(end) : new Date();
    if (Number.isNaN(a.getTime()) || Number.isNaN(b.getTime())) return "—";
    const sec = Math.max(0, Math.round((b.getTime() - a.getTime()) / 1000));
    if (sec < 60) return sec + "s";
    return Math.floor(sec / 60) + "m " + (sec % 60) + "s";
  }

            h("th", null, "Exit"),

  async function openInitRunDetailModal(node, runId) {
    const wrap = h("div");
    const header = h("div", { class: "muted", style: "margin-bottom: 8px; font-size: 13px" }, "Loading…");
    const log = h("pre", { class: "log-viewer", style: "max-height: 480px" });
    wrap.appendChild(header);
    wrap.appendChild(log);

    let pollTimer = null;
    async function refresh() {
      try {
        const r = await api("GET", `/api/nodes/${encodeURIComponent(node.name)}/init/runs/${runId}`);
        header.innerHTML = "";
        header.appendChild(document.createTextNode(`Run #${r.id} · `));
        header.appendChild(initRunBadge(r.status));
        header.appendChild(document.createTextNode(` · started ${fmtRelative(r.started_at)}`));
        if (r.current_step) header.appendChild(document.createTextNode(` · step ${r.current_step}`));
        if (r.exit_code != null) header.appendChild(document.createTextNode(` · exit ${r.exit_code}`));
        const wasNearBottom = (log.scrollTop + log.clientHeight) >= (log.scrollHeight - 30);
        log.textContent = r.log_text || "";
        if (wasNearBottom) log.scrollTop = log.scrollHeight;
        if (r.status === "running" || r.status === "queued") {
          if (!pollTimer) pollTimer = setInterval(refresh, 1500);
        } else {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }
      } catch (err) {
        header.textContent = "Failed: " + err.message;
        if (pollTimer) clearInterval(pollTimer);
      }
    }
    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: async () => {
        const text = log.textContent || "";
        if (!text.trim()) { toast("info", "Nothing to copy", "Log is empty"); return; }
        const ok = await copyTextToClipboard(text);
        if (ok) toast("success", "Copied", `${text.length} chars`);
        else toast("error", "Copy failed", "Clipboard unavailable");
      } }, "Copy log"),
      h("button", { class: "btn btn-primary", onclick: () => {
        if (pollTimer) clearInterval(pollTimer);
        Modal.close();
      } }, "Close"),
    );
    Modal.open({ title: `Init run #${runId} · ${node.name}`, body: wrap, footer });
    refresh();
  }

      `  • Stop + disable legacy systemd units (vpsproxy-xray, ssl-proxy-controller, xout)\n` +
      `  • rm -rf every /opt/<service>/ matching the catalog\n` +

  async function openInitializeWizard(node, onDone) {
    // Pull the most up-to-date node row (with all secrets) so we can pre-fill defaults.
    let detail;
    try {
      const resp = await api("GET", `/api/nodes/${encodeURIComponent(node.name)}`);
      detail = resp;
    } catch (err) { toast("error", "Could not load node", err.message); return; }

    // Load admin registries (SSH Keys channel + AI Keys channel) so
    // step 1 and step 3 can offer the operator's pre-saved values.
    let adminKeys = [];
    let aiKeys = [];
    try {
      const r = await api("GET", "/api/ssh-keys");
      adminKeys = r.ssh_keys || r.keys || [];
    } catch (err) { /* non-fatal */ }
    try {
      const r = await api("GET", "/api/ai-api-keys");
      aiKeys = r.ai_api_keys || r.keys || [];
    } catch (err) { /* non-fatal */ }

    // Default git identity to node name + bitsfactor.com email when
    // the node has no stored override. Operator can still edit them
    // in step 4 — these are just sensible defaults so the operator
    // doesn't have to type anything for a typical bitsfactor box.
    const _nodeId = (node.name || "").trim();
    const state = {
      step: 1,
      git_private_key: detail.init_git_private_key || "",
      git_user_name: detail.init_git_user_name || _nodeId,
      git_user_email: detail.init_git_user_email
        || (_nodeId ? `${_nodeId}@bitsfactor.com` : ""),
      desired_ssh_port: detail.init_desired_ssh_port || 60101,
      install_codex: detail.init_install_codex !== false,
      codex_base_url: detail.init_codex_base_url || "",
      codex_api_key: detail.init_codex_api_key || "",
      timezone: detail.init_timezone || "Asia/Shanghai",
    };

    const TOTAL_STEPS = 5;
    const wrap = h("div", { id: "init-wizard-body" });
    const footer = h("div", { class: "row", id: "init-wizard-footer" });

    function renderStep() {
      wrap.innerHTML = "";
      footer.innerHTML = "";
      const header = h("div", { class: "muted", style: "font-size: 12px; margin-bottom: 12px" },
        `Step ${state.step} of ${TOTAL_STEPS}`);
      wrap.appendChild(header);
      switch (state.step) {
        case 1: renderKeyStep(); break;
        case 2: renderPortStep(); break;
        case 3: renderCodexStep(); break;
        case 4: renderGitIdentityStep(); break;
        case 5: renderConfirmStep(); break;
        case 6: renderRunStep(); break;
      }
    }

    function navButtons({back = true, nextLabel = "Next →", onNext = () => { state.step++; renderStep(); }} = {}) {
      const f = footer;
      f.innerHTML = "";
      f.appendChild(h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"));
      if (back && state.step > 1) {
        f.appendChild(h("button", { class: "btn", onclick: () => { state.step--; renderStep(); } }, "← Back"));
      }
      f.appendChild(h("button", { class: "btn btn-primary", onclick: onNext }, nextLabel));
    }

    function renderKeyStep() {
      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "Step 1 · Git deploy key"),
        h("p", { class: "muted", style: "font-size: 13px; margin: 4px 0 12px" },
          "This private key will be installed at /root/.ssh/ on the target server so it can git-clone your private repos."),
      ));

      // ── Section A: SSH Keys registry (the channel the user manages
      // in the admin UI). Default is the row marked init_default.
      if (adminKeys.length) {
        const list = h("div", { style: "display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px" });
        list.appendChild(h("div", { class: "muted", style: "font-size: 12px" },
          "Pick from your ", h("strong", null, "SSH Keys"), " registry:"));
        // Sort: init_default first, then by name.
        const sorted = adminKeys.slice().sort((a, b) =>
          (b.is_init_default ? 1 : 0) - (a.is_init_default ? 1 : 0)
          || (a.name || "").localeCompare(b.name || ""));
        for (const k of sorted) {
          const useBtn = h("button", { class: "btn btn-sm",
            onclick: async (e) => {
              e.preventDefault();
              try {
                // GET /api/ssh-keys/{id} returns the full row including
                // the private_key body. List endpoint masks it for
                // safety so we have to re-fetch.
                const full = await api("GET", `/api/ssh-keys/${k.id}`);
                const body = full.private_key || full.private_key_pem || "";
                if (!body) {
                  toast("error", "Empty key body", k.name);
                  return;
                }
                state.git_private_key = body;
                document.getElementById("wiz-key").value = body;
                toast("success", "Loaded", k.name);
              } catch (err) { toast("error", "Failed to read", err.message); }
            } }, k.is_init_default ? `Use ${k.name} ★` : `Use ${k.name}`);
          if (k.is_init_default) {
            useBtn.setAttribute("style", "background: var(--accent,#2563eb); color: white; border-color: var(--accent,#2563eb)");
          }
          list.appendChild(h("div", { class: "row", style: "gap: 8px; align-items: center" },
            useBtn,
            h("span", { class: "muted mono", style: "font-size: 11.5px" },
              `${k.key_type || k.type || "?"}  ${k.fingerprint || ""}`),
            k.is_init_default
              ? h("span", { class: "badge ok", style: "font-size: 10px" }, "default")
              : null,
          ));
        }
        // Auto-fill the default on first render so the operator can
        // just hit Next without clicking anything.
        if (!state.git_private_key) {
          const dflt = sorted.find((k) => k.is_init_default);
          if (dflt) {
            api("GET", `/api/ssh-keys/${dflt.id}`).then((full) => {
              const body = full.private_key || full.private_key_pem || "";
              if (body && !state.git_private_key) {
                state.git_private_key = body;
                const ta = document.getElementById("wiz-key");
                if (ta && !ta.value.trim()) ta.value = body;
              }
            }).catch(() => {});
          }
        }
        wrap.appendChild(list);
      } else {
        wrap.appendChild(h("div", { class: "muted", style: "font-size: 12px; margin-bottom: 8px; padding: 8px; background: var(--surface-2); border-radius: 4px" },
          "No keys in your SSH Keys registry yet. Add one in ",
          h("a", { href: "#/ssh-keys", style: "color: var(--accent,#2563eb)" }, "SSH Keys"),
          " (and mark one as init-default), or paste a key body manually below."));
      }

      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "Private key body"),
        h("textarea", { id: "wiz-key", class: "textarea mono", rows: "10",
          placeholder: "-----BEGIN OPENSSH PRIVATE KEY-----\n...\n-----END OPENSSH PRIVATE KEY-----" },
          state.git_private_key || ""),
      ));
      navButtons({ onNext: () => {
        state.git_private_key = document.getElementById("wiz-key").value.trim();

        state.step = 2; renderStep();
      } });
    }

    function renderPortStep() {
      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "Step 2 · SSH port"),
        h("p", { class: "muted", style: "font-size: 13px; margin: 4px 0 12px" },
          "Change the SSH port on the target server. After init succeeds the node's stored port will be auto-updated."),
      ));
      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "Desired SSH port (1024-65535)"),

      navButtons({ onNext: () => {
        const v = parseInt(document.getElementById("wiz-port").value || "60101", 10);
        // Allow 22 as the explicit "no change" sentinel (orchestrator skips it).
        if (!(v >= 1 && v < 65536)) { toast("error", "Port must be 1-65535"); return; }
        if (v !== 22 && v < 1024) { toast("error", "Port must be either 22 (no change) or 1024-65535"); return; }
        state.desired_ssh_port = v;
        state.step = 3; renderStep();
      } });
