          h("th", null, "Price"),
          h("th", null, "Period"),
          h("th", null, "Active"),
          h("th", null, ""))));
        const tbody = h("tbody");
        for (const svc of svcKeys) {
          // Service separator row
          const sepTr = h("tr", { style: "background: var(--bg-alt, #f5f5f5)" });
          const sepTd = h("td", { colspan: "7",
            style: "padding: 4px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted, #666)" },
            SERVICE_LABELS_P[svc] || svc);
          sepTr.appendChild(sepTd);
          tbody.appendChild(sepTr);
          for (const p of grouped[svc]) {
            const tr = h("tr");
            tr.appendChild(h("td", { class: "mono" }, p.code));
            tr.appendChild(h("td", null,
              (p.name || {})["zh-CN"] || h("span", { class: "muted" }, "—")));
            tr.appendChild(h("td", null, h("span", { class: "badge" }, p.kind)));
            tr.appendChild(h("td", { class: "mono" },
              (p.price_cents > 0)
                ? `${(p.price_cents / 100).toFixed(2)} ${p.currency || "USD"}`
                : h("span", { class: "muted" }, "free")));
            tr.appendChild(h("td", { class: "mono" },
              p.period_days ? `${p.period_days}d` : "—"));
            tr.appendChild(h("td", null, p.active
              ? h("span", { class: "badge ok" }, "active")
              : h("span", { class: "badge warn" }, "inactive")));
            tr.appendChild(h("td", { class: "actions" },
              h("button", { class: "btn btn-sm",
                onclick: () => openProductModal(p, load) }, "Edit")));
            tbody.appendChild(tr);
          }
        }
        tbl.appendChild(tbody);
        const wrap = h("div", { class: "table-wrap" });
        wrap.appendChild(tbl);
        body.appendChild(wrap);
      } catch (err) {
        body.innerHTML = "";
        body.appendChild(renderUserServiceError(err, load));
      }
    }
    await load();
  }

  function openProductModal(existing, onDone) {
    const isNew = !existing;
    const code = h("input", { class: "input", placeholder: "xout-basic",
      value: existing ? existing.code : "", disabled: !isNew });
    const kind = h("select", { class: "select" });
    for (const k of ["one_time", "recurring", "period"]) {
      const o = h("option", { value: k }, k);
      if (existing && existing.kind === k) o.selected = true;
      kind.appendChild(o);
    }
    const price = h("input", { class: "input", type: "number", min: "0",
      placeholder: "Price in cents (0 = free)",
      value: existing ? String(existing.price_cents) : "0" });
    const currency = h("input", { class: "input", placeholder: "USD",
      value: existing && existing.currency ? existing.currency : "USD" });
    const periodDays = h("input", { class: "input", type: "number", min: "0",
      placeholder: "Period days (only for kind=period)",
      value: existing && existing.period_days ? String(existing.period_days) : "" });
    const stripePid = h("input", { class: "input", placeholder: "stripe price_id (optional)",
      value: existing && existing.stripe_price_id ? existing.stripe_price_id : "" });
    const nameZh = h("input", { class: "input", placeholder: "中文显示名",
      value: existing ? ((existing.name || {})["zh-CN"] || "") : "" });
    const nameEn = h("input", { class: "input", placeholder: "English display name",
      value: existing ? ((existing.name || {})["en-US"] || "") : "" });
    const descZh = h("textarea", { class: "input", rows: "2",
      placeholder: "中文描述" }, existing ? ((existing.description || {})["zh-CN"] || "") : "");
    const descEn = h("textarea", { class: "input", rows: "2",
      placeholder: "English description" }, existing ? ((existing.description || {})["en-US"] || "") : "");
    const active = h("input", { type: "checkbox" });
    active.checked = existing ? !!existing.active : true;

    // Service picker
    const serviceSelect = h("select", { class: "select" });
    const SERVICE_OPTS = [
      { value: "chat",     label: "Chat AI" },
      { value: "xout",     label: "Xout VPN" },
      { value: "platform", label: "Platform" },
    ];
    for (const opt of SERVICE_OPTS) {
      const o = h("option", { value: opt.value }, opt.label);
      const currentSvc = existing ? (existing.service_code || "platform") : "platform";
      if (opt.value === currentSvc) o.selected = true;
      serviceSelect.appendChild(o);
    }

    openModal({
      title: isNew ? "New product" : `Edit — ${existing.code}`,
      body: h("div", { class: "form-grid" },
        h("label", null, "Code"),         code,
        h("label", null, "Service"),      serviceSelect,
        h("label", null, "Kind"),         kind,
        h("label", null, "Price (cents)"), price,
        h("label", null, "Currency"),     currency,
        h("label", null, "Period days"),  periodDays,
        h("label", null, "Stripe price"), stripePid,
        h("label", null, "Name (zh-CN)"), nameZh,
        h("label", null, "Name (en-US)"), nameEn,
        h("label", null, "Desc (zh-CN)"), descZh,
        h("label", null, "Desc (en-US)"), descEn,
        h("label", null, "Active"),       h("label", { class: "row", style: "gap: 6px" }, active, h("span", { class: "muted" }, "shown in /api/products"))),
      onSave: async () => {
        const payload = {
          service_code: serviceSelect.value,
          kind: kind.value,
          price_cents: parseInt(price.value || "0", 10),
          currency: currency.value.trim() || "USD",
          period_days: periodDays.value ? parseInt(periodDays.value, 10) : null,
          stripe_price_id: stripePid.value.trim() || null,
          name:        { "zh-CN": nameZh.value.trim(), "en-US": nameEn.value.trim() },
          description: { "zh-CN": descZh.value.trim(), "en-US": descEn.value.trim() },
          active: active.checked,
        };
        if (isNew) {
          payload.code = code.value.trim();
          if (!/^[a-z][a-z0-9_-]{1,40}$/.test(payload.code)) {
            throw new Error("code must match ^[a-z][a-z0-9_-]{1,40}$");
          }
          await api("POST", "/api/user-service/products", payload);
          toast("success", "Product created", payload.code);
        } else {
          await api("PATCH", `/api/user-service/products/${existing.id}`, payload);
          toast("success", "Product updated", existing.code);
        }
        onDone && onDone();
      },
    });
  }

  // Friendly error body for proxy/connectivity errors. Most failures
  // here are operator-fixable (URL or token missing) so we tell the
  // user exactly where to go to fix them.
  function renderUserServiceError(err, retry) {
    const code = (err && err.code) || (err && err.status === 503 ? "user_service_not_configured" : "");
    if (code === "user_service_not_configured") {
      return h("div", { class: "alert alert-warn" },
        h("strong", null, "User service not configured. "),
        "Open ", h("a", { href: "#/settings" }, "Settings → User Service"),
        " and fill in the base URL and admin token.");
    }
    return h("div", { class: "alert alert-error" },
      h("strong", null, "Failed to reach user-service: "),
      err && err.message ? err.message : String(err),
      " ",
      h("a", { href: "#", onclick: (e) => { e.preventDefault(); retry && retry(); } }, "Retry"));
  }

  // ===========================================================================
  // Commands palette — operator-facing imperative actions (replaces the
  // old "write a .command file, double-click via Finder, screenshot the
  // terminal" loop). Backed by /api/commands (catalog) +
  // /api/commands/{id}/run (dispatcher) + the /api/local/* executors.
  //
  // The page is data-driven: each row in commands_catalog renders as one
  // card with a form, a Run button, and an inline output panel. The
  // catalog row's ``schema`` describes the form; the dispatcher merges
  // form values onto the row's ``exec.args`` and routes to the right
  // executor kind. No client-side switch on kind; new builtin kinds
  // surface automatically as long as the backend dispatcher knows them.
  // ===========================================================================
  // Category metadata used by the Commands page (tabs + grouping).
  const COMMANDS_CATEGORY_ORDER = ["quick", "git", "deploy", "db", "remote", "free"];
  const COMMANDS_CATEGORY_LABEL = {
    quick:  "Quick",
    git:    "Git",
    deploy: "Deploy",
    db:     "Database",
    remote: "Remote",
    free:   "Free-form",
  };

  async function renderCommandsView(root) {
    setActiveNav("commands");
    root.innerHTML = "";

    root.appendChild(uiPageHeader(
      "Commands",
      "Run common imperative actions on your host or remote nodes. Output streams into the right-hand drawer.",
    ));

    const status = h("p", { class: "muted" }, "Loading…");
    root.appendChild(status);

    let commands = [];
    let dbs = [];
    let nodes = [];
    let services = [];
    try {
      const [cmdResp, dbResp, nodeResp, svcResp] = await Promise.all([
        api("GET", "/api/commands"),
        api("GET", "/api/databases").catch(() => ({ entries: [] })),
        api("GET", "/api/nodes").catch(() => ({ nodes: [] })),
        api("GET", "/api/services").catch(() => ({ services: [] })),
      ]);
      commands = cmdResp.commands || [];
      dbs = dbResp.entries || [];
      nodes = nodeResp.nodes || [];
      services = svcResp.services || [];
    } catch (err) {
      status.remove();
      root.appendChild(h("p", { class: "muted danger" },
        "Could not load command catalog: " + (err.message || String(err))
        + ". If you just pulled this build, try ", h("a", { href: "#/databases" }, "Apply schema"),
        " from the Databases page first."));
      return;
    }
    status.remove();

    if (!commands.length) {
      root.appendChild(h("p", { class: "muted" },
        "No commands seeded. Run Apply schema to seed the builtins."));
      return;
    }

    // ---- Group commands by category ----
    const grouped = {};
    for (const c of commands) {
      const cat = c.category || "free";
      (grouped[cat] = grouped[cat] || []).push(c);
    }
    const orderedCategories = [
      ...COMMANDS_CATEGORY_ORDER.filter((k) => grouped[k]),
      ...Object.keys(grouped).filter((k) => !COMMANDS_CATEGORY_ORDER.includes(k)),
    ];

    // ---- Layout: left = main (recent + tabs + grids), right = drawer ----
    const drawer = buildCommandsDrawer();
    const main = h("div", { class: "commands-main" });
    const layout = h("div", { class: "commands-layout" },
      main,
      h("aside", { class: "commands-drawer-wrap" }, drawer.el),
    );
    root.appendChild(layout);

    // Recent strip (placeholder — populated below)
    const recentStrip = h("div", { class: "commands-recent" });
    main.appendChild(recentStrip);

    // Tabs
    const tabsBar = h("div", { class: "commands-tabs" });
    main.appendChild(tabsBar);

    // One grid per category. We keep all in DOM and toggle visibility so
    // form state survives tab switches.
    const gridByCategory = {};
    const cardsById = new Map();           // cmd.id -> { card, applyArgs, triggerRun, category }
    for (const cat of orderedCategories) {
      const grid = h("div", { class: "commands-grid" });
      grid.style.display = "none";
      gridByCategory[cat] = grid;
      for (const cmd of grouped[cat]) {
        const built = buildCommandCard(cmd, { dbs, nodes, services }, drawer);
        cardsById.set(cmd.id, { ...built, category: cat });
        grid.appendChild(built.card);
      }
      main.appendChild(grid);
    }

    function activateTab(cat) {
      for (const c of orderedCategories) {
        gridByCategory[c].style.display = c === cat ? "" : "none";
      }
      for (const btn of tabsBar.querySelectorAll(".commands-tab")) {
        btn.classList.toggle("active", btn.dataset.cat === cat);
      }
    }

    for (const cat of orderedCategories) {
      const btn = h("button", { class: "commands-tab", "data-cat": cat },
        COMMANDS_CATEGORY_LABEL[cat] || cat,
        h("span", { class: "count" }, String(grouped[cat].length)),
      );
      btn.addEventListener("click", () => activateTab(cat));
      tabsBar.appendChild(btn);
    }
    activateTab(orderedCategories[0]);

    // Recent strip — last 5 runs across all commands; click to re-run.
    async function refreshRecent() {
      try {
        const r = await api("GET", "/api/commands/runs?limit=5");
        recentStrip.innerHTML = "";
        recentStrip.appendChild(h("span", { class: "commands-recent-label" }, "Recent"));
        const runs = r.runs || [];
        if (!runs.length) {
          recentStrip.appendChild(h("span", { class: "muted", style: "font-size: 12px;" },
            "No runs yet."));
          return;
        }
        for (const run of runs) {
          const built = cardsById.get(run.command_id);
          const title = (built && built.cmd && (built.cmd.title || built.cmd.id))
                     || run.command_id;
          const dotClass = run.status === "success" ? "dot" : "dot failed";
          const pill = h("button", { class: "commands-recent-pill", title: run.command_id },
            h("span", { class: dotClass }),
            h("span", null, title),
            h("span", { class: "when" }, fmtRelative(run.started_at)),
          );
          if (built) {
            pill.addEventListener("click", () => {
              activateTab(built.category);
              built.applyArgs(run.args_json || {});
              setTimeout(() => built.triggerRun(), 50);
            });
          } else {
            pill.disabled = true;
            pill.title = run.command_id + " — command no longer in catalog";
          }
          recentStrip.appendChild(pill);
        }
      } catch (_err) {
        // Silent — Recent is a nice-to-have, don't block the page.
      }
    }
    drawer.onAfterRun = refreshRecent;
    refreshRecent();
  }

  // Build the sticky output drawer. Returns an object with:
  //   el          — the DOM element to mount
  //   start({cmd, args, applyArgs, triggerRun})  — switch into "running" state
  //   finish({cmd, result, durationMs, applyArgs, triggerRun})
  //   error({cmd, err, applyArgs, triggerRun})
  //   onAfterRun  — optional callback invoked after a run completes
  //                 (used by Recent strip to refresh).
  function buildCommandsDrawer() {
    const el = h("div", { class: "commands-drawer" });
    let activeCardEl = null;

    function setActiveCard(card) {
      if (activeCardEl) activeCardEl.classList.remove("is-active");
      activeCardEl = card || null;
      if (activeCardEl) activeCardEl.classList.add("is-active");
    }

    function showEmpty() {
      el.innerHTML = "";
      el.appendChild(h("div", { class: "drawer-empty" },
        "Run any command to see its output here."));
      setActiveCard(null);
    }

    function showRunning(cmd, ctxBits) {
      el.innerHTML = "";
      const header = h("div", { class: "drawer-header" },
        h("div", { class: "drawer-title" }, cmd.title || cmd.id),
        h("div", { class: "drawer-meta" }, "running…"),
      );
      el.appendChild(header);
      el.appendChild(h("div", { class: "drawer-body muted" }, "Running…"));
      setActiveCard(ctxBits && ctxBits.cardEl);
    }

    function showResult(cmd, result, durationMs, ctxBits) {
      el.innerHTML = "";
      const ok = !!result.ok;
      const exit = result.exit_code != null ? `exit ${result.exit_code}` : (ok ? "ok" : "—");
      const dur = result.duration_ms != null ? `${result.duration_ms}ms` : `${durationMs}ms`;
      const ts = new Date().toLocaleTimeString();
      const meta = `${ts} · ${dur} · ${exit}` + (result.cwd ? ` · ${result.cwd}` : "");
      const header = h("div", { class: "drawer-header" },
        h("div", { class: "drawer-title" }, cmd.title || cmd.id),
        h("div", { class: "drawer-meta", style: `color: ${ok ? "var(--success)" : "var(--danger)"};` },
          (ok ? "✓ " : "✗ ") + meta),
      );
      el.appendChild(header);

      const body = h("div", { class: "drawer-body" });
      if (result.command) {
        body.appendChild(h("div", { class: "drawer-cmd" }, "$ " + result.command));
      }
      if (result.error) {
        body.appendChild(h("div", { style: "color: var(--danger); margin-bottom: 4px;" },
          result.error));
      }
      if (result.stdout) {
        body.appendChild(h("div", { class: "drawer-stdout" }, result.stdout));
      }
      if (result.stderr) {
        body.appendChild(h("div", { class: "drawer-stderr" }, result.stderr));
      }
      if (!result.stdout && !result.stderr && !result.error && !result.command) {
        body.appendChild(h("div", { class: "muted" }, "(no output)"));
      }
      el.appendChild(body);

      const tools = h("div", { class: "drawer-tools" });
      if (result.stdout) {
        const b = h("button", { class: "btn btn-sm" }, "Copy stdout");
        b.addEventListener("click", () => navigator.clipboard.writeText(result.stdout).then(
          () => toast("success", "stdout copied"),
          () => toast("error", "copy failed"),
        ));
        tools.appendChild(b);
      }
      if (result.stderr) {
        const b = h("button", { class: "btn btn-sm" }, "Copy stderr");
        b.addEventListener("click", () => navigator.clipboard.writeText(result.stderr).then(
          () => toast("success", "stderr copied"),
          () => toast("error", "copy failed"),
        ));
        tools.appendChild(b);
      }
      if (ctxBits && ctxBits.triggerRun) {
        const rb = h("button", { class: "btn btn-sm" }, "Re-run");
        rb.addEventListener("click", () => ctxBits.triggerRun());
        tools.appendChild(rb);
      }
      el.appendChild(tools);
      setActiveCard(ctxBits && ctxBits.cardEl);
    }

    function showError(cmd, err, ctxBits) {
      el.innerHTML = "";
      const header = h("div", { class: "drawer-header" },
        h("div", { class: "drawer-title" }, cmd.title || cmd.id),
        h("div", { class: "drawer-meta", style: "color: var(--danger);" }, "request failed"),
      );
      el.appendChild(header);
      el.appendChild(h("div", { class: "drawer-body", style: "color: var(--danger);" },
        err && err.message ? err.message : String(err)));
      setActiveCard(ctxBits && ctxBits.cardEl);
    }

    showEmpty();
    return {
      el,
      start: showRunning,
      finish: showResult,
      error: showError,
      onAfterRun: null,
      _afterRun() { if (typeof this.onAfterRun === "function") this.onAfterRun(); },
    };
  }

  // Build one card for a commands_catalog row. Returns { card, applyArgs,
  // triggerRun, cmd } so the parent view can populate from history /
  // recent runs and trigger Run programmatically. Output goes into the
  // shared drawer, not back into the card itself.
  function buildCommandCard(cmd, ctx, drawer) {
    const card = h("div", { class: "commands-card" });
    card.appendChild(h("div", null,
      h("div", { style: "font-weight: 600; font-size: 14px;" }, cmd.title || cmd.id),
      h("div", { class: "muted", style: "font-size: 12px; margin-top: 2px;" },
        cmd.description || ""),
    ));
    const form = h("div", { class: "form-area" });
    const inputs = {};
    const schema = Array.isArray(cmd.schema) ? cmd.schema
                 : (typeof cmd.schema === "string" ? JSON.parse(cmd.schema || "[]") : []);
    for (const field of schema) {
      const wrapper = h("div", { style: "display: flex; flex-direction: column; gap: 2px;" });
      wrapper.appendChild(h("label", {
        style: "font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px;",
      }, field.label || field.name));
      let el;
      if (field.type === "textarea") {
        el = h("textarea", {
          class: "input",
          rows: 3,
          placeholder: field.placeholder || "",
          style: "font-family: var(--mono); font-size: 12px; resize: vertical;",
        });
      } else if (field.type === "checkbox") {
        const cb = h("input", { type: "checkbox" });
        wrapper.appendChild(h("div", { style: "display: flex; align-items: center; gap: 6px; margin-top: 2px;" },
          cb,
          h("span", { style: "font-size: 12px; color: var(--text);" }, field.label || field.name),
        ));
        wrapper.firstChild.style.display = "none";  // hide duplicate label
        inputs[field.name] = { el: cb, type: "checkbox" };
        form.appendChild(wrapper);
        continue;
      } else if (field.type === "db_id") {
        el = h("select", { class: "input", style: "font-size: 13px;" });
        el.appendChild(h("option", { value: "" }, "Select…"));
        for (const d of (ctx.dbs || [])) {
          el.appendChild(h("option", { value: d.id }, `${d.label || d.id} (${d.id})`));
        }
      } else if (field.type === "node_name") {
        el = h("select", { class: "input", style: "font-size: 13px;" });
        el.appendChild(h("option", { value: "" }, "Select…"));
        for (const n of (ctx.nodes || [])) {
          el.appendChild(h("option", { value: n.name }, `${n.name} (${n.host || ""})`));
        }
      } else if (field.type === "service_name") {
        el = h("select", { class: "input", style: "font-size: 13px;" });
        el.appendChild(h("option", { value: "" }, "Select…"));
        for (const s of (ctx.services || [])) {
          el.appendChild(h("option", { value: s.name }, s.name));
        }
      } else {
        el = h("input", {
          class: "input", type: "text",
          placeholder: field.placeholder || "",
          style: "font-size: 13px;",
        });
      }
      wrapper.appendChild(el);
      inputs[field.name] = { el, type: field.type || "text", required: !!field.required };
      form.appendChild(wrapper);
    }
    card.appendChild(form);

    const runBtn = h("button", { class: "btn btn-primary btn-sm" }, "Run");
    const historyBtn = h("button", { class: "btn btn-sm" }, "History");
    card.appendChild(h("div", { class: "footer" }, historyBtn, runBtn));

    function applyArgs(args) {
      if (!args || typeof args !== "object") return;
      for (const [name, info] of Object.entries(inputs)) {
        if (!(name in args)) continue;
        const v = args[name];
        if (info.type === "checkbox") {
          info.el.checked = !!v;
        } else {
          info.el.value = v == null ? "" : String(v);
        }
      }
    }
    function triggerRun() { runBtn.click(); }

    runBtn.addEventListener("click", async () => {
      const args = {};
      for (const [name, info] of Object.entries(inputs)) {
        if (info.type === "checkbox") {
          args[name] = info.el.checked;
        } else {
          const v = (info.el.value || "").trim();
          if (info.required && !v) {
            toast("warning", `${name} is required`);
            info.el.focus();
            return;
          }
          if (v !== "") args[name] = v;
        }
      }
      // Footgun-protect git-commit-push when paths is blank — backend's
      // `git add -A` will sweep the whole working tree including unrelated
      // edits. Force the operator to opt in.
      if (cmd.id && cmd.id.startsWith("git-commit-push") && !args.paths) {
        const ok = window.confirm(
          "No paths provided — this will stage EVERYTHING in the working tree "
          + "(including any unrelated edits) and commit + push it. Continue?"
        );
        if (!ok) return;
      }
      runBtn.disabled = true;
      runBtn.textContent = "Running…";
      const ctxBits = { cardEl: card, applyArgs, triggerRun };
      drawer.start(cmd, ctxBits);
      const t0 = Date.now();
      try {
        const result = await api("POST", `/api/commands/${encodeURIComponent(cmd.id)}/run`, { args });
        drawer.finish(cmd, result, Date.now() - t0, ctxBits);
      } catch (err) {
        drawer.error(cmd, err, ctxBits);
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = "Run";
        drawer._afterRun();
      }
    });

    historyBtn.addEventListener("click", async () => {
      try {
        const r = await api("GET", `/api/commands/runs?command_id=${encodeURIComponent(cmd.id)}&limit=25`);
        showHistoryModal(cmd, r.runs || [], { applyArgs, triggerRun });
      } catch (err) {
        toast("error", "Could not load history", err.message);
      }
    });

    return { card, applyArgs, triggerRun, cmd };
  }

  // ``controls`` (optional) = { applyArgs(args), triggerRun() } closures
  // owned by the originating card. Passing them in keeps the history
  // modal a pure renderer and gives one-click "re-run with same args"
  // without smuggling DOM refs through globals.
  function showHistoryModal(cmd, runs, controls) {
    const body = h("div", null);
    if (!runs.length) {
      body.appendChild(h("p", { class: "muted" }, "No runs yet."));
    } else {
      const tbl = h("table", { class: "data" });
      const headerCells = [
        h("th", null, "When"),
        h("th", null, "Status"),
        h("th", null, "Exit"),
        h("th", null, "Args"),
      ];
      if (controls && controls.applyArgs) headerCells.push(h("th", null, ""));
      tbl.appendChild(h("thead", null, h("tr", null, ...headerCells)));
      const tb = h("tbody");
      for (const r of runs) {
        const when = r.started_at ? new Date(r.started_at).toLocaleString() : "—";
        const argsObj = r.args_json && typeof r.args_json === "object" ? r.args_json : {};
        const argsStr = (() => {
          try { return JSON.stringify(argsObj); } catch { return ""; }
        })();
        const cells = [
          h("td", { style: "font-family: var(--mono); font-size: 12px;" }, when),
          h("td", null, r.status),
          h("td", null, r.exit_code != null ? String(r.exit_code) : "—"),
          h("td", {
            style: "font-family: var(--mono); font-size: 11px; max-width: 320px;"
                 + " overflow: hidden; text-overflow: ellipsis; white-space: nowrap;",
            title: argsStr,
          }, argsStr),
        ];
        if (controls && controls.applyArgs) {
          const reRunBtn = h("button", { class: "btn btn-sm" }, "Re-run");
          reRunBtn.addEventListener("click", () => {
            controls.applyArgs(argsObj);
            Modal.close();
            // Defer the actual run so the modal-close transition can settle
            // — without this, the inline output panel sometimes races with
            // the modal teardown and renders briefly under the closing layer.
            setTimeout(() => controls.triggerRun(), 50);
          });
          cells.push(h("td", { style: "white-space: nowrap;" }, reRunBtn));
        }
        tb.appendChild(h("tr", null, ...cells));
      }
      tbl.appendChild(tb);
      body.appendChild(tbl);
    }
    Modal.open({
      title: `History · ${cmd.title || cmd.id}`,
      body,
      footer: h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
    });
  }

  async function renderLogsView(root) {
    setActiveNav("logs");
    root.innerHTML = "";
    root.appendChild(h("div", { class: "page-header" },
      h("div", null,
        h("h1", null, "Logs"),
        h("p", { class: "lede" }, "Tail the most recent lines of the controller and Caddy logs."),
      ),
    ));

    const tabs = h("div", { class: "tabs" });
    const controllerTab = h("div", { class: "tab active", "data-which": "controller" }, "Controller");
    const caddyTab = h("div", { class: "tab", "data-which": "caddy" }, "Caddy");
    tabs.appendChild(controllerTab);
    tabs.appendChild(caddyTab);
    root.appendChild(tabs);

    const row = h("div", { class: "row between", style: "margin-bottom: 12px" },
      h("div", { class: "muted", id: "log-meta" }, ""),
      h("div", { class: "row" },
        h("label", { class: "muted" }, "Tail: "),
        (() => {
          const sel = h("select", { class: "select", id: "log-tail" });
          for (const n of [100, 500, 1000, 2000, 5000]) sel.appendChild(h("option", { value: String(n) }, `${n} lines`));
          sel.value = "500";
          sel.addEventListener("change", reload);
          return sel;
        })(),
        h("button", { class: "btn btn-sm", onclick: reload }, "Refresh"),
        (() => {
          const auto = h("label", { class: "inline-checkbox" },
            h("input", { type: "checkbox", id: "log-auto" }), " Auto-refresh");
          return auto;
        })(),
      ),
    );
    root.appendChild(row);

    const card = h("div", { class: "card" });
    const body = h("div", { class: "card-body" });
    const viewer = h("div", { class: "log-viewer", id: "log-viewer" }, h("span", { class: "dim" }, "Loading…"));
    body.appendChild(viewer);
    card.appendChild(body);
    root.appendChild(card);

    let which = "controller";
    let autoTimer = null;

    controllerTab.addEventListener("click", () => { which = "controller"; controllerTab.classList.add("active"); caddyTab.classList.remove("active"); reload(); });
    caddyTab.addEventListener("click", () => { which = "caddy"; caddyTab.classList.add("active"); controllerTab.classList.remove("active"); reload(); });

    async function reload() {
      const tail = document.getElementById("log-tail").value || "500";
      try {
        const resp = await api("GET", `/api/logs?which=${encodeURIComponent(which)}&tail=${encodeURIComponent(tail)}`);
        viewer.innerHTML = "";
        document.getElementById("log-meta").textContent = `${resp.path}`;
        if (!resp.lines || !resp.lines.length) {
          viewer.appendChild(h("span", { class: "dim" }, "(no log lines yet)"));
        } else {
          viewer.appendChild(document.createTextNode(resp.lines.join("\n")));
        }
        viewer.scrollTop = viewer.scrollHeight;
      } catch (err) {
        if (err.status === 401) showLogin();
        else toast("error", "Could not read log", err.message);
      }
    }

    document.getElementById("log-auto").addEventListener("change", (e) => {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
      if (e.target.checked) autoTimer = setInterval(reload, 3000);
    });

    reload();
    // cleanup on leaving view
    App._leaveCurrent = () => { if (autoTimer) clearInterval(autoTimer); };
  }

  // ----- Settings view -----

  // Render the "Bootstrap .env" card on Settings. Pulls /api/env,
  // shows masked values in a small table, and offers an Edit button
  // that opens openEditEnvModal. Lifted out of the function body so
  // both initial render and post-save reload can share it.
  async function renderSettingsEnvCard(envBody) {
    envBody.innerHTML = "";
    let view;
    try {
      view = await api("GET", "/api/env");
    } catch (err) {
      envBody.appendChild(h("div", { class: "muted",
        style: "color: var(--danger)" },
        err.status === 404
          ? "Endpoint /api/env not available — restart the admin to pick up the new build."
          : "Load failed: " + err.message));
      return;
    }
    const pathEl = document.getElementById("env-file-path");
    if (pathEl) pathEl.textContent = view.path || "";
    if (!view.available) {
      envBody.appendChild(h("div", { class: "muted",
        style: "color: var(--warn, #b58200)" },
        view.reason || "(.env not available)"));
      return;
    }
    const tbl = h("table", { class: "data" });
    tbl.appendChild(h("thead", null, h("tr", null,
      h("th", { style: "width: 220px" }, "Key"),
      h("th", null, "Value"),
    )));
    const tb = h("tbody");
    for (const e of (view.entries || [])) {
      tb.appendChild(h("tr", null,
        h("td", { class: "mono", style: "font-size: 12px" }, e.key),
        h("td", {
          class: "mono",
          style: "font-size: 11.5px; max-width: 720px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;",
          title: e.display || "",
        }, e.display || h("span", { class: "muted" }, "(empty)")),
      ));
    }
    tbl.appendChild(tb);
    envBody.appendChild(h("div", { class: "table-wrap" }, tbl));
    envBody.appendChild(h("div", { class: "muted",
      style: "margin-top: 8px; font-size: 12px" },
      view.note || "Changes take effect on next admin restart."));
    if (App.mode === "readwrite") {
      envBody.appendChild(h("div", { style: "margin-top: 12px" },
        h("button", { class: "btn btn-primary",
          onclick: () => openEditEnvModalFromSettings(view, envBody) },
          "Edit .env")));
    }
  }

  // Edit-bootstrap-.env modal for Settings (own copy because the
  // Databases-page modal closes over its own renderEnv reload). The
  // body is structurally identical — secret rows seed empty so an
  // unchanged save doesn't round-trip the real secret.
  function openEditEnvModalFromSettings(currentView, envBody) {
    const rowsContainer = h("div");
    const buildRow = (key, value, isSecret) => {
      const keyInput = h("input", { class: "input mono",
        style: "font-size: 12px; flex: 0 0 240px",
        value: key, placeholder: "SSL_SERVICE_FOO" });
      const valInput = h("input", { class: "input mono",
        style: "font-size: 11.5px; flex: 1",
        type: isSecret ? "password" : "text",
        value: value || "",
        placeholder: isSecret ? "(unchanged — leave blank to keep existing)" : "" });
      const isSecretWrap = h("span", { class: "muted",
        style: "font-size: 11px; margin: 0 8px" },
        isSecret ? "🔒 secret" : "");
      const revealBtn = h("button", { class: "btn btn-sm",
        type: "button",
        title: isSecret ? "Show / hide value" : "",
        style: isSecret ? "" : "display: none",
        onclick: (e) => {
          e.preventDefault();
          valInput.type = (valInput.type === "password" ? "text" : "password");
        },
      }, isSecret ? "👁" : "");
      const removeBtn = h("button", { class: "btn btn-sm btn-danger",
        type: "button", title: "Remove this line",
        onclick: (e) => { e.preventDefault(); row.remove(); } }, "−");
      const row = h("div", {
        class: "row",
        style: "gap: 6px; align-items: center; margin-bottom: 6px;",
        "data-env-row": "1",
      }, keyInput, isSecretWrap, valInput, revealBtn, removeBtn);
      return row;
    };
    for (const e of (currentView.entries || [])) {
      rowsContainer.appendChild(buildRow(
        e.key, e.is_secret ? "" : (e.display || ""), e.is_secret));
    }
    const addBtn = h("button", { class: "btn btn-sm", type: "button",
      onclick: (e) => {
        e.preventDefault();
        rowsContainer.appendChild(buildRow("", "", false));
      } }, "+ Add line");
    const errEl = h("div", { class: "muted",
      style: "color: var(--danger); margin-top: 8px" });
    const body = h("div", null,
      h("p", { class: "muted" },
        "Editing ", h("span", { class: "mono", style: "font-size: 11.5px" },
          currentView.path || ""),
        ". Empty value on a 🔒 secret = keep the existing value."),
      rowsContainer,
      h("div", { style: "margin-top: 8px" }, addBtn),
      errEl);
    const saveBtn = h("button", { class: "btn btn-primary", type: "button",
      onclick: async (e) => {
        e.preventDefault();
        const entries = Array.from(rowsContainer.querySelectorAll('[data-env-row="1"]'))
          .map((row) => {
            const inputs = row.querySelectorAll("input");
            return { key: inputs[0].value.trim(), value: inputs[1].value };
          })
          .filter((r) => r.key);
        if (!entries.length) {
          errEl.textContent = "Need at least one entry.";
          return;
        }
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        try {
          await api("PUT", "/api/env", { entries });
          toast("success", ".env saved",
            "Restart the admin to pick up the new bootstrap config.");
          Modal.close();
          renderSettingsEnvCard(envBody);
        } catch (err) {
          errEl.textContent = err.message || "save failed";
          saveBtn.disabled = false;
          saveBtn.textContent = "Save";
        }
      } }, "Save");
    const footer = h("div", { class: "row" },
      h("div", { style: "flex: 1" }),
      h("button", { class: "btn", type: "button",
        onclick: () => Modal.close() }, "Cancel"),
      saveBtn);
    Modal.open({ title: "Edit bootstrap .env", body, footer, size: "wide" });
  }

  async function renderSettingsView(root) {
    setActiveNav("settings");
    root.innerHTML = "";
    root.appendChild(h("div", { class: "page-header" },
      h("div", null,
        h("h1", null, "Settings"),
        h("p", { class: "lede" },
          "System-level configuration. The Bootstrap .env card below is ",
          "the source of truth for ",
          h("span", { class: "mono" }, "SSL_SERVICE_*"),
          " — changes there take effect on next admin restart."),
      ),
      h("div", { class: "row" }, h("button", { class: "btn", onclick: () => renderSettingsView(root) }, "Refresh")),
    ));

    // -------- Bootstrap .env (system-level) --------
    // The file the admin booted from. Contains DSN, admin token,
    // ports, log level, ACME email, etc. — putting it here in
    // Settings rather than Databases since it's all system config,
    // not just the DB pointer.
    const envCard = h("div", { class: "card" });
    envCard.appendChild(h("div", { class: "card-header" },
      h("h2", null, "Bootstrap .env"),
      h("span", { class: "hint", id: "env-file-path" }, "")));
    const envBody = h("div", { class: "card-body" });
    envCard.appendChild(envBody);
    root.appendChild(envCard);
    envBody.appendChild(h("div", { class: "muted", style: "padding: 8px 0;" },
      "Loading…"));
    renderSettingsEnvCard(envBody);

    const o = App.overview || {};
    const grid = h("div", { class: "stats" });
    grid.appendChild(statCard("Mode", (o.mode || "—").toUpperCase(), "See sidebar badge"));
    grid.appendChild(statCard("Poll interval", (o.poll_interval_seconds ?? "—") + "s", "Controller loop cadence"));
    grid.appendChild(statCard("Renew before", (o.renew_before_days ?? "—") + " days", "Certificate expiry threshold"));
    grid.appendChild(statCard("Retry backoff", (o.retry_backoff_seconds ?? "—") + "s", "After ACME failure"));
    root.appendChild(grid);

    const pathsCard = h("div", { class: "card" });
    pathsCard.appendChild(h("div", { class: "card-header" }, h("h2", null, "Paths")));
    const pathsBody = h("div", { class: "card-body" });
    const paths = o.paths || {};
    for (const [k, v] of Object.entries(paths)) {
      pathsBody.appendChild(h("div", { class: "row", style: "gap: 12px; padding: 6px 0;" },
        h("div", { class: "muted", style: "min-width: 180px;" }, k),
        h("div", { class: "mono" }, v),
      ));
    }
    pathsCard.appendChild(pathsBody);
    root.appendChild(pathsCard);

    const acmeCard = h("div", { class: "card" });
    acmeCard.appendChild(h("div", { class: "card-header" }, h("h2", null, "ACME")));
    const acmeBody = h("div", { class: "card-body" });
    acmeBody.appendChild(h("div", { class: "row", style: "gap: 12px; padding: 6px 0;" },
      h("div", { class: "muted", style: "min-width: 180px;" }, "email"),
      h("div", { class: "mono" }, o.acme_email || "—"),
    ));
    acmeBody.appendChild(h("div", { class: "row", style: "gap: 12px; padding: 6px 0;" },
      h("div", { class: "muted", style: "min-width: 180px;" }, "staging"),
      h("div", null, o.acme_staging ? h("span", { class: "badge warn" }, "staging") : h("span", { class: "badge ok" }, "production")),
    ));
    acmeCard.appendChild(acmeBody);
    root.appendChild(acmeCard);

    // -------- Schema-driven settings cards --------
    // All operator-tunable cards (GitHub PAT, Stripe, OAuth, SMTP, …) are
    // declared once in admin.py's SETTINGS_REGISTRY and exposed via
    // /api/settings-schema. The block below renders every entry generically
    // — adding a new service's settings is a one-line append on the server,
    // no UI change required.
    let schemaResp;
    try {
      schemaResp = await api("GET", "/api/settings-schema");
    } catch (err) {
      root.appendChild(h("div", { class: "alert alert-error" },
        "Could not load settings schema: " + (err.message || err)));
      return;
    }
    const cards = (schemaResp && schemaResp.cards) || [];
    let lastGroup = null;
    for (const entry of cards) {
      // Group divider
      if (entry.group !== lastGroup) {
        const hdr = h("h2", { style: "margin: 18px 0 6px; font-size: 13px; "
          + "text-transform: uppercase; letter-spacing: 0.06em; "
          + "color: var(--muted)" }, entry.group);
        root.appendChild(hdr);
        lastGroup = entry.group;
      }
      const card = h("div", { class: "card" });
      const header = h("div", { class: "card-header" },
        h("h2", null, entry.title),
        entry.hint ? h("span", { class: "hint" }, entry.hint) : null);
      card.appendChild(header);
      const body = h("div", { class: "card-body" });
      const inputs = {};
      for (const f of (entry.fields || [])) {
        const wrap = h("div", { class: "field" });
        const lbl = h("label", null, f.label || f.name);
        if (f.hint) {
          lbl.appendChild(h("span", { class: "hint" }, " — " + f.hint));
        }
        wrap.appendChild(lbl);
        let input;
        if (f.type === "bool") {
          input = h("input", { type: "checkbox" });
          const row = h("label", { class: "row", style: "gap: 6px" },
            input, h("span", { class: "muted" }, f.placeholder || ""));
          wrap.appendChild(row);
        } else if (f.type === "select" && Array.isArray(f.options)) {
          input = h("select", { class: "select" });
          for (const opt of f.options) {
            input.appendChild(h("option", { value: opt.value || opt },
              opt.label || opt.value || opt));
          }
          wrap.appendChild(input);
        } else {
          const t = (f.type === "number" ? "number"
                    : f.type === "password" || f.secret ? "password"
                    : f.type === "email" ? "email"
                    : f.type === "url" ? "url"
                    : "text");
          input = h("input", { class: "input mono", type: t,
            placeholder: f.placeholder || "",
            autocomplete: f.secret ? "off" : "on" });
          wrap.appendChild(input);
        }
        inputs[f.name] = { el: input, def: f };
        body.appendChild(wrap);
      }
      const status = h("div", { class: "muted",
        style: "margin-top: 6px; font-size: 12px" }, "loading…");

      function readPayload() {
        const out = {};
        for (const [n, ref] of Object.entries(inputs)) {
          const f = ref.def;
          const el = ref.el;
          let v;
          if (f.type === "bool") v = !!el.checked;
          else if (f.type === "number") v = el.value === "" ? null : parseInt(el.value, 10);
          else v = el.value.trim();
          if (v !== null && v !== "") out[n] = v;
        }
        return out;
      }
      function applyResponse(resp) {
        for (const [n, ref] of Object.entries(inputs)) {
          const f = ref.def;
          const el = ref.el;
          const v = (resp || {})[n];
          if (f.type === "bool") el.checked = !!v;
          else el.value = (v === undefined || v === null) ? "" : String(v);
        }
        const filled = Object.values(inputs).some((ref) => {
          if (ref.def.type === "bool") return ref.el.checked;
          return (ref.el.value || "").trim() !== "";
        });
        const m = entry.status_msg || {};
        const word = filled ? (m.configured || "configured")
                            : (m.missing || "not configured");
        status.textContent = word;
      }

      body.appendChild(h("div", { class: "row", style: "gap: 8px; margin-top: 12px" },
        h("button", { class: "btn btn-primary", onclick: async (e) => {
          e.preventDefault();
          try {
            const r = await api("PUT", `/api/system-config/${entry.key}`, readPayload());
            applyResponse(r);
            toast("success", `${entry.title} saved`, "");
          } catch (err) { toast("error", "Save failed", err.message); }
        } }, "Save"),
        h("button", { class: "btn", onclick: async (e) => {
          e.preventDefault();
          try {
            const r = await api("GET", `/api/system-config/${entry.key}`).catch(() => ({}));
            applyResponse(r);
          } catch (err) { toast("error", "Reload failed", err.message); }
        } }, "Reload"),
        status));
      card.appendChild(body);
      root.appendChild(card);

      // Initial fetch — fire-and-forget per card.
      api("GET", `/api/system-config/${entry.key}`).catch(() => ({})).then((r) => {
        applyResponse(r);
      });
    }
  }

  // ---------------------------------------------------------------------------
  // restartAdminFlow — POSTs /api/admin/restart and polls /api/admin/version
  // until the started_at timestamp changes (= a new process is up).
  // Replaces the old workflow of sshing in and running .command files.
  // ---------------------------------------------------------------------------
  async function restartAdminFlow(triggerBtn) {
    if (!confirm("Restart the admin process now?\n\n" +
                 "Any in-flight requests get terminated. The page will " +
                 "auto-recover when the new process is up.")) return;

    // Snapshot the current version so we can detect the swap.
    let before = null;
    try { before = await api("GET", "/api/admin/version"); }
    catch (err) {
      alert("Cannot read /api/admin/version (need newer admin build): " + err.message);
      return;
    }

    triggerBtn.disabled = true;
    const originalLabel = triggerBtn.textContent;
    triggerBtn.textContent = "Restarting…";

    try {
      await api("POST", "/api/admin/restart", {});
    } catch (err) {
      // Some browsers see the closed connection before the JSON body arrives;
      // tolerate that and rely on the version-poll loop to confirm.
      console.warn("restart POST returned", err);
    }

    // Poll up to ~30s for the new started_at to appear.
    const start = Date.now();
    let upAt = null;
    while (Date.now() - start < 30_000) {
      await new Promise(r => setTimeout(r, 700));
      try {
        const now = await api("GET", "/api/admin/version");
        if (now && now.started_at && before && now.started_at !== before.started_at) {
          upAt = now;
          break;
        }
      } catch (_e) { /* admin still down, keep polling */ }
    }

    triggerBtn.disabled = false;
    triggerBtn.textContent = originalLabel;
    if (upAt) {
      // Force a full page reload so the new build's HTML/JS is picked up too.
      location.reload();
    } else {
      alert("Admin did not come back up within 30s. Check the host logs.");
    }
  }

  // ---------------------------------------------------------------------------
  // Databases — multi-DB registry + cross-DB sync. The currently-
  // connected DSN is auto-registered; users can add more, edit labels
  // and DSNs, mark a "primary on next restart", and sync between any
  // two of them via an analyze-first preview.
  // ---------------------------------------------------------------------------
  // ---------------------------------------------------------------------------
  // Xout — dedicated channel for the xout proxy service. Two cards:
  //   1. Presets — named bundles of inbound configs (multi-protocol).
  //   2. Nodes  — list of nodes that have xout deployed; per-node
  //               "Deploy with preset" action.
  // ---------------------------------------------------------------------------
  async function renderXoutView(root) {
    setActiveNav("xout");
    root.innerHTML = "";
    root.appendChild(h("div", { class: "page-header" },
      h("div", null,
        h("h1", null, "Xout"),
        h("p", { class: "lede" },
          "Multi-inbound VLESS+Reality / HTTP / SOCKS proxy. ",
          "Maintain named presets and pick which one to deploy per node."),
      ),
    ));

    // Card 1: Presets
    const presetsCard = h("div", { class: "card" });
    presetsCard.appendChild(h("div", { class: "card-header" },
      h("h2", null, "Presets"),
      h("button", { class: "btn btn-primary",
        onclick: () => openXoutPresetEditor(null, refresh) }, "+ Add preset")));
    const presetsBody = h("div", { class: "card-body" });
    presetsCard.appendChild(presetsBody);
    root.appendChild(presetsCard);

    // Card 2: Products — xout sub-products. Each = a (node, inbound_tag)
    // selector. User subscribes to a product → /sub/{token} returns the
    // matching VLESS URIs.
    const productsCard = h("div", { class: "card" });
    productsCard.appendChild(h("div", { class: "card-header" },
      h("h2", null, "Products"),
      h("div", { class: "row", style: "gap: 6px; flex: 1; justify-content: flex-end" },
        h("button", { class: "btn btn-sm",
          onclick: () => loadXoutProducts() }, "Refresh"),
        h("button", { class: "btn btn-sm btn-primary",
          onclick: () => openXoutProductEditor(null, loadXoutProducts) }, "+ New product"))));
    const productsBody = h("div", { class: "card-body" });
    productsCard.appendChild(productsBody);
    root.appendChild(productsCard);

    async function loadXoutProducts() {
      productsBody.innerHTML = "";
      productsBody.appendChild(h("div", { class: "muted" }, "Loading…"));
      try {
        const r = await api("GET", "/api/user-service/xout/products");
        const products = r.products || [];
        productsBody.innerHTML = "";
        if (products.length === 0) {
          productsBody.appendChild(h("div", { class: "muted" },
            "No xout products yet — click ", h("strong", null, "+ New product"),
            " to create one (e.g. 美国-only, 全节点-pack, etc.)."));
          return;
        }
        const tbl = h("table", { class: "data" });
        tbl.appendChild(h("thead", null, h("tr", null,
          h("th", null, "Code"),
          h("th", null, "Name (zh-CN)"),
          h("th", null, "Period"),
          h("th", null, "Price"),
          h("th", null, "Subscribers"),
          h("th", null, "Nodes / inbounds"),
          h("th", null, "Active"),
          h("th", null, ""))));
        const tbody = h("tbody");
        for (const p of products) {
          const tr = h("tr");
          tr.appendChild(h("td", { class: "mono" }, p.code));
          const nameZh = (p.name && p.name["zh-CN"]) || "";
          tr.appendChild(h("td", null, nameZh || h("span", { class: "muted" }, "—")));
          tr.appendChild(h("td", { class: "mono" }, p.period_days ? `${p.period_days}d` : "—"));
          tr.appendChild(h("td", { class: "mono" },
            p.price_cents > 0
              ? `${(p.price_cents / 100).toFixed(2)} ${p.currency || "USD"}`
              : h("span", { class: "muted" }, "free")));
          tr.appendChild(h("td", { class: "mono" }, String(p.subscriber_count || 0)));
          const sel = (p.inbound_selector && p.inbound_selector.nodes) || [];
          let summary;
          if (sel.length === 0) {
            summary = h("span", { class: "muted" }, "(none)");
          } else {
            const badges = h("div", { class: "row", style: "gap: 4px; flex-wrap: wrap" });
            for (const n of sel) {
              badges.appendChild(h("span", { class: "badge",
                title: `${n.name}: ${(n.tags || ["*"]).join(", ")}` },
                `${n.name}: ${(n.tags || ["*"]).join(",")}`));
            }
            summary = badges;
          }
          tr.appendChild(h("td", null, summary));
          tr.appendChild(h("td", null, p.active
            ? h("span", { class: "badge ok" }, "active")
            : h("span", { class: "badge warn" }, "inactive")));
          // Delete is only safe when no subs (server enforces too).
          // Active products with subscribers must be deactivated first
          // so we don't accidentally orphan active customers.
          const canDelete = (p.subscriber_count || 0) === 0;
          const delBtn = h("button", {
            class: "btn btn-sm",
            style: canDelete ? "color: #c0392b" : "",
            disabled: canDelete ? null : true,
            title: canDelete
              ? "Delete this product permanently"
              : `Cannot delete — ${p.subscriber_count} active subscription(s). Cancel them first or set the product inactive.`,
            onclick: () => deleteXoutProduct(p, loadXoutProducts),
          }, "Delete");
          tr.appendChild(h("td", { class: "actions" },
            h("button", { class: "btn btn-sm",
              onclick: () => openXoutProductEditor(p, loadXoutProducts) }, "Edit"),
            delBtn));
          tbody.appendChild(tr);
        }
        tbl.appendChild(tbody);
        const wrap = h("div", { class: "table-wrap" });
        wrap.appendChild(tbl);
        productsBody.appendChild(wrap);
      } catch (err) {
        productsBody.innerHTML = "";
        productsBody.appendChild(h("div", { class: "alert alert-error" },
          "Failed to load xout products: " + (err.message || err)));
      }
    }
    loadXoutProducts();

    // Card 3: Nodes
    const nodesCard = h("div", { class: "card" });
    const assignPresetBtn = h("button", { class: "btn btn-sm btn-primary",
      title: "Assign a preset to the checked nodes (xout reads its preset assignment from the DB on every 30s tick)",
      onclick: () => bulkAssignPreset() }, "Assign preset");
    // "Sync traffic" was removed alongside xout_traffic_daily in the
    // user-system unification. Traffic now flows into usage_events /
    // usage_quotas at user-service automatically; no manual pull needed.
    nodesCard.appendChild(h("div", { class: "card-header" },
      h("h2", null, "Deployed nodes"),
      h("div", { class: "row", style: "gap: 6px; flex: 1; justify-content: flex-end" },
        h("span", { class: "hint", id: "xout-nodes-count" }, ""),
        assignPresetBtn)));
    const nodesBody = h("div", { class: "card-body" });
    nodesCard.appendChild(nodesBody);
    root.appendChild(nodesCard);

    let cachedPresets = [];
    let cachedNodes   = [];

    // Returns the names of the currently checked-on nodes in the Deployed
    // nodes table — empty array means "no selection, fall back to all".
    function selectedNodeNames() {
      return Array.from(nodesBody.querySelectorAll(".xout-node-cb:checked"))
        .map((cb) => cb.dataset.node);
    }

    // bulkSyncTraffic was removed alongside xout_traffic_daily in the
    // user-system unification.

    async function bulkAssignPreset() {
      // Pick nodes — explicit selection required so the operator
      // can't accidentally retarget every node by clicking the wrong
      // button while no checkboxes are ticked.
      const nodes = selectedNodeNames();
      if (!nodes.length) {
        toast("error", "No nodes selected",
              "Tick the rows you want to retarget, then click Assign preset.");
        return;
      }
      if (!cachedPresets.length) {
        toast("error", "No presets",
              "Create a preset in the Presets section first.");
        return;
      }
      const sel = h("select", { class: "select" });
      for (const p of cachedPresets) {
        const ibCount = (p.inbounds || []).length;
        sel.appendChild(h("option", { value: String(p.id) },
          `${p.name}  (${ibCount} inbound${ibCount === 1 ? "" : "s"})`));
      }
      // Pre-select the most-common current preset across the selection so
      // the operator usually just clicks Save to confirm.
      const currentByNode = {};
      for (const n of cachedNodes) {
        if (nodes.includes(n.node_name) && n.preset_id) {
          currentByNode[String(n.preset_id)] =
            (currentByNode[String(n.preset_id)] || 0) + 1;
        }
      }
      const top = Object.entries(currentByNode)
        .sort((a, b) => b[1] - a[1])[0];
      if (top) sel.value = top[0];

      const summary = h("div", { class: "muted", style: "font-size: 12.5px" },
        `Assigning to ${nodes.length} node${nodes.length === 1 ? "" : "s"}: `,
        h("span", { class: "mono" }, nodes.join(", ")));

      openModal({
        title: "Assign xout preset",
        body: h("div", { class: "form-grid" },
          h("label", null, "Preset"), sel,
          h("div", { style: "grid-column: 1/-1" }, summary),
          h("div", { style: "grid-column: 1/-1; font-size: 12px",
                     class: "muted" },
            "Each xout container reads its assignment from the database on its next 30-second tick. ",
            "If the rendered preset hash changes, xray restarts with the new config; ",
            "existing connections drop briefly. No deploy needed.")),
        saveLabel: "Assign",
        onSave: async () => {
          const presetId = parseInt(sel.value, 10);
          if (!presetId) throw new Error("pick a preset");
          await api("POST", "/api/xout/assignments",
                    { nodes, preset_id: presetId });
          toast("success", "Preset assigned",
                `${nodes.length} node${nodes.length === 1 ? "" : "s"}`);
          refresh();
        },
      });
    }
    // bulkSyncTokens / "Sync tokens" button removed — admin's
    // subscription handler now reads xout_node_inbounds at request
    // time, and the xout container writes Reality keys + token
    // presence directly into the DB on its 30s tick. No SSH-pull
    // reconciliation step needed anymore.

    const renderPresets = (presets) => {
      presetsBody.innerHTML = "";
      cachedPresets = presets;
      if (!presets.length) {
        presetsBody.appendChild(h("div", { class: "empty" },
          h("div", { class: "title" }, "No presets yet"),
          h("div", { class: "sub" }, "Create one to define inbound endpoints.")));

      }
      const tbl = h("table", { class: "data" });
      tbl.appendChild(h("thead", null, h("tr", null,
        h("th", null, "Name"), h("th", null, "Inbounds"),
        h("th", null, "Description"), h("th", null, "Updated"), h("th", null, ""))));
      const tb = h("tbody");
      for (const p of presets) {
        const protoBadges = h("div", { class: "row", style: "gap: 4px; flex-wrap: wrap" });
        for (const ib of (p.inbounds || [])) {
          protoBadges.appendChild(h("span", { class: "badge",
            title: `${ib.protocol} on port ${ib.port} (tag: ${ib.tag})` },
            `${ib.protocol}:${ib.port}`));
        }
        tb.appendChild(h("tr", null,
          h("td", { class: "mono" }, p.name),
          h("td", null, protoBadges),
          h("td", { class: "muted" }, p.description || "—"),
          h("td", { class: "muted", style: "font-size: 12px" },
            p.updated_at ? fmtRelative(p.updated_at) : "—"),
          h("td", { class: "actions" },
            h("button", { class: "btn btn-sm",
              title: "Show the resolved inbounds + outbounds that would ship to a node",
              onclick: () => openXoutPresetPreviewModal(p) }, "View"),
            h("button", { class: "btn btn-sm",
              onclick: () => openXoutPresetEditor(p, refresh) }, "Edit"),
            h("button", { class: "btn btn-sm btn-danger",
              onclick: async () => {
                if (!confirm(`Delete preset "${p.name}"?`)) return;
                try {
                  await api("DELETE", `/api/xout/presets/${p.id}`);
                  toast("success", "Preset deleted", "");
                  refresh();
                } catch (err) { toast("error", "Delete failed", err.message); }
              } }, "Delete"),
          ),
        ));
      }
      tbl.appendChild(tb);
      const wrap = h("div", { class: "table-wrap" });
      wrap.appendChild(tbl);
      presetsBody.appendChild(wrap);
    };


    const renderNodes = (nodes) => {
      nodesBody.innerHTML = "";
      cachedNodes = nodes;
      const counter = document.getElementById("xout-nodes-count");
      if (counter) counter.textContent = `${nodes.length} node${nodes.length === 1 ? "" : "s"}`;
      if (!nodes.length) {
        nodesBody.appendChild(h("div", { class: "empty" },
          h("div", { class: "title" }, "No xout deployments yet"),
          h("div", { class: "sub" },
            "Deploy from Services → xout → Deploy. Assign a preset on this page after the container is up — the container reads its preset and user list from the DB on every 30s tick.")));
        return;
      }
      const tbl = h("table", { class: "data" });
      const headSelectAll = h("input", { type: "checkbox", title: "Select all",
        onchange: (e) => {
          for (const cb of nodesBody.querySelectorAll(".xout-node-cb")) cb.checked = e.target.checked;
        }});
      tbl.appendChild(h("thead", null, h("tr", null,
        h("th", { style: "width: 30px" }, headSelectAll),
        h("th", null, "Node"),
        h("th", null, "Container"),
        h("th", null, "Health"),
        h("th", null, "Current preset"),
        h("th", { title: "When the xout container last finished a tick (read preset+users from DB, pushed traffic deltas back). Tick is 30s." },
          "Last synced"),
        h("th", null, "Last deploy"),
        h("th", null, ""))));
      const tb = h("tbody");
      for (const n of nodes) {
        const stateBadge = (() => {
          const t = (n.container_state || "").toLowerCase();
          if (t === "running") return h("span", { class: "badge ok" }, h("span", { class: "dot" }), "running");
          if (t === "absent") return h("span", { class: "badge" }, "absent");
          if (t === "exited" || t === "dead") return h("span", { class: "badge danger" }, t);
          return h("span", { class: "badge muted" }, t || "unknown");
        })();
        const healthBadge = (() => {
          if (n.healthcheck_ok === true) return h("span", { class: "badge ok" }, "✓");
          if (n.healthcheck_ok === false) return h("span", { class: "badge danger" }, "✗");
          return h("span", { class: "muted" }, "—");
        })();
        // Staleness signal — tick is 30s, so anything past 2min means
        // the container hasn't ticked for ~4 cycles and is likely down
        // or has lost DB connectivity.
        const lastSyncedCell = (() => {
          if (!n.last_synced_at) {
            return h("span", { class: "muted",
              title: "Container has never reported a completed tick. Wait ~30-60s after deploy, then refresh." },
              "never");
          }
          const ageMs = Date.now() - new Date(n.last_synced_at).getTime();
          if (Number.isNaN(ageMs)) return h("span", { class: "muted" }, n.last_synced_at);
          const rel = fmtRelative(n.last_synced_at);
          if (ageMs > 120_000) {
            return h("span", { class: "badge danger",
              title: `Last tick was ${rel} — container may be down or DB DSN misconfigured. Tick should fire every 30s.` },
              rel);
          }
          return h("span", { class: "muted", style: "font-size: 12px" }, rel);
        })();
        const cb = h("input", { type: "checkbox", class: "xout-node-cb" });
        cb.dataset.node = n.node_name;
        tb.appendChild(h("tr", null,
          h("td", null, cb),
          h("td", { class: "mono" }, n.node_name),
          h("td", null, stateBadge),
          h("td", null, healthBadge),
          h("td", { class: "mono" }, n.preset_name || h("span", { class: "muted" }, "(unassigned)")),
          h("td", null, lastSyncedCell),
          h("td", { class: "muted", style: "font-size: 12px" },
            n.last_observed_at ? fmtRelative(n.last_observed_at) : "never"),
          h("td", { class: "actions" },
            h("button", { class: "btn btn-sm", title: "Run proxy traffic test from inside the node",
              onclick: () => openXoutTestModal(n.node_name) },
              "Test"),
            h("button", { class: "btn btn-sm",
              title: "Get the subscription content for every user published to this node",
              onclick: () => openNodeSubscriptionModal(n.node_name) },
              "Subscription")),
        ));
      }
      tbl.appendChild(tb);
      const wrap = h("div", { class: "table-wrap" });
      wrap.appendChild(tbl);
      nodesBody.appendChild(wrap);
    };

    async function refresh() {
      // Each call is independent — render whichever cards' API succeeded
      // rather than wedging the whole page if one endpoint flakes.
      const renderError = (target, err) => {
        target.innerHTML = "";
        target.appendChild(h("div", { class: "muted", style: "color: var(--danger); padding: 8px 0" },
          err.status === 404
            ? "Endpoint missing — restart admin to pick up the new build."
            : "Load failed: " + (err.message || "")));
      };
      const tasks = [
        ["GET", "/api/xout/presets",  presetsBody, (d) => renderPresets(d.presets || [])],
        ["GET", "/api/xout/nodes",    nodesBody,   (d) => renderNodes(d.nodes    || [])],
      ];
      await Promise.all(tasks.map(async ([m, p, body, render]) => {
        try { render(await api(m, p)); }
        catch (err) { renderError(body, err); }
      }));
    }

    presetsBody.appendChild(h("div", { class: "muted", style: "padding: 8px 0;" }, "Loading…"));
    nodesBody.appendChild(h("div", { class: "muted", style: "padding: 8px 0;" }, "Loading…"));
    refresh();
  }

  // fmtXoutBytes was used only by openVerifyTrafficModal, which was

  // Modal: run end-to-end proxy traffic check on the actual node.
  // Hits POST /api/xout/nodes/{name}/test which sshes in and runs `curl`
  // through every http/socks inbound (with the configured auth) and
  // TCP-handshakes every VLESS port. Parses the per-inbound results
  // and shows them in a table.
  async function openXoutTestModal(nodeName) {
    const body = h("div");
    body.appendChild(h("div", { class: "muted", style: "padding: 12px;" },

    Modal.open({ title: `Test xout on ${nodeName}`, body, size: "wide" });

    let r;

    } catch (err) {

    body.innerHTML = "";
    body.appendChild(h("div", { class: "row", style: "gap: 12px; margin-bottom: 8px" },
      h("strong", null, `${r.ok_count}/${r.results.length} OK`),
      h("span", { class: "muted" }, `preset: ${r.preset_name}`),
      h("span", { class: "muted" }, `via: `),
      h("span", { class: "mono", style: "font-size: 12px" }, r.test_url),
      h("span", { class: "muted" }, `(${r.duration_seconds?.toFixed?.(1) || "?"}s)`)));

    const tbl = h("table", { class: "data" });
    tbl.appendChild(h("thead", null, h("tr", null,
      h("th", null, "Inbound"),
      h("th", null, "Protocol"),
      h("th", null, "Port"),
      h("th", null, "Result"),
      h("th", null, "Latency"),
      h("th", null, "Detail"),
    )));
    const tb = h("tbody");
    for (const it of (r.results || [])) {
      const okBadge = it.ok
        ? h("span", { class: "badge ok" }, h("span", { class: "dot" }), "ok")
        : h("span", { class: "badge danger" }, h("span", { class: "dot" }), "fail");
      const detail = it.ok

        h("td", null, okBadge),
        h("td", { class: "muted", style: "font-size: 12px" },
          it.latency_ms != null ? `${it.latency_ms}ms` : "—"),
        h("td", { class: "muted", style: "font-size: 12px; max-width: 320px; overflow: hidden; text-overflow: ellipsis" },
          detail),

    }
    tbl.appendChild(tb);
    const wrap = h("div", { class: "table-wrap" });
    wrap.appendChild(tbl);
    body.appendChild(wrap);

    Modal.open({ title: `Test xout on ${nodeName}`, body, size: "wide",
      footer: h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => openXoutTestModal(nodeName) }, "Re-run"),
        h("div", { style: "flex: 1" }),

    // Format toggle (radio-like — only one section visible at a time)

    const tabRow = h("div", { class: "row", style: "gap: 6px; margin-bottom: 8px" });

    tabRow.appendChild(tabClash);

      });
      const text = format === "base64" ? (r.base64 || "") : (r.clash || "");
      const help = format === "base64"

        : "Drop this YAML into your Clash config (proxies: section). Each entry is a separate proxy node.";
      contentEl.innerHTML = "";
      contentEl.appendChild(h("div", { class: "muted",
        style: "font-size: 11px; margin-bottom: 6px" }, help));
      const ta = h("textarea", {
        readOnly: true,
        style: `width: 100%; padding: 8px; min-height: ${format === "clash" ? 280 : 140}px; font-family: monospace; font-size: 11px; box-sizing: border-box`,
      }, text);
      contentEl.appendChild(ta);
      const buttonRow = h("div", { class: "row", style: "gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap" },

              document.execCommand("copy");
              toast("success", "Copied",
                format === "base64" ? "Base64 subscription" : "Clash YAML");
            }
          }}, "Copy"),
        h("a", {
          href: "data:text/" + (format === "base64" ? "plain" : "yaml")
                + ";charset=utf-8," + encodeURIComponent(text),
          download: nodeName + "." + (format === "base64" ? "txt" : "yaml"),
          class: "btn btn-sm",
          style: "text-decoration: none",
        }, "Download"),
        h("span", { class: "muted", style: "font-size: 11px; margin-left: 4px" },
