    function renderCodexStep() {
      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "Step 3 · Codex CLI"),
        h("p", { class: "muted", style: "font-size: 13px; margin: 4px 0 12px" },
          "Install the OpenAI Codex CLI and configure its API endpoint."),
      ));
      wrap.appendChild(h("div", { class: "field inline-checkbox" },
        h("input", { id: "wiz-install-codex", type: "checkbox", checked: state.install_codex }),
        h("label", { for: "wiz-install-codex", style: "margin: 0" }, "Install Codex CLI"),
      ));

      // AI Keys registry picker (mirrors step 1's SSH-keys picker).
      // Each row has: Use button (default-highlighted in accent color),
      // name + url + masked key + default badge. Clicking Use fills
      // both BASE_URL and API_KEY fields below.
      if (aiKeys.length) {
        const list = h("div", { style: "display: flex; flex-direction: column; gap: 6px; margin: 8px 0 12px" });
        list.appendChild(h("div", { class: "muted", style: "font-size: 12px" },
          "Pick from your ", h("strong", null, "AI Keys"), " registry:"));
        const sorted = aiKeys.slice().sort((a, b) =>
          (b.is_init_default ? 1 : 0) - (a.is_init_default ? 1 : 0)
          || (a.name || "").localeCompare(b.name || ""));
        for (const k of sorted) {
          const useBtn = h("button", { class: "btn btn-sm",
            onclick: async (e) => {
              e.preventDefault();
              try {
                // Re-fetch full record — list endpoint may mask api_key.
                const full = await api("GET", `/api/ai-api-keys/${k.id}`);
                state.codex_base_url = full.url || k.url || "";
                state.codex_api_key  = full.api_key || k.api_key || "";
                document.getElementById("wiz-codex-url").value = state.codex_base_url;
                document.getElementById("wiz-codex-key").value = state.codex_api_key;
                toast("success", "Loaded", k.name);
              } catch (err) { toast("error", "Failed to read", err.message); }
            } }, k.is_init_default ? `Use ${k.name} ★` : `Use ${k.name}`);
          if (k.is_init_default) {
            useBtn.setAttribute("style", "background: var(--accent,#2563eb); color: white; border-color: var(--accent,#2563eb)");
          }
          const maskedKey = (k.api_key || "").length > 8
            ? (k.api_key.slice(0, 4) + "…" + k.api_key.slice(-4))
            : (k.api_key ? "(short)" : "(empty)");
          list.appendChild(h("div", { class: "row", style: "gap: 8px; align-items: center" },
            useBtn,
            h("span", { class: "muted mono", style: "font-size: 11.5px; flex: 1" },
              `${k.url || ""}  ${maskedKey}`),
            k.is_init_default
              ? h("span", { class: "badge ok", style: "font-size: 10px" }, "default")
              : null,
          ));
        }
        wrap.appendChild(list);
        // Auto-fill the default on first render so the operator can
        // accept-as-is by hitting Next.
        if (!state.codex_api_key) {
          const dflt = sorted.find((k) => k.is_init_default);
          if (dflt) {
            api("GET", `/api/ai-api-keys/${dflt.id}`).then((full) => {
              if (!state.codex_api_key) {
                state.codex_base_url = full.url || "";
                state.codex_api_key = full.api_key || "";
                const u = document.getElementById("wiz-codex-url");
                const a = document.getElementById("wiz-codex-key");
                if (u && !u.value.trim()) u.value = state.codex_base_url;
                if (a && !a.value.trim()) a.value = state.codex_api_key;
              }
            }).catch(() => {});
          }
        }
      } else {
        wrap.appendChild(h("div", { class: "muted",
          style: "font-size: 12px; margin: 8px 0; padding: 8px; background: var(--surface-2); border-radius: 4px" },
          "No keys in your AI Keys registry yet. Add one in ",
          h("a", { href: "#/ai-keys", style: "color: var(--accent,#2563eb)" }, "AI Keys"),
          " (and mark one as init-default), or paste below."));
      }

      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "OPENAI_BASE_URL ", h("span", { class: "hint" }, " — leave blank to use script default")),
        h("input", { id: "wiz-codex-url", class: "input mono", value: state.codex_base_url,
          placeholder: "https://api.openai.com/v1 (or your proxy)" }),
      ));
      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "OPENAI_API_KEY"),
        h("input", { id: "wiz-codex-key", class: "input mono", type: "text", value: state.codex_api_key,
          placeholder: "sk-..." }),
      ));
      navButtons({ onNext: () => {
        state.install_codex = document.getElementById("wiz-install-codex").checked;
        state.codex_base_url = document.getElementById("wiz-codex-url").value.trim();
        state.codex_api_key = document.getElementById("wiz-codex-key").value.trim();
        if (state.install_codex && !state.codex_api_key) {
          if (!confirm("No Codex API key set — continue without configuring API?")) return;
        }
        state.step = 4; renderStep();
      } });
    }

    function renderGitIdentityStep() {
      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "Step 4 · Git identity"),
        h("p", { class: "muted", style: "font-size: 13px; margin: 4px 0 4px" },
          "Used by `git config --global user.name` / `user.email` on the server."),
        h("div", { class: "muted", style: "font-size: 12px; margin: 4px 0 12px; padding: 8px 10px; background: var(--surface-2); border-radius: 4px; line-height: 1.6" },
          "Pre-filled from the node name (e.g. ",
          h("span", { class: "mono", style: "font-size: 11px" }, node.name + " / " + node.name + "@bitsfactor.com"),
          "). You can override below or clear them — empty fields fall back to git.sh's auto-detection (server's existing config, or GitHub username + noreply email).")
      ));
      wrap.appendChild(h("div", { class: "form-row" },
        h("div", { class: "field" },
          h("label", null, "user.name (optional)"),
          h("input", { id: "wiz-git-name", class: "input", value: state.git_user_name }),
        ),
        h("div", { class: "field" },
          h("label", null, "user.email (optional)"),
          h("input", { id: "wiz-git-email", class: "input", value: state.git_user_email }),
        ),
      ));
      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "Timezone"),
        h("input", { id: "wiz-tz", class: "input mono", value: state.timezone }),
      ));
      navButtons({ onNext: () => {
        state.git_user_name = document.getElementById("wiz-git-name").value.trim();
        state.git_user_email = document.getElementById("wiz-git-email").value.trim();
        state.timezone = document.getElementById("wiz-tz").value.trim() || "Asia/Shanghai";
        state.step = 5; renderStep();
      } });
    }

    function renderConfirmStep() {
      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "Step 5 · Confirm"),
        h("p", { class: "muted", style: "font-size: 13px; margin: 4px 0 12px" },
          `Review the plan. Confirm to save these settings to ${node.name} and start initialization.`),
      ));
      const summary = h("div", { class: "log-viewer", style: "max-height: 320px; font-size: 12.5px" });
      const lines = [
        `Target:               ${node.ssh_user}@${node.host}:${node.ssh_port}`,
        `Timezone:             ${state.timezone}`,
        `Git deploy key:       ${state.git_private_key ? "(set, " + state.git_private_key.length + " bytes)" : "(none — skipped)"}`,
        `Git user.name:        ${state.git_user_name || "(auto)"}`,
        `Git user.email:       ${state.git_user_email || "(auto)"}`,
        `Install Codex CLI:    ${state.install_codex ? "yes" : "no"}`,
        `Codex BASE_URL:       ${state.codex_base_url || "(script default)"}`,
        `Codex API key:        ${state.codex_api_key ? "(set, " + state.codex_api_key.length + " chars)" : "(none — skipped)"}`,
        `Desired SSH port:     ${state.desired_ssh_port}`,
        ``,
        `Steps that will run:`,
        `  1. set-timezone`,
        `  2. install-git`,
        `  3. install-python`,
        `  4. install-node`,
        `  5. install-go`,
        `  6. install-docker`,
        state.git_private_key ? `  7. set-git-key` : `  7. set-git-key  (skipped — no key)`,
        state.install_codex ? `  8. install-codex` : `  8. install-codex  (skipped)`,
        (state.install_codex && state.codex_api_key) ? `  9. set-codex-api` : `  9. set-codex-api  (skipped)`,
        `  10. change-ssh-port → verify → update node row`,
      ];
      summary.appendChild(document.createTextNode(lines.join("\n")));
      wrap.appendChild(summary);
      navButtons({ nextLabel: "Save & Run →", onNext: () => { state.step = 6; renderStep(); kickoffInit(); } });
    }

    function renderRunStep() {
      wrap.appendChild(h("div", { class: "field" },
        h("label", null, "Initializing"),
        h("p", { class: "muted", style: "font-size: 13px; margin: 4px 0 12px" },
          "Live log below. You can close the modal — the job keeps running and will appear in node history when done."),
      ));
      wrap.appendChild(h("div", { id: "wiz-status", class: "muted", style: "margin-bottom: 8px" }, "Starting…"));
      const out = h("pre", { class: "log-viewer", id: "wiz-log", style: "max-height: 420px" });
      wrap.appendChild(out);

      footer.innerHTML = "";
      footer.appendChild(h("button", { class: "btn", onclick: async () => {
        const el = document.getElementById("wiz-log");
        const text = el ? (el.textContent || "") : "";
        if (!text.trim()) { toast("info", "Nothing to copy", "Log is empty"); return; }
        const ok = await copyTextToClipboard(text);
        if (ok) toast("success", "Copied", `${text.length} chars`);
        else toast("error", "Copy failed", "Clipboard unavailable");
      } }, "Copy log"));
      footer.appendChild(h("button", { class: "btn", onclick: () => Modal.close() }, "Close"));
    }

    let pollTimer = null;
    let currentRunId = null;
    let modalOpen = true;

    async function kickoffInit() {
      const payload = {
        init_git_private_key: state.git_private_key || null,
        init_git_user_name: state.git_user_name || null,
        init_git_user_email: state.git_user_email || null,
        init_desired_ssh_port: state.desired_ssh_port,
        init_install_codex: state.install_codex,
        init_codex_base_url: state.codex_base_url || null,
        init_codex_api_key: state.codex_api_key || null,
        init_timezone: state.timezone,
      };
      try {
        const r = await api("POST", `/api/nodes/${encodeURIComponent(node.name)}/init/start`, payload);
        currentRunId = r.id;
        document.getElementById("wiz-status").textContent = `Run #${r.id} · ${r.status}`;
        startPolling();
      } catch (err) {
        document.getElementById("wiz-status").textContent = `Failed to start: ${err.message}`;
        toast("error", "Init start failed", err.message);
      }
    }

    function startPolling() {
      const poll = async () => {
        if (!currentRunId) return;
        try {
          const r = await api("GET", `/api/nodes/${encodeURIComponent(node.name)}/init/runs/${currentRunId}`);
          if (modalOpen) {
            const statusEl = document.getElementById("wiz-status");
            const logEl = document.getElementById("wiz-log");
            if (statusEl) statusEl.textContent = `Run #${r.id} · ${r.status}` + (r.current_step ? ` · ${r.current_step}` : "");
            if (logEl) {
              const wasNearBottom = (logEl.scrollTop + logEl.clientHeight) >= (logEl.scrollHeight - 30);
              logEl.textContent = r.log_text || "";
              if (wasNearBottom) logEl.scrollTop = logEl.scrollHeight;
            }
          }
          if (r.status === "success" || r.status === "failed" || r.status === "cancelled") {
            clearInterval(pollTimer); pollTimer = null;
            toast(r.status === "success" ? "success" : "error",
              `Init ${r.status}`,
              r.status === "success" ? `Node ${node.name} initialized` : `exit ${r.exit_code}`);
            onDone && onDone();
          }
        } catch (err) {
          // network blip; keep trying
        }
      };
      pollTimer = setInterval(poll, 1500);
      poll();
    }

    // Override Modal.close to stop polling.
    const origClose = Modal.close.bind(Modal);
    const myClose = () => { modalOpen = false; if (pollTimer) clearInterval(pollTimer); origClose(); Modal.close = origClose; };
    Modal.close = myClose;

    Modal.open({ title: `Initialize ${node.name}`, body: wrap, footer: footer });
    renderStep();
  }

  // ----- Services view -----

  async function renderServicesView(root) {
    setActiveNav("services");
    root.innerHTML = "";
    root.appendChild(h("div", { class: "page-header" },
      h("div", null,
        h("h1", null, "Services"),
        h("p", { class: "lede" }, "Deployable services. Each entry points to a GitHub repo + compose file. The Deploy action on a node clones the repo, writes a .env, and runs `docker compose up -d --build`."),
      ),
      h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => renderServicesView(root) }, "Refresh"),
        App.mode === "readwrite"
          ? h("button", { class: "btn btn-primary", onclick: () => openNewServiceModal(() => renderServicesView(root)) }, "+ New service")
          : null,
        App.mode === "readwrite"
          ? h("button", { class: "btn", onclick: () => openServiceModal(null, () => renderServicesView(root)) }, "+ Register existing")
          : null,
      ),
    ));
    const card = h("div", { class: "card" });
    card.appendChild(h("div", { class: "card-header" }, h("h2", null, "Catalog"), h("span", { class: "hint", id: "services-count" })));
    const body = h("div", { class: "card-body tight" });
    card.appendChild(body);
    root.appendChild(card);
    try {
      // Pull catalog + summary in parallel — summary is the new
      // /api/services-summary that joins service_node_state to give
      // per-service running/absent/unhealthy counts. Fall back to
      // catalog-only on older backends that don't have the endpoint.
      const [resp, summaryResp] = await Promise.all([
        api("GET", "/api/services"),
        api("GET", "/api/services-summary").catch((err) => {
          if (err.status === 404) return { services: [] };
          throw err;
        }),
      ]);
      const rows = resp.services || [];
      const summaryByName = {};
      for (const s of (summaryResp.services || [])) summaryByName[s.name] = s;
      document.getElementById("services-count").textContent = `${rows.length} service${rows.length === 1 ? "" : "s"}`;
      if (!rows.length) {
        body.appendChild(h("div", { class: "empty" },
          h("div", { class: "title" }, "No services registered"),
          h("div", { class: "sub" }, App.mode === "readwrite" ? "Add your first service to make it deployable from the Nodes page." : "Read-only admin.")));
      } else {
        body.appendChild(renderServicesTable(rows, summaryByName));
      }
    } catch (err) {
      if (err.status === 401) showLogin();
      else toast("error", "Failed to load services", err.message);
    }
  }

  function renderServicesTable(services, summaryByName) {
    summaryByName = summaryByName || {};
    const table = h("table", { class: "data" });
    table.appendChild(h("thead", null,
      h("tr", null,
        h("th", null, "Name"),
        h("th", null, "Repo"),
        h("th", null, "Manifest"),
        h("th", null, "Per-node status"),
        h("th", null, "Branch"),
        h("th", null, "Updated"),
        h("th", null, ""),
      ),
    ));
    const tbody = h("tbody");
    for (const s of services) {
      const actions = h("td", { class: "actions" });
      // "Push to GitHub" — only shown for draft services with a local
      // rendered tree but no GitHub URL yet. Lets the operator
      // retroactively push after configuring github.api_token.
      const isPushable = (
        App.mode === "readwrite"
        && s.status === "draft"
        && !!s.local_repo_dir
        && !s.github_repo_url
      );
      if (isPushable) {
        actions.appendChild(h("button", { class: "btn btn-sm btn-primary",
          title: "Create the repo on GitHub and push the local tree",
          onclick: async () => {
            if (!confirm(`Push '${s.name}' to GitHub?\n\nThis creates a private repo under your token's user account and pushes the existing local tree at ${s.local_repo_dir}.`)) return;
            try {
              const r = await api("POST", `/api/services/${encodeURIComponent(s.name)}/push-to-github`, {});
              toast("success", "Pushed to GitHub", r.github_repo_url);
              renderServicesView(document.getElementById("view-root"));
            } catch (err) { toast("error", "Push failed", err.message); }
          }
        }, "Push to GitHub"));
      }
      actions.appendChild(h("button", { class: "btn btn-sm",
        title: s.has_manifest ? "Re-fetch .deploy.yaml from GitHub" : "Pull .deploy.yaml from GitHub",
        onclick: () => fetchServiceManifest(s.name, true)
      }, s.has_manifest ? "Sync" : "Sync manifest"));
      actions.appendChild(h("button", { class: "btn btn-sm btn-primary",
        title: "Deploy this service to one or more nodes",
        onclick: () => openServiceDeployModal(s)
      }, "Deploy…"));
      actions.appendChild(h("button", { class: "btn btn-sm",
        onclick: () => openServiceHistoryModal(s.name) }, "History"));
      actions.appendChild(h("button", { class: "btn btn-sm",
        onclick: () => openServiceModal(s, () => renderServicesView(document.getElementById("view-root")))
      }, "Edit"));
      if (App.mode === "readwrite") {
        actions.appendChild(h("button", { class: "btn btn-sm btn-danger",
          onclick: async () => {
            if (!confirm(`Delete service ${s.name}?`)) return;
            try {
              await api("DELETE", `/api/services/${encodeURIComponent(s.name)}`);
              toast("success", "Deleted", s.name);
              renderServicesView(document.getElementById("view-root"));
            } catch (err) { toast("error", "Delete failed", err.message); }
          } }, "✕"));
      }
      const manifestCell = h("td", null);
      if (s.has_manifest) {
        manifestCell.appendChild(h("span", { class: "badge ok" }, "loaded"));
        if ((s.required_env || []).length) {
          manifestCell.appendChild(h("span", { class: "muted",
            style: "margin-left: 6px; font-size: 11px;" },
            `requires ${s.required_env.length} env`));
        }
        if ((s.exposed_ports || []).length) {
          manifestCell.appendChild(h("span", { class: "muted",
            style: "margin-left: 6px; font-size: 11px;" },
            `port ${s.exposed_ports.join(",")}`));
        }
      } else {
        manifestCell.appendChild(h("span", { class: "badge warn" }, "not synced"));
      }
      const summary = summaryByName[s.name] || { running: 0, unhealthy: 0, absent: 0, total: 0, other: 0 };
      const fleetCell = h("td", { style: "cursor: pointer", title: "Click to view per-node status",
        onclick: () => openServiceFleetModal(s.name) });
      if (summary.total === 0) {
        fleetCell.appendChild(h("span", { class: "muted", style: "font-size: 12px" }, "no nodes yet"));
      } else {
        if (summary.running) {
          fleetCell.appendChild(h("span", { class: "badge ok" },
            h("span", { class: "dot" }), `${summary.running} running`));
        }
        if (summary.unhealthy) {
          fleetCell.appendChild(h("span", { class: "badge danger", style: "margin-left: 4px" },
            h("span", { class: "dot" }), `${summary.unhealthy} unhealthy`));
        }
        if (summary.absent) {
          fleetCell.appendChild(h("span", { class: "badge", style: "margin-left: 4px" },
            `${summary.absent} absent`));
        }
        if (!summary.running && !summary.unhealthy && !summary.absent && summary.other) {
          fleetCell.appendChild(h("span", { class: "badge warn" }, `${summary.other} other`));
        }
      }
      tbody.appendChild(h("tr", null,
        h("td", { class: "domain" }, s.name,
          s.description ? h("div", { class: "muted", style: "font-size: 11px; margin-top: 2px" }, s.description) : null),
        h("td", { class: "mono", style: "font-size: 12px" }, s.github_repo_url),
        manifestCell,
        fleetCell,
        h("td", { class: "mono", style: "font-size: 12px" }, s.default_branch),
        h("td", { class: "muted" }, fmtRelative(s.updated_at)),
        actions,
      ));
    }
    table.appendChild(tbody);
    const wrap = h("div", { class: "table-wrap" });
    wrap.appendChild(table);
    return wrap;
  }

  async function fetchServiceManifest(name, refresh) {
    toast("info", "Syncing", `Fetching .deploy.yaml from ${name}…`);
    try {
      const r = await api("POST", `/api/services/${encodeURIComponent(name)}/manifest`,
        { save: true });
      toast("success", "Manifest synced",
        `${name} · branch=${r.branch_used} · ${(r.manifest.required_env || []).length} required env`);
      if (refresh) renderServicesView(document.getElementById("view-root"));
    } catch (err) { toast("error", "Sync failed", err.message); }
  }

  async function openServiceDeployModal(service) {
    // Open the modal IMMEDIATELY with a spinner skeleton. The data
    // fetches below (manifest / fresh service / databases / nodes)
    // run in parallel and replace the skeleton when they all land.
    // Without this, the click felt frozen for 1–3s while the backend
    // walked GitHub (.deploy.yaml fetch) before anything rendered.
    const formContainer = h("div", {
      style: "padding: 32px; text-align: center; font-size: 13px;" },
      h("div", { class: "spinner",
        style: "margin: 0 auto 12px; width: 24px; height: 24px; "
          + "border: 3px solid var(--border); border-top-color: var(--accent); "
          + "border-radius: 50%; animation: spin 0.9s linear infinite;" }),
      h("div", { class: "muted" }, "Loading deploy form…"));
    const cancelBtn = h("button", { type: "button", class: "btn",
      onclick: () => Modal.close() }, "Cancel");
    const deployBtn = h("button", { type: "button", class: "btn btn-primary",
      disabled: true }, "Deploy");
    const footer = h("div", { class: "row" },
      cancelBtn, h("div", { style: "flex: 1;" }), deployBtn);
    Modal.open({ title: `Deploy ${service.name}`, body: formContainer,
                 footer, size: "wide" });

    // Kick off every dependency in parallel. Failures of optional
    // resources (databases / fresh service / nodes) degrade gracefully
    // with empty fallbacks so the form still renders. Manifest is the
    // only hard dependency — if that fails we bail.
    const cachedManifest = (service.has_manifest && service.deploy_yaml)
      ? Promise.resolve({manifest: parseInlineManifest(service)})
      : api("POST", `/api/services/${encodeURIComponent(service.name)}/manifest`,
            {save: true});
    let manifestRes, freshSvc, dbRes, nodesRes;
    try {
      [manifestRes, freshSvc, dbRes, nodesRes] = await Promise.all([
        cachedManifest,
        api("GET", `/api/services/${encodeURIComponent(service.name)}`)
          .catch(() => null),
        api("GET", "/api/databases").catch(() => ({entries: []})),
        api("GET", "/api/nodes").catch(() => ({nodes: []})),
      ]);
    } catch (err) {
      formContainer.innerHTML = "";
      formContainer.appendChild(h("div", { style: "padding: 24px; color: var(--danger);" },
        "Could not load manifest: " + (err.message || "")));
      return;
    }
    const manifest = manifestRes.manifest;
    if (freshSvc && freshSvc.name) service = freshSvc;
    const databases = dbRes.entries || dbRes.databases || [];
    const nodesList = nodesRes.nodes || [];

    // (xout used to need its own legacy token/preset selector here. After
    //  the xout-merge refactor it's a plain env-driven service like every
    //  other one — XOUT_DATABASE_URL flows in through the standard env
    //  table + secrets:database:active resolver.)

    const form = h("form");
    form.appendChild(h("p", { class: "muted" },
      "Deploy ", h("strong", null, service.name),
      " — git: ", h("span", { class: "mono" }, service.github_repo_url),
      ". The platform will clone, write .env, run ",
      h("span", { class: "mono" }, "docker compose up -d --build"),
      ", and verify the healthcheck before marking each node successful."));

    // Revision pin
    form.appendChild(h("div", { class: "field" },
      h("label", null, "Revision ", h("span", { class: "hint" },
        " — git SHA, tag, or branch. Default: ", h("span", { class: "mono" }, service.default_branch || "main"))),
      h("input", { id: "svc-revision", class: "input mono",
        placeholder: service.default_branch || "main", value: "" })));

    // Env overrides. Required fields highlighted, defaults pre-filled.
    const envWrap = h("div", { class: "field" },
      h("label", null, "Environment ", h("span", { class: "hint" },
        " — required fields in red MUST be filled; others use the default")));
    const envTable = h("table", { class: "data", style: "width: 100%; font-size: 12.5px;" });
    envTable.appendChild(h("thead", null, h("tr", null,
      h("th", null, "Variable"), h("th", null, "Default"), h("th", null, "Override (per-deploy)"))));
    const envBody = h("tbody");
    const allKeys = new Set([
      ...(manifest.required_env || []),
      ...Object.keys(manifest.defaults || {}),
      ...Object.keys(service.default_env || {}),
    ]);
    // Per-row getters keyed by env name. Mirrors the pattern used in
    // openServiceModal so a row can wrap a select+free-text pair (used
    // for SSL_SERVICE_PG_DSN) without the submit logic having to know.
    const envInputs = {};
    const redact = (s) => (s || "").replace(/:[^:@/]*@/, ":****@");
    for (const key of Array.from(allKeys).sort()) {
      const isRequired = (manifest.required_env || []).includes(key);
      const manifestDefault = (manifest.defaults || {})[key] || "";
      const savedValue = (service.default_env || {})[key] || "";
      // What the "Default" column should show — saved default_env wins
      // over the manifest default since that's what the operator
      // actually configured in the Edit dialog.
      const displayDefault = savedValue || manifestDefault;

      let valueCell;
      // Database-DSN keys get a friendly picker so the operator doesn't
      // paste the full DSN. ssl-service uses SSL_SERVICE_PG_DSN; xout
      // uses XOUT_DATABASE_URL — both consume the same `database:<id>`
      // resolver token at deploy time.
      const isDsnKey = (key === "SSL_SERVICE_PG_DSN" || key === "XOUT_DATABASE_URL");
      if (isDsnKey && databases.length) {
        // Friendly picker — pre-select whatever the operator saved in
        // Edit. The visible label shows the database name + redacted
        // DSN so the operator can see at a glance which DB they're
        // about to deploy against.
        const sel = h("select", { class: "input mono",
          style: "width: 100%; font-size: 11.5px",
          "data-env-key": key });
        sel.appendChild(h("option", { value: "" },
          savedValue ? "(custom — typed below)" : "(none — pick a database)"));
        const entries = databases.slice().sort((a, b) =>
          (b.is_active ? 1 : 0) - (a.is_active ? 1 : 0));
        const matchToken = savedValue && savedValue.startsWith("database:")
          ? savedValue.slice("database:".length) : null;
        for (const db of entries) {
          const token = `database:${db.id}`;
          const lbl = db.label || db.id;
          const text = `${lbl}${db.is_active ? "  ★ active" : ""}  —  ${redact(db.dsn_masked || "")}`;
          const opt = h("option", { value: token }, text);
          if (matchToken && db.id === matchToken) opt.selected = true;
          sel.appendChild(opt);
        }
        const free = h("input", { class: "input mono", "data-env-key": key + ":free",
          style: "width: 100%; font-size: 11.5px; margin-top: 4px;",
          placeholder: "Or paste a raw DSN (advanced)",
          value: savedValue && !savedValue.startsWith("database:") ? savedValue : "" });
        valueCell = h("td", null, sel, free);
        envInputs[key] = () => sel.value || free.value;
      } else {
        // Generic row — pre-fill the input with whatever is saved so
        // the operator sees the value that's about to be sent. Empty
        // means "no override; backend will fall back to default_env /
        // manifest default".
        const inp = h("input", {
          class: "input mono",
          "data-env-key": key,
          placeholder: manifestDefault || (isRequired ? "(required)" : ""),
          value: savedValue || "",
          style: isRequired && !savedValue && !manifestDefault ? "border-color: var(--danger);" : "",
        });
        valueCell = h("td", null, inp);
        envInputs[key] = () => inp.value;
      }

      const tr = h("tr", null,
        h("td", { class: "mono", style: "font-size: 12px" },
          isRequired
            ? h("span", { style: "color: var(--danger); font-weight: bold;" }, key + " *")
            : key),
        h("td", { class: "muted mono", style: "font-size: 11px" },
          displayDefault || h("span", null, "—")),
        valueCell,
      );
      envBody.appendChild(tr);
    }
    envTable.appendChild(envBody);
    const envWrapInner = h("div", { class: "table-wrap",
      style: "max-height: 240px; overflow-y: auto;" });
    envWrapInner.appendChild(envTable);
    envWrap.appendChild(envWrapInner);
    form.appendChild(envWrap);

    // Node multi-select
    const listWrap = h("div", { class: "field" },
      h("label", null, "Target nodes"));
    const tools = h("div", { class: "row", style: "gap: 6px; margin-bottom: 6px;" },
      h("button", { type: "button", class: "btn btn-sm",
        onclick: (e) => { e.preventDefault();
          form.querySelectorAll('input[type="checkbox"][data-node]').forEach(c => c.checked = true);
          updateCount();
        } }, "Select all"),
      h("button", { type: "button", class: "btn btn-sm",
        onclick: (e) => { e.preventDefault();
          form.querySelectorAll('input[type="checkbox"][data-node]').forEach(c => c.checked = false);
          updateCount();
        } }, "Clear"),
      h("span", { class: "muted", id: "svc-deploy-count", style: "margin-left: 8px;" }, "0 selected"),
    );
    listWrap.appendChild(tools);
    const list = h("div", { style:
      "max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 6px; background: var(--surface);" });
    listWrap.appendChild(list);
    form.appendChild(listWrap);

    function updateCount() {
      const n = form.querySelectorAll('input[type="checkbox"][data-node]:checked').length;
      const el = document.getElementById("svc-deploy-count");
      if (el) el.textContent = `${n} selected`;
    }
    // Use the nodes list that was pre-fetched in parallel above. No
    // extra round-trip here.
    for (const n of nodesList) {
      const id = `sn-${n.name}`;
      list.appendChild(h("label", {
        class: "row", style: "gap: 8px; padding: 4px 6px; cursor: pointer; align-items: center;", for: id },
        h("input", { type: "checkbox", id, "data-node": n.name, onchange: updateCount }),
        h("span", { class: "mono" }, n.name),
        h("span", { class: "muted", style: "font-size: 11.5px;" },
          ` ${n.ssh_user}@${n.host}:${n.ssh_port}`),
        h("span", { class: "badge", style: "margin-left: auto; font-size: 10.5px;" }, n.auth_method),
      ));
    }

    deployBtn.addEventListener("click", async () => {
      const nodes = Array.from(form.querySelectorAll('input[type="checkbox"][data-node]:checked'))
        .map(c => c.getAttribute("data-node"));
      if (!nodes.length) { toast("error", "Pick at least one node"); return; }

      const payload = {
        nodes,
        revision: document.getElementById("svc-revision").value.trim() || null,
        triggered_by: "admin",
      };

      const env = {};
      for (const [k, getter] of Object.entries(envInputs)) {
        const v = (getter() || "").trim();
        if (v) env[k] = v;
      }
      payload.env = env;
      if (!confirm(`Deploy ${service.name} (${payload.revision || service.default_branch || 'main'}) to ${nodes.length} node(s)?`))
        return;

      // Visible in-flight state — without this the modal looks frozen
      // for the multi-minute clone+build. We replace the form with a
      // status block, lock both footer buttons, and only restore on
      // failure (success transitions to the report modal).
      const revLabel = payload.revision || service.default_branch || "main";
      const statusBlock = h("div", { style: "padding: 24px; text-align: center;" },
        h("div", { class: "spinner",
          style: "margin: 0 auto 12px; width: 28px; height: 28px; "
            + "border: 3px solid var(--border); border-top-color: var(--accent); "
            + "border-radius: 50%; animation: spin 0.9s linear infinite;" }),
        h("div", { style: "font-weight: 600; margin-bottom: 6px;" },
          `Deploying ${service.name} @ ${revLabel} to ${nodes.length} node(s)…`),
        h("div", { class: "muted", style: "font-size: 12.5px; margin-bottom: 8px;" },
          nodes.join(", ")),
        h("div", { class: "muted", style: "font-size: 12px;" },
          "Each node clones the repo, writes .env, runs `docker compose up -d --build`, ",
          "then waits for the healthcheck. This can take a few minutes."),
        h("div", { class: "muted", style: "font-size: 11.5px; margin-top: 10px;" },
          "Don't close this window — report appears here when finished."));
      form.style.display = "none";
      form.parentNode.appendChild(statusBlock);
      cancelBtn.disabled = true;
      deployBtn.disabled = true;
      deployBtn.textContent = "Deploying…";
      toast("info", "Deploy started",
        `${service.name} → ${nodes.length} node(s); waiting for backend`);

      try {
        const r = await api("POST", `/api/services/${encodeURIComponent(service.name)}/deploy`, payload);
        Modal.close();
        openServiceDeployReportModal(r);
        toast(r.fail === 0 ? "success" : "info", "Deploy complete",
          `${r.success}/${r.total} ok · ${r.fail} failed`);
      } catch (err) {
        // Restore the form so the user can adjust + retry instead of
        // being stuck on a dead spinner.
        statusBlock.remove();
        form.style.display = "";
        cancelBtn.disabled = false;
        deployBtn.disabled = false;
        deployBtn.textContent = "Deploy";
        toast("error", "Deploy failed", err.message);
      }
    });
    // Swap the spinner skeleton out for the real form and enable Deploy.
    formContainer.innerHTML = "";
    formContainer.appendChild(form);
    deployBtn.disabled = false;
  }

  function parseInlineManifest(service) {
    // The backend already split out the parsed fields; rebuild a
    // partial manifest object so the modal logic doesn't re-parse YAML.
    return {
      required_env: service.required_env || [],
      defaults: {},   // manifest defaults are folded into required_env display
      exposed_ports: service.exposed_ports || [],
      healthcheck: service.healthcheck || {},
    };
  }

  function openServiceDeployReportModal(report) {
    const body = h("div", null,
      h("div", { class: "row", style: "gap: 12px; margin-bottom: 12px;" },
        h("div", null, h("strong", null, "Service: "), report.service),
        h("div", null, h("strong", null, "Revision: "),
          h("span", { class: "mono" }, report.revision_requested)),
        h("div", null, h("span", { class: "badge ok" }, `${report.success} ok`)),
        h("div", null, h("span", { class: "badge danger" }, `${report.fail} failed`)),
        h("div", { class: "muted" }, "at " + fmtDate(report.at)),
      ),
    );
    const tbl = h("table", { class: "data" });
    tbl.appendChild(h("thead", null, h("tr", null,
      h("th", null, "Node"), h("th", null, "Result"),
      h("th", null, "Healthcheck"), h("th", null, "SHA"),
      h("th", null, "Duration"), h("th", null, "Detail"))));
    const tb = h("tbody");
    for (const r of (report.results || [])) {
      tb.appendChild(h("tr", null,
        h("td", { class: "mono" }, r.node),
        h("td", null, r.ok
          ? h("span", { class: "badge ok" }, "ok")
          : h("span", { class: "badge danger" }, "fail")),
        h("td", null,
          r.healthcheck_passed === true
            ? h("span", { class: "badge ok" }, "passed")
            : (r.healthcheck_passed === false
              ? h("span", { class: "badge danger" }, "failed")
              : h("span", { class: "muted" }, "—"))),
        h("td", { class: "mono", style: "font-size: 11px" },
          r.deployed_sha ? r.deployed_sha.slice(0, 8) : "—"),
        h("td", { class: "muted mono", style: "font-size: 11px" },
          r.duration_seconds != null ? r.duration_seconds + "s" : "—"),
        h("td", { class: "muted mono", style: "font-size: 11px" },
          (r.error || r.healthcheck_detail || "").slice(0, 120)),
      ));
    }
    tbl.appendChild(tb);
    const wrap = h("div", { class: "table-wrap" });
    wrap.appendChild(tbl);
    body.appendChild(wrap);
    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Close"));
    Modal.open({ title: "Deploy report", body, footer });
  }

  // Per-service "Fleet" modal: live container state per node, with a
  // Refresh button that fans out probes to all nodes that have a row
  // for this service. Generic — works for ssl-service, api-gateway, etc.
  //
  // All DOM refs are kept in closure (NOT looked up via getElementById)
  // so two modals opened in quick succession can't write into each
  // other's elements (review R12.1).
  async function openServiceFleetModal(serviceName) {
    const body = h("div");
    const stampEl = h("div", { class: "muted", style: "flex: 1; font-size: 12px;" }, "Loading…");
    const refreshBtn = h("button", { class: "btn btn-sm",
      onclick: () => refreshFleet() }, "Refresh");
    const header = h("div", { class: "row",
      style: "gap: 8px; align-items: center; margin-bottom: 12px;" },
      stampEl, refreshBtn);
    body.appendChild(header);
    const tableWrap = h("div", null,
      h("div", { class: "muted", style: "padding: 16px; text-align: center" }, "Loading…"));
    body.appendChild(tableWrap);

    const renderTable = (states) => {
      tableWrap.innerHTML = "";
      if (!states || !states.length) {
        tableWrap.appendChild(h("div", { class: "empty" },
          h("div", { class: "title" }, "No node state yet"),
          h("div", { class: "sub" }, "Deploy this service to a node to see it appear here.")));
        return;
      }
      const tbl = h("table", { class: "data" });
      tbl.appendChild(h("thead", null, h("tr", null,
        h("th", null, "Node"),
        h("th", null, "Container"),
        h("th", null, "Image"),
        h("th", null, "Health"),
        h("th", null, "Last seen"),
        h("th", null, "Last deploy"),
        h("th", null, ""),
      )));
      const tb = h("tbody");
      const stateBadge = (s) => {
        const t = (s || "").toLowerCase();
        if (t === "running") return h("span", { class: "badge ok" }, h("span", { class: "dot" }), "running");
        if (t === "absent") return h("span", { class: "badge" }, "absent");
        if (t === "exited" || t === "dead") return h("span", { class: "badge danger" }, h("span", { class: "dot" }), t);
        if (t === "restarting" || t === "created" || t === "paused") return h("span", { class: "badge warn" }, h("span", { class: "dot" }), t);
        return h("span", { class: "badge muted" }, t || "unknown");
      };
      const healthBadge = (ok) => {
        if (ok === true) return h("span", { class: "badge ok" }, "✓");
        if (ok === false) return h("span", { class: "badge danger" }, "✗");
        return h("span", { class: "muted" }, "—");
      };
      for (const st of states) {
        tb.appendChild(h("tr", null,
          h("td", { class: "mono" }, st.node_name),
          h("td", null, stateBadge(st.container_state)),
          h("td", { class: "mono", style: "font-size: 11.5px" }, st.container_image || "—"),
          h("td", null, healthBadge(st.healthcheck_ok)),
          h("td", { class: "muted", style: "font-size: 12px" },
            st.last_observed_at ? fmtRelative(st.last_observed_at) : "never"),
          h("td", { class: "muted", style: "font-size: 12px" },
            st.status ? `${st.status}${st.revision ? " · " + st.revision.slice(0, 7) : ""}` : "—"),
          h("td", null,
            h("div", { class: "row", style: "gap: 4px" },
              h("button", { class: "btn btn-sm", title: "Probe just this node",
                onclick: async (e) => {
                  e.preventDefault();
                  e.target.disabled = true;
                  e.target.textContent = "Probing…";
                  try { await probeNode(st.node_name); await loadFleet(false); }
                  catch (err) { toast("error", "Probe failed", err.message); }
                } }, "Probe"),
              h("button", { class: "btn btn-sm", title: "Edit per-node config",
                onclick: () => openServiceNodeConfigModal(serviceName, st.node_name) },
                "Configure"),
            ),
          ),
        ));
      }
      tbl.appendChild(tb);
      const wrap = h("div", { class: "table-wrap" });
      wrap.appendChild(tbl);
      tableWrap.appendChild(wrap);
    };

    const loadFleet = async (showSpinner = true) => {
      if (showSpinner) {
        tableWrap.innerHTML = "";
        tableWrap.appendChild(h("div", { class: "muted", style: "padding: 16px; text-align: center" }, "Loading…"));
      }
      try {
        const r = await api("GET", `/api/services/${encodeURIComponent(serviceName)}/nodes`);
        renderTable(r.states || []);
        const newest = (r.states || []).reduce((a, b) =>
          (a && a.last_observed_at && (!b.last_observed_at || a.last_observed_at > b.last_observed_at)) ? a : b, null);
        if (newest && newest.last_observed_at) {
          stampEl.textContent = `Last observed: ${fmtRelative(newest.last_observed_at)}`;
        } else {
          stampEl.textContent = "Never observed";
        }
      } catch (err) {
        if (err.code === "service_not_found") {
          toast("error", "Service not registered", `${serviceName} isn't in the catalog`);
          Modal.close();
          return;
        }
        tableWrap.innerHTML = "";
        tableWrap.appendChild(h("div", { class: "muted", style: "padding: 16px; color: var(--danger)" },
          "Load failed: " + (err.message || "")));
      }
    };

    const refreshFleet = async () => {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Refreshing…";
      stampEl.textContent = "Probing all nodes…";
      try {
        const r = await api("POST", `/api/services/${encodeURIComponent(serviceName)}/refresh`, {});
        if (r && r.message) {
          // Backend signaled "no node has a state row yet — deploy first".
          stampEl.textContent = r.message;
          renderTable([]);
        } else {
          // Per-node failures (SSH timeout, host down) come back in r.errors.
          // Surface them so the user knows the refreshed numbers don't
          // cover every node (review pass-3 R3.12).
          if (r && Array.isArray(r.errors) && r.errors.length) {
            const total = r.total || (r.refreshed + r.errors.length);
            const sample = r.errors.slice(0, 3)
              .map((e) => `${e.node || "?"}: ${e.error || "fail"}`).join(" · ");
            const more = r.errors.length > 3 ? ` (+${r.errors.length - 3} more)` : "";
            toast("error",
              `${r.errors.length}/${total} nodes failed to refresh`,
              sample + more);
          }
          await loadFleet(false);
        }
      } catch (err) {
        if (err.code === "service_not_found") {
          toast("error", "Service not registered", `${serviceName} isn't in the catalog`);
          Modal.close();
          return;
        }
        toast("error", "Refresh failed", err.message);
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh";
      }
    };

    Modal.open({
      title: `${serviceName} · Per-node status`,
      body,
      footer: h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => openServiceHistoryModal(serviceName) }, "Deploy history"),
        h("div", { style: "flex: 1" }),
        h("button", { class: "btn btn-primary", onclick: () => Modal.close() }, "Close"),
      ),
    });
    loadFleet(true);
  }


  // ---------------------------------------------------------------------------
  // Service-per-node config modal — renders a form from service.config_schema,
  // populated by service_node_config values. On Save, PUTs back; if the user
  // ticks "redeploy", the same call triggers a re-deploy of just this node so
  // the running container picks up the change.
  // ---------------------------------------------------------------------------
  async function openServiceNodeConfigModal(serviceName, nodeName) {
    const body = h("div");
    const title = `Configure ${serviceName} on ${nodeName}`;
    body.appendChild(h("div", { class: "muted", style: "padding: 16px;" },
      "Loading config…"));
    Modal.open({ title, body });

    let payload;
    try {
      payload = await api("GET",
        `/api/services/${encodeURIComponent(serviceName)}/nodes/${encodeURIComponent(nodeName)}/config`);
    } catch (err) {
      body.innerHTML = "";
      body.appendChild(h("div", { class: "muted", style: "color: var(--danger)" },
        "Load failed: " + (err.message || "")));
      return;
    }

    const schema = payload.config_schema || [];
    const values = payload.values || {};
    const effective = payload.effective || {};

    body.innerHTML = "";
    if (!schema.length) {
      body.appendChild(h("div", { class: "empty" },
        h("div", { class: "title" }, "No config schema"),
        h("div", { class: "sub" },
          "This service's .deploy.yaml hasn't declared a config_schema. ",
          "Add one and re-fetch the manifest to enable visual config.")));
      Modal.open({
        title, body,
        footer: h("div", { class: "row" },
          h("div", { style: "flex: 1" }),
          h("button", { class: "btn btn-primary", onclick: () => Modal.close() }, "Close"),
        ),
      });
      return;
    }

    const form = h("form", { onsubmit: (e) => e.preventDefault() });
    const inputs = {};
    for (const entry of schema) {
      const key = entry.key;
      const live = effective[key] != null ? String(effective[key]) : "";
      const saved = values[key] != null ? String(values[key]) : "";
      const isOverridden = key in values;

      const row = h("div", { class: "form-row", style: "margin-bottom: 12px;" });
      const labelText = entry.label || key;
      const labelEl = h("label", { style: "display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px;" },
        labelText,
        entry.required ? h("span", { style: "color: var(--danger); margin-left: 4px;" }, "*") : null,
        h("span", { class: "muted", style: "font-weight: normal; margin-left: 8px; font-size: 11px;" },
          key, entry.init_only ? " · init-only" : ""),
      );
      row.appendChild(labelEl);

      let input;
      const initialValue = isOverridden ? saved : live;
      if (entry.type === "enum" && Array.isArray(entry.options) && entry.options.length) {
        input = h("select", { name: key });
        for (const opt of entry.options) {
          const o = h("option", { value: opt }, opt);
          if (opt === initialValue) o.selected = true;
          input.appendChild(o);
        }
      } else if (entry.type === "boolean") {
        input = h("input", { type: "checkbox", name: key });
        input.checked = (initialValue === "true" || initialValue === "1");
      } else if (entry.type === "textarea") {
        input = h("textarea", { name: key, rows: 4, style: "width: 100%; font-family: monospace; font-size: 12px;" });
        input.value = initialValue;
      } else if (entry.type === "password") {
        input = h("input", { type: "password", name: key, style: "width: 100%;" });
        input.value = initialValue;
      } else if (entry.type === "integer") {
        input = h("input", { type: "number", name: key, style: "width: 100%;" });
        if ("min" in entry) input.min = entry.min;
        if ("max" in entry) input.max = entry.max;
        input.value = initialValue;
      } else {
        input = h("input", { type: "text", name: key, style: "width: 100%;" });
        if (entry.validate) input.pattern = entry.validate;
        input.value = initialValue;
      }
      input.style.padding = "6px 8px";
      input.style.border = "1px solid var(--border)";
      input.style.borderRadius = "4px";
      inputs[key] = { entry, input };
      row.appendChild(input);

      if (entry.help) {
        row.appendChild(h("div", { class: "muted", style: "font-size: 11px; margin-top: 3px;" },
          entry.help));
      }
      const liveLine = h("div", { class: "muted", style: "font-size: 11px; margin-top: 2px;" });
      if (isOverridden) {
        liveLine.appendChild(h("span", { style: "color: var(--accent)" },
          "saved override · "));
      } else if (live) {
        liveLine.appendChild(h("span", null, "default · current effective: "));
        liveLine.appendChild(h("span", { class: "mono" }, live));
      }
      if (liveLine.children.length) row.appendChild(liveLine);
      form.appendChild(row);
    }
    body.appendChild(form);

    const errorEl = h("div", { class: "muted", style: "color: var(--danger); margin-top: 8px;" });
    body.appendChild(errorEl);

    const redeployCheck = h("input", { type: "checkbox", id: "snc-redeploy", checked: true });
    const footer = h("div", { class: "row", style: "gap: 8px; align-items: center;" },
      h("label", { for: "snc-redeploy", style: "font-size: 13px; display: flex; align-items: center; gap: 6px;" },
        redeployCheck, "Re-deploy after save (restart container with new env)"),
      h("div", { style: "flex: 1" }),
      h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("button", { class: "btn btn-primary",
        onclick: async (e) => {
          e.preventDefault();
          errorEl.textContent = "";
          const out = {};
          for (const [key, { entry, input }] of Object.entries(inputs)) {
            if (entry.type === "boolean") {
              out[key] = input.checked ? "true" : "false";
            } else {
              const v = input.value;
              if (v == null || v === "") {
                // Skip empty values so they fall back to defaults rather
                // than persisting "" (which would block first-deploy
                // env-vs-default semantics).
                continue;
              }
              out[key] = v;
            }
          }
          e.target.disabled = true;
          e.target.textContent = "Saving…";
          try {
            const r = await api("PUT",
              `/api/services/${encodeURIComponent(serviceName)}/nodes/${encodeURIComponent(nodeName)}/config`,
              { values: out, redeploy: redeployCheck.checked });
            const msg = redeployCheck.checked
              ? `Saved + ${r.redeploy && r.redeploy.success ? "redeployed" : "redeploy failed"}`
              : "Saved";
            toast("success", msg, "");
            Modal.close();
          } catch (err) {
            errorEl.textContent = err.message || "save failed";
            e.target.disabled = false;
            e.target.textContent = "Save";
          }
        } }, "Save"),
    );

    Modal.open({ title, body, footer });
  }


  // ---------------------------------------------------------------------------
  // Effective env viewer / editor — works for ANY service, not just those
  // that declared a config_schema. Shows the full env that the deploy script
  // would write to the node's .env, with per-key source attribution. Lets
  // operators add/edit/clear free-form per-node overrides + (optionally)
  // trigger a redeploy so the running container picks up the change.
  //
  // Backed by the same /api/services/{name}/nodes/{node}/config endpoint
  // as the schema-based modal — the GET response now includes effective +
  // sources + manifest_defaults + secrets so the UI can render this view
  // without parsing yaml on the client.
  // ---------------------------------------------------------------------------
  async function openServiceNodeEnvModal(serviceName, nodeName) {
    const title = `Effective env: ${serviceName} on ${nodeName}`;
    const body = h("div");
    body.appendChild(h("div", { class: "muted", style: "padding: 16px;" }, "Loading…"));
    Modal.open({ title, body });

    let payload;
    try {
      payload = await api("GET",
        `/api/services/${encodeURIComponent(serviceName)}/nodes/${encodeURIComponent(nodeName)}/config`);
    } catch (err) {
      body.innerHTML = "";
      body.appendChild(h("div", { style: "padding: 16px; color: var(--danger);" },
        "Load failed: " + (err.message || err)));
      return;
    }

    const effective = payload.effective || {};
    const sources = payload.sources || {};
    const overrides = payload.values || {};
    const manifestDefaults = payload.manifest_defaults || {};
    const serviceDefaults = payload.service_defaults || {};
    const schemaDefaults = payload.schema_defaults || {};
    const secrets = payload.secrets || [];

    // We mutate this on every edit and POST it back as the FULL set of
    // per-node overrides. The user can clear an override by deleting its
    // value (we drop empty strings before PUT, treating "" as "use the
    // layer below this override").
    const editedOverrides = { ...overrides };

    body.innerHTML = "";

    // Summary header.
    const summary = h("div", {
      class: "muted",
      style: "padding: 4px 0 12px 0; font-size: 12px;",
    },
      `${Object.keys(effective).length} env vars · `,
      `${Object.keys(overrides).length} per-node override${Object.keys(overrides).length === 1 ? "" : "s"} · `,
      `${secrets.length} secret${secrets.length === 1 ? "" : "s"} from manifest`,
    );
    body.appendChild(summary);

    const sourceColors = {
      "override": "#1f8a4c",
      "override (shadows secret)": "#b03a2e",
      "secret": "#7a5af8",
      "service_default": "#1f6feb",
      "manifest_default": "#6b7280",
      "schema_default": "#6b7280",
    };
    const sourceLabel = (src) => {
      const colour = sourceColors[src] || "#6b7280";
      return h("span", {
        class: "badge",
        style: `background: ${colour}1a; color: ${colour}; border: 1px solid ${colour}55;
                font-size: 10.5px; padding: 1px 6px; border-radius: 3px;`,
      }, src);
    };

    // Build the rows. Sort: overrides first, then by key alphabetically.
    const sortedKeys = Object.keys(effective).sort((a, b) => {
      const ao = a in overrides ? 0 : 1;
      const bo = b in overrides ? 0 : 1;
      if (ao !== bo) return ao - bo;
      return a < b ? -1 : a > b ? 1 : 0;
    });

    const tbl = h("table", {
      class: "data",
      style: "width: 100%; table-layout: fixed; font-size: 12.5px;",
    });
    tbl.appendChild(h("colgroup", null,
      h("col", { style: "width: 32%;" }),
      h("col", { style: "width: 42%;" }),
      h("col", { style: "width: 16%;" }),
      h("col", { style: "width: 10%;" }),
    ));
    tbl.appendChild(h("thead", null, h("tr", null,
      h("th", null, "Key"),
      h("th", null, "Value"),
      h("th", null, "Source"),
      h("th", null, ""),
    )));
    const tb = h("tbody");
    tbl.appendChild(tb);

    // Renders one row. Re-rendered on every edit so badges + buttons
    // stay in sync with the current `editedOverrides` state.
    function renderRow(key) {
      const tr = h("tr");
      tr.appendChild(h("td", { class: "mono", style: "vertical-align: top; padding-top: 8px;" }, key));

      const valTd = h("td", { style: "vertical-align: top;" });
      const isOverridden = key in editedOverrides;
      const baseline =
        key in serviceDefaults ? serviceDefaults[key] :
        key in manifestDefaults ? manifestDefaults[key] :
        key in schemaDefaults ? schemaDefaults[key] :
        "";
      const currentVal = isOverridden ? editedOverrides[key] : (effective[key] || "");

      const isMaskedSecret = currentVal === "********" && (sources[key] === "secret");
      const input = h("input", {
        type: "text",
        value: isMaskedSecret ? "" : currentVal,
        placeholder: isMaskedSecret ? "(masked secret — type a value to override)" : "(empty)",
        style: "width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;",
        oninput: (e) => {
          editedOverrides[key] = e.target.value;
          refreshSummary();
        },
      });
      valTd.appendChild(input);

      // Show baseline (the value that would apply if override were cleared)
      // when the user has overridden a key whose underlying value is known.
      if (isOverridden && baseline !== "" && baseline !== editedOverrides[key]) {
        valTd.appendChild(h("div", {
          class: "muted",
          style: "font-size: 11px; margin-top: 3px;",
        }, "baseline: ", h("span", { class: "mono" }, baseline)));
      }
      tr.appendChild(valTd);

      const srcKey = isOverridden && sources[key] !== "override (shadows secret)" ? "override" : sources[key] || "—";
      const srcTd = h("td", { style: "vertical-align: top; padding-top: 8px;" });
      srcTd.appendChild(sourceLabel(srcKey));
      tr.appendChild(srcTd);

      const actTd = h("td", { style: "vertical-align: top; padding-top: 6px; text-align: right;" });
      if (isOverridden) {
        actTd.appendChild(h("button", {
          class: "btn",
          style: "font-size: 11px; padding: 2px 8px;",
          onclick: () => {
            delete editedOverrides[key];
            redrawTable();
          },
        }, "clear"));
      }
      tr.appendChild(actTd);

      return tr;
    }

    function redrawTable() {
      tb.innerHTML = "";
      // Re-derive sortedKeys to surface newly-added keys at top.
      const keys = new Set([...Object.keys(effective), ...Object.keys(editedOverrides)]);
      const sorted = [...keys].sort((a, b) => {
        const ao = a in editedOverrides ? 0 : 1;
        const bo = b in editedOverrides ? 0 : 1;
        if (ao !== bo) return ao - bo;
        return a < b ? -1 : a > b ? 1 : 0;
      });
      for (const k of sorted) tb.appendChild(renderRow(k));
      refreshSummary();
    }

    function refreshSummary() {
      const overrideCount = Object.values(editedOverrides).filter((v) => v !== "").length;
      summary.innerHTML = "";
      summary.appendChild(document.createTextNode(
        `${tb.children.length} env vars · ${overrideCount} per-node override${overrideCount === 1 ? "" : "s"} · ${secrets.length} secret${secrets.length === 1 ? "" : "s"} from manifest`,
      ));
    }

    redrawTable();
    body.appendChild(tbl);

    // Free-form add — dropping a brand-new key into editedOverrides and
    // letting redrawTable surface a fresh row at the top.
    const addRow = h("div", {
      style: "margin-top: 14px; padding: 10px 12px; background: var(--surface-alt); border-radius: 4px;",
    });
    const newKeyInput = h("input", {
      type: "text",
      placeholder: "NEW_ENV_VAR",
      style: "font-family: ui-monospace, monospace; font-size: 12px; padding: 4px 8px; width: 32%;",
    });
    const newValInput = h("input", {
      type: "text",
      placeholder: "value",
      style: "font-family: ui-monospace, monospace; font-size: 12px; padding: 4px 8px; width: 42%; margin-left: 8px;",
    });
    const addBtn = h("button", {
      class: "btn btn-primary",
      style: "margin-left: 8px; font-size: 12px;",
      onclick: () => {
        const k = newKeyInput.value.trim();
        if (!k) return;
        if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(k)) {
          toast("error", "Invalid key", "ENV var name must match [A-Za-z_][A-Za-z0-9_]*");
          return;
        }
        editedOverrides[k] = newValInput.value;
        newKeyInput.value = "";
        newValInput.value = "";
        redrawTable();
      },
    }, "+ Add override");
    addRow.appendChild(h("div", { class: "muted", style: "font-size: 11.5px; margin-bottom: 6px;" },
      "Add an override for a key not already in the effective env (e.g. a feature flag the manifest doesn't list)."));
    addRow.appendChild(newKeyInput);
    addRow.appendChild(newValInput);
    addRow.appendChild(addBtn);
    body.appendChild(addRow);

    // Footer — Save / Save+Redeploy / Close. Save sends the full set of
    // overrides; empty values are dropped, equivalent to "clear override".
    const errEl = h("div", { style: "color: var(--danger); flex: 1; font-size: 12px;" });

    async function doSave(redeploy) {
      const cleaned = {};
      for (const [k, v] of Object.entries(editedOverrides)) {
        if (v === "" || v === undefined || v === null) continue;
        cleaned[k] = v;
      }
      try {
        await api("PUT",
          `/api/services/${encodeURIComponent(serviceName)}/nodes/${encodeURIComponent(nodeName)}/config`,
          { values: cleaned, redeploy: !!redeploy },
        );
        toast("success",
          redeploy ? "Saved + redeploy queued" : "Saved",
          `${serviceName} on ${nodeName}: ${Object.keys(cleaned).length} override${Object.keys(cleaned).length === 1 ? "" : "s"}`);
        Modal.close();
      } catch (err) {
        errEl.textContent = err.message || String(err);
      }
    }

    Modal.open({
      title, body,
      footer: h("div", { class: "row", style: "align-items: center; gap: 8px;" },
        errEl,
        h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
        h("button", { class: "btn", onclick: () => doSave(false) }, "Save"),
        h("button", { class: "btn btn-primary", onclick: () => doSave(true) }, "Save + Redeploy"),
      ),
    });
  }

  function envDictToText(envDict) {
    if (!envDict) return "";
    return Object.entries(envDict).map(([k, v]) => `${k}=${v}`).join("\n");
  }
  function envTextToDict(text) {
    const out = {};
    for (const raw of (text || "").split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith("#")) continue;
      const eq = line.indexOf("=");
      if (eq < 0) continue;
      const k = line.slice(0, eq).trim();
      const v = line.slice(eq + 1);
      if (k) out[k] = v;
    }
    return out;
  }

  // -------------------------------------------------------------------------
  // New Service flow — generates a brand-new repo from the platform template,

  async function openNewServiceModal(onCreated) {
    let defaults = null;
    try {
      defaults = await api("GET", "/api/services-new/defaults");
    } catch (err) {
      toast("error", "Could not load New Service defaults", err.message);
      return;
    }

    const nameInput = h("input", { class: "input", placeholder: "sub-link",

    for (const n of (defaults.nodes || [])) {
      const opt = h("option", { value: n.name },
        `${n.name} (${n.host || "no host"})`);
      if (n.name === defaults.default_deploy_node) opt.selected = true;

    if (noNodes) {
      nodeSelect.appendChild(h("option", { value: "" }, "(no nodes registered)"));

    }
    const suffix = defaults.domain_suffix || "develop.cc";
    const domainInput = h("input", { class: "input", value: "",
      placeholder: `e.g. sub-link.${suffix}` });
    // Auto-fill domain as the operator types the name.
    nameInput.addEventListener("input", () => {
      const slug = nameInput.value.trim().toLowerCase()
        .replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "");
      if (slug && !domainInput.dataset.touched) {
        domainInput.value = `${slug}.${suffix}`;
      }
      // Auto-fill repo_name from the same slug unless the user typed.
      if (slug && !repoInput.dataset.touched) repoInput.value = slug;
    });
    domainInput.addEventListener("input", () => { domainInput.dataset.touched = "1"; });
    repoInput.addEventListener("input", () => { repoInput.dataset.touched = "1"; });

    const portHint = defaults.port_pool && defaults.port_pool.next_free
      ? `next free: ${defaults.port_pool.next_free}` : "auto";
    const githubHint = defaults.github_token_configured
      ? "will push to your GitHub account (owner auto-detected from token)"
      : "github.api_token not set — will create local-only";

    const body = h("div", null,
      h("div", { class: "field" },
        h("label", null, "Name"),
        nameInput,
        h("div", { class: "hint" },
          "lowercase, letters/digits/hyphens, 3..40 chars; becomes the slug everywhere"),
      ),
      h("div", { class: "field" },
        h("label", null, "Display name"),
        displayInput,
        h("div", { class: "hint" }, "shown on the products page; defaults to the name"),
      ),
      h("div", { class: "field" },
        h("label", null, "GitHub repo name"),
        repoInput,
        h("div", { class: "hint" }, githubHint),
      ),
      h("div", { class: "field" },
        h("label", null, "Deploy node"),
        nodeSelect,
        h("div", { class: "hint" }, "the route's upstream points at this node's host:port"),
      ),
      h("div", { class: "field" },
        h("label", null, "Domain"),
        domainInput,
        h("div", { class: "hint" },
          `default: <name>.${suffix} (host port ${portHint})`),
      ),
      h("div", { class: "hint", id: "new-service-status" }, ""),
      h("pre", { id: "new-service-log",
        style: "display:none;background:var(--bg-muted);padding:12px;border-radius:6px;max-height:300px;overflow:auto;font-size:12px;line-height:1.4;" }),
      h("div", { id: "new-service-result" }),
    );

    const submitBtn = h("button", { class: "btn btn-primary" }, "Create");
    if (noNodes) {
      submitBtn.disabled = true;
      submitBtn.title = "Add a node on the Nodes page before creating services";
    }
    const closeBtn = h("button", { class: "btn" }, "Close");
    closeBtn.onclick = () => Modal.close();

    submitBtn.onclick = async () => {
      const payload = {
        name: nameInput.value.trim(),
        display_name: displayInput.value.trim() || null,
        repo_name: repoInput.value.trim() || null,
        deploy_node_name: nodeSelect.value,
        domain: domainInput.value.trim(),
        push_to_github: !!repoInput.value.trim(),
      };
      if (!payload.name) { toast("error", "name is required"); return; }
      if (!payload.deploy_node_name) { toast("error", "pick a deploy node"); return; }
      if (!payload.domain) { toast("error", "domain is required"); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating…";
      const status = body.querySelector("#new-service-status");
      const logEl = body.querySelector("#new-service-log");
      const resultEl = body.querySelector("#new-service-result");
      status.textContent = "Working — this takes 5-30 seconds…";
      logEl.style.display = "none";
      logEl.textContent = "";
      resultEl.innerHTML = "";

      let resp;
      try {
        resp = await api("POST", "/api/services-new", payload);
      } catch (err) {
        status.textContent = "";
        toast("error", "Create failed", err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Create";
        return;
      }

      // Render the per-step log.
      logEl.style.display = "block";
      const lines = (resp.steps || []).map(s => {
        const tag = s.status === "ok" ? "✓" : s.status === "skip" ? "·" : "✗";
        const ms = s.elapsed_ms || 0;
        return `${tag} ${s.name}  (${ms}ms)${s.message ? "  — " + s.message : ""}`;
      });
      logEl.textContent = lines.join("\n");

      if (resp.error) {
        status.textContent = `Failed at step "${(resp.steps || []).slice(-1)[0]?.name || "?"}": ${resp.error.message}`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Retry";
        return;
      }

      status.textContent = `Created ${resp.service.name}.`;
      const links = h("div", { class: "row", style: "margin-top:12px;gap:12px;" });
      if (resp.local_repo_dir) {
        links.appendChild(h("span", { class: "muted", style: "font-family:monospace;font-size:12px;" },
          resp.local_repo_dir));
      }
      if (resp.route_domain) {
        links.appendChild(h("a", {
          href: `https://${resp.route_domain}`, target: "_blank", rel: "noopener",
          class: "btn btn-sm",
        }, `Open https://${resp.route_domain}`));
      }
      if (resp.github_repo_url) {
        links.appendChild(h("a", {
          href: resp.github_repo_url, target: "_blank", rel: "noopener",
          class: "btn btn-sm",
        }, "GitHub"));
      }
      resultEl.appendChild(links);

      submitBtn.style.display = "none";
      closeBtn.textContent = "Done";
      if (typeof onCreated === "function") onCreated();
    };

    Modal.open({
      title: "New service",
      body,
      footer: h("div", { class: "row", style: "gap:8px;" }, closeBtn, submitBtn),
      size: "wide",
    });
  }

  async function openServiceModal(existing, onSaved) {
    const isEdit = !!existing;
    // For Edit: pull the parsed manifest so we know which envs the
    // service supports, and pull the Databases registry so the PG_DSN
    // row can be a dropdown instead of free text.
    let manifest = null;
    let databases = [];
    if (isEdit) {
      try {
        // ALWAYS re-fetch from the upstream repo so the operator sees
        // the latest required_env/defaults — the cached `existing.deploy_yaml`
        // can be stale (e.g. the manifest just got new flags upstream).
        const r = await api("POST",
          `/api/services/${encodeURIComponent(existing.name)}/manifest`,
          { save: true });
        manifest = r.manifest;
      } catch (_) {
        // Fall back to the stored cache if the fetch fails (offline, etc.)
        if (existing.deploy_yaml) {
          try { manifest = parseInlineManifest(existing); } catch (_) { manifest = null; }
        }
      }
      try {
        const r = await api("GET", "/api/databases");
