    renderBody();

    Modal.open({ title: `Subscription: ${nodeName}`, body,
      footer: h("div", { class: "row" },
        h("button", { class: "btn", title: "Re-fetch subscription from the database",
          onclick: () => { Modal.close(); openNodeSubscriptionModal(nodeName); }
        }, "Refresh"),
        h("div", { style: "flex: 1" }),
        h("button", { class: "btn btn-primary", onclick: () => Modal.close() }, "Close")) });
  }

  // Modal: create or edit a preset (multi-inbound editor).
  async function openXoutPresetEditor(existing, onDone) {
    // Pre-load picker target list (static IPs + sibling xout inbounds)
    // so the per-inbound Outbound dropdowns render synchronously.
    try {
      const r = await api("GET", "/api/xout/outbound-targets");
      window._xoutTargets = (r && r.targets) || [];
    } catch (_) {
      window._xoutTargets = [];
    }
    const body = h("div");
    const nameInput = h("input", { type: "text", value: existing ? existing.name : "",
      placeholder: "preset name (unique)", style: "width: 100%; padding: 6px 8px;" });
    const descInput = h("input", { type: "text", value: existing ? (existing.description || "") : "",
      placeholder: "optional description", style: "width: 100%; padding: 6px 8px;" });
    body.appendChild(h("div", { class: "form-row", style: "margin-bottom: 8px" },
      h("label", { style: "display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px" }, "Name"),
      nameInput));
    body.appendChild(h("div", { class: "form-row", style: "margin-bottom: 12px" },
      h("label", { style: "display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px" }, "Description"),
      descInput));

    // ---- Inbounds: compact table view + raw JSON edit ----
    //
    // Per user feedback the editor is intentionally minimal: read-only
    // table that shows tag · inbound · → · outbound at a glance, with
    // Add / Batch / Remove for the common workflow. For per-field
    // tweaks (changing a single port, swapping a Reality SNI, editing
    // an outbound's auth) the operator clicks "Edit raw JSON" and
    // edits the inbound[] array directly — much faster than a
    // 13-row form.
    //
    // Source of truth = ``inbounds`` array of plain objects matching
    // the wire format. Save reads from this directly.
    let inbounds = (existing && Array.isArray(existing.inbounds))
      ? JSON.parse(JSON.stringify(existing.inbounds))
      : [];

    // Helper: pretty label for a static_ip outbound id.
    function _staticIpLabel(id) {
      const targets = window._xoutTargets || [];
      const t = targets.find(x => x.kind === "static_ip" && String(x.id) === String(id));
      return t ? t.label : ("static_ip #" + id);
    }
    // Helper: outbound summary text for the table.
    function _obSummary(ob) {
      if (!ob) return "—";
      const t = (ob.type || "").toLowerCase();
      if (t === "direct" || !t) return "direct (no chain)";
      if (t === "static_ip") return _staticIpLabel(ob.static_ip_id);
      if (t === "http" || t === "socks")
        return t + "://" + (ob.host || "?") + ":" + (ob.port || "?")
             + (ob.user ? " · auth" : "");
      if (t === "vless")
        return "vless://" + (ob.host || "?") + ":" + (ob.port || "?");
      return t;
    }
    // Helper: inbound badge — "vless:12001".
    function _ibBadge(ib) {
      return (ib.protocol || "?") + ":" + (ib.port || "?");
    }

    // Slot where the inline "Batch from Static IPs" picker renders.
    const batchPickerSlot = h("div");

    const tableWrap = h("div", { id: "ib-table-wrap" });
    let viewMode = "table";  // "table" | "json"
    let jsonTextarea = null;
    // Click-to-edit state. Only one cell is in edit mode at a time
    // across the whole table — keeps the UI focused. Snapshot is taken
    // when entering edit mode so Cancel can roll back.
    //   editing.idx       — row index
    //   editing.field     — "tag" | "inbound" | "outbound"
    //   editing.snapshot  — pre-edit value for restore on Cancel
    let editing = null;

    // Helper: deep-clone via JSON round-trip. Sufficient for the plain
    // {string/number/array/object} shapes our inbound entries hold.
    function _deepCopy(v) {
      return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
    }
    function _enterEdit(idx, field) {
      const ib = inbounds[idx];
      if (!ib) return;
      // Already editing this exact cell — no-op.
      if (editing && editing.idx === idx && editing.field === field) return;
      // Switching to a different cell mid-edit = implicit commit of the
      // prior one (Excel-style click-away).
      editing = null;
      let snap;
      if (field === "tag") snap = ib.tag;
      else if (field === "inbound") snap = {
        protocol: ib.protocol,
        port: ib.port,
        reality: _deepCopy(ib.reality),
        users: _deepCopy(ib.users),
        auth: _deepCopy(ib.auth),
      };
      else if (field === "outbound") snap = _deepCopy(ib.outbound || {type:"direct"});
      editing = { idx, field, snapshot: snap };
      renderTableView();
    }
    function _commitEdit() {
      // Real-time mutation already happened during typing — exit and rerender.
      editing = null;
      dirty = true; _refreshUnsavedBadge();
      renderTableView();
    }
    function _cancelEdit() {
      if (!editing) return;
      const ib = inbounds[editing.idx];
      if (ib) {
        if (editing.field === "tag") {
          ib.tag = editing.snapshot;
        } else if (editing.field === "inbound") {
          const s = editing.snapshot;
          ib.protocol = s.protocol;
          ib.port = s.port;
          if (s.reality !== undefined) ib.reality = s.reality; else delete ib.reality;
          if (s.users !== undefined) ib.users = s.users; else delete ib.users;
          if (s.auth !== undefined) ib.auth = s.auth; else delete ib.auth;
        } else if (editing.field === "outbound") {
          ib.outbound = editing.snapshot;
        }
      }
      editing = null;
      renderTableView();
    }
    const toggleBtn = h("button", { class: "btn btn-sm", type: "button",
      onclick: () => {
        if (viewMode === "table") {
          viewMode = "json";
          renderJsonView();
          toggleBtn.textContent = "← Back to table";
        } else {
          viewMode = "table";
          renderTableView();
          toggleBtn.textContent = "Edit raw JSON";
        }
      } }, "Edit raw JSON");

    function nextInboundPort() {
      const used = inbounds
        .map(r => parseInt(r.port || 0, 10))
        .filter(n => n > 0);
      return used.length ? Math.max(...used) + 1 : 12001;
    }

    function addInbound(seed) {
      // Default to vless+Reality with the canonical SNI of the
      // first VLESS inbound (or www.develop.cc) so single-click
      // Add Just Works without forcing the operator to fill in
      // Reality params.
      const defaultSni = (() => {
        for (const ib of inbounds) {
          if ((ib.protocol || "").toLowerCase() === "vless"
              && ib.reality && ib.reality.sni) return ib.reality.sni;
        }
        return "www.develop.cc";
      })();
      const fresh = Object.assign({
        tag: `in${inbounds.length + 1}`,
        protocol: "vless",
        port: nextInboundPort(),
        reality: { sni: defaultSni, private_key: "auto", short_id: "auto" },
        outbound: { type: "direct" },
      }, seed || {});
      // Normalize protocol — picker may pass "socks5" but the wire
      // format prefers "socks".
      if ((fresh.protocol || "").toLowerCase() === "socks5") fresh.protocol = "socks";
      inbounds.push(fresh);
      dirty = true;
      _refreshUnsavedBadge();
      if (viewMode === "table") renderTableView();
    }

    // Track whether the in-memory inbounds[] has diverged from what's
    // on disk. The "Unsaved" badge nudges the operator that a "Save"
    // click is still needed — without it, Batch-from-Static-IPs felt
    // like it persisted as soon as the picker said "Inbounds added".
    let dirty = false;
    const unsavedBadge = h("span", {
      class: "badge warn",
      style: "display: none; font-size: 11px;",
      id: "ib-unsaved-badge",
    }, "Unsaved");
    function _refreshUnsavedBadge() {
      unsavedBadge.style.display = dirty ? "" : "none";
    }
    // After a batch picker run, briefly highlight the last N rows so
    // the operator can see the newly-added entries pop in.
    function highlightLastN(n) {
      // Defer one tick so renderTableView() has flushed the new rows.
      setTimeout(() => {
        const rows = tableWrap.querySelectorAll("table tbody tr");
        const start = Math.max(0, rows.length - n);
        for (let i = start; i < rows.length; i++) {
          const tr = rows[i];
          tr.style.transition = "background 1.4s ease-out";
          tr.style.background = "var(--accent-bg, #fef3c7)";
          setTimeout(() => { tr.style.background = ""; }, 50);
        }
      }, 50);
    }

    const inboundsHeader = h("div", { class: "row",
      style: "align-items: center; gap: 8px; margin: 8px 0;" },
      h("h3", { style: "margin: 0;" }, "Inbounds"),
      unsavedBadge,
      h("span", { style: "flex: 1;" }),
      toggleBtn,
      h("button", { class: "btn btn-sm",
        title: "Pick multiple Static IPs and auto-generate one VLESS+Reality "
             + "inbound per IP — tag becomes {node_name}-<country-zh>, "
             + "outbound chains via the Static IP",
        onclick: () => openBatchInboundsFromStaticIps({
          nextPort: nextInboundPort,
          addInbound,
          inlineSlot: batchPickerSlot,
          highlightLastN,
          defaultSni: (() => {
            for (const ib of inbounds) {
              if ((ib.protocol || "").toLowerCase() === "vless"
                  && ib.reality && ib.reality.sni) return ib.reality.sni;
            }
            return "";
          })(),
        }) }, "+ Batch from Static IPs"),
      h("button", { class: "btn btn-sm",
        onclick: () => addInbound({}) }, "+ Add inbound"));
    body.appendChild(inboundsHeader);
    body.appendChild(batchPickerSlot);
    body.appendChild(tableWrap);

    function renderTableView() {
      while (tableWrap.firstChild) tableWrap.removeChild(tableWrap.firstChild);
      if (!inbounds.length) {
        tableWrap.appendChild(h("div", { class: "muted",
          style: "padding: 24px 12px; text-align: center; "
               + "border: 1px dashed var(--border, #e2e8f0); "
               + "border-radius: 6px; font-size: 12.5px;" },
          "No inbounds yet. Click ",
          h("strong", null, "+ Add inbound"),
          " or ",
          h("strong", null, "+ Batch from Static IPs"),
          " above."));
        return;
      }
      const tbl = h("table", { class: "data",
        style: "width: 100%; font-size: 12.5px;" });
      tbl.appendChild(h("thead", null, h("tr", null,
        h("th", { style: "min-width: 160px;" }, "Tag"),
        h("th", { style: "width: 180px;" }, "Inbound"),
        h("th", { style: "width: 24px; text-align: center;" }, ""),
        h("th", null, "Outbound"),
        h("th", { style: "width: 40px; text-align: right;" }, ""),
      )));
      const tb = h("tbody");

      // Display-mode helpers: read-only span with hover affordance and
      // click handler that enters edit mode for this cell.
      function _displayCell(idx, field, content, opts) {
        opts = opts || {};
        return h("div", {
          title: "Click to edit",
          style: (opts.style || "")
               + " cursor: pointer; padding: 3px 6px; "
               + "border-radius: 3px; "
               + "transition: background 0.1s;",
          onmouseenter: (ev) => {
            ev.currentTarget.style.background = "var(--surface-alt, #f7fafc)";
          },
          onmouseleave: (ev) => {
            ev.currentTarget.style.background = "";
          },
          onclick: () => _enterEdit(idx, field),
        }, content);
      }

      // Done / Cancel button pair shared by every editor — keeps the
      // commit semantics consistent.
      function _doneCancelBtns() {
        return h("div", { class: "row",
          style: "gap: 4px; margin-top: 6px;" },
          h("button", { class: "btn btn-sm btn-primary", type: "button",
            title: "Commit edit",
            onclick: () => _commitEdit() }, "✓ Done"),
          h("button", { class: "btn btn-sm", type: "button",
            title: "Discard edit and restore previous value",
            onclick: () => _cancelEdit() }, "✗ Cancel"));
      }

      inbounds.forEach((ib, idx) => {
        const ob = ib.outbound || (ib.outbound = { type: "direct" });
        const obType = (ob.type || "direct").toLowerCase();
        const isEditing = (f) => editing && editing.idx === idx && editing.field === f;

        // ---- TAG cell ----
        const tagCell = h("td", { style: "min-width: 0;" });
        if (isEditing("tag")) {
          const tagInput = h("input", { type: "text", value: ib.tag || "",
            class: "input mono", placeholder: "tag",
            style: "padding: 3px 6px; font-size: 11.5px; width: 100%;",
            oninput: (ev) => { ib.tag = ev.currentTarget.value; },
          });
          tagCell.appendChild(tagInput);
          tagCell.appendChild(_doneCancelBtns());
          // Focus the input so the operator can start typing right away.
          setTimeout(() => { try { tagInput.focus(); tagInput.select(); } catch (_) {} }, 0);
        } else {
          tagCell.appendChild(_displayCell(idx, "tag",
            ib.tag
              ? h("span", { class: "mono", style: "font-size: 12px;" }, ib.tag)
              : h("span", { class: "muted" }, "—")));
        }

        // ---- INBOUND cell ----
        const inCell = h("td", { style: "min-width: 0;" });
        if (isEditing("inbound")) {
          const protoSel = h("select", { class: "input",
            style: "padding: 3px 6px; font-size: 11.5px;" });
          for (const p of ["vless", "socks", "http"]) {
            const opt = h("option", { value: p }, p);
            if ((ib.protocol || "vless").toLowerCase() === p) opt.selected = true;
            protoSel.appendChild(opt);
          }
          protoSel.onchange = (ev) => {
            ib.protocol = ev.currentTarget.value;
            if (ib.protocol === "vless") {
              if (!ib.reality || !ib.reality.sni) {
                const sni = (() => {
                  for (const o of inbounds) {
                    if ((o.protocol || "").toLowerCase() === "vless"
                        && o.reality && o.reality.sni) return o.reality.sni;
                  }
                  return "www.develop.cc";
                })();
                ib.reality = { sni, private_key: "auto", short_id: "auto" };
              }
              if (!ib.users) ib.users = [{ name: "default", uuid: "auto" }];
              delete ib.auth;
            } else {
              delete ib.reality;
              delete ib.users;
            }
            // Don't full-rerender; the cell's already in edit mode and
            // we want to keep the editor open. The display reflects the
            // mutation on the next commit.
          };
          const portInput = h("input", { type: "number", min: 1, max: 65535,
            value: ib.port == null ? "" : String(ib.port),
            class: "input mono",
            style: "padding: 3px 6px; font-size: 11.5px; width: 80px;",
            oninput: (ev) => {
              ib.port = parseInt(ev.currentTarget.value, 10) || 0;
            },
          });
          inCell.appendChild(h("div", { class: "row",
            style: "gap: 4px; align-items: center;" },
            protoSel,
            h("span", { class: "muted", style: "font-size: 10.5px;" }, ":"),
            portInput));
          inCell.appendChild(_doneCancelBtns());
          setTimeout(() => { try { portInput.focus(); portInput.select(); } catch (_) {} }, 0);
        } else {
          inCell.appendChild(_displayCell(idx, "inbound",
            h("span", { class: "badge",
              style: "font-size: 11px; padding: 1px 6px;" },
              _ibBadge(ib))));
        }

        // ---- OUTBOUND cell ----
        const obCell = h("td", { style: "min-width: 0;" });
        if (isEditing("outbound")) {
          obCell.appendChild(_renderOutboundEditor(ib, idx));
        } else {
          // Color cue: direct = neutral; static_ip = orange (chained
          // proxy); manual http/socks/vless = blue.
          const obToneStyle = obType === "static_ip"
            ? "color: var(--accent, #c2410c);"
            : (obType === "direct" ? "color: var(--muted, #718096);"
               : "color: var(--info, #2b6cb0);");
          obCell.appendChild(_displayCell(idx, "outbound",
            h("span", null,
              h("span", { class: "mono", style: "font-size: 11.5px;" },
                _obSummary(ob)),
              h("span", { class: "muted",
                style: "font-size: 10.5px; margin-left: 8px;" }, "✏︎")),
            { style: obToneStyle }));
        }

        tb.appendChild(h("tr", null,
          tagCell,
          inCell,
          h("td", { style: "text-align: center; color: var(--muted);" }, "→"),
          obCell,
          h("td", { style: "text-align: right; vertical-align: top; padding-top: 6px;" },
            h("button", { class: "btn btn-sm btn-danger", type: "button",
              title: "Remove this inbound",
              onclick: () => {
                inbounds.splice(idx, 1);
                dirty = true; _refreshUnsavedBadge();
                if (editing) {
                  if (editing.idx === idx) editing = null;
                  else if (editing.idx > idx) editing.idx -= 1;
                }
                renderTableView();
              } }, "×")),
        ));
      });
      tbl.appendChild(tb);
      tableWrap.appendChild(tbl);
      tableWrap.appendChild(h("div", { class: "muted",
        style: "font-size: 11px; margin-top: 6px;" },
        inbounds.length + " inbound" + (inbounds.length === 1 ? "" : "s"),
        " · click a cell to edit · ",
        h("strong", null, "Edit raw JSON"),
        " for everything else (Reality params, users, advanced)."));
    }

    // Outbound editor — expands inside the row when the operator clicks
    // the outbound cell. Lets them swap type and fill the type-specific
    // fields without the JSON view. Click ✓ Done to collapse back to
    // the summary.
    function _renderOutboundEditor(ib, idx) {
      const ob = ib.outbound || (ib.outbound = { type: "direct" });
      const wrap = h("div", {
        style: "background: var(--surface-alt, #f7fafc); "
             + "padding: 8px 10px; border-radius: 4px; "
             + "border: 1px solid var(--accent, #c2410c);",
      });

      // Type dropdown + Done button.
      const typeSel = h("select", { class: "input",
        style: "padding: 3px 6px; font-size: 11.5px; min-width: 200px;" });
      for (const [v, lbl] of [
        ["direct",    "Direct (no chain)"],
        ["static_ip", "Pick from Static IPs"],
        ["http",      "Manual: HTTP proxy"],
        ["socks",     "Manual: SOCKS proxy"],
        ["vless",     "Manual: VLESS+Reality"],
      ]) {
        const opt = h("option", { value: v }, lbl);
        if ((ob.type || "direct") === v) opt.selected = true;
        typeSel.appendChild(opt);
      }
      typeSel.onchange = (ev) => {
        const t = ev.currentTarget.value;
        const next = { type: t };
        if (t === "static_ip") next.static_ip_id = ob.static_ip_id || 0;
        else if (t === "http" || t === "socks") {
          next.host = ob.host || "";
          next.port = ob.port || 0;
          next.user = ob.user || "";
          next.pass = ob.pass || "";
        } else if (t === "vless") {
          next.host = ob.host || "";
          next.port = ob.port || 0;
          next.uuid = ob.uuid || "";
          next.sni = ob.sni || "";
          next.pubkey = ob.pubkey || ob.public_key || "";
          next.short_id = ob.short_id || "";
        }
        ib.outbound = next;
        renderTableView();
      };
      wrap.appendChild(h("div", { class: "row",
        style: "gap: 8px; align-items: center; margin-bottom: 6px;" },
        h("span", { class: "muted",
          style: "font-size: 10.5px; text-transform: uppercase;" }, "Type"),
        typeSel,
        h("span", { style: "flex: 1;" }),
        h("button", { class: "btn btn-sm btn-primary", type: "button",
          title: "Commit outbound changes and collapse editor",
          onclick: () => _commitEdit() }, "✓ Done"),
        h("button", { class: "btn btn-sm", type: "button",
          title: "Discard outbound changes and restore previous value",
          onclick: () => _cancelEdit() }, "✗ Cancel")));

      // Type-specific fields.
      const t = (ob.type || "direct").toLowerCase();
      if (t === "static_ip") {
        const pick = h("select", { class: "input",
          style: "padding: 3px 6px; font-size: 11.5px; width: 100%;" });
        const targets = (window._xoutTargets || [])
          .filter(x => x.kind === "static_ip");
        if (!targets.length) {
          pick.appendChild(h("option", { value: "" },
            "(no static IPs registered with http/socks/vless protocol)"));
        } else {
          const cur = String(ob.static_ip_id || "");
          for (const tg of targets) {
            const opt = h("option", { value: String(tg.id) }, tg.label);
            if (cur === String(tg.id)) opt.selected = true;
            pick.appendChild(opt);
          }
          if (!cur && targets[0]) ob.static_ip_id = targets[0].id;
        }
        pick.onchange = (ev) => {
          ib.outbound.static_ip_id = parseInt(ev.currentTarget.value, 10) || 0;
        };
        wrap.appendChild(pick);
        wrap.appendChild(h("div", { class: "muted",
          style: "font-size: 10.5px; margin-top: 4px;" },
          "Resolves to host/port/protocol from the Static IPs registry at deploy time."));
      } else if (t === "http" || t === "socks") {
        const host = h("input", { type: "text", value: ob.host || "",
          placeholder: "upstream host", class: "input",
          style: "padding: 3px 6px; font-size: 11.5px; flex: 2;",
          oninput: (e) => { ib.outbound.host = e.currentTarget.value; } });
        const port = h("input", { type: "number", min: 1, max: 65535,
          value: ob.port || "", placeholder: "port", class: "input mono",
          style: "padding: 3px 6px; font-size: 11.5px; width: 80px;",
          oninput: (e) => {
            ib.outbound.port = parseInt(e.currentTarget.value, 10) || 0;
          } });
        const user = h("input", { type: "text", value: ob.user || "",
          placeholder: "user (blank = no auth)", class: "input",
          style: "padding: 3px 6px; font-size: 11.5px; flex: 1;",
          oninput: (e) => { ib.outbound.user = e.currentTarget.value; } });
        const pass = h("input", { type: "text", value: ob.pass || "",
          placeholder: "pass", class: "input",
          style: "padding: 3px 6px; font-size: 11.5px; flex: 1;",
          oninput: (e) => { ib.outbound.pass = e.currentTarget.value; } });
        wrap.appendChild(h("div", { class: "row",
          style: "gap: 6px; margin-bottom: 4px;" }, host, port));
        wrap.appendChild(h("div", { class: "row", style: "gap: 6px;" }, user, pass));
      } else if (t === "vless") {
        const host = h("input", { type: "text", value: ob.host || "",
          placeholder: "upstream host", class: "input",
          style: "padding: 3px 6px; font-size: 11.5px; flex: 2;",
          oninput: (e) => { ib.outbound.host = e.currentTarget.value; } });
        const port = h("input", { type: "number", min: 1, max: 65535,
          value: ob.port || "", placeholder: "port", class: "input mono",
          style: "padding: 3px 6px; font-size: 11.5px; width: 80px;",
          oninput: (e) => {
            ib.outbound.port = parseInt(e.currentTarget.value, 10) || 0;
          } });
        const uuid = h("input", { type: "text", value: ob.uuid || "",
          placeholder: "client uuid", class: "input mono",
          style: "padding: 3px 6px; font-size: 11.5px; width: 100%;",
          oninput: (e) => { ib.outbound.uuid = e.currentTarget.value; } });
        const sni = h("input", { type: "text", value: ob.sni || "",
          placeholder: "Reality SNI", class: "input",
          style: "padding: 3px 6px; font-size: 11.5px; flex: 2;",
          oninput: (e) => { ib.outbound.sni = e.currentTarget.value; } });
        const pubkey = h("input", { type: "text",
          value: ob.pubkey || ob.public_key || "",
          placeholder: "Reality public key", class: "input mono",
          style: "padding: 3px 6px; font-size: 11.5px; flex: 3;",
          oninput: (e) => { ib.outbound.pubkey = e.currentTarget.value; } });
        const short_id = h("input", { type: "text", value: ob.short_id || "",
          placeholder: "short_id", class: "input mono",
          style: "padding: 3px 6px; font-size: 11.5px; flex: 1;",
          oninput: (e) => { ib.outbound.short_id = e.currentTarget.value; } });
        wrap.appendChild(h("div", { class: "row",
          style: "gap: 6px; margin-bottom: 4px;" }, host, port));
        wrap.appendChild(h("div", { class: "row",
          style: "gap: 6px; margin-bottom: 4px;" }, uuid));
        wrap.appendChild(h("div", { class: "row", style: "gap: 6px;" },
          sni, pubkey, short_id));
      }
      // direct = no extra fields.
      return wrap;
    }

    function renderJsonView() {
      while (tableWrap.firstChild) tableWrap.removeChild(tableWrap.firstChild);
      tableWrap.appendChild(h("div", { class: "muted",
        style: "font-size: 11.5px; margin-bottom: 6px;" },
        "Edit the inbound[] array directly. Click ",
        h("strong", null, "Apply JSON"),
        " to validate and switch back to the table."));
      jsonTextarea = h("textarea", {
        class: "input mono",
        spellcheck: "false",
        style: "width: 100%; min-height: 380px; font-size: 11.5px; "
             + "white-space: pre; resize: vertical; "
             + "font-family: ui-monospace, SFMono-Regular, Menlo, monospace;",
      }, JSON.stringify(inbounds, null, 2));
      tableWrap.appendChild(jsonTextarea);
      const errBox = h("div", { class: "muted",
        style: "color: var(--danger, #c53030); font-size: 11.5px; margin-top: 4px; "
             + "min-height: 14px;" });
      tableWrap.appendChild(errBox);
      tableWrap.appendChild(h("div", { class: "row",
        style: "gap: 8px; margin-top: 8px;" },
        h("button", { class: "btn btn-sm btn-primary", type: "button",
          onclick: () => {
            try {
              const parsed = JSON.parse(jsonTextarea.value);
              if (!Array.isArray(parsed)) throw new Error("must be a JSON array");
              inbounds = parsed;
              dirty = true; _refreshUnsavedBadge();
              viewMode = "table";
              toggleBtn.textContent = "Edit raw JSON";
              renderTableView();
              toast("success", "JSON applied",
                    inbounds.length + " inbound" + (inbounds.length === 1 ? "" : "s"));
            } catch (err) {
              errBox.textContent = "Invalid JSON: " + err.message;
            }
          } }, "Apply JSON"),
        h("button", { class: "btn btn-sm", type: "button",
          onclick: () => {
            viewMode = "table";
            toggleBtn.textContent = "Edit raw JSON";
            renderTableView();
          } }, "Cancel"),
      ));
    }

    if (!inbounds.length) {
      // Start at 12001 (high port, won't collide with caddy on 443).
      addInbound({tag: "vless-main", protocol: "vless", port: 12001});
    } else {
      renderTableView();
    }

    const errorEl = h("div", { class: "muted", style: "color: var(--danger); margin-top: 8px;" });
    body.appendChild(errorEl);

    const footer = h("div", { class: "row", style: "gap: 8px" },
      h("div", { style: "flex: 1" }),
      h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("button", { class: "btn btn-primary",
        onclick: async (e) => {
          e.preventDefault();
          errorEl.textContent = "";
          const name = nameInput.value.trim();
          if (!name) { errorEl.textContent = "Name is required"; return; }
          // If the operator is currently in raw-JSON mode, parse the
          // textarea contents into the inbounds array first so they
          // can hit Save without an explicit Apply step.
          if (viewMode === "json" && jsonTextarea) {
            try {
              const parsed = JSON.parse(jsonTextarea.value);
              if (!Array.isArray(parsed)) throw new Error("must be a JSON array");
              inbounds = parsed;
            } catch (err) {
              errorEl.textContent = "Invalid JSON: " + err.message;
              return;
            }
          }
          const payload = {
            name,
            description: descInput.value.trim() || null,
            inbounds,
          };
          e.target.disabled = true;
          e.target.textContent = "Saving…";
          try {
            if (existing) {
              await api("PATCH", `/api/xout/presets/${existing.id}`, payload);
              toast("success", "Preset updated", "");
            } else {
              await api("POST", "/api/xout/presets", payload);
              toast("success", "Preset created", "");
            }
            dirty = false;
            _refreshUnsavedBadge();
            Modal.close();
            if (onDone) onDone();
          } catch (err) {
            errorEl.textContent = err.message || "save failed";
            e.target.disabled = false;
            e.target.textContent = existing ? "Save" : "Create";
          }
        } }, existing ? "Save" : "Create"));

    Modal.open({ title: existing ? `Edit preset: ${existing.name}` : "New preset",
                 body, footer, size: "wide" });
  }

  // Modal: show what a preset will look like after resolution. Hits
  // /api/xout/presets/{id}/preview which expands referential outbounds
  // (static_ip / xout_inbound) into concrete host:port:user:pass and
  // leaves the VLESS users[] with the "auto" placeholder. Pretty-prints
  // the JSON so the operator can sanity-check before deploying.
  async function openXoutPresetPreviewModal(preset) {
    const body = h("div");
    body.appendChild(h("div", { class: "muted",
      style: "padding: 8px 0; font-size: 12.5px;" }, "Loading…"));
    Modal.open({ title: `Preview: ${preset.name}`, body, size: "wide" });
    let data;
    try {
      data = await api("GET", `/api/xout/presets/${preset.id}/preview`);
    } catch (err) {
      body.innerHTML = "";
      body.appendChild(h("div", { style: "padding: 12px; color: var(--danger);" },
        "Preview failed: " + (err.message || "")));
      return;
    }
    body.innerHTML = "";
    body.appendChild(h("div", { class: "muted",
      style: "font-size: 12px; margin-bottom: 8px;" }, data.note || ""));
    const pre = h("pre", {
      class: "mono",
      style: "background: var(--surface-2); border: 1px solid var(--border); "
        + "border-radius: 4px; padding: 12px; max-height: 520px; "
        + "overflow: auto; font-size: 12px; white-space: pre;",
    }, JSON.stringify(data.resolved_inbounds, null, 2));
    body.appendChild(pre);
    const copyBtn = h("button", { class: "btn btn-sm",
      onclick: async (e) => {
        e.preventDefault();
        try {
          await navigator.clipboard.writeText(pre.textContent);
          toast("success", "Copied", "Preset JSON on clipboard");
        } catch (err) { toast("error", "Copy failed", err.message); }
      } }, "Copy JSON");
    body.appendChild(h("div", { class: "row", style: "gap: 8px; margin-top: 10px;" },
      copyBtn));
  }

  async function renderDatabasesView(root) {
    setActiveNav("databases");
    root.innerHTML = "";
    root.appendChild(h("div", { class: "page-header" },
      h("div", null,
        h("h1", null, "Databases"),
        h("p", { class: "lede" },
          "Manage the Postgres connections this admin knows about and sync ",
          "config between any two of them. The currently-connected database ",
          "is auto-registered on first load."),
      ),
    ));

    // ---- Card 1: registry list ----
    const listCard = h("div", { class: "card" });
    listCard.appendChild(h("div", { class: "card-header" },
      h("h2", null, "Registered databases"),
      h("span", { class: "hint", id: "db-count" }, "")));
    const listBody = h("div", { class: "card-body" });
    listCard.appendChild(listBody);
    root.appendChild(listCard);

    listBody.appendChild(h("div", { class: "muted", style: "padding: 8px 0;" },
      "Loading…"));

    // ---- Card 1.5: push DSN to deployed services ----
    // After switching the local admin's active DB, the ssl-service
    // containers running on remote nodes are still pointing at the
    // old DSN. This card is the explicit "push the new DSN to those
    // containers" action — re-deploys ssl-service everywhere so the
    // containers respawn with the new env.
    const pushCard = h("div", { class: "card" });
    pushCard.appendChild(h("div", { class: "card-header" },
      h("h2", null, "Push DSN to deployed services")));
    const pushBody = h("div", { class: "card-body" });
    pushCard.appendChild(pushBody);
    root.appendChild(pushCard);

    // ---- Card 2: sync ----
    const syncCard = h("div", { class: "card", id: "sync-card",
      style: "display: none" });
    syncCard.appendChild(h("div", { class: "card-header" },
      h("h2", null, "Sync between databases")));
    const syncBody = h("div", { class: "card-body" });
    syncCard.appendChild(syncBody);
    root.appendChild(syncCard);

    // ---- Card 3: analysis ----
    const analysisCard = h("div", { class: "card", style: "display: none" });
    const analysisStamp = h("span", { class: "hint" }, "");
    analysisCard.appendChild(h("div", { class: "card-header" },
      h("h2", null, "Analysis"), analysisStamp));
    const analysisBody = h("div", { class: "card-body" });
    analysisCard.appendChild(analysisBody);
    root.appendChild(analysisCard);

    let cachedView = null;

    const refresh = async () => {
      try {
        const view = await api("GET", "/api/databases");
        cachedView = view;
        renderList(view);
        renderSync(view);
      } catch (err) {
        listBody.innerHTML = "";
        listBody.appendChild(h("div", { class: "muted", style: "color: var(--danger)" },
          err.status === 404
            ? "Database endpoints not available — restart the admin server to pick up the new build."
            : "Load failed: " + err.message));
      }
    };

    // -------- Render: registered DB list --------
    const renderList = (view) => {
      listBody.innerHTML = "";
      const counter = document.getElementById("db-count");
      if (counter) counter.textContent =
        `${view.entries.length} registered`;

      const tbl = h("table", { class: "data" });
      tbl.appendChild(h("thead", null, h("tr", null,
        h("th", null, "Label"),
        h("th", null, "DSN (masked)"),
        h("th", null, "Status"),
        h("th", null, "Added"),
        h("th", null, ""),
      )));
      const tb = h("tbody");
      for (const e of view.entries) {
        const badges = h("div", { class: "row", style: "gap: 4px; flex-wrap: wrap" });
        if (e.is_current)
          badges.appendChild(h("span", { class: "badge ok",
            title: "The admin process is currently connected here" },
            h("span", { class: "dot" }), "in use"));
        if (e.is_active && !e.is_current)
          badges.appendChild(h("span", { class: "badge warn",
            title: "Active in registry but live connection still on the old DSN — restart admin or activate again" },
            "active (registry)"));
        if (e.is_active && e.is_current)
          badges.appendChild(h("span", { class: "badge",
            title: "Saved as active in the persistent registry" }, "active"));
        if (!e.is_current && !e.is_active)
          badges.appendChild(h("span", { class: "muted" }, "—"));

        const actions = h("td", { class: "actions" });
        actions.appendChild(h("button", { class: "btn btn-sm",
          title: "Probe connectivity",
          onclick: () => testDb(e.id) }, "Test"));
        if (App.mode === "readwrite") {
          actions.appendChild(h("button", { class: "btn btn-sm",
            onclick: () => openEditDbModal(e) }, "Edit"));
          if (!e.is_current) {
            actions.appendChild(h("button", { class: "btn btn-sm btn-primary",
              title: "Switch the admin's live connection to this DB now",
              onclick: () => activateDb(e) }, "Activate"));
          }
          if (!e.is_current) {
            actions.appendChild(h("button", { class: "btn btn-sm btn-danger",
              onclick: () => deleteDb(e) }, "Delete"));
          }
        }

        tb.appendChild(h("tr", null,
          h("td", null, e.label || "—"),
          h("td", { class: "mono", style: "font-size: 11.5px; max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;",
            title: e.dsn_masked || "" }, e.dsn_masked || "—"),
          h("td", null, badges),
          h("td", { class: "muted", style: "font-size: 12px" },
            fmtRelative(e.added_at) || "—"),
          actions,
        ));
      }
      tbl.appendChild(tb);
      const wrap = h("div", { class: "table-wrap" });
      wrap.appendChild(tbl);
      listBody.appendChild(wrap);

      // Add button
      if (App.mode === "readwrite") {
        listBody.appendChild(h("div", { style: "margin-top: 12px" },
          h("button", { class: "btn btn-primary",
            onclick: () => openAddDbModal() }, "+ Add database")));
      }

      if (view.last_sync) {
        const ls = view.last_sync;
        const fromLabel = (view.entries.find(e => e.id === ls.from_id) || {}).label || ls.from_id || "?";
        const toLabel = (view.entries.find(e => e.id === ls.to_id) || {}).label || ls.to_id || "?";
        listBody.appendChild(h("div", { class: "muted",
          style: "margin-top: 12px; font-size: 12px" },
          `Last sync: ${fromLabel} → ${toLabel} · `,
          `${ls.totals_applied || 0} rows · ${fmtRelative(ls.at)}`));
      }

      // Render push-DSN section (depends on the active entry's DSN).
      renderPushSection(view);
    };

    // Render the "Push DSN to deployed services" card body. Pulls
    // /api/services-summary so we can show how many ssl-service
    // nodes will be touched.
    const renderPushSection = async (view) => {
      pushBody.innerHTML = "";
      const activeEntry = view.entries.find(e => e.is_current) || view.entries.find(e => e.is_active);
      if (!activeEntry) {
        pushBody.appendChild(h("div", { class: "muted" },
          "No active database — pick one in the table above first."));
        return;
      }
      pushBody.appendChild(h("div", { class: "muted", style: "margin-bottom: 8px" },
        "After switching the live database (above), deployed ssl-service containers ",
        "on your remote nodes are still pointing at the old DSN. Use this to push the ",
        h("strong", null, "currently in-use"), " DSN (",
        h("span", { class: "mono", style: "font-size: 11.5px" }, activeEntry.dsn_masked || "—"),
        ") to every ssl-service node, then docker compose restarts the containers ",
        "with the new env."));

      // Async fetch service summary to know how many ssl-service nodes
      // would actually get touched.
      let counts = null;
      try {
        const r = await api("GET", "/api/services-summary").catch(() => ({ services: [] }));
        const svc = (r.services || []).find(s => s.name === "ssl-service");
        if (svc) counts = svc;
      } catch (_) { /* ignore */ }

      if (!counts) {
        pushBody.appendChild(h("div", { class: "muted",
          style: "padding: 6px 0; font-size: 12px" },
          "ssl-service is not registered as a service in the catalog — register it first."));
        return;
      }
      const totalNodes = counts.total || 0;
      const runningNodes = counts.running || 0;
      const unhealthyNodes = counts.unhealthy || 0;
      pushBody.appendChild(h("div", { style: "margin-bottom: 8px; font-size: 13px" },
        h("strong", null, `${totalNodes} ssl-service node${totalNodes === 1 ? "" : "s"}`),
        " on record · ",
        h("span", { class: "badge ok" }, `${runningNodes} running`),
        unhealthyNodes
          ? h("span", { class: "badge danger", style: "margin-left: 4px" },
              `${unhealthyNodes} unhealthy`)
          : null,
      ));
      if (totalNodes === 0) {
        pushBody.appendChild(h("div", { class: "muted", style: "padding: 4px 0" },
          "No deployed ssl-service nodes yet. Deploy first from the Nodes page."));
        return;
      }

      const includeAbsentChk = h("input", { type: "checkbox", id: "push-incl-absent" });
      pushBody.appendChild(h("label", {
        for: "push-incl-absent", class: "muted",
        style: "display: block; font-size: 12px; margin: 6px 0; cursor: pointer",
      }, includeAbsentChk, " Also push to nodes where the container is currently absent (will respawn it)"));

      const pushBtn = h("button", { class: "btn btn-primary",
        onclick: async () => {
          const includeAbsent = includeAbsentChk.checked;
          const targetCount = includeAbsent ? totalNodes : runningNodes;
          if (targetCount === 0) {
            toast("info", "No targets",
              includeAbsent ? "Nothing to push to." : "All known nodes are absent — tick the checkbox to also include them.");
            return;
          }
          const msg =
            `Push DSN to ${targetCount} ssl-service node(s)?\n\n` +
            `DSN: ${activeEntry.dsn_masked || "?"}\n\n` +
            `Each node will: git pull → write fresh .env (with new SSL_SERVICE_PG_DSN) → docker compose up -d --build.\n\n` +
            `Containers will restart and reconnect to the new database.`;
          if (!confirm(msg)) return;
          pushBtn.disabled = true; pushBtn.textContent = "Pushing…";
          try {
            const r = await api("POST", "/api/databases/push-dsn-to-nodes",
              { include_absent: includeAbsent });
            const ok = r.success || 0;
            const fail = r.fail || 0;
            toast(fail === 0 ? "success" : "info", "Push complete",
              `${ok}/${r.total || ok + fail} ok · ${fail} failed`);
            // Reuse the existing per-deploy report modal.
            if (typeof openServiceDeployReportModal === "function" && r.results) {
              openServiceDeployReportModal(r);
            }
          } catch (err) {
            toast("error", "Push failed", err.message);
          } finally {
            pushBtn.disabled = false; pushBtn.textContent = "Push DSN to deployed nodes";
          }
        } }, "Push DSN to deployed nodes");
      pushBody.appendChild(pushBtn);
    };

    // -------- Render: sync picker --------
    const renderSync = (view) => {
      syncBody.innerHTML = "";
      if (view.entries.length < 2) {
        syncCard.style.display = "none";
        return;
      }
      syncCard.style.display = "";

      // Default: source = current, target = first non-current
      const defaultSourceId = view.current_id || view.entries[0].id;
      const defaultTargetId = (view.entries.find(e => e.id !== defaultSourceId) || {}).id;

      const buildSelect = (id, defaultId) => {
        const sel = h("select", { class: "select", id });
        for (const e of view.entries) {
          const opt = h("option", { value: e.id },
            e.label + (e.is_current ? " (in use)" : ""));
          if (e.id === defaultId) opt.selected = true;
          sel.appendChild(opt);
        }
        return sel;
      };
      const sourceSel = buildSelect("sync-source", defaultSourceId);
      const targetSel = buildSelect("sync-target", defaultTargetId);
      // Avoid same-source/target by reactively swapping.
      sourceSel.onchange = () => {
        if (sourceSel.value === targetSel.value) {
          const next = view.entries.find(e => e.id !== sourceSel.value);
          if (next) targetSel.value = next.id;
        }
      };
      targetSel.onchange = () => {
        if (sourceSel.value === targetSel.value) {
          const next = view.entries.find(e => e.id !== targetSel.value);
          if (next) sourceSel.value = next.id;
        }
      };

      syncBody.appendChild(h("div", { class: "form-row" },
        h("div", { class: "field" },
          h("label", null, "Source (data of truth)"),
          sourceSel),
        h("div", { class: "field" },
          h("label", null, "Target (will be overwritten on conflicts)"),
          targetSel),
      ));

      const analyzeBtn = h("button", { class: "btn btn-primary",
        onclick: async () => {
          analyzeBtn.disabled = true;
          analyzeBtn.textContent = "Analyzing…";
          try {
            const r = await api("POST", "/api/sync/analyze",
              { from_id: sourceSel.value, to_id: targetSel.value });
            renderAnalysis(r, view);
          } catch (err) {
            toast("error", "Analyze failed", err.message);
          } finally {
            analyzeBtn.disabled = false;
            analyzeBtn.textContent = "Analyze";
          }
        } }, "Analyze");
      syncBody.appendChild(analyzeBtn);
    };

    // -------- Render: analysis result + Apply --------
    const renderAnalysis = (analysis, view) => {
      analysisCard.style.display = "";
      const fromLabel = (view.entries.find(e => e.id === analysis.from_id) || {}).label || analysis.from_id;
      const toLabel = (view.entries.find(e => e.id === analysis.to_id) || {}).label || analysis.to_id;
      const t = analysis.totals || {};
      const erroredCount = t.errored_tables || 0;
      const targetMissingCount = t.target_missing_tables || 0;
      const sourceMissingCount = t.source_missing_tables || 0;
      const wouldInsert = t.would_insert_if_bootstrapped || 0;

      const stampParts = [
        `${fromLabel} → ${toLabel}`,
        `${t.insert || 0} insert`,
        `${t.overwrite || 0} OVERWRITE`,
        `${t.preserve_only_in_target || 0} preserved`,
      ];
      if (sourceMissingCount) stampParts.push(`${sourceMissingCount} source-missing`);
      if (targetMissingCount) stampParts.push(`${targetMissingCount} target-missing`);
      if (erroredCount) stampParts.push(`${erroredCount} ERRORED`);
      analysisStamp.textContent = stampParts.join(" · ");
      analysisBody.innerHTML = "";

      // Step 1 of 2 — Sync Schema. The structural step: ensure target has
      // the same tables as source. Hides "Sync Data" while the schema
      // hasn't caught up. After Sync Schema completes we auto-re-Analyze
      // and the report flips into Step 2.
      if (targetMissingCount > 0) {
        const targetEntry = (view.entries || []).find(e => e.id === analysis.to_id);
        const banner = h("div", {
          style: "background: var(--surface-alt); border-left: 4px solid var(--danger); padding: 10px 12px; margin-bottom: 14px;",
        });
        banner.appendChild(h("div", { style: "font-weight: 600; margin-bottom: 4px" },
          `Step 1 of 2 (Sync Schema) — Target '${toLabel}' is missing ${targetMissingCount} table(s): `,
          h("span", { class: "mono", style: "font-size: 11.5px" },
            (analysis.target_missing || []).join(", "))));
        banner.appendChild(h("div", { class: "muted", style: "font-size: 12px; margin-bottom: 8px" },
          `Sync the schema (table structure) first; ${wouldInsert} rows from the source are waiting. "Sync Data" appears after that.`));
        if (targetEntry && App.mode === "readwrite") {
          const syncSchemaBtn = h("button", {
            class: "btn btn-sm btn-primary",
          }, `Sync Schema to ${toLabel}`);
          syncSchemaBtn.onclick = async () => {
            if (!confirm(`Sync schema (run schema.sql) against '${toLabel}'?\n\nThis creates the missing sync tables. Idempotent — safe even if some tables already exist.`)) return;
            syncSchemaBtn.disabled = true;
            syncSchemaBtn.textContent = "Syncing schema…";
            const progress = h("div", { class: "muted",
              style: "font-size: 12px; margin-top: 6px;" },
              "Running schema.sql… this can take ~10s on Supabase.");
            banner.appendChild(progress);
            try {
              const r = await api("POST",
                `/api/databases/${encodeURIComponent(targetEntry.id)}/apply-schema`, {});
              const stillMissing = (r.missing_tables || []).length;
              if (stillMissing > 0) {
                toast("error", "Schema sync incomplete",
                  `${stillMissing} tables still missing after schema.sql ran.`);
                syncSchemaBtn.disabled = false;
                syncSchemaBtn.textContent = `Sync Schema to ${toLabel}`;
                progress.textContent = `Still missing: ${(r.missing_tables || []).join(", ")}`;
                return;
              }
              progress.textContent = "Schema synced. Re-analyzing…";
              toast("success", "Schema synced",
                `${(r.checked_tables || []).length} sync tables on ${toLabel}.`);
              // Auto-rerun Analyze so the user immediately sees Step 2.
              try {
                const fresh = await api("POST", "/api/sync/analyze",
                  { from_id: analysis.from_id, to_id: analysis.to_id });
                renderAnalysis(fresh, view);
              } catch (err) {
                toast("error", "Re-analyze failed", err.message);
                syncSchemaBtn.disabled = false;
                syncSchemaBtn.textContent = `Sync Schema to ${toLabel}`;
              }
            } catch (err) {
              toast("error", "Sync schema failed", err.message);
              syncSchemaBtn.disabled = false;
              syncSchemaBtn.textContent = `Sync Schema to ${toLabel}`;
              progress.remove();
            }
          };
          banner.appendChild(syncSchemaBtn);
        }
        analysisBody.appendChild(banner);
      } else if ((t.insert || 0) + (t.overwrite || 0) > 0) {
        // Schema is good and there's something to apply — tell the user
        // explicitly that we're in Step 2 (Sync Data).
        analysisBody.appendChild(h("div", {
          class: "muted",
          style: "background: var(--surface-alt); border-left: 4px solid var(--success, #2a8a3e); padding: 8px 12px; margin-bottom: 14px; font-size: 12px;",
        }, `Step 2 of 2 (Sync Data) — Schema is in sync. Review the per-table changes below, then click "Sync Data" at the bottom to write the rows.`));
      }

      // Real DB errors get their own callout.
      if (erroredCount > 0) {
        const errBox = h("div", {
          style: "background: var(--surface-alt); border-left: 4px solid var(--danger); padding: 10px 12px; margin-bottom: 14px; color: var(--danger);",
        });
        errBox.appendChild(h("div", { style: "font-weight: 600" },
          `${erroredCount} table(s) errored — see logs:`));
        for (const e of (analysis.errors || []).slice(0, 5)) {
          errBox.appendChild(h("div", { class: "mono", style: "font-size: 11px; margin-top: 4px;" },
            `${e.table}: ${(e.error || "").slice(0, 200)}`));
        }
        analysisBody.appendChild(errBox);
      }

      // Empty-state: only if every table is `ok` AND has zero changes.
      const okTables = (analysis.tables || []).filter(x => x.status === "ok");
      if ((t.insert || 0) === 0 && (t.overwrite || 0) === 0
          && erroredCount === 0 && targetMissingCount === 0
          && okTables.length === (analysis.tables || []).length) {
        analysisBody.appendChild(h("div", { class: "empty" },
          h("div", { class: "title" }, "Nothing to sync"),
          h("div", { class: "sub" }, "Source and target are already identical for these tables.")));
        return;
      }

      // Per-table summary
      const summaryTbl = h("table", { class: "data" });
      summaryTbl.appendChild(h("thead", null, h("tr", null,
        h("th", null, "Table"),
        h("th", null, "Status"),
        h("th", null, "Insert"),
        h("th", null, "Overwrite"),
        h("th", null, "Preserve (target-only)"),
      )));
      const stb = h("tbody");
      const statusBadge = (row) => {
        switch (row.status) {
          case "ok":
            return h("span", { class: "badge ok" }, "ok");
          case "source_missing":
            return h("span", { class: "badge",
              title: "Source DB doesn't have this table — nothing to push" },
              "source missing");
          case "target_missing":
            return h("span", { class: "badge warn",
              title: "Target DB doesn't have this table — would be inserted after bootstrap" },
              "target missing");
          case "both_missing":
            return h("span", { class: "muted" }, "—");
          case "error":
            return h("span", { class: "badge danger" }, "error");
          default:
            return h("span", { class: "muted" }, "?");
        }
      };
      for (const r of analysis.tables) {
        const insertCell = (() => {
          if (r.status === "target_missing" && r.would_insert > 0) {
            return h("span", { class: "badge warn",
              title: "These rows are waiting on the source side; they'd be inserted once the target schema is bootstrapped" },
              `${r.would_insert} pending`);
          }
          if (r.insert > 0) return h("span", { class: "badge ok" }, String(r.insert));
          return h("span", { class: "muted" }, "0");
        })();
        stb.appendChild(h("tr", null,
          h("td", { class: "mono" }, r.table),
          h("td", null, statusBadge(r)),
          h("td", null, insertCell),
          h("td", null, r.overwrite > 0
            ? h("span", { class: "badge danger" }, String(r.overwrite))
            : h("span", { class: "muted" }, "0")),
          h("td", { class: "muted" }, String(r.preserve_only_in_target || 0)),
        ));
      }
      summaryTbl.appendChild(stb);
      const wrap = h("div", { class: "table-wrap" });
      wrap.appendChild(summaryTbl);
      analysisBody.appendChild(wrap);

      // Per-table overwrite samples
      for (const t of analysis.tables) {
        if (!t.sample_overwrite || !t.sample_overwrite.length) continue;
        analysisBody.appendChild(h("div", { style: "margin: 16px 0 6px; font-weight: 600" },
          `${t.table} — will overwrite (showing ${t.sample_overwrite.length}/${t.overwrite}):`));
        const tbl = h("table", { class: "data" });
        tbl.appendChild(h("thead", null, h("tr", null,
          h("th", null, "PK"),
          h("th", null, "Changed fields"),
          h("th", null, "Before (target)"),
          h("th", null, "After (source)"),
        )));
        const tb = h("tbody");
        for (const s of t.sample_overwrite) {
          tb.appendChild(h("tr", null,
            h("td", { class: "mono" }, Object.entries(s.pk).map(([k, v]) => `${k}=${v}`).join(" ")),
            h("td", { class: "mono", style: "font-size: 11.5px" },
              (s.changed_fields || []).join(", ")),
            h("td", { class: "mono", style: "font-size: 11px; color: var(--danger)" },
              Object.entries(s.before).map(([k, v]) => `${k}=${v}`).join("\n")),
            h("td", { class: "mono", style: "font-size: 11px; color: var(--success, green)" },
              Object.entries(s.after).map(([k, v]) => `${k}=${v}`).join("\n")),
          ));
        }
        tbl.appendChild(tb);
        const wrap2 = h("div", { class: "table-wrap" });
        wrap2.appendChild(tbl);
        analysisBody.appendChild(wrap2);
      }

      // Sync Data — only when there's actually something to apply AND
      // target schema is ready (Step 1 finished). Hidden during Step 1
      // so the user can't pick the wrong action.
      const haveChanges = (t.insert || 0) + (t.overwrite || 0) > 0;
      if (targetMissingCount === 0 && haveChanges) {
        // Mode picker. 'merge' (default) = source wins on PK conflict.
        // 'insert_only' = skip overwrites entirely; only add new rows.
        const modeMerge = h("input", { type: "radio", name: "sync-mode",
          value: "merge", id: "sm-merge", checked: true });
        const modeInsert = h("input", { type: "radio", name: "sync-mode",
          value: "insert_only", id: "sm-insert" });
        const modeBox = h("div", {
          style: "background: var(--surface-alt); padding: 10px 12px; border-radius: 6px; margin-top: 16px;",
        },
          h("div", { style: "font-weight: 600; margin-bottom: 6px; font-size: 13px" },
            "Conflict mode"),
          h("label", { style: "display: block; cursor: pointer; padding: 3px 0", for: "sm-merge" },
            modeMerge,
            h("strong", { style: "margin-left: 6px" }, "Merge"),
            h("span", { class: "muted", style: "margin-left: 8px; font-size: 12px" },
              `(default — overwrite ${t.overwrite || 0} target rows + insert ${t.insert || 0})`)),
          h("label", { style: "display: block; cursor: pointer; padding: 3px 0", for: "sm-insert" },
            modeInsert,
            h("strong", { style: "margin-left: 6px" }, "Insert only"),
            h("span", { class: "muted", style: "margin-left: 8px; font-size: 12px" },
              `(skip overwrites — only insert ${t.insert || 0} new rows; existing target rows stay untouched)`)),
        );
        analysisBody.appendChild(modeBox);

        const apply = h("button", { class: "btn btn-danger",
          style: "margin-top: 12px", onclick: async () => {
            const mode = (document.querySelector('input[name="sync-mode"]:checked') || modeMerge).value;
            const isInsertOnly = mode === "insert_only";
            const msg = isInsertOnly
              ? `Sync data from '${fromLabel}' to '${toLabel}' (INSERT ONLY)?\n\n` +
                `${t.insert || 0} new rows will be inserted.\n` +
                `${t.overwrite || 0} overlapping rows will be SKIPPED (target keeps its version).\n` +
                `${t.preserve_only_in_target || 0} target-only rows will be kept.\n\n` +
                `This writes to '${toLabel}'.`
              : `Sync data from '${fromLabel}' to '${toLabel}' (MERGE)?\n\n` +
                `${t.insert || 0} new rows will be inserted.\n` +
                `${t.overwrite || 0} EXISTING rows will be OVERWRITTEN by source.\n` +
                `${t.preserve_only_in_target || 0} target-only rows will be kept.\n\n` +
                `This writes to '${toLabel}'. Irreversible.`;
            if (!confirm(msg)) return;
            apply.disabled = true; apply.textContent = "Syncing data…";
            try {
              const r = await api("POST", "/api/sync/apply",
                { from_id: analysis.from_id, to_id: analysis.to_id, mode });
              const ok = (r.results || []).reduce((a, b) => a + (b.rows_applied || 0), 0);
              const fail = (r.errors || []).length;
              toast(fail === 0 ? "success" : "info",
                isInsertOnly ? "Data synced (insert-only)" : "Data synced",
                `${ok} rows applied · ${fail} table(s) failed`);
              await refresh();
              analysisCard.style.display = "none";
            } catch (err) {
              toast("error", "Sync data failed", err.message);
            } finally {
              apply.disabled = false; apply.textContent = "Sync Data";
            }
          } }, "Sync Data");
        analysisBody.appendChild(apply);
      }
    };

    // -------- Action handlers --------
    const testDb = async (id) => {
      try {
        const r = await api("POST", `/api/databases/${encodeURIComponent(id)}/test`, {});
        const missing = r.missing_tables || [];
        toast(missing.length ? "info" : "success", "Connection OK",
          missing.length
            ? `Missing tables: ${missing.join(", ")}`
            : `${(r.checked_tables || []).length} sync tables present`);
      } catch (err) {
        toast("error", "Test failed", err.message);
      }
    };

    const setPrimary = async (id) => {
      // Backwards-compat name; the underlying endpoint is now Activate.
      return activateDb({ id });
    };

    const activateDb = async (entry) => {
      const msg = `Switch the admin's live connection to '${entry.label || entry.id}'?\n\nThe currently-running admin will close its old DB pool and open a new one to this DSN. In-flight requests get a 5s grace period.`;
      if (!confirm(msg)) return;
      try {
        const r = await api("PUT", `/api/databases/${encodeURIComponent(entry.id)}/activate`, {});
        if (r.live_swap === false) {
          toast("error", "Activated (registry only)",
            r.error || "Live swap failed — restart admin to apply.");
        } else {
          toast("success", "Switched live connection",
            `'${entry.label || entry.id}' is now in use.`);
        }
        await refresh();
      } catch (err) { toast("error", "Activate failed", err.message); }
    };

    const deleteDb = async (entry) => {
      if (!confirm(`Delete '${entry.label}'?\n\n${entry.dsn_masked || ""}`)) return;
      try {
        await api("DELETE", `/api/databases/${encodeURIComponent(entry.id)}`);
        toast("success", "Removed", entry.label);
        await refresh();
      } catch (err) { toast("error", "Delete failed", err.message); }
    };

    const openAddDbModal = () => openDbModal(null);
    const openEditDbModal = (entry) => openDbModal(entry);

    const openDbModal = (entry) => {
      const isEdit = !!entry;
      const labelInput = h("input", {
        class: "input", placeholder: "e.g. Production Supabase",
        value: isEdit ? (entry.label || "") : "",
      });
      const dsnInput = h("input", {
        class: "input mono", type: "text",
        placeholder: "postgresql://user:password@host:5432/db?sslmode=require",
        value: "",
      });
      const body = h("div", null,
        h("div", { class: "field" },
          h("label", null, "Label"),
          labelInput),
        h("div", { class: "field" },
          h("label", null, "DSN ",
            isEdit
              ? h("span", { class: "muted", style: "font-size: 11.5px" },
                  " — currently: " + (entry.dsn_masked || "—") + " (leave empty to keep)")
              : null),
          dsnInput),
      );
      const footer = h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"),
        h("div", { style: "flex: 1" }),
        h("button", { class: "btn btn-primary", onclick: async () => {
          const label = labelInput.value.trim();
          const dsn = dsnInput.value.trim();
          if (!isEdit && !dsn) { toast("error", "DSN is required"); return; }
          try {
            if (isEdit) {
              const body = {};
              if (label) body.label = label;
              if (dsn) body.dsn = dsn;
              await api("PATCH", `/api/databases/${encodeURIComponent(entry.id)}`, body);
              toast("success", "Updated", label || entry.label);
            } else {
              await api("POST", "/api/databases", { label, dsn });
              toast("success", "Added", label || "Database");
            }
            Modal.close();
            await refresh();
          } catch (err) {
            toast("error", "Save failed", err.message);
          }
        } }, isEdit ? "Save" : "Add"),
      );
      Modal.open({ title: isEdit ? `Edit ${entry.label}` : "Add database", body, footer });
    };

    refresh();
  }

  // ---------------------------------------------------------------------------
  // Router
  // ---------------------------------------------------------------------------

  // -----------------------------------------------------------------
  // Single-source-of-truth nav registry. Each entry:
  //   slug     — hash key (`#/<slug>`)
  //   label    — sidebar text
  //   icon     — inline SVG path body (just the inner shapes; the outer
  //              <svg> attrs are added by buildSidebar)
  //   render   — view function (already defined elsewhere in this file)
  // Adding a new section is a single append; no HTML edit, no two-place
  // sync between the sidebar and the routing table.
  const NAV_REGISTRY = [
    { slug: "dashboard",    label: "Dashboard",    render: renderDashboard,    icon: '<rect x="2" y="2" width="5" height="6" rx="1"/><rect x="9" y="2" width="5" height="4" rx="1"/><rect x="2" y="10" width="5" height="4" rx="1"/><rect x="9" y="8" width="5" height="6" rx="1"/>' },
    { slug: "routes",       label: "Routes",       render: renderRoutesView,   icon: '<circle cx="3" cy="3" r="1.5"/><circle cx="13" cy="8" r="1.5"/><circle cx="3" cy="13" r="1.5"/><path d="M3 3h4a3 3 0 0 1 3 3v0M3 13h4a3 3 0 0 0 3-3V8"/>' },
    { slug: "certificates", label: "Certificates", render: renderCertificatesView, icon: '<path d="M8 1l6 3v3c0 4-2.5 7-6 8-3.5-1-6-4-6-8V4l6-3z"/><path d="M5.5 8l2 2 3-4"/>' },
    { slug: "zones",        label: "DNS Zones",    render: renderZonesView,    icon: '<circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 3 4 3 6s-1 4-3 6c-2-2-3-4-3-6s1-4 3-6z"/>' },
    { slug: "nodes",        label: "Nodes",        render: renderNodesView,    icon: '<rect x="2" y="3" width="12" height="4" rx="1"/><rect x="2" y="9" width="12" height="4" rx="1"/><circle cx="4.5" cy="5" r="0.5" fill="currentColor"/><circle cx="4.5" cy="11" r="0.5" fill="currentColor"/>' },
    { slug: "services",     label: "Services",     render: renderServicesView, icon: '<path d="M2 4l6-2 6 2v8l-6 2-6-2V4z"/><path d="M2 4l6 2 6-2M8 6v8"/>' },
    { slug: "static-ips",   label: "Static IPs",   render: renderStaticIpsView, icon: '<circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c1.5 2 2.2 4 2.2 6S9.5 12 8 14M8 2c-1.5 2-2.2 4-2.2 6S6.5 12 8 14"/>' },
    { slug: "ai-keys",      label: "AI Keys",      render: renderAiKeysView,   icon: '<circle cx="6" cy="8" r="2.5"/><path d="M8.5 8h6M11.5 8v2M13.5 8v2M2 4 a4 4 0 0 1 8 0"/>' },
    { slug: "ssh-keys",     label: "SSH Keys",     render: renderSshKeysView,  icon: '<circle cx="5" cy="8" r="2.5"/><path d="M7.5 8h6M11.5 8v2M13.5 8v2"/>' },
    { slug: "xout",         label: "Xout",         render: renderXoutView,     icon: '<path d="M2 8h4M10 8h4M6 4l4 4-4 4M10 4l-4 4 4 4"/>' },
    { slug: "users",        label: "Users",        render: renderUsersView,    icon: '<circle cx="8" cy="5" r="2.5"/><path d="M3 14c0-2.8 2.2-5 5-5s5 2.2 5 5"/>' },
    { slug: "products",     label: "Products",     render: renderProductsView, icon: '<path d="M2 4l6-2 6 2v8l-6 2-6-2V4z"/><path d="M2 4l6 2 6-2"/><path d="M8 6v8"/>' },
    { slug: "billing",      label: "Billing",      render: renderBillingView,  icon: '<path d="M2 4h12v8H2z"/><path d="M2 7h12"/><path d="M5 10h2M9 10h3"/>' },
    { slug: "databases",    label: "Databases",    render: renderDatabasesView, icon: '<ellipse cx="8" cy="3.5" rx="5" ry="1.5"/><path d="M3 3.5v9c0 .8 2.2 1.5 5 1.5s5-.7 5-1.5v-9"/><path d="M3 8c0 .8 2.2 1.5 5 1.5s5-.7 5-1.5"/>' },
    { slug: "commands",     label: "Commands",     render: renderCommandsView, icon: '<path d="M2 4h12v8H2z"/><path d="M4 7l3 1-3 1M8 9h4"/>' },
    { slug: "logs",         label: "Logs",         render: renderLogsView,     icon: '<rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 6h6M5 9h6M5 12h3"/>' },
    { slug: "settings",     label: "Settings",     render: renderSettingsView, icon: '<circle cx="8" cy="8" r="2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M3.2 12.8l1.4-1.4M11.4 4.6l1.4-1.4"/>' },
  ];

  // Build sidebar from NAV_REGISTRY at boot.
  (function buildSidebar() {
    const navEl = document.getElementById("nav");
    if (!navEl) return;
    navEl.innerHTML = "";
    for (const entry of NAV_REGISTRY) {
      const a = document.createElement("a");
      a.href = "#/" + entry.slug;
      a.dataset.nav = entry.slug;
      a.innerHTML =
        '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">'
        + entry.icon + '</svg>'
        + entry.label;
      navEl.appendChild(a);
    }
  })();

  // Routes table derived from the same registry.
  const routes = Object.fromEntries(
    NAV_REGISTRY.map((e) => ["#/" + e.slug, e.render])
  );

  function navigate() {
    if (App._leaveCurrent) { try { App._leaveCurrent(); } catch (_) {} App._leaveCurrent = null; }
    const hash = location.hash || "#/dashboard";
    const render = routes[hash] || renderDashboard;
    const root = document.getElementById("view-root");
    render(root, {});
  }

  window.addEventListener("hashchange", navigate);

  document.getElementById("logout-btn").addEventListener("click", () => {
    Store.clearToken();
    showLogin();
  });

  // Sidebar Restart button — same flow that used to live only on the
  // Databases page header. Visible from every view now.
  document.getElementById("restart-admin-btn").addEventListener("click", (e) => {
    restartAdminFlow(e.currentTarget);
  });

  function showLogin() {
    document.getElementById("app").classList.add("hidden");
    document.getElementById("login").classList.add("open");
    const tokenEl = document.getElementById("login-token");
    setTimeout(() => tokenEl.focus(), 50);
  }

  function hideLogin() {
    document.getElementById("login").classList.remove("open");
    document.getElementById("app").classList.remove("hidden");
  }

  async function verifyAndEnter() {
    try {
      await api("GET", "/api/overview");
      hideLogin();
      await refreshOverview();
      navigate();
      return true;
    } catch (err) {
      if (err.status === 401) showLogin();
      else toast("error", "Connection error", err.message);
      return false;
    }
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const token = document.getElementById("login-token").value.trim();
    const remember = document.getElementById("login-remember").checked;
    if (!token) return;
    Store.setToken(token, remember);
    const errEl = document.getElementById("login-error");
    errEl.textContent = "";
    try {
      await api("GET", "/api/overview");
      document.getElementById("login-token").value = "";
      hideLogin();
      await refreshOverview();
      if (!location.hash) location.hash = "#/dashboard";
      navigate();
    } catch (err) {
      errEl.textContent = err.status === 401 ? "Invalid token." : ("Could not connect: " + err.message);
      Store.clearToken();
    }
  });

  // Boot
  if (!Store.getToken()) {
    showLogin();
  } else {
    verifyAndEnter().then(ok => { if (ok && !location.hash) location.hash = "#/dashboard"; });
  }

  // Refresh sidebar periodically
  setInterval(() => { if (!document.hidden && !document.getElementById("login").classList.contains("open")) refreshOverview(); }, 15000);

})();
</script>

</body>
</html>
