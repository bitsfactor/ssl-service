    }
    const form = h("form");
    form.appendChild(h("div", { class: "form-row" },
      h("div", { class: "field" },
        h("label", null, "Name"),
        h("input", { id: "svc-name", class: "input mono", required: true, disabled: isEdit,
          value: existing ? existing.name : "" }),
      ),
      h("div", { class: "field" },
        h("label", null, "Display name"),
        h("input", { id: "svc-display", class: "input",
          value: existing ? existing.display_name : "" }),
      ),
    ));
    form.appendChild(h("div", { class: "field" },
      h("label", null, "Description"),
      h("input", { id: "svc-desc", class: "input",
        value: existing && existing.description ? existing.description : "" }),
    ));
    form.appendChild(h("div", { class: "form-row" },
      h("div", { class: "field" },
        h("label", null, "GitHub repo URL"),
        h("input", { id: "svc-repo", class: "input mono", required: true,
          placeholder: "git@github.com:bitsfactor/ssl-service.git",
          value: existing ? existing.github_repo_url : "" }),
      ),
      h("div", { class: "field" },
        h("label", null, "Branch"),
        h("input", { id: "svc-branch", class: "input mono",
          value: existing ? existing.default_branch : "main" }),
      ),
    ));
    form.appendChild(h("div", { class: "form-row" },
      h("div", { class: "field" },
        h("label", null, "Compose file (relative to repo root)"),
        h("input", { id: "svc-compose", class: "input mono",
          value: existing ? existing.compose_file : "docker-compose.yml" }),
      ),
      h("div", { class: "field" },
        h("label", null, "Install dir template ", h("span", { class: "hint" }, " — {name} = service name")),
        h("input", { id: "svc-installdir", class: "input mono",
          value: existing ? existing.install_dir_template : "/opt/{name}" }),
      ),
    ));
    // Per-row default-env editor — same UX as the Deploy modal.
    // Required vars highlighted red; SSL_SERVICE_PG_DSN is rendered
    // as a dropdown sourced from the Databases registry.
    const envWrap = h("div", { class: "field" },
      h("label", null, "Default env",
        h("span", { class: "hint" }, " — saved per-service; auto-applied at every deploy")));
    const envTable = h("table", { class: "data", style: "width: 100%; font-size: 12.5px;" });
    envTable.appendChild(h("thead", null, h("tr", null,
      h("th", null, "Variable"),
      h("th", null, "Manifest default"),
      h("th", null, "Saved value"),
    )));
    const envBody = h("tbody");
    const savedEnv = (existing && existing.default_env) || {};

    // Union of: required_env, manifest defaults, anything already saved.
    const envKeys = new Set();
    if (manifest) {
      for (const k of (manifest.required_env || [])) envKeys.add(k);
      for (const k of Object.keys(manifest.defaults || {})) envKeys.add(k);
    }
    for (const k of Object.keys(savedEnv)) envKeys.add(k);

    // Each row owns its own input element so we can read all of them
    // back on Save. We capture them in this dict instead of relying on
    // global IDs.
    const envInputs = {};

    // Known SSL_SERVICE_* enums — render these as dropdowns instead of
    // free text so the operator can't typo a value.
    const ENV_ENUMS = {
      SSL_SERVICE_MODE: ["readonly", "readwrite"],
      SSL_SERVICE_ENABLE_WEB_UI: ["false", "true"],
      SSL_SERVICE_ACME_STAGING: ["false", "true"],
    };

    const buildRow = (key, manifestDefault, savedValue, isRequired) => {
      let valueCell;
      // ssl-service uses SSL_SERVICE_PG_DSN; xout uses XOUT_DATABASE_URL.
      // Both are database DSNs and resolve via the same `database:<id>`
      // token, so they share the picker UI.
      const isDsnKey = (key === "SSL_SERVICE_PG_DSN" || key === "XOUT_DATABASE_URL");
      if (isDsnKey && databases.length) {
        // Pick from the Databases registry. We store `database:<id>`
        // (a resolver token) instead of the cleartext DSN — that way
        // the actual DSN never round-trips through the browser, and
        // editing a database's DSN later auto-flows to all deploys
        // that reference it.
        const sel = h("select", { class: "input mono",
          style: "width: 100%; font-size: 11.5px",
          "data-env-key": key });
        sel.appendChild(h("option", { value: "" },
          savedValue ? "(custom — typed below)" : "(none — pick a database)"));
        const redact = (s) => (s || "").replace(/:[^:@/]*@/, ":****@");
        // Sort so the active database floats to the top.
        const entries = databases.slice().sort((a, b) =>
          (b.is_active ? 1 : 0) - (a.is_active ? 1 : 0));
        const matchToken = savedValue && savedValue.startsWith("database:")
          ? savedValue.slice("database:".length) : null;
        for (const db of entries) {
          const token = `database:${db.id}`;
          const lbl = db.label || db.id;
          const text = `${lbl}${db.is_active ? "  ★ active" : ""}  —  ${redact(db.dsn_masked || "")}`;
          const opt = h("option", { value: token }, text);
          if (matchToken && db.id === matchToken) opt.selected = true;
          sel.appendChild(opt);
        }
        // Free-text fallback (when the saved value isn't a registry token)
        const free = h("input", { class: "input mono", "data-env-key": key + ":free",
          style: "width: 100%; font-size: 11.5px; margin-top: 4px;",
          placeholder: "Or paste a raw DSN (advanced — won't track registry edits)",
          value: savedValue && !savedValue.startsWith("database:") ? savedValue : "" });
        valueCell = h("td", null, sel, free);
        envInputs[key] = () => sel.value || free.value;
      } else if (ENV_ENUMS[key]) {
        const sel = h("select", { class: "input mono",
          style: "width: 100%; font-size: 11.5px",
          "data-env-key": key });
        // Empty option = "use the manifest default"
        sel.appendChild(h("option", { value: "" },
          manifestDefault ? `(default — ${manifestDefault})` : "(none)"));
        const cur = savedValue || "";
        for (const v of ENV_ENUMS[key]) {
          const opt = h("option", { value: v }, v);
          if (cur === v) opt.selected = true;
          sel.appendChild(opt);
        }
        valueCell = h("td", null, sel);
        envInputs[key] = () => sel.value;
      } else {
        const inp = h("input", { class: "input mono",
          "data-env-key": key,
          style: "width: 100%; font-size: 11.5px"
            + (isRequired && !savedValue && !manifestDefault ? "; border-color: var(--danger)" : ""),
          placeholder: manifestDefault || (isRequired ? "(required)" : ""),
          value: savedValue || "" });
        valueCell = h("td", null, inp);
        envInputs[key] = () => inp.value;
      }
      envBody.appendChild(h("tr", null,
        h("td", { class: "mono", style: "font-size: 12px" },
          isRequired
            ? h("span", { style: "color: var(--danger); font-weight: bold;" }, key + " *")
            : key),
        h("td", { class: "muted mono", style: "font-size: 11px" },
          manifestDefault || h("span", null, "—")),
        valueCell,
      ));
    };

    if (manifest) {
      const required = new Set(manifest.required_env || []);
      // Priority order: required first, then a small curated "core"
      // group of the most-edited knobs, then everything else
      // alphabetically. Keeps the operator's eyeballs on the values
      // they actually need to touch — typing has-defaults stuff falls
      // to the bottom under a hint that they can ignore it.
      const corePriority = [
        "SSL_SERVICE_ENABLE_WEB_UI",
        "SSL_SERVICE_ADMIN_TOKEN",
        "SSL_SERVICE_MODE",
        "SSL_SERVICE_PG_DSN",
      ];
      const allKeys = Array.from(envKeys);
      const requiredKeys = allKeys.filter((k) => required.has(k))
        .sort((a, b) => corePriority.indexOf(a) - corePriority.indexOf(b)
          || a.localeCompare(b));
      const coreKeys = allKeys.filter((k) => !required.has(k) && corePriority.includes(k))
        .sort((a, b) => corePriority.indexOf(a) - corePriority.indexOf(b));
      const otherKeys = allKeys.filter((k) => !required.has(k) && !corePriority.includes(k))
        .sort();

      for (const key of requiredKeys) {
        const manifestDefault = (manifest.defaults || {})[key] || "";
        buildRow(key, manifestDefault, savedEnv[key] || "", true);
      }
      for (const key of coreKeys) {
        const manifestDefault = (manifest.defaults || {})[key] || "";
        buildRow(key, manifestDefault, savedEnv[key] || "", false);
      }
      // Visual divider before the "advanced" section
      if (otherKeys.length) {
        envBody.appendChild(h("tr", null,
          h("td", { colspan: "3",
            style: "padding: 8px 0 4px; font-size: 11px; color: var(--muted); border-bottom: 1px dashed var(--border)" },
            "Advanced (manifest defaults — usually no need to override)")));
      }
      for (const key of otherKeys) {
        const manifestDefault = (manifest.defaults || {})[key] || "";
        buildRow(key, manifestDefault, savedEnv[key] || "", false);
      }
    } else {
      // No manifest yet (new service or fetch failed) — fall back to a
      // simple textarea so the operator can still save defaults.
      const ta = h("textarea", { id: "svc-env-ta", class: "textarea mono", rows: "6",
        placeholder: "KEY=value, one per line" }, envDictToText(savedEnv));
      envBody.appendChild(h("tr", null,
        h("td", { colspan: "3" }, ta)));
      envInputs.__textarea = () => ta.value;
    }
    envTable.appendChild(envBody);
    const envInner = h("div", { class: "table-wrap",
      style: "max-height: 280px; overflow-y: auto" });
    envInner.appendChild(envTable);
    envWrap.appendChild(envInner);
    form.appendChild(envWrap);
    form.appendChild(h("div", { class: "field" },
      h("label", null, "Pre-deploy command (optional, runs before docker compose up)"),
      h("textarea", { id: "svc-pre", class: "textarea mono", rows: "2",
        placeholder: "(blank)" },
        existing && existing.pre_deploy_command ? existing.pre_deploy_command : ""),
    ));
    form.appendChild(h("div", { class: "field" },
      h("label", null, "Post-deploy command (optional)"),
      h("textarea", { id: "svc-post", class: "textarea mono", rows: "2",
        placeholder: "(blank)" },
        existing && existing.post_deploy_command ? existing.post_deploy_command : ""),
    ));

    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("button", { class: "btn btn-primary", onclick: async (e) => {
        e.preventDefault();

          display_name: document.getElementById("svc-display").value.trim(),
          description: document.getElementById("svc-desc").value.trim() || null,
          github_repo_url: document.getElementById("svc-repo").value.trim(),
          default_branch: document.getElementById("svc-branch").value.trim() || "main",
          compose_file: document.getElementById("svc-compose").value.trim() || "docker-compose.yml",
          install_dir_template: document.getElementById("svc-installdir").value.trim() || "/opt/{name}",
          default_env: (() => {
            // Prefer the per-row table; fall back to the textarea
            // when no manifest was loaded.
            if (envInputs.__textarea) {
              return envTextToDict(envInputs.__textarea());
            }
            const out = {};
            for (const [k, getter] of Object.entries(envInputs)) {
              const v = (getter() || "").trim();
              if (v) out[k] = v;
            }
            return out;
          })(),
          pre_deploy_command: document.getElementById("svc-pre").value.trim() || null,
          post_deploy_command: document.getElementById("svc-post").value.trim() || null,
        };
        try {
          if (isEdit) {
            await api("PATCH", `/api/services/${encodeURIComponent(existing.name)}`, payload);
          } else {
            payload.name = document.getElementById("svc-name").value.trim();
            await api("POST", "/api/services", payload);
          }
          Modal.close();
          toast("success", isEdit ? "Service updated" : "Service added", payload.name || existing.name);
          onSaved && onSaved();
        } catch (err) { toast("error", "Save failed", err.message); }
      } }, isEdit ? "Save" : "Add service"),
    );
    Modal.open({ title: isEdit ? `Edit ${existing.name}` : "Add service",
                 body: form, footer, size: "wide" });
  }

  // ----- Static IPs view -----

  // Per-row loop-test timers that survive view re-renders within the
  // same #/static-ips session. Cleared when the user navigates away.
  const StaticIpLoopState = {
    timers: new Map(),    // id -> setInterval handle
    seconds: new Map(),   // id -> chosen seconds
    statuses: new Map(),  // id -> latest result {success, latency_ms, error, at}
    onTickCallbacks: new Set(),
    start(id, seconds, runOnce) {
      this.stop(id);
      this.seconds.set(id, seconds);
      const handle = setInterval(() => runOnce(id), seconds * 1000);
      this.timers.set(id, handle);
      runOnce(id);
    },
    stop(id) {
      const t = this.timers.get(id);
      if (t) clearInterval(t);
      this.timers.delete(id);
      this.seconds.delete(id);
    },
    stopAll() {
      for (const t of this.timers.values()) clearInterval(t);
      this.timers.clear();
      this.seconds.clear();
      // statuses is cosmetic (used to show fresh badges in the table) —
      // wipe it too so we don't carry stale "ok" indicators into a
      // future visit when the DB has since changed.
      this.statuses.clear();
    },
    isRunning(id) { return this.timers.has(id); },
  };

  // Selection state for batch operations. Lives at module scope so it
  // survives an in-view re-render (e.g. sort change) but is wiped on
  // navigate-away just like the loop timers.
  const StaticIpSelection = {
    ids: new Set(),
    rowsById: new Map(),  // id -> the live ``r`` object (for batch loop / test)
    listeners: new Set(), // callbacks fired when the set changes
    set(id, on) {
      if (on) this.ids.add(id);
      else this.ids.delete(id);
      this._fire();
    },
    setAll(ids, on) {
      for (const id of ids) {
        if (on) this.ids.add(id);
        else this.ids.delete(id);
      }
      this._fire();
    },
    clear() { this.ids.clear(); this._fire(); },
    has(id) { return this.ids.has(id); },
    size() { return this.ids.size; },
    onChange(cb) { this.listeners.add(cb); return () => this.listeners.delete(cb); },
    _fire() { for (const cb of this.listeners) try { cb(); } catch (_) {} },
  };

  // Inline DOM patch helpers — replace the older "renderStaticIpsView()
  // on every change" pattern that was rebuilding the whole table 30
  // times a minute under loop tests. Each helper finds the row by its
  // ``data-ip-id`` attribute and mutates only the cell that changed.

  function _ipRowEl(id) {
    return document.querySelector(`tr[data-ip-id="${id}"]`);
  }

  function updateRowLastTest(id, status) {
    // status: { success, latency_ms, error, at }
    StaticIpLoopState.statuses.set(id, status);
    const tr = _ipRowEl(id);
    if (!tr) return;
    const cell = tr.querySelector(".ip-last-test");
    if (!cell) return;
    cell.replaceChildren(
      ipResultBadge(status.success, status.latency_ms, status.error, status.at),
      status.at ? h("div", { class: "muted", style: "font-size: 11px; margin-top: 2px" },
                     fmtRelative(status.at)) : null,
    );
  }

  // The dedicated Loop column was removed (operators wanted it in the
  // ⋯ menu instead), so this function now toggles a small inline
  // "🔄Ns" indicator inside the latency cell, next to the result
  // badge. The actual start/stop happens via the menu's Loop entry.
  function updateRowLoopButton(id) {
    const tr = _ipRowEl(id);
    if (!tr) return;
    const cell = tr.querySelector(".ip-last-test");
    if (!cell) return;
    const running = StaticIpLoopState.isRunning(id);
    let indicator = cell.querySelector(".ip-loop-indicator");
    if (running) {
      const text = `🔄${StaticIpLoopState.seconds.get(id)}s`;
      if (!indicator) {
        indicator = h("span", { class: "ip-loop-indicator",
          style: "font-size: 10.5px; margin-left: 6px; color: var(--accent, #38a169);",
          title: "Loop is ticking" }, text);
        cell.appendChild(indicator);
      } else {
        indicator.textContent = text;
      }
    } else if (indicator) {
      indicator.remove();
    }
  }

  function removeRowFromDom(id) {
    const tr = _ipRowEl(id);
    if (tr && tr.parentNode) tr.parentNode.removeChild(tr);
    StaticIpSelection.set(id, false);
    StaticIpLoopState.stop(id);
    StaticIpLoopState.statuses.delete(id);
    StaticIpSelection.rowsById.delete(id);
    // Refresh the count badge if present.
    const countEl = document.getElementById("ips-count");
    if (countEl) {
      const remaining = document.querySelectorAll('tr[data-ip-id]').length;
      countEl.textContent = `${remaining} IP${remaining === 1 ? "" : "s"}`;
    }
  }

  // Light connectivity-only test used by the Loop tick — too cheap to
  // run a full speedtest 10 times a minute. Updates the latency cell
  // only; bandwidth cell is left to whichever speedtest ran most
  // recently.
  async function ipTestOnce(id, kind) {
    try {
      const r = await api("POST", `/api/static-ips/${id}/test`, { kind: kind || "manual" });
      const status = {
        success: r.result.success,
        latency_ms: r.result.latency_ms,
        error: r.result.error,
        at: new Date().toISOString(),
      };
      updateRowLastTest(id, status);
      return status;
    } catch (err) {
      if (err && err.status === 404) {
        removeRowFromDom(id);
      } else {
        updateRowLastTest(id, {
          success: false, latency_ms: null,
          error: err.message || String(err),
          at: new Date().toISOString(),
        });
      }
      throw err;
    }
  }

  // Full speed test. Backs both the per-row "Test" action and the
  // batch "Test (N)" toolbar — the operator's mental model is "Test"
  // == "find out how good this proxy actually is", which TCP latency
  // alone doesn't answer. Updates BOTH the latency and bandwidth
  // cells inline so the table reflects fresh data without a
  // re-render. Returns the same shape ipTestOnce does so callers can
  // count ok/fail.
  async function ipSpeedTestOnce(id) {
    try {
      const r = await api("POST", `/api/static-ips/${id}/speedtest`);
      const result = r.result || {};
      const lat = result.latency || {};
      // Distinguish "everything ok" from "tcp ok but proxy
      // unusable" so callers can render an accurate badge. The
      // backend's ``result.ok`` is true only if BOTH latency AND
      // bandwidth succeeded for proxy protocols; we expose a
      // ``bw_error`` so the row's bandwidth cell can show a hint.
      const bwErr = (result.bandwidth_down && result.bandwidth_down.error)
                 || (result.bandwidth_up && result.bandwidth_up.error)
                 || (result.app_rtt && result.app_rtt.error);
      const status = {
        success: !!result.ok || (lat.ok > 0 && !bwErr),
        // Keep raw float — _fmtLatency formats with appropriate
        // precision (sub-ms gets decimals, ms+ rounds to int).
        // Math.round() collapsed 0.4ms latencies to "0ms" which made
        // local proxies look broken.
        latency_ms: lat.p50_ms != null ? lat.p50_ms : null,
        error: lat.error || bwErr,
        at: new Date().toISOString(),
        loss_pct: lat.loss_pct,
        jitter_ms: lat.jitter_ms,
        bw_error: bwErr,
        ok: !!result.ok,
      };
      updateRowLastTest(id, status);
      updateRowBandwidth(id, result);
      return status;
    } catch (err) {
      if (err && err.status === 404) {
        removeRowFromDom(id);
      } else {
        updateRowLastTest(id, {
          success: false, latency_ms: null,
          error: err.message || String(err),
          at: new Date().toISOString(),
        });
      }
      throw err;
    }
  }

  // Render a "▼ Down · ▲ Up" cell from a speed-test result. Handles
  // the three states: (a) bandwidth ran and we have numbers; (b)
  // protocol can't carry HTTP traffic — show "n/a"; (c) PySocks not
  // installed — show actionable hint. State (c) happens once per
  // venv lifetime; we surface it inline so the operator notices.
  function _bandwidthCellContent(result) {
    if (!result) return [h("span", { class: "muted", style: "font-size: 11.5px;" }, "—")];
    const proto = (result.protocol || "").toLowerCase();
    const isProxyProto = ["http", "https", "socks5", "socks4"].includes(proto);
    if (!isProxyProto) {
      return [h("span", { class: "muted", style: "font-size: 11.5px;" }, "n/a (not a proxy)")];
    }
    const down = result.bandwidth_down;
    const up = result.bandwidth_up;
    if (!down && !up) {
      return [h("span", { class: "muted", style: "font-size: 11.5px;" }, "(not run)")];
    }
    const dn = (down && down.mbps != null) ? down.mbps : null;
    const upMbps = (up && up.mbps != null) ? up.mbps : null;
    // When BOTH directions failed, surface the failure category so
    // the operator can act — auth issues need different fixes from
    // routing / timeout issues. Categorize by inspecting the error
    // string. The same upstream message (e.g. "SOCKS5 auth failed
    // status=1" / "rep=2") repeats across down/up so we just sniff
    // whichever has one.
    if (dn == null && upMbps == null) {
      const err = (down && down.error) || (up && up.error) || "";
      let label = "failed";
      let hint = err;
      if (/auth failed/i.test(err)) {
        label = "auth failed";
        hint = "wrong user / pass";
      } else if (/rep=2|not allowed by ruleset|connection not allowed/i.test(err)) {
        label = "blocked";
        hint = "proxy refuses destination";
      } else if (/rep=4|host unreachable/i.test(err)) {
        label = "unreachable";
      } else if (/timed out|TimeoutError|Timeout/i.test(err)) {
        label = "timeout";
      } else if (/connection refused/i.test(err)) {
        label = "refused";
      } else if (err) {
        hint = err.slice(0, 80);
      }
      return [
        h("span", { class: "badge danger", style: "font-size: 11px;",
                    title: err || label }, label),
        hint && hint !== label
          ? h("div", { class: "muted mono", style: "font-size: 10.5px; margin-top: 2px;" },
              hint.length > 30 ? hint.slice(0, 30) + "…" : hint)
          : null,
      ];
    }
    // Stacked bandwidth: download on top, upload below. Saves
    // horizontal space at the cost of 1 extra line of vertical room
    // (which the row already has from other 2-line cells).
    const fmt = (v) => v == null ? "—" : (v >= 100 ? Math.round(v) : v.toFixed(1));
    const tip = `Download: ${dn == null ? "—" : dn + " Mbps"}
Upload: ${upMbps == null ? "—" : upMbps + " Mbps"}`;
    return [
      h("div", { class: "mono", style: "font-size: 12px; line-height: 1.3; white-space: nowrap;", title: tip },
        h("span", { class: "muted", style: "margin-right: 2px;" }, "▼"),
        fmt(dn),
        h("span", { class: "muted", style: "margin-left: 4px; font-size: 10.5px;" }, "Mbps")),
      h("div", { class: "mono", style: "font-size: 12px; line-height: 1.3; white-space: nowrap;", title: tip },
        h("span", { class: "muted", style: "margin-right: 2px;" }, "▲"),
        fmt(upMbps),
        h("span", { class: "muted", style: "margin-left: 4px; font-size: 10.5px;" }, "Mbps")),
    ];
  }

  function updateRowBandwidth(id, result) {
    const tr = _ipRowEl(id);
    if (!tr) return;
    const cell = tr.querySelector(".ip-bandwidth");
    if (!cell) return;
    cell.replaceChildren(..._bandwidthCellContent(result));
  }

  // Format a latency value (raw float ms) for compact display.
  // < 1ms numbers must keep a decimal so a 0.4ms TCP RTT doesn't
  // collapse to "0ms" and look broken; everything else rounds to int.
  function _fmtLatency(latency) {
    if (latency == null) return "";
    if (latency < 1) return `${latency.toFixed(2)}ms`;
    if (latency < 10) return `${latency.toFixed(1)}ms`;
    return `${Math.round(latency)}ms`;
  }

  function ipResultBadge(success, latency, error, at) {
    if (success === null || success === undefined)
      return h("span", { class: "badge" }, "—");
    if (success) {
      const text = (latency != null) ? `ok · ${_fmtLatency(latency)}` : "ok";
      const b = h("span", { class: "badge ok", title: at ? fmtDate(at) : "" }, h("span", { class: "dot" }), text);
      return b;
    }
    return h("span", { class: "badge danger", title: error || "" }, h("span", { class: "dot" }), "fail");
  }

  function ipUnlockBadge(item) {
    const s = (item.status || "").toLowerCase();
    if (s === "available" || s === "full") return h("span", { class: "badge ok" }, item.service);
    if (s === "originals_only") return h("span", { class: "badge warn" }, item.service + " · originals");
    if (s === "blocked") return h("span", { class: "badge danger" }, item.service + " · blocked");
    if (s === "error") return h("span", { class: "badge" }, item.service + " · err");
    return h("span", { class: "badge" }, item.service + " · ?");
  }

  async function renderStaticIpsView(root, params) {
    setActiveNav("static-ips");
    root.innerHTML = "";
    // Loop timers must persist across in-view re-renders (caused by
    // sort changes, bulk-add, single-test toasts, etc.). They should
    // only be cleared when the user navigates AWAY to a different
    // page. Same for selection — wipe it on leave so a future visit
    // starts with no rows preselected.
    App._leaveCurrent = () => {
      StaticIpLoopState.stopAll();
      StaticIpSelection.clear();
    };

    let currentSort = (params && params.sort) || "country";

    // Page header. The right-side toolbar is nowrap so the three
    // buttons stay on a single line; the lede paragraph on the left
    // takes whatever width is left over (page-header is flex).
    root.appendChild(h("div", { class: "page-header" },
      h("div", null,
        h("h1", null, "Static IPs"),
        h("p", { class: "lede" }, "Proxy IP registry. Bulk-paste any blob — IPs, ports, protocols, country names — and an AI parser turns it into clean rows. Test connectivity per row, in a loop, or all at once."),
      ),
      h("div", { class: "row", style: "flex-wrap: nowrap; flex-shrink: 0;" },
        h("button", { class: "btn", onclick: () => renderStaticIpsView(root, { sort: currentSort }) }, "Refresh"),
        h("button", { class: "btn", id: "btn-test-all",
          title: "Open the Test modal pre-targeted at every row",
          onclick: () => openTestModal({type:'all'}) }, "Test all…"),
        h("button", { class: "btn",
          title: "Register an inbound from one of your Xout-deployed nodes as a Static IP entry.",
          onclick: () => openImportFromXoutModal(() => renderStaticIpsView(root, { sort: currentSort })) },
          "Import from Xout"),
        h("button", { class: "btn btn-primary", onclick: () => openBulkAddModal(() => renderStaticIpsView(root, { sort: currentSort })) }, "+ Bulk add"),
      ),
    ));

    // Sort controls. Each entry is [server-key, button-label]. We
    // surface "Vendor" and "Expires" alongside the legacy keys; the
    // server-side sort_clauses table has the matching ORDER BY.
    const sortOptions = [
      ["country",  "Country"],
      ["provider", "Provider"],
      ["vendor",   "Vendor"],
      ["expires",  "Expires"],
      ["ip",       "IP"],
      ["created",  "Created"],
    ];
    const sortRow = h("div", { class: "row", style: "gap: 6px; margin-bottom: 12px;" },
      h("span", { class: "muted" }, "Sort: "),
      ...sortOptions.map(([key, lbl]) =>
        h("button", { class: "btn btn-sm" + (key === currentSort ? " btn-primary" : ""),
          onclick: () => { currentSort = key; renderStaticIpsView(root, { sort: key }); } },
          lbl),
      ),
    );
    root.appendChild(sortRow);

    // Selection toolbar — appears only when ≥1 row is checked. Sits
    // between the sort row and the table so it doesn't push the table
    // around when it shows/hides; we use a fixed-height wrapper.
    const selToolbar = h("div", {
      id: "ip-sel-toolbar",
      style: "display: none; gap: 8px; align-items: center; padding: 8px 12px; "
           + "margin-bottom: 12px; background: var(--surface); border: 1px solid var(--border); "
           + "border-radius: 8px;",
    });
    root.appendChild(selToolbar);

    function _renderSelToolbar() {
      const n = StaticIpSelection.size();
      // Always sync row checkboxes — including when n=0 — otherwise
      // toggling the master OFF leaves the row checkboxes visually
      // checked even though the selection state is empty. The earlier
      // early-return below missed this and the row UI desynced from
      // the model.
      for (const cb of document.querySelectorAll('input.ip-sel-row')) {
        const id = parseInt(cb.value, 10);
        cb.checked = StaticIpSelection.has(id);
      }
      if (n === 0) {
        selToolbar.style.display = "none";
        selToolbar.replaceChildren();
        const master = document.getElementById("ip-sel-master");
        if (master) { master.checked = false; master.indeterminate = false; }
        return;
      }
      selToolbar.style.display = "flex";
      selToolbar.replaceChildren(
        h("strong", null, `${n} selected`),
        h("span", { class: "muted", style: "flex: 1;" },
          App.mode === "readwrite"
            ? "Test, loop, edit, or delete the highlighted rows in one shot."
            : "Test the highlighted rows in one shot."),
        h("button", { class: "btn btn-sm",
          onclick: () => openTestModal({type:'selected', ids: Array.from(StaticIpSelection.ids)}) }, `Test (${n})…`),
        h("button", { class: "btn btn-sm",
          onclick: () => batchLoopSelected() }, `Loop (${n})…`),
        ...(App.mode === "readwrite" ? [
          h("button", { class: "btn btn-sm",
            title: "Set Vendor and/or Expires on every selected row",
            onclick: () => openBatchEditModal(Array.from(StaticIpSelection.ids)) },
            `Edit (${n})…`),
          h("button", { class: "btn btn-sm danger",
            onclick: () => batchDeleteSelected() }, `Delete (${n})`),
        ] : []),
        h("button", { class: "btn btn-sm",
          onclick: () => StaticIpSelection.clear() }, "Clear"),
      );
      // Sync the master "select all" checkbox. (Per-row checkboxes
      // are already synced at the top of this function.)
      const master = document.getElementById("ip-sel-master");
      const total = document.querySelectorAll('tr[data-ip-id]').length;
      if (master) {
        master.checked = (n > 0 && n === total);
        master.indeterminate = (n > 0 && n < total);
      }
    }
    StaticIpSelection.onChange(_renderSelToolbar);

    // Card with table
    const card = h("div", { class: "card" });
    card.appendChild(h("div", { class: "card-header" },
      h("h2", null, "All static IPs"),
      h("span", { class: "hint", id: "ips-count" }, ""),
    ));
    const body = h("div", { class: "card-body tight", id: "ips-body" });
    card.appendChild(body);
    root.appendChild(card);

    try {
      const resp = await api("GET", "/api/static-ips?sort=" + encodeURIComponent(currentSort));
      // Same navigate-while-awaiting race as the SSH Keys page —
      // null-check both the count span and the body container before
      // mutating, otherwise we throw during a quick page swap.
      const countEl = document.getElementById("ips-count");
      if (!countEl || !document.body.contains(body)) return;
      const ips = resp.static_ips || [];
      countEl.textContent = `${ips.length} IP${ips.length === 1 ? "" : "s"}`;
      if (!ips.length) {
        body.appendChild(h("div", { class: "empty" },
          h("div", { class: "title" }, "No static IPs registered yet"),
          h("div", { class: "sub" }, 'Click "+ Bulk add" to paste a blob and let the AI parser turn it into rows.'),
        ));
      } else {
        body.appendChild(renderStaticIpsTable(ips));
      }
    } catch (err) {
      if (err.status === 401) showLogin();
      else toast("error", "Failed to load static IPs", err.message);
    }
  }

  // ---------------------------------------------------------------------
  // Static IP — URI builder + Auth helpers
  // ---------------------------------------------------------------------

  // Protocols where a password makes sense. The Auth column shows
  // "missing"/"set" only for these; tcp/udp/icmp etc render "—".
  const _IP_PROTO_CREDENTIAL_REQUIRED = new Set([
    "ssh", "socks5", "socks4", "shadowsocks", "ss", "trojan",
    "vmess", "vless", "http", "https",
  ]);

  // Build the canonical "<protocol>://<user>:<pass>@<host>:<port>" URI.
  // Matches the residential/datacenter proxy industry standard
  // (Bright Data, Oxylabs, Smartproxy etc. all serve the same form).
  // The credential segment degrades gracefully:
  //   user + pass   -> "user:pass@"
  //   pass only     -> "pass@"      (trojan / single-secret protocols)
  //   user only     -> "user@"      (ssh)
  //   neither       -> ""           (whitelisted IP auth, or open)
  // Returns null only when port is missing — that's the one thing
  // there's no sensible default for.
  function buildIpUri(r) {
    if (!r || !r.ip || !r.port) return null;
    const proto = (r.protocol || "tcp").toLowerCase();
    const host = r.ip.includes(":") && !r.ip.startsWith("[") ? `[${r.ip}]` : r.ip;
    // Anonymous + whitelist modes deliberately skip the credential
    // segment in the URI, regardless of any stale user/pass left on
    // the row — both auth schemes expect no creds in the connection.
    const skipCreds = r.auth_mode === "anonymous" || r.auth_mode === "whitelist";
    let cred = "";
    if (!skipCreds) {
      if (r.username && r.password) {
        cred = `${encodeURIComponent(r.username)}:${encodeURIComponent(r.password)}@`;
      } else if (r.password) {
        cred = `${encodeURIComponent(r.password)}@`;
      } else if (r.username) {
        cred = `${encodeURIComponent(r.username)}@`;
      }
    }
    return `${proto}://${cred}${host}:${r.port}`;
  }

  // Lightweight ⋯-menu popover anchored to a button. Auto-dismisses on
  // outside click / scroll / Escape. We avoid pulling in a UI library —
  // 60 lines of vanilla beats 50 KB of someone else's framework.
  function openIpRowMenu(anchorBtn, items) {
    const existing = document.getElementById("__ip_menu_popover");
    if (existing) existing.remove();
    const rect = anchorBtn.getBoundingClientRect();
    const pop = h("div", { id: "__ip_menu_popover" });
    pop.style.cssText = [
      "position: fixed",
      `top: ${Math.round(rect.bottom + 4)}px`,
      `right: ${Math.round(window.innerWidth - rect.right)}px`,
      "z-index: 9999",
      "background: var(--surface, #fff)",
      "border: 1px solid var(--border, #ddd)",
      "border-radius: 8px",
      "box-shadow: 0 6px 20px rgba(0,0,0,0.12)",
      "min-width: 180px",
      "padding: 4px",
      "font-size: 13px",
    ].join(";");
    for (const item of items) {
      if (item === "---") {
        pop.appendChild(h("div", { style: "border-top: 1px solid var(--border, #eee); margin: 4px 0;" }));
        continue;
      }
      const row = h("div", null, item.label);
      row.style.cssText = [
        "padding: 6px 10px",
        "border-radius: 4px",
        item.disabled ? "cursor: not-allowed; opacity: 0.5" : "cursor: pointer",
        item.danger ? "color: var(--danger, #c0392b)" : "",
      ].filter(Boolean).join(";");
      if (!item.disabled) {
        row.onmouseenter = () => { row.style.background = "var(--surface-alt, #f5f5f5)"; };
        row.onmouseleave = () => { row.style.background = ""; };
        row.onclick = (ev) => {
          ev.preventDefault(); ev.stopPropagation();
          pop.remove();
          try { item.onClick(); } catch (e) { console.error(e); }
        };
      } else {
        row.title = "Unavailable for this row";
      }
      pop.appendChild(row);
    }
    document.body.appendChild(pop);
    // Vertical overflow guard — when the row anchoring the menu sits
    // near the bottom of the viewport (last row of a long table), the
    // ``top: rect.bottom + 4`` placement above runs the menu off-screen
    // and the operator can't reach the items. Measure the rendered
    // popover and:
    //   * if it doesn't fit below, flip to anchor above the button
    //     (``bottom = window.innerHeight - rect.top + 4``);
    //   * if it fits neither above nor below, pin to the viewport
    //     edge with a max-height + scrollbar so every item stays
    //     reachable.
    const popRect = pop.getBoundingClientRect();
    const vh = window.innerHeight;
    const margin = 8;
    if (rect.bottom + 4 + popRect.height > vh - margin) {
      // Try above.
      if (rect.top - margin >= popRect.height + 4) {
        pop.style.top = "auto";
        pop.style.bottom = Math.round(vh - rect.top + 4) + "px";
      } else {
        // Doesn't fit above either — pin to viewport bottom + cap height.
        pop.style.top = "auto";
        pop.style.bottom = margin + "px";
        pop.style.maxHeight = (vh - margin * 2) + "px";
        pop.style.overflowY = "auto";
      }
    }
    const dismiss = (ev) => {
      if (ev && pop.contains(ev.target)) return;
      pop.remove();
      document.removeEventListener("mousedown", dismiss, true);
      document.removeEventListener("scroll", dismiss, true);
      document.removeEventListener("keydown", onKey, true);
    };
    const onKey = (ev) => { if (ev.key === "Escape") dismiss(); };
    setTimeout(() => {
      document.addEventListener("mousedown", dismiss, true);
      document.addEventListener("scroll", dismiss, true);
      document.addEventListener("keydown", onKey, true);
    }, 0);
  }

  async function copyTextToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) {
      // Fallback: textarea + execCommand for older browsers.
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) {}
      document.body.removeChild(ta);
      return ok;
    }
  }

  // Aggregate type + risk from the cached quality report. Returns
  // ``null`` when the row hasn't had a Quality report run yet, so
  // the row cell can show a "—" hint instead of a stale guess.
  // Sources are 100% keyless: ip-api.com flags, RDAP origin,
  // Spamhaus DNSBL, Scamalytics scrape. (proxycheck.io / AbuseIPDB /
  // IPQualityScore were dropped — paid-tier-or-useless.)
  function _ipQualitySummary(r) {
    const q = (r.static_info || {}).quality;
    if (!q) return null;

    // ----- Risk: max across the keyless sources. Right now that's
    // Scamalytics only, but we keep the sources map so future free
    // sources can plug in without touching the cell renderer.
    const sources = {};
    if (q.scamalytics?.score != null) sources.scamalytics = q.scamalytics.score;
    const scores = Object.values(sources);
    const risk = scores.length ? Math.max(...scores) : null;
    let riskLevel = null;
    if (risk != null) {
      if (risk >= 76) riskLevel = "critical";
      else if (risk >= 51) riskLevel = "high";
      else if (risk >= 26) riskLevel = "medium";
      else riskLevel = "low";
    }

    // ----- Type: priority chain. First match wins.
    // Inputs:
    //   ip-api.com flags       — `mobile`, `hosting`, `proxy`
    //   Scamalytics flags      — `is_anonymizing_vpn`, `is_proxy`, `is_tor`, `is_server`
    //   Spamhaus DNSBL listed  — sets the 'blacklisted' branch
    //   RDAP-vs-geo native     — sets re-announced / native
    const ipa = q.ip_api || {};
    const isAnon = (ipa.proxy === true)
                || (q.scamalytics?.is_anonymizing_vpn === true)
                || (q.scamalytics?.is_proxy === true)
                || (q.scamalytics?.is_tor === true);
    let type = null, typeColor = "muted";
    if (isAnon) { type = "anonymizer"; typeColor = "danger"; }
    else if (q.spamhaus?.listed) { type = "blacklisted"; typeColor = "danger"; }
    else if (q.native?.available === true && q.native.native === false) {
      type = "re-announced"; typeColor = "warn";
    }
    else if (ipa.mobile === true) {
      type = "mobile"; typeColor = "ok";
    }
    else if (ipa.hosting === true || q.scamalytics?.is_server === true) {
      type = "datacenter"; typeColor = "warn";
    }
    else if (q.native?.available === true && q.native.native === true) {
      // Native + non-hosting + non-mobile = a real residential / ISP
      // address from the registered ASN. We can't reliably split
      // residential vs commercial ISP without proxycheck/abuseipdb's
      // usage_type, so we just call it "ISP" — accurate either way.
      type = "ISP"; typeColor = "ok";
    }

    const streaming = q.streaming || [];
    const unlocked = streaming.filter(s => s.status === "available").length;
    const partialUnlock = streaming.filter(s => s.status === "redirect").length;
    // Cache the cached_at timestamp so the modal can show "last run X ago".
    const qualityAt = q.cached_at || null;

    return {
      risk, riskLevel, sources,
      type, typeColor,
      unlocked, totalStreaming: streaming.length, partialUnlock,
      streamingDetail: streaming,
      spamhaus: q.spamhaus?.listed === true,
      qualityAt,
    };
  }

  // Type / Risk / Unlock cells are intentionally kept to a SINGLE
  // visual element each — a colored badge with the headline number.
  // Subordinate signals (Spamhaus, breakdown by source, per-service
  // unlock list) live in tooltips so the row stays a compact one-line
  // shape. The earlier "stack secondary signals under the badge"
  // pattern produced rows that were 3× tall and made the table hard
  // to scan.
  // Type cell renderer. Takes the row's quality-summary AND the row
  // itself, so we can fall back to the gateway provider name when no
  // Quality report has run yet. Gateway rows otherwise show "—" until
  // the operator runs a report, which is unhelpful since we already
  // know it's e.g. Decodo.
  function _ipTypeCell(summary, r) {
    if (!summary) {
      // No Quality report cached yet. For gateway rows we name the
      // provider; for xout_inbound rows we name the source node so
      // operators know it's a self-hosted upstream; for plain static
      // rows we prompt the operator to run a Quality report.
      if (r && r.kind === "gateway") {
        return [h("span", {
          class: "badge info", style: "white-space: nowrap;",
          title: "Gateway provider — run Quality report for the exit IP's classification." },
          r.gateway_provider || "gateway")];
      }
      if (r && r.kind === "xout_inbound") {
        const meta = (r.static_info || {}).xout_inbound || {};
        const label = meta.node_name
          ? `xout · ${meta.node_name}`
          : "xout";
        return [h("span", {
          class: "badge ok", style: "white-space: nowrap;",
          title: meta.inbound_tag
            ? `Imported from xout: ${meta.node_name}/${meta.inbound_tag}`
            : "Imported from a deployed Xout inbound" }, label)];
      }
      return [h("span", { class: "muted",
        style: "font-size: 11.5px;", title: "Run Quality report" }, "—")];
    }
    if (!summary.type) {
      return [h("span", { class: "muted", style: "font-size: 11.5px;" }, "?")];
    }
    // Spamhaus listing surfaces as a small 🚫 prefix on the type badge
    // — the only secondary signal we keep visible at table density,
    // because it materially changes how an operator should treat the
    // IP. Streaming-unlock count moved to its own dedicated column.
    const text = summary.spamhaus ? `🚫 ${summary.type}` : summary.type;
    const tip = summary.spamhaus ? "Listed on Spamhaus DNSBL" : "";
    return [h("span", { class: "badge " + summary.typeColor,
      style: "white-space: nowrap;", title: tip }, text)];
  }

  function _ipRiskCell(summary) {
    if (!summary || summary.risk == null) {
      return [h("span", { class: "muted", style: "font-size: 11.5px;" }, "—")];
    }
    // Tooltip shows the per-source breakdown; cell shows just the
    // headline max score with severity-colored badge. The riskLevel
    // word ("low"/"high") was redundant with the color.
    const tip = "max across sources:\n" + Object.entries(summary.sources)
      .map(([k, v]) => `${k}: ${v}`).join("\n");
    const sev = summary.riskLevel === "critical" ? "danger"
              : summary.riskLevel === "high"     ? "danger"
              : summary.riskLevel === "medium"   ? "warn" : "ok";
    return [h("span", { class: "badge " + sev, title: tip }, `${summary.risk}/100`)];
  }

  // Combined Risk + Unlock cell — both signals come from the IP
  // intelligence test, so we stack them in one column. Top line is
  // risk (color-coded severity); bottom is unlock score.
  function _ipRiskProbeCell(summary) {
    const out = [];
    if (!summary || summary.risk == null) {
      out.push(h("div", { class: "muted", style: "font-size: 11.5px;" }, "—"));
    } else {
      const tip = "max across sources:\n" + Object.entries(summary.sources)
        .map(([k, v]) => `${k}: ${v}`).join("\n");
      const sev = summary.riskLevel === "critical" ? "danger"
                : summary.riskLevel === "high"     ? "danger"
                : summary.riskLevel === "medium"   ? "warn" : "ok";
      out.push(h("div", { style: "line-height: 1.3;" },
        h("span", { class: "badge " + sev, title: tip,
          style: "font-size: 10.5px; padding: 1px 6px;" },
          summary.risk + "/100")));
    }
    if (!summary || summary.totalStreaming === 0) {
      out.push(h("div", { class: "muted",
        style: "font-size: 10.5px; margin-top: 2px;",
        title: "Run Quality report" }, "no unlock"));
    } else {
      const available = summary.unlocked;
      const total = summary.totalStreaming;
      const partial = summary.partialUnlock || 0;
      const score = total ? Math.round(((available + partial * 0.5) / total) * 100) : 0;
      const sev = score >= 75 ? "ok" : score >= 40 ? "warn" : "danger";
      const tip = `${available}/${total} unlocked\n` + (summary.streamingDetail || [])
        .map(s => `${s.service}: ${s.status}`).join("\n");
      out.push(h("div", { style: "margin-top: 2px; line-height: 1.3;" },
        h("span", { class: "badge " + sev, title: tip,
          style: "font-size: 10.5px; padding: 1px 6px;" },
          score + "/100")));
    }
    return out;
  }

  // Expires cell — color-coded relative date.
  //   no expiry         -> muted "—"
  //   already expired   -> danger badge "EXPIRED"
  //   <  7 days         -> danger badge "in Xd"
  //   < 30 days         -> warn   badge "in Xd"
  //   else              -> ok     badge "in Xd" (or absolute date if >1y)
  function _ipExpiresCell(expiresAt) {
    if (!expiresAt) {
      return [h("span", { class: "muted", style: "font-size: 11.5px;",
        title: "Set in Edit → Expires when this lease ends" }, "—")];
    }
    let when;
    try { when = new Date(expiresAt); } catch (_) { when = null; }
    if (!when || isNaN(when.getTime())) {
      return [h("span", { class: "muted", style: "font-size: 11.5px;" }, "?")];
    }
    const now = new Date();
    const diffMs = when.getTime() - now.getTime();
    const diffDays = Math.floor(diffMs / (24 * 3600 * 1000));
    let cls, text, sub = "";
    // Display in UTC to match the date the operator typed into the
    // date picker (backend stores HTML date inputs as UTC midnight).
    // Local-timezone formatting drifts by a day in Western TZs.
    const _abs = `${when.getUTCFullYear()}-${String(when.getUTCMonth()+1).padStart(2,"0")}-${String(when.getUTCDate()).padStart(2,"0")}`;
    if (diffMs < 0) {
      cls = "danger"; text = "EXPIRED";
      sub = Math.abs(diffDays) + "d ago";
    } else if (diffDays < 7) {
      cls = "danger";
      const hrs = Math.floor(diffMs / (3600 * 1000));
      text = diffDays > 0 ? "in " + diffDays + "d" : "in " + hrs + "h";
      sub = _abs;
    } else if (diffDays < 30) {
      cls = "warn"; text = "in " + diffDays + "d"; sub = _abs;
    } else if (diffDays < 365) {
      cls = "ok"; text = "in " + diffDays + "d"; sub = _abs;
    } else {
      cls = "ok"; text = _abs;
    }
    return [
      h("div", null, h("span", { class: "badge " + cls,
        style: "font-size: 10.5px; padding: 1px 6px;",
        title: `Expires ${when.toISOString()}` }, text)),
      sub ? h("div", { class: "muted",
        style: "font-size: 10.5px; margin-top: 2px;" }, sub) : null,
    ].filter(Boolean);
  }

  // Streaming-unlock score: normalized to 0–100. Each "available"
  // service is +1, blocked is +0, redirect is +0.5 (geo workaround
  // sometimes works). The per-service breakdown lives in the tooltip.
  function _ipUnlockCell(summary) {
    if (!summary || summary.totalStreaming === 0) {
      return [h("span", { class: "muted", style: "font-size: 11.5px;",
        title: "Run Quality report" }, "—")];
    }
    const available = summary.unlocked;
    const total = summary.totalStreaming;
    const partial = summary.partialUnlock || 0;
    const score = total ? Math.round(((available + partial * 0.5) / total) * 100) : 0;
    const sev = score >= 75 ? "ok" : score >= 40 ? "warn" : "danger";
    const tip = `${available}/${total} unlocked\n` + (summary.streamingDetail || [])
      .map(s => `${s.service}: ${s.status}`).join("\n");
    return [h("span", { class: "badge " + sev, title: tip }, `${score}/100`)];
  }

  function _ipAuthBadge(r) {
    const proto = (r.protocol || "tcp").toLowerCase();
    // VLESS uses Reality / UUID auth, not user:pass — render a
    // distinct badge so the operator doesn't see "missing" on a
    // perfectly-configured Reality entry.
    if (proto === "vless") {
      const v = (r.static_info || {}).vless || {};
      const ok = v.uuid && v.sni && (v.pubkey || v.public_key);
      return h("span", {
        class: ok ? "badge ok" : "badge warn",
        title: ok
          ? `Reality\nuuid=${v.uuid}\nsni=${v.sni}`
          : "Reality params incomplete — re-import or fix in Edit",
      }, ok ? "Reality" : "Reality (incomplete)");
    }
    if (proto === "vmess" || proto === "trojan") {
      // VMess / Trojan share the "single secret" auth shape; show
      // configured/missing without the user:pass naming.
      return h("span", { class: r.password ? "badge ok" : "badge warn" },
        r.password ? "configured" : "missing");
    }
    if (!_IP_PROTO_CREDENTIAL_REQUIRED.has(proto)) {
      return h("span", { class: "muted", style: "font-size: 11px;" }, "—");
    }
    // auth_mode is the operator's explicit declaration. When set,
    // it overrides the "infer from creds" logic — an anonymous open
    // proxy SHOULD show "anonymous", not "missing", because absence
    // of credentials is by design.
    if (r.auth_mode === "anonymous") return h("span", { class: "badge" }, "anonymous");
    if (r.auth_mode === "whitelist") return h("span", { class: "badge ok" }, "whitelist");
    if (r.username && r.password) return h("span", { class: "badge ok" }, "user:pass");
    if (r.password) return h("span", { class: "badge ok" }, "password");
    if (r.username) return h("span", { class: "badge ok" }, "user");
    return h("span", { class: "badge warn" }, "missing");
  }

  function renderStaticIpsTable(ips) {
    // Reset selection bookkeeping every full render — the row objects
    // get re-created here, so the Set's references must follow.
    StaticIpSelection.rowsById.clear();
    for (const r of ips) StaticIpSelection.rowsById.set(r.id, r);

    const table = h("table", { class: "data" });
    // Master "select all" checkbox in the header.
    const masterCb = h("input", {
      type: "checkbox", id: "ip-sel-master",
      style: "cursor: pointer;",
      onchange: (ev) => {
        const on = ev.currentTarget.checked;
        const allIds = ips.map(r => r.id);
        StaticIpSelection.setAll(allIds, on);
      },
    });
    // Compact 9-column layout. We previously had 13 cols (Port,
    // Protocol, Provider as separate ones, plus stacked sub-lines on
    // Type/Risk/Unlock) — operators called the result "messy". Port
    // is now part of the IP cell, Provider is part of the Country
    // cell, and the quality cells are single-badge each.
    table.appendChild(h("thead", null,
      h("tr", null,
        h("th", { style: "width: 28px;" }, masterCb),
        h("th", null, "IP"),
        h("th", null, "Country"),
        h("th", null, "Auth"),
        h("th", null, "Latency"),
        h("th", { title: "Download (▼) and Upload (▲) Mbps stacked" }, "Bandwidth"),
        h("th", { title: "ISP / network class derived from the quality report" }, "Type"),
        h("th", { title: "Risk score (top, max across fraud sources) and Unlock score (bottom, streaming services that work)" },
          "Risk Probe"),
        h("th", { title: "Lease / subscription expiry — operator-set; color-coded <7d / <30d / ok" }, "Expires"),
        h("th", null, ""),
      ),
    ));
    const tbody = h("tbody");
    for (const r of ips) {
      const liveStatus = StaticIpLoopState.statuses.get(r.id);
      const lastSuccess = liveStatus ? liveStatus.success : r.last_test_success;
      const lastLatency = liveStatus ? liveStatus.latency_ms : r.last_test_latency_ms;
      const lastError = liveStatus ? liveStatus.error : r.last_test_error;
      const lastAt = liveStatus ? liveStatus.at : r.last_test_at;

      // Copy URI moved into the ⋯ menu — operators wanted denser
      // rows and the standalone button took meaningful horizontal
      // space. The menu still has it as a top-tier item.
      const uri = buildIpUri(r);

      const moreBtn = h("button", { class: "btn btn-sm",
        title: "More actions",
        onclick: (ev) => {
          ev.stopPropagation();
          const loopRunning = StaticIpLoopState.isRunning(r.id);
          const items = [];
          // Copy URI sits at the top — most-frequent action.
          items.push({
            label: uri ? "Copy URI" : "Copy URI (no creds)",
            disabled: !uri,
            onClick: async () => {
              if (!uri) {
                toast("error", "No URI", "Add credentials in Edit, then try again.");
                return;
              }
              const ok = await copyTextToClipboard(uri);
              toast(ok ? "success" : "error",
                    ok ? "URI copied" : "Copy failed",
                    uri.length > 60 ? uri.slice(0, 60) + "…" : uri);
            },
          });
          items.push("---");
          // The "Test…" entry is the comprehensive speed-test flow
          // (latency + bandwidth + app-RTT). It opens the modal
          // showing the LAST cached result first so the operator
          // can decide whether to re-run.
          // Unified Test… opens the new checklist modal. The legacy
          // Quality report entry was rolled into it (IP intelligence
          // + Streaming unlock checkboxes), so we drop the separate
          // menu item — operators only see one Test button now.
          items.push({ label: "Test…", onClick: () => openTestModal({type:'one', row: r}) });
          items.push({ label: loopRunning
              ? `Stop loop (${StaticIpLoopState.seconds.get(r.id)}s)`
              : "Start loop…",
            onClick: () => toggleLoop(r) });
          // Probe info menu item was removed — its functionality
          // (geo + light streaming check) is now part of the Test
          // modal's "IP intelligence" + "Streaming unlock" checkboxes,
          // which produce a richer report. Keeping a separate menu
          // entry for it would just be two paths to the same thing.
          items.push({ label: "Details…", onClick: () => openIpDetailModal(r.id) });
          if (App.mode === "readwrite") {
            items.push("---");
            items.push({ label: "Edit", onClick: () =>
              openEditIpModal(r, () => renderStaticIpsView(document.getElementById("view-root"), {})) });
            items.push({ label: "Delete", danger: true, onClick: () => confirmDeleteIp(r) });
          }
          openIpRowMenu(ev.currentTarget, items);
        },
      }, "⋯");

      const actions = h("td", { class: "actions" }, moreBtn);

      const rowCheckbox = h("input", {
        type: "checkbox", value: String(r.id),
        class: "ip-sel-row",
        checked: StaticIpSelection.has(r.id) ? "checked" : null,
        style: "cursor: pointer;",
        onchange: (ev) => {
          StaticIpSelection.set(r.id, ev.currentTarget.checked);
        },
      });

      // Bandwidth cell pulls from the latest cached speedtest in
      // static_info.speedtest if present. Live updates happen via
      // updateRowBandwidth() during/after a speed test action.
      const cachedSpeed = (r.static_info || {}).speedtest || null;
      const summary = _ipQualitySummary(r);

      // Latency cell: single primary badge. The "X ago" hint lives in
      // the badge's title tooltip — keeping the cell to one line was
      // the biggest single readability win in the cleanup. Loop
      // indicator (🔄) appears as a small inline pill next to the
      // badge when a loop is ticking.
      const loopRunning = StaticIpLoopState.isRunning(r.id);
      const latencyBadge = ipResultBadge(lastSuccess, lastLatency, lastError, lastAt);
      if (latencyBadge && lastAt) {
        const existingTitle = latencyBadge.getAttribute("title") || "";
        latencyBadge.setAttribute("title",
          (existingTitle ? existingTitle + "\n" : "") + "Last: " + fmtRelative(lastAt));
      }
      const latencyCellChildren = [latencyBadge];
      if (loopRunning) {
        latencyCellChildren.push(h("span", { class: "ip-loop-indicator",
          style: "font-size: 10.5px; margin-left: 6px; color: var(--accent, #38a169);",
          title: "Loop is ticking" },
          `🔄${StaticIpLoopState.seconds.get(r.id)}s`));
      }

      // IP cell — primary mono line is the operator-relevant IP.
      // For static rows that's ``ip:port`` directly. For gateway rows
      // it's ``exit_ip`` (what the proxy appears as on the internet),
      // with the gateway hostname:port hidden in a tooltip + named
      // by the kind badge below. This matches the operator's mental
      // model: "the row IS the IP I'm leasing, not the gateway box".
      const isGateway = r.kind === "gateway";
      const ipCellChildren = [];
      const headIp = isGateway ? (r.exit_ip || "") : r.ip;
      const headPort = isGateway ? null : r.port;
      const gatewayTip = isGateway
        ? `via ${r.ip}${r.port == null ? "" : ":" + r.port}`
            + (r.gateway_provider ? `\nprovider: ${r.gateway_provider}` : "")
        : null;
      if (isGateway && !r.exit_ip) {
        ipCellChildren.push(h("div", { class: "muted",
          style: "font-size: 11.5px; line-height: 1.25;",
          title: "No exit IP captured — set it in Edit to enable geo / quality.\n" + gatewayTip },
          "(no exit IP)"));
      } else {
        ipCellChildren.push(h("div", { class: "mono",
          style: "font-size: 12.5px; line-height: 1.25;",
          title: gatewayTip || undefined },
          headIp,
          headPort == null ? null
            : h("span", { class: "muted", style: "margin-left: 2px;" }, ":" + headPort)));
      }
      // Tag row: vendor + protocol badges. ``gateway_provider`` is
      // now a UNIVERSAL "vendor" field — applies to every row, so we
      // render the badge whenever it's set, regardless of kind. For
      // gateway rows with no explicit vendor we fall back to "gateway"
      // so it's clear the row routes via an upstream service.
      const tagRow = h("div", { style: "margin-top: 2px;",
        title: gatewayTip || undefined });
      const vendorLabel = r.gateway_provider || (isGateway ? "gateway" : null);
      if (vendorLabel) {
        tagRow.appendChild(h("span", { class: "badge info",
          style: "font-size: 10px; padding: 1px 6px; margin-right: 4px;",
          title: "Vendor / purchased from" },
          vendorLabel));
      }
      tagRow.appendChild(h("span", { class: "badge",
        style: "font-size: 10px; padding: 1px 6px;" }, r.protocol || "tcp"));
      ipCellChildren.push(tagRow);

      // Origin cell — only Country in the table. The Provider name
      // (often long ASN org strings like "Telstra International
      // Limited") got dropped from the row to free horizontal space;
      // it stays on the row's tooltip and in the Edit modal.
      const originCellChildren = [];
      const originTip = r.provider ? `Provider: ${r.provider}` : "";
      if (r.country) {
        originCellChildren.push(h("div", {
          style: "font-size: 12.5px; line-height: 1.25;",
          title: originTip || undefined,
        }, r.country));
      }
      if (!originCellChildren.length) {
        originCellChildren.push(h("span", {
          class: "muted",
          title: originTip || undefined,
        }, "—"));
      }

      const tr = h("tr", { "data-ip": r.id, "data-ip-id": r.id },
        h("td", null, rowCheckbox),
        h("td", { class: "ip-cell" }, ...ipCellChildren),
        h("td", { class: "ip-origin" }, ...originCellChildren),
        h("td", null, _ipAuthBadge(r)),
        h("td", { class: "ip-last-test", style: "white-space: nowrap;" }, ...latencyCellChildren),
        h("td", { class: "ip-bandwidth" }, ..._bandwidthCellContent(cachedSpeed && {...cachedSpeed, protocol: r.protocol})),
        h("td", { class: "ip-type" }, ..._ipTypeCell(summary, r)),
        // Risk + Unlock merged into one column ("Risk Probe"): risk
        // on top, unlock score below. The two are conceptually paired
        // (both come from the IP-intelligence test) so combining
        // saves a column without confusing the operator.
        h("td", { class: "ip-risk-probe" }, ..._ipRiskProbeCell(summary)),
        h("td", { class: "ip-expires" }, ..._ipExpiresCell(r.expires_at)),
        actions,
      );
      tbody.appendChild(tr);
      // Geo / unlock info no longer renders inline — it lives in the
      // Details modal now (less visual noise on the table itself, and
      // the operator clicks Details when they actually want it).
    }
    table.appendChild(tbody);
    const wrap = h("div", { class: "table-wrap" });
    wrap.appendChild(table);
    return wrap;
  }

  // Start/stop the loop timer for one row. Inline DOM update only;
  // never re-renders the whole view (which used to flash the entire
  // table once per tick — visible flicker, lost scroll position,
  // re-fetch storm).
  function toggleLoop(row) {
    if (StaticIpLoopState.isRunning(row.id)) {
      StaticIpLoopState.stop(row.id);
      updateRowLoopButton(row.id);
      return;
    }
    const form = h("form");
    form.appendChild(h("div", { class: "field" },
      h("label", null, "Interval (seconds)"),
      h("input", { id: "loop-interval", class: "input mono", type: "number", min: "1", value: row.loop_test_seconds || 10 }),
    ));
    const footer = h("div", { class: "row" },
      h("button", { type: "button", class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("button", { type: "button", class: "btn btn-primary", onclick: async () => {
        const sec = Math.max(1, parseInt(document.getElementById("loop-interval").value, 10) || 10);
        Modal.close();
        try { await api("PATCH", `/api/static-ips/${row.id}`, { loop_test_seconds: sec }); } catch (_) {}
        _startLoopFor(row.id, sec);
      } }, "Start"),
    );
    Modal.open({ title: `Loop test ${row.ip}`, body: form, footer });
  }

  // Internal helper: kicks the loop using the shared ipTestOnce path
  // so loop ticks, manual tests, and batch tests all update the row
  // identically. Loop tick failures are silent — the cell goes red
  // and the next tick will recover; we only stop the loop on
  // hard errors (e.g. row deleted server-side).
  function _startLoopFor(id, seconds) {
    StaticIpLoopState.start(id, seconds, async (rid) => {
      try {
        await ipTestOnce(rid, "loop");
      } catch (err) {
        if (err && err.status === 404) {
          StaticIpLoopState.stop(rid);
          updateRowLoopButton(rid);
        }
      }
    });
    updateRowLoopButton(id);
  }

  // The per-row Test action runs the FULL speed test (latency +
  // bandwidth + app RTT). Loop ticks still use the lighter
  // ipTestOnce path because a 30s tick is unacceptable for a 10s
  // loop interval. If the operator wants pure connectivity, the
  // Loop button is the right tool.
  async function runSingleTest(id) {
    toast("info", "Testing", "Running speed test (latency + bandwidth)…");
    try {
      const status = await ipSpeedTestOnce(id);
      if (status.ok) {
        const parts = [];
        if (status.latency_ms != null) parts.push(`${status.latency_ms}ms`);
        if (status.loss_pct != null) parts.push(`loss ${status.loss_pct}%`);
        toast("success", "Speed test ok", parts.join(" · "));
      } else if (status.bw_error) {
        // Latency probably ok, bandwidth failed — categorize.
        const e = status.bw_error;
        let summary = "bandwidth failed";
        if (/auth failed/i.test(e)) summary = "auth failed — wrong user/pass";
        else if (/rep=2|not allowed by ruleset/i.test(e))
          summary = "proxy refuses destination";
        else if (/timed out|Timeout/i.test(e)) summary = "timed out";
        else if (/connection refused/i.test(e)) summary = "refused";
        toast("error", "Speed test failed", summary);
      } else {
        toast("error", "Speed test failed", status.error || `id ${id} unreachable`);
      }
    } catch (err) {
      toast("error", "Speed test failed", err.message);
    }
  }

  // ---- Batch operations on selected rows --------------------------------

  // Batch Test → run the full speed test on every selected row in
  // parallel. Bandwidth probes are bounded by a 30s timeout each,
  // so worst-case wall time = ceil(N / workers) × 30s. With 4 workers
  // and 50 rows that's ~6 min — still way better than serial. The
  // operator can leave the page during the run; cells update as
  // workers finish.
  async function batchTestSelected() {
    const ids = Array.from(StaticIpSelection.ids).filter(id => _ipRowEl(id) != null);
    for (const id of Array.from(StaticIpSelection.ids)) {
      if (!_ipRowEl(id)) StaticIpSelection.set(id, false);
    }
    if (!ids.length) return;
    toast("info", "Testing", `Speed-testing ${ids.length} row${ids.length === 1 ? "" : "s"}…`);
    // Lower concurrency than for plain TCP-only because each worker
    // holds a proxy connection open for ~10–30s. 4 is a good balance
    // — more would saturate flaky residential proxies.
    const limit = 4;
    let i = 0;
    let ok = 0, fail = 0, skipped = 0;
    async function worker() {
      while (i < ids.length) {
        const idx = i++;
        try {
          const status = await ipSpeedTestOnce(ids[idx]);
          // ``status.ok`` reflects backend's all-pass criterion;
          // ``status.success`` is the more permissive "latency works"
          // flag. We count fully ok as ok, anything else as fail —
          // that's the metric the operator cares about for batch
          // viability assessment.
          if (status.ok) ok++; else fail++;
        } catch (err) {
          if (err && err.status === 404) skipped++;
          else fail++;
        }
      }
    }
    await Promise.all(Array.from({length: Math.min(limit, ids.length)}, worker));
    let detail = `${ok} ok · ${fail} failed`;
    if (skipped) detail += ` · ${skipped} skipped (already deleted)`;
    toast(fail === 0 ? "success" : (ok === 0 ? "error" : "info"),
          "Batch speed test complete", detail);
  }

  async function batchLoopSelected() {
    // Filter out IDs whose row has already been removed from the DOM
    // (most often after a partial bulk delete). Same drop-stale logic
    // as batchTestSelected so Loop doesn't fire ticks against rows
    // the server has already forgotten about.
    const ids = Array.from(StaticIpSelection.ids).filter(id => _ipRowEl(id) != null);
    for (const id of Array.from(StaticIpSelection.ids)) {
      if (!_ipRowEl(id)) StaticIpSelection.set(id, false);
    }
    if (!ids.length) return;
    // If any selected row is already looping, the button stops them
    // all. Otherwise prompt once for the interval.
    const anyRunning = ids.some(id => StaticIpLoopState.isRunning(id));
    if (anyRunning) {
      for (const id of ids) {
        if (StaticIpLoopState.isRunning(id)) {
          StaticIpLoopState.stop(id);
          updateRowLoopButton(id);
        }
      }
      toast("success", "Loop stopped", `${ids.length} row${ids.length === 1 ? "" : "s"}`);
      return;
    }
    const form = h("form");
    form.appendChild(h("p", { class: "muted" },
      `Start a connectivity loop on ${ids.length} selected row${ids.length === 1 ? "" : "s"}.`));
    form.appendChild(h("div", { class: "field" },
      h("label", null, "Interval (seconds)"),
      h("input", { id: "batch-loop-interval", class: "input mono",
                   type: "number", min: "1", value: "10" }),
    ));
    const footer = h("div", { class: "row" },
      h("button", { type: "button", class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("button", { type: "button", class: "btn btn-primary", onclick: async () => {
        const sec = Math.max(1, parseInt(document.getElementById("batch-loop-interval").value, 10) || 10);
        Modal.close();
        // Persist the interval choice on every selected row in
        // parallel so a future single-row toggle picks the same
        // default. Failures here are silent — the loop runs anyway.
        Promise.all(ids.map(id =>
          api("PATCH", `/api/static-ips/${id}`, { loop_test_seconds: sec }).catch(() => {}))
        );
        for (const id of ids) _startLoopFor(id, sec);
        toast("success", "Loop started", `${ids.length} row${ids.length === 1 ? "" : "s"} every ${sec}s`);
      } }, `Start (${ids.length})`),
    );
    Modal.open({ title: `Loop ${ids.length} selected`, body: form, footer });
  }

  async function batchDeleteSelected() {
    const ids = Array.from(StaticIpSelection.ids);
    if (!ids.length) return;
    const body = h("div", null,
      h("p", null, `Delete ${ids.length} static IP${ids.length === 1 ? "" : "s"}?`),
      h("p", { class: "muted", style: "font-size: 12.5px;" },
        "Test history for these rows will be lost. This cannot be undone."),
    );
    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("button", { class: "btn btn-danger", onclick: async () => {
        Modal.close();
        const limit = 8;
        let i = 0, ok = 0, fail = 0, alreadyGone = 0;
        async function worker() {
          while (i < ids.length) {
            const id = ids[i++];
            try {
              await api("DELETE", `/api/static-ips/${id}`);
              removeRowFromDom(id);
              ok++;
            } catch (err) {
              if (err && err.status === 404) {
                // Row already gone server-side — clean up the local
                // bookkeeping anyway so subsequent Test/Loop on the
                // same selection don't fire requests against this id.
                removeRowFromDom(id);
                alreadyGone++;
              } else {
                fail++;
              }
            }
          }
        }
        await Promise.all(Array.from({length: Math.min(limit, ids.length)}, worker));
        let detail = `${ok} deleted`;
        if (alreadyGone) detail += ` · ${alreadyGone} already gone`;
        if (fail) detail += ` · ${fail} failed`;
        toast(fail === 0 ? "success" : (ok === 0 ? "error" : "info"),
              "Delete complete", detail);
      } }, `Delete ${ids.length}`),
    );
    Modal.open({ title: "Delete selected", body, footer });
  }

  // Batch edit modal — set Vendor and/or Expires on N selected rows
  // at once. The form has a checkbox per field so the operator can
  // pick exactly which attributes to overwrite. Unchecked fields are
  // left alone on every row (PATCH only sends the keys the operator
  // ticked). Confirmed before applying since this clobbers values.
  function openBatchEditModal(ids) {
    if (!ids || !ids.length) return;
    // Sample any selected row to seed sensible defaults — usually the
    // operator wants to set a NEW vendor / expiry, not see the old
    // one, but having defaults pre-filled is harmless.
    const sample = StaticIpSelection.rowsById.get(ids[0]) || {};

    const body = h("div", null);
    body.appendChild(h("p", { class: "muted", style: "margin: 0 0 12px;" },
      `Update ${ids.length} selected row${ids.length === 1 ? "" : "s"}. `
      + "Tick the field(s) you want to overwrite — unticked fields stay as-is."));

    // ----- Vendor row
    const vendorChk = h("input", { type: "checkbox", id: "_be_vendor",
      style: "margin-right: 6px;" });
    const vendorInput = h("input", { class: "input mono",
      placeholder: "decodo / proxy-cheap / personal-server / …",
      value: sample.gateway_provider || "" });
    body.appendChild(h("div", { class: "field", style: "margin-bottom: 12px;" },
      h("label", { for: "_be_vendor",
        style: "display: flex; align-items: center; cursor: pointer;" },
        vendorChk,
        h("span", null, "Vendor / purchased from")),
      vendorInput,
    ));

    // ----- Expires row
    const expChk = h("input", { type: "checkbox", id: "_be_exp",
      style: "margin-right: 6px;" });
    const expInput = h("input", { class: "input", type: "date",
      value: sample.expires_at ? (() => {
        try {
          const d = new Date(sample.expires_at);
          if (isNaN(d.getTime())) return "";
          const pad = n => String(n).padStart(2, "0");
          // UTC components — backend stored "yyyy-mm-dd" as UTC midnight,
          // displaying in local TZ would shift the date by one in
          // negative-offset zones (e.g. Pacific UTC-8).
          return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
        } catch (_) { return ""; }
      })() : "" });
    body.appendChild(h("div", { class: "field", style: "margin-bottom: 12px;" },
      h("label", { for: "_be_exp",
        style: "display: flex; align-items: center; cursor: pointer;" },
        expChk,
        h("span", null, "Expires (date-only)")),
      h("div", { class: "row", style: "gap: 8px;" },
        expInput,
        h("button", { class: "btn btn-sm", type: "button",
          title: "Clear the expiry on every selected row",
          onclick: () => { expInput.value = ""; expChk.checked = true; } },
          "Clear"),
      ),
    ));

    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("button", { class: "btn btn-primary", onclick: async () => {
        const payload = {};
        if (vendorChk.checked) {
          payload.gateway_provider = vendorInput.value.trim() || null;
        }
        if (expChk.checked) {
          payload.expires_at = expInput.value.trim() || null;
        }
        if (!Object.keys(payload).length) {
          toast("error", "Nothing to update",
                "Tick at least one field's checkbox.");
          return;
        }
        Modal.close();
        const limit = 8;
        let i = 0, ok = 0, fail = 0;
        async function worker() {
          while (i < ids.length) {
            const id = ids[i++];
            try {
              const fresh = await api("PATCH", `/api/static-ips/${id}`, payload);
              StaticIpSelection.rowsById.set(id, fresh);
              ok++;
            } catch (_) { fail++; }
          }
        }
        await Promise.all(Array.from({length: Math.min(limit, ids.length)}, worker));
        const tone = fail === 0 ? "success" : (ok === 0 ? "error" : "info");
        toast(tone, "Batch edit complete",
              `${ok} updated${fail ? " · " + fail + " failed" : ""}`);
        // Re-render to pick up new vendor badges + expires cells.
        renderStaticIpsView(document.getElementById("view-root"), {});
      } }, `Apply to ${ids.length}`),
    );
    Modal.open({ title: `Edit ${ids.length} selected`, body, footer });
  }

  async function runProbe(id) {

    try {
      const r = await api("POST", `/api/static-ips/${id}/probe`);
      toast("success", "Probe complete", r.ip);
      // Show summary in modal
      openStaticInfoModal(r.ip, r.static_info);
      renderStaticIpsView(document.getElementById("view-root"), {});
    } catch (err) {
