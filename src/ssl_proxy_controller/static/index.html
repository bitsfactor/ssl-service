  // ---------- Unified Test modal -----------------------------------
  // One entry point for connectivity / bandwidth / app-RTT / IP
  // intelligence / streaming-unlock — operators check the boxes and
  // hit Run. Replaces the older runSpeedTest + runQualityReport
  // modals; the page-level "Test all" and selection-toolbar
  // "Test (N)" both go through this same modal.
  //
  // ``target`` shapes:
  //   { type: "one",      row }       — one row (full menu entry)
  //   { type: "all" }                 — every row in the catalog
  //   { type: "selected", ids: [...] }— current selection
  //
  // The modal shows the last cached results (only for one-row mode)
  // above the checklist so operators don't have to think "is this
  // the run modal or the view modal" — it's both.
  function openTestModal(target) {
    let title, subjectLine, ids, singleRow;
    if (target.type === "one") {
      singleRow = target.row;
      ids = [singleRow.id];
      title = `Test · ${singleRow.ip}`;
      subjectLine = singleRow.ip + (singleRow.port ? ":" + singleRow.port : "")
                  + " · " + (singleRow.protocol || "tcp");
    } else if (target.type === "all") {
      const allIds = Array.from(StaticIpSelection.rowsById.keys());
      ids = allIds;
      title = `Test all (${allIds.length} IPs)`;
      subjectLine = `Will run the selected tests against every row in the registry.`;
    } else {
      ids = (target.ids || []).slice();
      title = `Test ${ids.length} selected`;
      subjectLine = `${ids.length} row${ids.length === 1 ? "" : "s"} selected.`;
    }

    // Track checklist state. Defaults: connectivity + IP intel + streaming
    // ON; bandwidth + app-RTT OFF (slow). These get toggled by the
    // operator and read on Run.
    const state = {
      connectivity: true,
      bandwidth: false,
      app_rtt: false,
      ip_intel: true,
      streaming: true,
      running: false,
      results: null,
    };

    function _renderModal() {
      const body = h("div", null);

      // ----- Subject + cached summary (one-row only)
      body.appendChild(h("div", { class: "muted",
        style: "margin-bottom: 12px; font-size: 12.5px;" }, subjectLine));

      if (singleRow && !state.running) {
        const cached = (singleRow.static_info || {});
        const sp = cached.speedtest || {};
        const q = cached.quality || {};
        const summary = _ipQualitySummary(singleRow);
        const lines = [];
        if (sp.latency && sp.latency.p50_ms != null) {
          const at = sp.cached_at ? " · " + fmtRelative(sp.cached_at) : "";
          lines.push("Latency: " + _fmtLatency(sp.latency.p50_ms) + at);
        }
        if (sp.bandwidth_down || sp.bandwidth_up) {
          const dn = sp.bandwidth_down && sp.bandwidth_down.mbps;
          const up = sp.bandwidth_up && sp.bandwidth_up.mbps;
          lines.push("Bandwidth: ▼" + (dn != null ? dn : "—")
                                  + " ▲" + (up != null ? up : "—") + " Mbps");
        }
        if (sp.app_rtt && sp.app_rtt.rtt_ms != null) {
          lines.push("App-RTT: " + sp.app_rtt.rtt_ms + " ms"
                  + (sp.app_rtt.visible_ip ? " · seen as " + sp.app_rtt.visible_ip : ""));
        }
        if (summary) {
          const t = summary.type ? "Type: " + summary.type : null;
          const r = summary.risk != null ? "Risk: " + summary.risk + "/100" : null;
          const u = summary.totalStreaming
            ? "Unlock: " + summary.unlocked + "/" + summary.totalStreaming : null;
          const parts = [t, r, u].filter(Boolean);
          if (parts.length) lines.push(parts.join("  ·  "));
        }
        if (lines.length) {
          const sumBox = h("div", {
            style: "background: var(--surface-alt, #f5f5f5); padding: 10px 12px; "
                 + "border-radius: 6px; margin-bottom: 12px; font-size: 12px;",
          });
          sumBox.appendChild(h("div", { class: "muted",
            style: "font-size: 10.5px; margin-bottom: 4px; text-transform: uppercase;" },
            "Last results"));
          for (const l of lines) sumBox.appendChild(h("div", { class: "mono",
            style: "line-height: 1.6;" }, l));
          body.appendChild(sumBox);
        } else {
          body.appendChild(h("div", { class: "muted",
            style: "padding: 8px 12px; margin-bottom: 12px; font-size: 12px;" },
            "No cached results yet — pick the tests below and click Run."));
        }
      }

      if (state.running) {
        const progress = state.results || {};
        body.appendChild(h("div", { style: "padding: 28px; text-align: center;" },
          h("div", { class: "spinner", style: "margin: 0 auto 12px;" }),
          h("div", null, "Running tests… "
            + (progress.done != null
                ? `${progress.done}/${progress.total} complete`
                : "")),
          h("div", { class: "muted", style: "font-size: 12px; margin-top: 6px;" },
            "Cancel-safe: closing this modal won't stop in-flight requests, "
            + "but you'll have to wait for them to finish in the background.")));
      } else {
        // ----- Checklist
        const chkBox = h("div", { style: "margin-bottom: 12px;" });
        chkBox.appendChild(h("div", { class: "muted",
          style: "font-size: 10.5px; margin-bottom: 8px; text-transform: uppercase;" },
          "Run tests"));
        function _row(key, label, hint, cost) {
          const cb = h("input", { type: "checkbox",
            checked: state[key] ? "checked" : null,
            id: "_test_" + key,
            style: "margin-right: 8px; cursor: pointer;",
            onchange: (ev) => {
              state[key] = ev.currentTarget.checked;
              // Streaming is grouped under IP intel — if IP intel
              // turns off, streaming follows. Reverse: if streaming
              // turns on, IP intel follows (need it for the request).
              if (key === "ip_intel" && !state.ip_intel) state.streaming = false;
              if (key === "streaming" && state.streaming) state.ip_intel = true;
              _renderModal();
            },
          });
          const lbl = h("label", {
            for: "_test_" + key,
            style: "display: flex; align-items: center; padding: 6px 0; cursor: pointer;",
          }, cb,
            h("span", null,
              h("span", { style: "font-weight: 500;" }, label),
              h("span", { class: "muted", style: "margin-left: 8px; font-size: 11.5px;" },
                hint),
              h("span", { class: "muted", style: "margin-left: 8px; font-size: 10.5px;" },
                "(" + cost + ")")));
          chkBox.appendChild(lbl);
        }
        _row("connectivity", "Connectivity",      "TCP latency + jitter + loss",       "~1s");
        _row("bandwidth",    "Bandwidth",          "down + up via the proxy",            "~25s");
        _row("app_rtt",      "App-layer RTT",      "round-trip via Cloudflare",          "~3s");
        _row("ip_intel",     "Risk probe (IP intelligence)",    "geo · ASN · RDAP origin · Spamhaus DNSBL · Scamalytics fraud score", "~5s");
        _row("streaming",    "Streaming unlock",   "16 services from admin host",        "~6s");
        body.appendChild(chkBox);

        // ----- Estimated wall time
        const perIp = (state.connectivity ? 1 : 0)
                    + (state.bandwidth ? 25 : 0)
                    + (state.app_rtt ? 3 : 0)
                    + (state.ip_intel ? 5 : 0)
                    + (state.streaming ? 6 : 0);
        const concurrency = (state.bandwidth || state.app_rtt) ? 2 : 4;
        const est = ids.length === 1
          ? perIp
          : Math.ceil(ids.length / concurrency) * perIp;
        if (perIp === 0) {
          body.appendChild(h("div", { class: "muted",
            style: "font-size: 12px; padding: 6px 0;" },
            "Pick at least one test."));
        } else {
          body.appendChild(h("div", { class: "muted",
            style: "font-size: 12px; padding: 6px 0;" },
            "Estimated wall time: ~" + est + "s"
            + (ids.length > 1 ? ` (concurrency ${concurrency})` : "")));
        }
      }

      // ----- Footer
      const runBtn = h("button", {
        class: "btn btn-primary",
        disabled: state.running ? "true" : null,
        onclick: () => _runSelectedTests(),
      }, state.running ? "Running…" : "Run selected");
      const footer = h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
        runBtn);

      Modal.open({ title, body, footer, size: "wide" });
    }

    async function _runSelectedTests() {
      // Validate at least one test is selected.
      if (!(state.connectivity || state.bandwidth || state.app_rtt
            || state.ip_intel || state.streaming)) {
        toast("error", "Pick at least one test", "");
        return;
      }
      state.running = true;
      state.results = { done: 0, total: ids.length, ok: 0, fail: 0 };
      _renderModal();
      const concurrency = (state.bandwidth || state.app_rtt) ? 2 : 4;
      let cursor = 0;
      async function _worker() {
        while (cursor < ids.length) {
          const id = ids[cursor++];
          try {
            await _runTestsForId(id, state);
            state.results.ok++;
          } catch (err) {
            state.results.fail++;
            console.error("test failed for id=" + id, err);
          }
          state.results.done++;
          _renderModal();
        }
      }
      await Promise.all(
        Array.from({length: Math.min(concurrency, ids.length)}, _worker));

      // Refresh row cells in-table and the row cache.
      for (const id of ids) {
        try {
          const fresh = await api("GET", `/api/static-ips/${id}`);
          StaticIpSelection.rowsById.set(id, fresh);
          _refreshIpQualityCells(fresh);
          // Also refresh latency + bandwidth cells since speedtest
          // may have been part of the run.
          const cs = (fresh.static_info || {}).speedtest;
          if (cs) {
            const lat = cs.latency || {};
            if (lat.p50_ms != null) {
              updateRowLastTest(id, {
                success: lat.ok > 0,
                latency_ms: lat.p50_ms,
                error: lat.error,
                at: cs.cached_at || new Date().toISOString(),
              });
            }
            updateRowBandwidth(id, {...cs, protocol: fresh.protocol});
          }
        } catch (_) { /* ignore */ }
      }

      // Final summary
      const r = state.results;
      const tone = r.fail === 0 ? "success" : (r.ok === 0 ? "error" : "info");
      toast(tone, "Tests complete", `${r.ok} ok · ${r.fail} failed`);
      state.running = false;
      _renderModal();
    }

    _renderModal();
  }

  // Per-id orchestrator: bundles selected checkboxes into 1-2 backend
  // calls (speedtest + quality, depending on what's checked).
  async function _runTestsForId(id, opts) {
    const tasks = [];
    if (opts.connectivity || opts.bandwidth || opts.app_rtt) {
      tasks.push(api("POST", `/api/static-ips/${id}/speedtest`, {
        include_latency: !!opts.connectivity,
        include_bandwidth: !!opts.bandwidth,
        include_app_rtt: !!opts.app_rtt,
      }));
    }
    if (opts.ip_intel) {
      tasks.push(api("POST", `/api/static-ips/${id}/quality`, {
        include_streaming: !!opts.streaming,
      }));
    }
    return Promise.all(tasks);
  }

  // ---------- Legacy single-purpose modals (kept for back-compat) -----
  // Speed test modal — multi-component (TCP latency, app-layer RTT,
  // download Mbps, upload Mbps). Click on "Test…" in the row menu
  // opens this modal pre-populated with the LAST cached result (no
  // automatic re-run). The operator clicks "Run test" inside the
  // modal when they actually want a fresh measurement. The previous
  // behavior — auto-run on every menu click — was a 30s surprise on
  // every accidental click; this keeps the table snappy and gives
  // the operator explicit control.
  async function runSpeedTest(id) {
    const row = StaticIpSelection.rowsById.get(id);
    if (!row) {
      toast("error", "IP not found", `id=${id}`);
      return;
    }
    _renderSpeedTestModal(row, { running: false });
  }

  function _renderSpeedTestModal(row, state) {
    state = state || {};
    const cached = (row.static_info || {}).speedtest || null;
    const result = state.freshResult || cached;
    const hasResult = result != null;

    const body = h("div", null);
    if (state.running) {
      body.appendChild(h("div", { style: "padding: 28px; text-align: center; color: var(--text-dim);" },
        h("div", { class: "spinner", style: "margin: 0 auto 12px;" }),
        "Running speed test… can take 10–30 seconds for slow proxies."));
    } else if (!hasResult) {
      body.appendChild(h("div", { class: "muted", style: "padding: 24px; text-align: center;" },
        h("div", { style: "margin-bottom: 6px;" }, "No previous test result for this IP."),
        h("div", { style: "font-size: 12px;" },
          "Click ‘Run test’ below to measure TCP latency, bandwidth (down + up), and app-layer RTT.")));
    } else {
      body.appendChild(_speedTestBodyContent({ ip: row.ip, result }));
      if (state.freshResult) {
        body.insertBefore(h("div", {
          style: "padding: 6px 10px; margin-bottom: 10px; "
               + "background: rgba(56,161,105,0.08); border-left: 3px solid var(--accent, #38a169); "
               + "font-size: 12px;",
        }, "Fresh result just measured."), body.firstChild);
      } else if (result.cached_at) {
        body.insertBefore(h("div", {
          class: "muted", style: "font-size: 12px; margin-bottom: 8px;",
        }, "Last measured ", fmtRelative(result.cached_at),
          h("span", { style: "margin: 0 6px;" }, "·"),
          "Click ‘Re-run test’ for a fresh measurement."), body.firstChild);
      }
    }

    const runBtn = h("button", {
      class: "btn btn-primary",
      disabled: state.running ? "true" : null,
      onclick: () => _runSpeedTestNow(row),
    }, state.running ? "Running…" : (hasResult ? "Re-run test" : "Run test"));

    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
      runBtn,
    );

    Modal.open({ title: `Test · ${row.ip}`, body, footer, size: "wide" });
  }

  async function _runSpeedTestNow(row) {
    _renderSpeedTestModal(row, { running: true });
    try {
      const r = await api("POST", `/api/static-ips/${row.id}/speedtest`);
      // Update row in-table so the latency/bandwidth cells reflect
      // the fresh measurement immediately — no full re-render.
      const lat = r.result && r.result.latency;
      if (lat && lat.p50_ms != null) {
        updateRowLastTest(row.id, {
          success: lat.ok > 0,
          latency_ms: lat.p50_ms,
          error: lat.error,
          at: new Date().toISOString(),
        });
      }
      updateRowBandwidth(row.id, r.result || null);
      // Update the cached snapshot on the local row object so the
      // next time the operator opens the modal they see this result.
      row.static_info = row.static_info || {};
      row.static_info.speedtest = r.result;

      _renderSpeedTestModal(row, { running: false, freshResult: r.result });

      // Toast summary — honest about partial successes.
      const result = r.result || {};
      const bwErr = (result.bandwidth_down && result.bandwidth_down.error)
                 || (result.bandwidth_up && result.bandwidth_up.error)
                 || (result.app_rtt && result.app_rtt.error);
      if (result.ok) {
        const bd = result.bandwidth_down && result.bandwidth_down.mbps;
        const bu = result.bandwidth_up && result.bandwidth_up.mbps;
        const parts = [];
        if (lat && lat.p50_ms != null) parts.push(`p50 ${lat.p50_ms}ms`);
        if (bd != null) parts.push(`▼ ${bd} Mbps`);
        if (bu != null) parts.push(`▲ ${bu} Mbps`);
        toast("success", "Speed test ok", parts.join(" · "));
      } else if (bwErr) {
        let summary = "bandwidth failed";
        if (/auth failed/i.test(bwErr)) summary = "auth failed — wrong user/pass";
        else if (/rep=2|not allowed by ruleset/i.test(bwErr))
          summary = "proxy refuses destination — provider ACL";
        else if (/rep=4|host unreachable/i.test(bwErr)) summary = "destination unreachable via proxy";
        else if (/timed out|Timeout/i.test(bwErr)) summary = "timed out";
        else if (/connection refused/i.test(bwErr)) summary = "connection refused";
        toast("error", "Speed test failed", summary);
      } else {
        toast("error", "Speed test failed",
              (lat && lat.error) ? lat.error : "could not even reach the proxy");
      }
    } catch (err) {
      _renderSpeedTestModal(row, { running: false });
      toast("error", "Speed test failed", err.message);
    }
  }

  // Module-scope 2-column key/value grid. Used by the Details modal,
  // Speed-test renderer, and Risk-probe renderer for a consistent
  // look. Each pair is `[label, value]`; ``value`` may be a string, a
  // number, a DOM node, null, or undefined (renders as muted "—").
  function _detailKvGrid(pairs, opts) {
    opts = opts || {};
    const cols = opts.cols || 2;
    const grid = h("div", {
      style: "display: grid; "
           + "grid-template-columns: repeat(" + cols + ", 1fr); "
           + "gap: 4px 24px; font-size: 12.5px;",
    });
    for (const [label, val, valOpts] of pairs) {
      const row = h("div", {
        style: "display: flex; align-items: baseline; gap: 8px; "
             + "min-width: 0; padding: 4px 0; "
             + "border-bottom: 1px dashed var(--border, #edf2f7);",
      });
      row.appendChild(h("span", { class: "muted",
        style: "font-size: 11px; flex-shrink: 0; min-width: 90px; "
             + "text-transform: uppercase; letter-spacing: 0.02em;" },
        label));
      const wrap = (valOpts && valOpts.wrap) ? "normal" : "nowrap";
      const breakAll = (valOpts && valOpts.breakAll) ? "word-break: break-all;" : "";
      const valEl = h("span", { style: "flex: 1; min-width: 0; "
        + "overflow: hidden; text-overflow: ellipsis; white-space: " + wrap + ";"
        + breakAll });
      if (val == null || val === "") {
        valEl.appendChild(h("span", { class: "muted" }, "—"));
      } else if (typeof val === "string" || typeof val === "number") {
        if (valOpts && valOpts.mono) {
          valEl.appendChild(h("span", { class: "mono" }, String(val)));
        } else {
          valEl.textContent = String(val);
        }
      } else {
        valEl.appendChild(val);
      }
      row.appendChild(valEl);
      grid.appendChild(row);
    }
    return grid;
  }

  // Stat tile — large value above small label. Used as a row of
  // headline metrics at the top of the Speed-test card.
  function _statTile(label, value, opts) {
    opts = opts || {};
    const tone = opts.tone || "default";
    const valColor = tone === "danger" ? "var(--danger, #c53030)"
                  : tone === "warn"   ? "var(--warning, #c2410c)"
                  : tone === "ok"     ? "var(--success, #2f855a)"
                  : "var(--text)";
    const bg = tone === "danger" ? "rgba(220, 38, 38, 0.06)"
             : tone === "warn"   ? "rgba(217, 119, 6, 0.08)"
             : tone === "ok"     ? "rgba(56, 161, 105, 0.06)"
             : "var(--surface-alt, #f7fafc)";
    return h("div", {
      title: opts.title || "",
      style: "padding: 10px 12px; border-radius: 6px; "
           + "background: " + bg + "; "
           + "border-left: 3px solid " + valColor + "; "
           + "min-width: 0;",
    },
      h("div", { class: "mono",
        style: "font-size: 16px; font-weight: 700; color: " + valColor + "; "
             + "line-height: 1.2; overflow: hidden; "
             + "text-overflow: ellipsis; white-space: nowrap;" },
        value == null || value === "" ? "—" : value),
      h("div", { class: "muted",
        style: "font-size: 10.5px; margin-top: 2px; "
             + "text-transform: uppercase; letter-spacing: 0.03em;" },
        label));
  }

  // Pure renderer: takes a payload-shaped object {ip, result} and
  // returns a DOM node with the speed-test result laid out as a row
  // of headline stat tiles + a 2-column kvGrid for everything else.
  // Used by the Test modal, the Details modal's Speed-test card,
  // and (in the future) historical-comparison views.
  function _speedTestBodyContent(payload) {
    const r = payload.result || {};
    const lat = r.latency || {};
    const down = r.bandwidth_down;
    const up = r.bandwidth_up;
    const app = r.app_rtt;

    const body = h("div", null);
    body.appendChild(h("div", { class: "muted",
      style: "margin-bottom: 10px; font-size: 11.5px;" },
      `${payload.ip}${r.port ? ":" + r.port : ""} · ${r.protocol || "?"} · `,
      h("strong", null, (r.wall_time_seconds || 0) + "s"), " elapsed",
    ));

    // ---- Headline stat tiles row ----
    // 4 tiles: latency p50, ok / total samples, download, upload.
    // Down/up in their own tile each = quick at-a-glance throughput.
    const lossOk = lat.loss_pct == null ? null : (lat.loss_pct === 0);
    const tiles = h("div", {
      style: "display: grid; grid-template-columns: repeat(4, 1fr); "
           + "gap: 8px; margin-bottom: 12px;",
    });
    tiles.appendChild(_statTile("p50 latency",
      lat.p50_ms == null ? null : lat.p50_ms + " ms",
      { tone: lat.p50_ms == null ? "default"
            : lat.p50_ms < 50 ? "ok"
            : lat.p50_ms < 200 ? "warn" : "danger" }));
    tiles.appendChild(_statTile("samples",
      lat.samples == null ? null : (lat.ok || 0) + "/" + lat.samples,
      { tone: lossOk == null ? "default" : (lossOk ? "ok" : "danger"),
        title: lat.loss_pct == null ? "" : ("loss " + lat.loss_pct + "%") }));
    const dnText = (down && down.mbps != null)
      ? down.mbps + " Mbps" : (down && down.error ? "fail" : null);
    tiles.appendChild(_statTile("download (▼)",
      dnText,
      { tone: !down ? "default"
            : down.error ? "danger"
            : down.mbps == null ? "default"
            : down.mbps >= 10 ? "ok"
            : down.mbps >= 2 ? "warn" : "danger",
        title: down && down.error ? down.error : "" }));
    const upText = (up && up.mbps != null)
      ? up.mbps + " Mbps" : (up && up.error ? "fail" : null);
    tiles.appendChild(_statTile("upload (▲)",
      upText,
      { tone: !up ? "default"
            : up.error ? "danger"
            : up.mbps == null ? "default"
            : up.mbps >= 5 ? "ok"
            : up.mbps >= 1 ? "warn" : "danger",
        title: up && up.error ? up.error : "" }));
    body.appendChild(tiles);

    // ---- Latency detail (kvGrid) ----
    body.appendChild(h("div", { class: "muted",
      style: "font-size: 10.5px; margin: 2px 0 6px; "
           + "text-transform: uppercase; letter-spacing: 0.04em; "
           + "font-weight: 600;" }, "TCP latency detail"));
    body.appendChild(_detailKvGrid([
      ["Loss",     lat.loss_pct == null ? null : lat.loss_pct + "%", {mono: true}],
      ["p90",      lat.p90_ms == null ? null : lat.p90_ms + " ms", {mono: true}],
      ["Jitter",   lat.jitter_ms == null ? null : lat.jitter_ms + " ms", {mono: true}],
      ["Min · Max",
        (lat.min_ms == null ? "—" : lat.min_ms + "ms")
        + "  ·  "
        + (lat.max_ms == null ? "—" : lat.max_ms + "ms"),
        {mono: true}],
    ]));

    // ---- Bandwidth + app-RTT detail (kvGrid) ----
    if (down || up || app) {
      body.appendChild(h("div", { class: "muted",
        style: "font-size: 10.5px; margin: 14px 0 6px; "
             + "text-transform: uppercase; letter-spacing: 0.04em; "
             + "font-weight: 600;" }, "Bandwidth via proxy"));
      const bwPairs = [];
      function _bwLine(item) {
        if (!item) return h("span", { class: "muted" }, "(not tested)");
        if (item.error) return h("span", { class: "muted mono",
          style: "font-size: 11.5px;",
          title: item.error },
          item.error.length > 40 ? item.error.slice(0, 40) + "…" : item.error);
        const txt = h("span", null,
          h("span", { class: "mono" },
            item.mbps == null ? "—" : item.mbps + " Mbps"),
          item.bytes ? h("span", { class: "muted",
            style: "margin-left: 8px; font-size: 11px;" },
            `${(item.bytes / 1024 / 1024).toFixed(1)} MiB in ${item.seconds}s`) : null);
        return txt;
      }
      bwPairs.push(["Download", _bwLine(down)]);
      bwPairs.push(["Upload",   _bwLine(up)]);
      if (app) {
        if (app.error) {
          bwPairs.push(["App-RTT", h("span", { class: "muted mono",
            style: "font-size: 11.5px;", title: app.error },
            app.error.length > 40 ? app.error.slice(0, 40) + "…" : app.error)]);
        } else {
          bwPairs.push(["App-RTT", h("span", { class: "mono" },
            app.rtt_ms == null ? "—" : (app.rtt_ms + " ms"))]);
          if (app.visible_ip) {
            bwPairs.push(["Exit IP (CF saw)",
              h("span", { class: "mono" }, app.visible_ip),
              {breakAll: true}]);
          }
        }
      }
      body.appendChild(_detailKvGrid(bwPairs));
    }

    // Notes from the runner (e.g. "protocol can't carry HTTP traffic").
    if ((r.notes || []).length) {
      const ul = h("ul", { class: "muted",
        style: "margin: 12px 0 0; padding-left: 20px; font-size: 12px;" });
      for (const n of r.notes) ul.appendChild(h("li", null, n));
      body.appendChild(ul);
    }

    return body;
  }

  // Quality report — same lazy modal pattern as the speed test:
  // click "Quality report…" in the row menu opens the modal pre-populated
  // with the LAST cached result, no automatic re-run. The operator runs
  // a fresh report explicitly via the "Run report" button. Quality
  // reports are slower than speed tests (16 streaming probes plus 4
  // fraud-source lookups) so the explicit-run pattern matters even more
  // here than for the speed test.
  async function runQualityReport(id) {
    const row = StaticIpSelection.rowsById.get(id);
    if (!row) {
      toast("error", "IP not found", `id=${id}`);
      return;
    }
    _renderQualityReportModal(row, { running: false });
  }

  function _renderQualityReportModal(row, state) {
    state = state || {};
    const cached = (row.static_info || {}).quality || null;
    const result = state.freshResult || cached;
    const hasResult = result != null;

    const body = h("div", null);
    if (state.running) {
      body.appendChild(h("div", { style: "padding: 28px; text-align: center; color: var(--text-dim);" },
        h("div", { class: "spinner", style: "margin: 0 auto 12px;" }),
        "Running quality report… checking ip-api, RDAP, Spamhaus, Scamalytics, plus 16 streaming services."));
    } else if (!hasResult) {
      body.appendChild(h("div", { class: "muted", style: "padding: 24px; text-align: center;" },
        h("div", { style: "margin-bottom: 6px;" }, "No previous quality report for this IP."),
        h("div", { style: "font-size: 12px;" },
          "Click ‘Run report’ below to query ip-api geo + flags, RDAP origin, "
          + "Spamhaus DNSBL, Scamalytics, and 16 streaming-unlock probes. All sources are keyless.")));
    } else {
      body.appendChild(_qualityReportBodyContent({ ip: row.ip, result }));
      if (state.freshResult) {
        body.insertBefore(h("div", {
          style: "padding: 6px 10px; margin-bottom: 10px; "
               + "background: rgba(56,161,105,0.08); border-left: 3px solid var(--accent, #38a169); "
               + "font-size: 12px;",
        }, "Fresh report just generated."), body.firstChild);
      } else if (result.cached_at) {
        body.insertBefore(h("div", {
          class: "muted", style: "font-size: 12px; margin-bottom: 8px;",
        }, "Last generated ", fmtRelative(result.cached_at),
          h("span", { style: "margin: 0 6px;" }, "·"),
          "Click ‘Re-run report’ for fresh data."), body.firstChild);
      }
    }

    const runBtn = h("button", {
      class: "btn btn-primary",
      disabled: state.running ? "true" : null,
      onclick: () => _runQualityReportNow(row),
    }, state.running ? "Running…" : (hasResult ? "Re-run report" : "Run report"));

    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
      runBtn,
    );

    Modal.open({ title: `Quality report · ${row.ip}`, body, footer, size: "wide" });
  }

  async function _runQualityReportNow(row) {
    _renderQualityReportModal(row, { running: true });
    try {
      const r = await api("POST", `/api/static-ips/${row.id}/quality`);
      // Update the cached snapshot on the local row object so the
      // table re-renders the Type/Risk/Unlock cells correctly. We
      // touch the row in-place AND also update the inline cells via
      // _refreshIpQualityCells so the change is visible without a
      // full table reload.
      row.static_info = row.static_info || {};
      row.static_info.quality = r.result;
      _refreshIpQualityCells(row);
      _renderQualityReportModal(row, { running: false, freshResult: r.result });
      toast("success", "Quality report complete", "");
    } catch (err) {
      _renderQualityReportModal(row, { running: false });
      toast("error", "Quality report failed", err.message);
    }
  }

  // Refresh the Type, Risk, and Unlock cells for one row in place
  // after a fresh quality report comes back. Avoids a full table
  // re-render (which would lose loop state, scroll position, and
  // selection bookkeeping).
  function _refreshIpQualityCells(row) {
    const tr = _ipRowEl(row.id);
    if (!tr) return;
    const summary = _ipQualitySummary(row);
    const cells = {
      ".ip-type":       _ipTypeCell(summary, row),
      ".ip-risk-probe": _ipRiskProbeCell(summary),
    };
    for (const [sel, children] of Object.entries(cells)) {
      const td = tr.querySelector(sel);
      if (!td) continue;
      td.replaceChildren(...children);
    }
  }

  // Pure renderer: takes a payload-shaped object {ip, result} and
  // returns a DOM node populated with the quality-report tables.
  // Factored out of the old _openQualityReportModal so the same body
  // content can be re-used for cached, fresh, and historical-comparison
  // views inside the new lazy modal.
  // Standalone streaming-unlock grid (without the Risk-probe wrapper).
  // Used by the Details modal which surfaces streaming as its own
  // top-level card. Returns the inner content (caller wraps in a
  // section header).
  function _streamingGridContent(streaming) {
    const wrap = h("div", null);
    if (!streaming || !streaming.length) {
      wrap.appendChild(h("div", { class: "muted", style: "font-size: 12px;" },
        "No streaming probes recorded yet."));
      return wrap;
    }
    const services = streaming;
    const total = services.length;
    const okN = services.filter(s => s.status === "available").length;
    const partN = services.filter(s => s.status === "redirect").length;
    const blockedN = services.filter(s => s.status === "blocked").length;
    const errN = services.filter(s => !["available","redirect","blocked"].includes(s.status)).length;
    const tally = h("div", { class: "row",
      style: "gap: 6px; margin-bottom: 10px; align-items: center;" },
      h("span", { class: "badge ok",
        style: "font-size: 10.5px;" }, okN + "/" + total + " unlocked"));
    if (blockedN) tally.appendChild(h("span", { class: "badge danger",
      style: "font-size: 10.5px;" }, blockedN + " blocked"));
    if (partN) tally.appendChild(h("span", { class: "badge danger",
      style: "font-size: 10.5px;" }, partN + " redirect"));
    if (errN) tally.appendChild(h("span", { class: "badge",
      style: "font-size: 10.5px;" }, errN + " error"));
    wrap.appendChild(tally);
    const grid = h("div", {
      style: "display: grid; "
           + "grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); "
           + "gap: 8px;",
    });
    for (const s of services) {
      const status = (s.status || "unknown").toLowerCase();
      let bg, fg, border, icon;
      if (status === "available") {
        bg = "rgba(56, 161, 105, 0.10)";
        fg = "var(--success, #2f855a)";
        border = "var(--success, #38a169)";
        icon = "✓";
      } else if (status === "redirect") {
        bg = "rgba(220, 38, 38, 0.06)";
        fg = "var(--danger, #c53030)";
        border = "var(--danger, #dc2626)";
        icon = "↗";
      } else if (status === "blocked") {
        bg = "rgba(220, 38, 38, 0.10)";
        fg = "var(--danger, #c53030)";
        border = "var(--danger, #dc2626)";
        icon = "✗";
      } else {
        bg = "rgba(220, 38, 38, 0.05)";
        fg = "var(--danger, #c53030)";
        border = "rgba(220, 38, 38, 0.4)";
        icon = "?";
      }
      const card = h("div", {
        title: s.error || `${s.code || ""} ${s.status || ""}`.trim(),
        style: "display: flex; align-items: center; gap: 8px; "
             + "padding: 8px 10px; border-radius: 6px; "
             + "background: " + bg + "; "
             + "border-left: 3px solid " + border + "; "
             + "min-width: 0;",
      });
      card.appendChild(h("span", {
        style: "font-size: 14px; font-weight: 700; color: " + fg + "; "
             + "flex-shrink: 0; width: 16px; text-align: center;",
      }, icon));
      const text = h("div", {
        style: "min-width: 0; flex: 1; line-height: 1.3;",
      });
      text.appendChild(h("div", {
        style: "font-weight: 600; font-size: 12.5px; color: var(--text); "
             + "overflow: hidden; text-overflow: ellipsis; white-space: nowrap;",
      }, s.service));
      text.appendChild(h("div", {
        style: "font-size: 10.5px; color: " + fg + "; "
             + "overflow: hidden; text-overflow: ellipsis; white-space: nowrap;",
      }, status + (s.code ? " · " + s.code : "")));
      card.appendChild(text);
      grid.appendChild(card);
    }
    wrap.appendChild(grid);
    return wrap;
  }

  function _qualityReportBodyContent(payload, opts) {
    opts = opts || {};
    const r = payload.result || {};
    const body = h("div", null);
    // Surface a top-of-modal warning for partial reports — most often
    // a gateway row with no exit_ip, where the IP-bound sources had
    // nothing to query and only streaming probes ran.
    if (r.error) {
      body.appendChild(h("div", {
        style: "padding: 8px 12px; margin-bottom: 12px; "
             + "background: var(--warning-bg, rgba(217,119,6,0.08)); "
             + "border-left: 3px solid var(--warning, #d97706); "
             + "font-size: 12.5px;",
      }, "⚠ ", r.error,
        h("div", { class: "muted", style: "margin-top: 4px; font-size: 11.5px;" },
          "Open Edit and set the exit IP to enable geo / risk / RDAP queries.")));
    }
    const headerBits = [
      payload.ip, " · ",
    ];
    if (r.connect_target && r.connect_target !== payload.ip) {
      headerBits.push(h("span", { class: "muted",
        title: "TCP connection target — usually the gateway hostname; geo / risk above use the EXIT IP instead." },
        "via ", r.connect_target, " · "));
    }
    headerBits.push((r.wall_time_seconds || 0) + "s elapsed");
    body.appendChild(h("div", { class: "muted", style: "margin-bottom: 12px;" },
      ...headerBits));

    // ---- Headline flags row ----
    // Surfaces the at-a-glance signals (proxy / hosting / mobile /
    // anonymizer / spamhaus / native?) as a single row of colored
    // pills before the detail grids below. Operator's first scan.
    const flagsRow = h("div", { class: "row",
      style: "gap: 4px; flex-wrap: wrap; margin-bottom: 14px;" });
    const _addFlag = (el) => { if (el) flagsRow.appendChild(el); };
    if (r.ip_api) {
      const g = r.ip_api;
      if (g.hosting === true)  _addFlag(h("span", { class: "badge danger",
        style: "font-size: 10.5px;" }, "datacenter / hosting"));
      else if (g.hosting === false) _addFlag(h("span", { class: "badge ok",
        style: "font-size: 10.5px;" }, "not hosting"));
      if (g.mobile === true) _addFlag(h("span", { class: "badge warn",
        style: "font-size: 10.5px;" }, "mobile"));
      if (g.proxy === true)  _addFlag(h("span", { class: "badge danger",
        style: "font-size: 10.5px;" }, "known proxy"));
    }
    if (r.scamalytics && r.scamalytics.available) {
      const s = r.scamalytics;
      if (s.is_anonymizing_vpn) _addFlag(h("span", { class: "badge danger",
        style: "font-size: 10.5px;" }, "anonymizing VPN"));
      if (s.is_proxy) _addFlag(h("span", { class: "badge danger",
        style: "font-size: 10.5px;" }, "scam-proxy"));
      if (s.is_tor) _addFlag(h("span", { class: "badge danger",
        style: "font-size: 10.5px;" }, "Tor"));
      if (s.is_server) _addFlag(h("span", { class: "badge warn",
        style: "font-size: 10.5px;" }, "server / datacenter"));
    }
    if (r.spamhaus) {
      if (r.spamhaus.available && r.spamhaus.listed) {
        _addFlag(h("span", { class: "badge danger",
          style: "font-size: 10.5px;",
          title: (r.spamhaus.hits || []).map(h2 => `${h2.zone}=${h2.code}`).join(", ") },
          "🚫 Spamhaus LISTED"));
      } else if (r.spamhaus.available) {
        _addFlag(h("span", { class: "badge ok",
          style: "font-size: 10.5px;" }, "Spamhaus clean"));
      }
    }
    if (r.native && r.native.available) {
      if (r.native.native === false) _addFlag(h("span", { class: "badge warn",
        style: "font-size: 10.5px;",
        title: `RDAP says ${r.native.registered_cc} but geo says ${r.native.used_cc}` },
        "non-native (re-announced)"));
      else if (r.native.native === true) _addFlag(h("span", { class: "badge ok",
        style: "font-size: 10.5px;" }, "native"));
    }
    if (flagsRow.childNodes.length) body.appendChild(flagsRow);

    // ---- Geo & ASN block (kvGrid) ----
    if (r.ip_api) {
      const g = r.ip_api;
      body.appendChild(h("div", { class: "muted",
        style: "font-size: 10.5px; margin: 2px 0 6px; "
             + "text-transform: uppercase; letter-spacing: 0.04em; "
             + "font-weight: 600;" },
        "Geo & ASN ",
        h("span", { style: "font-weight: 400; text-transform: none; letter-spacing: 0;" },
          "via ip-api.com")));
      body.appendChild(_detailKvGrid([
        ["Country",      `${g.country || "—"}${g.country_code ? " (" + g.country_code + ")" : ""}`],
        ["City",         g.city],
        ["Organization", g.org, {wrap: true}],
        ["ASN",          g.asname ? `${g.asn} · ${g.asname}` : (g.asn || null), {mono: true, wrap: true}],
        ["Reverse DNS",  g.reverse, {mono: true, breakAll: true, wrap: true}],
      ]));
    }

    // ---- IP origin (RDAP vs geo) ----
    if (r.native) {
      body.appendChild(h("div", { class: "muted",
        style: "font-size: 10.5px; margin: 14px 0 6px; "
             + "text-transform: uppercase; letter-spacing: 0.04em; "
             + "font-weight: 600;" },
        "IP origin ",
        h("span", { style: "font-weight: 400; text-transform: none; letter-spacing: 0;" },
          "via RDAP registry")));
      if (!r.native.available) {
        body.appendChild(h("div", { class: "muted mono",
          style: "font-size: 11.5px;" },
          "(failed: " + (r.native.error || "unknown") + ")"));
      } else {
        body.appendChild(_detailKvGrid([
          ["Native?", r.native.native
            ? h("span", { class: "badge ok",
                style: "font-size: 10.5px;" }, "native (registered = used)")
            : h("span", { class: "badge warn",
                style: "font-size: 10.5px;" }, "non-native — re-announced")],
          ["RIR",                r.native.rir, {mono: true}],
          ["Registered (RDAP)",  r.native.registered_cc, {mono: true}],
          ["Used (geo)",         r.native.used_cc, {mono: true}],
        ]));
      }
    }

    // ---- Scamalytics fraud score ----
    if (r.scamalytics) {
      body.appendChild(h("div", { class: "muted",
        style: "font-size: 10.5px; margin: 14px 0 6px; "
             + "text-transform: uppercase; letter-spacing: 0.04em; "
             + "font-weight: 600;" },
        "Scamalytics ",
        h("span", { style: "font-weight: 400; text-transform: none; letter-spacing: 0;" },
          "via public scrape — keyless")));
      if (!r.scamalytics.available) {
        body.appendChild(h("div", { class: "muted",
          style: "font-size: 11.5px;" },
          "(unavailable — " + (r.scamalytics.error || "scrape failed") + ")"));
      } else {
        const s = r.scamalytics;
        let scoreCell = null;
        if (s.score != null) {
          const sev = (s.score >= 75) ? "danger" : (s.score >= 35 ? "warn" : "ok");
          scoreCell = h("span", { class: "badge " + sev,
            style: "font-size: 10.5px;" }, String(s.score) + " / 100");
        }
        let riskCell = null;
        if (s.risk) {
          const risk = String(s.risk);
          const sev = /high/.test(risk) ? "danger" : (/medium/.test(risk) ? "warn" : "ok");
          riskCell = h("span", { class: "badge " + sev,
            style: "font-size: 10.5px;" }, risk);
        }
        body.appendChild(_detailKvGrid([
          ["Fraud score", scoreCell],
          ["Risk class",  riskCell],
          ["Country",     s.country],
          ["ISP",         s.isp, {wrap: true}],
        ]));
      }
    }

    // ---- Streaming unlock — grid of service cards ----
    // Operators wanted a clearer visual: green for "this works",
    // red for "this doesn't" (anything other than ``available``).
    // Caller can opt out via opts.skip_streaming (e.g. the Details
    // modal which renders streaming as its own top-level card).
    if (!opts.skip_streaming && (r.streaming || []).length) {
      const services = r.streaming;
      const total = services.length;
      const okN = services.filter(s => s.status === "available").length;
      const partN = services.filter(s => s.status === "redirect").length;
      const blockedN = services.filter(s => s.status === "blocked").length;
      const errN = services.filter(s => !["available","redirect","blocked"].includes(s.status)).length;

      const headerRow = h("div", { class: "row",
        style: "align-items: center; gap: 10px; margin: 16px 0 8px;" },
        h("h3", { style: "margin: 0; font-size: 13px; font-weight: 600;" },
          "Streaming unlock"),
        h("span", { class: "muted",
          style: "font-weight: normal; font-size: 11.5px;" },
          "from admin host vantage · " + okN + "/" + total + " unlocked"),
      );
      // Tally pills next to the header so the operator sees the
      // breakdown without scanning the grid.
      if (blockedN) headerRow.appendChild(h("span", {
        class: "badge danger", style: "font-size: 10.5px;" },
        blockedN + " blocked"));
      if (partN) headerRow.appendChild(h("span", {
        class: "badge warn", style: "font-size: 10.5px;" },
        partN + " redirect"));
      if (errN) headerRow.appendChild(h("span", {
        class: "badge", style: "font-size: 10.5px;" },
        errN + " error"));
      body.appendChild(headerRow);

      const grid = h("div", {
        style: "display: grid; "
             + "grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); "
             + "gap: 8px; margin-bottom: 8px;",
      });
      for (const s of services) {
        const status = (s.status || "unknown").toLowerCase();
        let bg, fg, border, icon;
        if (status === "available") {
          bg = "rgba(56, 161, 105, 0.10)";
          fg = "var(--success, #2f855a)";
          border = "var(--success, #38a169)";
          icon = "✓";
        } else if (status === "redirect") {
          // Geo-redirects (3xx) usually mean the service is gating by
          // region — operator wanted these counted as "couldn't
          // unlock", so we color them red too. Distinguishable from
          // blocked by the icon (↗ vs ✗) and the status label.
          bg = "rgba(220, 38, 38, 0.06)";
          fg = "var(--danger, #c53030)";
          border = "var(--danger, #dc2626)";
          icon = "↗";
        } else if (status === "blocked") {
          bg = "rgba(220, 38, 38, 0.10)";
          fg = "var(--danger, #c53030)";
          border = "var(--danger, #dc2626)";
          icon = "✗";
        } else {
          bg = "rgba(220, 38, 38, 0.05)";
          fg = "var(--danger, #c53030)";
          border = "rgba(220, 38, 38, 0.4)";
          icon = "?";
        }
        const card = h("div", {
          title: s.error || `${s.code || ""} ${s.status || ""}`.trim(),
          style: "display: flex; align-items: center; gap: 8px; "
               + "padding: 8px 10px; border-radius: 6px; "
               + "background: " + bg + "; "
               + "border-left: 3px solid " + border + "; "
               + "min-width: 0;",
        });
        card.appendChild(h("span", {
          style: "font-size: 14px; font-weight: 700; color: " + fg + "; "
               + "flex-shrink: 0; width: 16px; text-align: center;",
        }, icon));
        const text = h("div", {
          style: "min-width: 0; flex: 1; line-height: 1.3;",
        });
        text.appendChild(h("div", {
          style: "font-weight: 600; font-size: 12.5px; "
               + "color: var(--text); "
               + "overflow: hidden; text-overflow: ellipsis; white-space: nowrap;",
        }, s.service));
        text.appendChild(h("div", {
          style: "font-size: 10.5px; color: " + fg + "; "
               + "overflow: hidden; text-overflow: ellipsis; white-space: nowrap;",
        }, status + (s.code ? " · " + s.code : "")));
        card.appendChild(text);
        grid.appendChild(card);
      }
      body.appendChild(grid);
    }

    return body;
  }

  async function runTestAll() {
    const btn = document.getElementById("btn-test-all");
    if (btn) { btn.setAttribute("disabled", "true"); btn.textContent = "Testing…"; }
    try {
      const r = await api("POST", "/api/static-ips/test-all");
      openTestAllReportModal(r);
      renderStaticIpsView(document.getElementById("view-root"), {});
      const persistFail = (r.errors || []).length;
      const tone = (r.fail === 0 && persistFail === 0) ? "success" : (persistFail ? "error" : "info");
      const detail = `${r.success}/${r.total} ok · ${r.fail} failed`
        + (persistFail ? ` · ${persistFail} persist errors` : "");
      toast(tone, "Test-all complete", detail);
    } catch (err) {
      toast("error", "Test-all failed", err.message);
    } finally {
      if (btn) { btn.removeAttribute("disabled"); btn.textContent = "Test all"; }
    }
  }

  // Details modal — comprehensive read-only view of an IP, organized
  // as discrete bordered cards so each section is visually distinct.
  // The previous design (flat h3 + table flow) made all sections
  // blur together; the card layout gives each one a clear boundary.
  // NO run buttons here — testing is exclusively through the "Test…"
  // menu. The split keeps responsibilities clean: Test = produce
  // data, Details = view data.
  async function openIpDetailModal(id) {
    try {
      const r = await api("GET", `/api/static-ips/${id}`);
      const body = h("div", null);

      // ---------- helpers ----------
      // Card with header bar + body. The header has a colored bar on
      // the left side (--accent) so each section reads as "its own
      // panel" instead of merging with neighbors.
      function _card(title, hint) {
        const card = h("div", {
          style: "border: 1px solid var(--border, #e2e8f0); "
               + "border-radius: 8px; "
               + "background: var(--surface, #fff); "
               + "margin-bottom: 14px; "
               + "overflow: hidden;",
        });
        const header = h("div", {
          style: "display: flex; align-items: baseline; gap: 10px; "
               + "padding: 10px 14px; "
               + "background: var(--surface-alt, #f7fafc); "
               + "border-bottom: 1px solid var(--border, #e2e8f0); "
               + "border-left: 3px solid var(--accent, #c2410c);",
        },
          h("strong", {
            style: "font-size: 12.5px; letter-spacing: 0.02em; "
                 + "text-transform: uppercase; color: var(--text);",
          }, title),
          hint ? h("span", { class: "muted",
            style: "font-weight: normal; font-size: 11.5px;" }, hint) : null);
        card.appendChild(header);
        const cardBody = h("div", { style: "padding: 12px 14px;" });
        card.appendChild(cardBody);
        body.appendChild(card);
        return cardBody;
      }
      // Two-column key-value grid. Pairs flow left-to-right, top-to-
      // bottom in two columns — way denser than a 1-column table for
      // identity-style metadata. Delegates to the module-scope
      // helper so the Speed-test and Risk-probe renderers can reuse
      // the same look.
      function _kvGrid(pairs, opts) { return _detailKvGrid(pairs, opts); }

      // ----- Identity / metadata (2-column grid) -----
      const idCard = _card("Identity");
      const expiresEl = h("div", null);
      for (const c of _ipExpiresCell(r.expires_at)) expiresEl.appendChild(c);
      const pairs = [
        ["IP / host",  r.ip ? h("span", { class: "mono" }, r.ip) : null],
        ["Port",       r.port == null ? null : h("span", { class: "mono" }, String(r.port))],
        ["Protocol",   h("span", { class: "badge" }, r.protocol || "tcp")],
        ["Kind",       h("span", { class: "badge" }, r.kind || "static")],
      ];
      if (r.kind === "gateway") {
        pairs.push(["Exit IP", r.exit_ip ? h("span", { class: "mono" }, r.exit_ip) : null]);
      }
      pairs.push(["Vendor",   r.gateway_provider]);
      pairs.push(["Expires",  expiresEl]);
      pairs.push(["Country",  r.country]);
      pairs.push(["Provider", r.provider]);
      pairs.push(["Label",    r.label]);
      pairs.push(["Notes",    r.notes]);
      pairs.push(["Created",  r.created_at ? fmtDate(r.created_at) : null]);
      pairs.push(["Updated",  r.updated_at ? fmtDate(r.updated_at) : null]);
      idCard.appendChild(_kvGrid(pairs));

      // ----- Connection URI -----
      const uri = buildIpUri(r);
      const uriCard = _card("Connection URI");
      if (uri) {
        uriCard.appendChild(h("div", {
          style: "display: flex; gap: 8px; align-items: stretch;" },
          h("input", { class: "input mono", value: uri, readonly: "readonly",
                       style: "flex: 1; font-size: 12px;" }),
          h("button", { class: "btn btn-sm btn-primary", onclick: async (ev) => {
            const ok = await copyTextToClipboard(uri);
            ev.currentTarget.textContent = ok ? "Copied ✓" : "Copy failed";
            setTimeout(() => { ev.currentTarget.textContent = "Copy"; }, 1500);
          } }, "Copy")));
      } else {
        uriCard.appendChild(h("div", { class: "muted", style: "font-size: 12px;" },
          "Cannot build a URI — protocol may need credentials, or this "
          + "protocol has no canonical URI form."));
      }

      // ----- Credentials (or VLESS Reality) -----
      const proto = (r.protocol || "tcp").toLowerCase();
      if (proto === "vless") {
        const vCard = _card("VLESS Reality");
        const v = (r.static_info || {}).vless || {};
        vCard.appendChild(_kvGrid([
          ["UUID",     v.uuid    ? h("span", { class: "mono" }, v.uuid) : null],
          ["SNI",      v.sni],
          ["Pubkey",   v.pubkey  ? h("span", { class: "mono" }, v.pubkey) : null],
          ["Short ID", v.short_id ? h("span", { class: "mono" }, v.short_id) : null],
          ["Flow",     v.flow || "(none)"],
        ]));
      } else if (_IP_PROTO_CREDENTIAL_REQUIRED.has(proto)) {
        const cCard = _card("Credentials");
        const credsContent = h("div", null);
        if (r.username || r.password) {
          const credPairs = [];
          if (r.username) {
            credPairs.push(["Username", h("span", { class: "mono",
              style: "word-break: break-all; white-space: normal;" }, r.username)]);
          }
          if (r.password) {
            const pwBox = h("span", { style: "display: inline-flex; align-items: center; gap: 8px;" },
              h("span", { class: "mono" }, "•".repeat(Math.min(r.password.length, 16))),
              h("button", { class: "btn btn-sm",
                onclick: async (ev) => {
                  const ok = await copyTextToClipboard(r.password);
                  ev.currentTarget.textContent = ok ? "Copied ✓" : "Copy failed";
                  setTimeout(() => { ev.currentTarget.textContent = "Copy"; }, 1500);
                } }, "Copy"));
            credPairs.push(["Password", pwBox]);
          }
          if (r.auth_mode) {
            credPairs.push(["Auth mode", h("span", { class: "badge" }, r.auth_mode)]);
          }
          credsContent.appendChild(_kvGrid(credPairs));
        } else {
          credsContent.appendChild(h("div", { class: "muted",
            style: "font-size: 12px;" }, "(none configured — open Edit to add)"));
        }
        cCard.appendChild(credsContent);
      }

      // ----- Xout source (only for kind=xout_inbound) -----
      if (r.kind === "xout_inbound") {
        const meta = (r.static_info || {}).xout_inbound || {};
        const xCard = _card("Xout source");
        xCard.appendChild(_kvGrid([
          ["Node",        meta.node_name],
          ["Inbound tag", meta.inbound_tag ? h("span", { class: "mono" }, meta.inbound_tag) : null],
          ["Preset",      meta.preset_name ? meta.preset_name + " (id=" + meta.preset_id + ")" : null],
        ]));
      }

      // ----- Cached speed test -----
      const sp = (r.static_info || {}).speedtest;
      if (sp) {
        const spCard = _card("Speed test",
          sp.cached_at ? "last run " + fmtRelative(sp.cached_at) : "");
        spCard.appendChild(_speedTestBodyContent({ ip: r.ip, result: sp }));
      }

      // ----- Cached Risk probe (geo / RDAP / Spamhaus / Scamalytics) -----
      // Streaming unlock is split out into its own card below — keeps
      // the Risk probe section focused on IP-classification signals
      // and gives streaming the visual real estate it deserves.
      const q = (r.static_info || {}).quality;
      if (q) {
        const qCard = _card("Risk probe",
          q.cached_at ? "last run " + fmtRelative(q.cached_at) : "");
        qCard.appendChild(_qualityReportBodyContent(
          { ip: r.ip, result: q }, { skip_streaming: true }));
      }

      // ----- Streaming unlock (its own card) -----
      if (q && (q.streaming || []).length) {
        const sCard = _card("Streaming unlock",
          "from admin host vantage" + (q.cached_at ? " · last run " + fmtRelative(q.cached_at) : ""));
        sCard.appendChild(_streamingGridContent(q.streaming));
      }

      // ----- Test history -----
      const histCard = _card("Test history", "last 10 results");
      const history = r.recent_results || [];
      if (history.length) {
        const histTbl = h("table", { class: "data" });
        histTbl.appendChild(h("thead", null, h("tr", null,
          h("th", null, "When"),
          h("th", null, "Kind"),
          h("th", null, "Result"),
          h("th", null, "Latency"),
          h("th", null, "Error"),
        )));
        const histBody = h("tbody");
        for (const row of history.slice(0, 10)) {
          histBody.appendChild(h("tr", null,
            h("td", { class: "muted mono", style: "font-size: 11.5px;" }, fmtDate(row.created_at)),
            h("td", null, h("span", { class: "badge" }, row.test_kind)),
            h("td", null, row.success
              ? h("span", { class: "badge ok" }, "ok")
              : h("span", { class: "badge danger" }, "fail")),
            h("td", { class: "mono" }, row.latency_ms == null ? "—" : (row.latency_ms + "ms")),
            h("td", { class: "muted mono", style: "font-size: 11px;" }, row.error || ""),
          ));
        }
        histTbl.appendChild(histBody);
        const wrap = h("div", { class: "table-wrap" });
        wrap.appendChild(histTbl);
        histCard.appendChild(wrap);
      } else {
        histCard.appendChild(h("div", { class: "muted",
          style: "padding: 12px; text-align: center; font-size: 12.5px;" },
          "No test history yet — open Test… to run something."));
      }

      // Read-only modal: ONLY a Close button. Tests live in the Test
      // modal, edits live in the Edit modal.
      const footer = h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
      );
      Modal.open({ title: `Details · ${r.ip}`, body, footer, size: "xlarge" });
    } catch (err) {
      toast("error", "Failed to load detail", err.message);
    }
  }

  function openEditIpModal(row, onSaved) {
    const allProtos = [
      "tcp", "udp", "http", "https", "ssh", "socks5", "socks4",
      "shadowsocks", "trojan", "vmess", "vless", "wireguard",
      "openvpn", "hysteria", "hysteria2", "icmp", "other",
    ];
    const currentProto = (row.protocol || "tcp").toLowerCase();

    const form = h("form");
    form.appendChild(h("div", { class: "form-row" },
      h("div", { class: "field" },
        h("label", null, "IP / host"),
        h("input", { id: "ip-ip", class: "input mono", value: row.ip, required: true }),
      ),
      h("div", { class: "field" },
        h("label", null, "Port"),
        h("input", { id: "ip-port", class: "input mono", type: "number", min: "1", max: "65535",
                     value: row.port == null ? "" : String(row.port) }),
      ),
    ));

    // Kind picker — static (default, plain IP) vs gateway (provider
    // hostname with session-encoded usernames). Toggling reveals /
    // hides the gateway-only fields below.
    const kindSelect = h("select", { id: "ip-kind", class: "input" });
    for (const [v, lbl] of [
      ["static",        "static — single IP, IP-bound credentials"],
      ["gateway",       "gateway — provider hostname (Decodo / BrightData / Oxylabs / etc.)"],
      ["xout_inbound",  "xout_inbound — pointer to one of our deployed Xout inbounds"],
    ]) {
      kindSelect.appendChild(h("option", {
        value: v, selected: ((row.kind || "static") === v) ? "selected" : null }, lbl));
    }
    form.appendChild(h("div", { class: "field" },
      h("label", null, "Kind"),
      kindSelect,
    ));

    // Vendor + Expires — both UNIVERSAL fields (apply to every row,
    // not just gateway). "Vendor" is where the operator bought this
    // proxy from (decodo / proxy-cheap / brightdata / personal-server /
    // …); "Expires" is the lease / subscription end date.
    const gwProviderInput = h("input", { id: "ip-gw-provider",
      class: "input mono", value: row.gateway_provider || "",
      placeholder: "decodo / proxy-cheap / brightdata / personal-server / …" });
    // Expires picker is day-precision only — operators don't track
    // their proxy leases down to the minute. The backend stores the
    // date as UTC midnight (``YYYY-MM-DDT00:00:00+00:00``); we display
    // it in UTC components so the operator sees back the SAME date
    // they typed regardless of their local timezone.
    const _expVal = row.expires_at ? (() => {
      try {
        const d = new Date(row.expires_at);
        if (isNaN(d.getTime())) return "";
        const pad = n => String(n).padStart(2, "0");

  // Batch from Static IPs — opens a multi-select picker over the
  // current static_ips registry, then for each selected row generates
  // ONE inbound and adds it to the preset editor's inbound list. The
  // tag template is ``{node_name}-<country-zh>``; the literal
  // ``{node_name}`` survives in the stored preset and is substituted
  // to the actual node name (e.g. ``us01``) at deploy time by
  // _xout_resolve_preset on the backend.
  //
  // When called from inside another modal (e.g. the preset editor),
  // pass ``opts.inlineSlot`` — a container element to render the picker
  // into. That keeps the parent modal's DOM intact. Without inlineSlot,
  // the picker falls back to a standalone Modal.open (legacy behaviour).
  async function openBatchInboundsFromStaticIps(opts) {
    opts = opts || {};
    const inlineSlot = opts.inlineSlot || null;
    const closePicker = inlineSlot
      ? () => { while (inlineSlot.firstChild) inlineSlot.removeChild(inlineSlot.firstChild); }
      : () => Modal.close();
    let allIps = [];
    try {
      const r = await api("GET", "/api/static-ips?sort=country");
      allIps = r.static_ips || [];
    } catch (err) {
      toast("error", "Failed to load Static IPs", err.message);
      return;
    }
    // Only http / socks5 / vless are pickable as outbounds — others
    // can't be used in the resolver. Pre-filter so the operator
    // doesn't pick something that won't resolve.
    const eligible = allIps.filter(r => {
      const p = (r.protocol || "").toLowerCase();
      if (!["http", "https", "socks5", "socks", "vless"].includes(p)) return false;
      if (p === "vless") {
        const v = (r.static_info || {}).vless || {};
        return !!(v.uuid && v.sni && (v.pubkey || v.public_key));
      }
      return true;
    });
    if (!eligible.length) {
      toast("info", "No eligible IPs",
            "Need static_ips with protocol http/socks5/vless first.");
      return;
    }

    const selected = new Set();

    const body = h("div");
    body.appendChild(h("p", { class: "muted",
      style: "margin: 0 0 12px; font-size: 12.5px;" },
      "Each picked Static IP becomes ONE inbound on the xout server. "
      + "Inbound protocol is what the CLIENT speaks (Reality looks like "
      + "HTTPS — recommended); outbound chains traffic through the "
      + "Static IP's upstream so each tag = a different exit country. ",
      "Tag template: ",
      h("code", null, "{node_name}-<country-zh>"),
      " — ",
      h("code", null, "{node_name}"),
      " is replaced with the actual node name at deploy time."));

    // VLESS+Reality first / default — clients get a uniform protocol
    // and the obfuscation properties of Reality. The outbound chain

    // determines the exit country, NOT the inbound protocol.
    const protoSel = h("select", { class: "input",
      style: "padding: 4px 8px; font-size: 12.5px;" });
    for (const [v, lbl] of [
      ["vless", "vless + Reality (recommended — uniform client protocol; outbound chains via Static IP)"],
      ["socks", "socks (legacy — exposes raw socks to clients)"],
      ["http",  "http"],

        style: "display: flex; align-items: center; padding: 8px 10px; "
             + "border-radius: 5px; cursor: pointer; "
             + "background: var(--surface-alt, #f7fafc);",

             + "text-overflow: ellipsis; white-space: nowrap;" },

      meta.appendChild(h("span", { style: "margin: 0 4px;" }, "·"));

        meta.appendChild(h("span", null, r.gateway_provider));

      text.appendChild(meta);
      card.appendChild(text);

    body.appendChild(grid);

    const footer = h("div", { class: "row",
      style: inlineSlot
        ? "gap: 8px; margin-top: 12px; padding-top: 10px; "
          + "border-top: 1px dashed var(--border, #e2e8f0);"
        : "" },
      h("button", { class: "btn", onclick: () => closePicker() }, "Cancel"),
      h("button", { class: "btn btn-primary", onclick: () => {
        if (!selected.size) {
          toast("error", "Pick at least one IP", "");
          return;
        }
        const proto = protoSel.value;
        const baseEl = parseInt(portBaseInput.value, 10);
        let portCounter = isFinite(baseEl) && baseEl > 0 ? baseEl : 12001;
        const sni = sniInput.value.trim();
        const user = userInput.value.trim();
        const pass = passInput.value;
        if (proto === "vless" && !sni) {
          toast("error", "VLESS needs SNI",
                "Set the Reality SNI in the form above.");
          return;
        }
        const usedTags = new Set();
        let added = 0;
        for (const r of eligible) {
          if (!selected.has(r.id)) continue;
          // Build tag with country-zh; disambiguate duplicates with -2/-3/...
          // BEFORE the {node_name} substitution so each tag is unique
          // within the preset.
          const country = _countryZh(r);
          let baseTag = "{node_name}-" + country;
          let tag = baseTag, n = 2;
          while (usedTags.has(tag)) tag = baseTag + "-" + (n++);
          usedTags.add(tag);
          const seed = {
            tag,
            protocol: proto,
            port: portCounter++,
            outbound: { type: "static_ip", static_ip_id: r.id },
          };
          if (proto === "vless") seed.reality = { sni };
          else if (user) seed.auth = { user, pass };
          opts.addInbound(seed);
          added++;
        }
        closePicker();
        // After picker closes, the new rows live in the editor's
        // in-memory inbounds[] but are NOT in the DB yet — the modal
        // Save button persists them. The earlier toast just said
        // "Inbounds added" which read like a save confirmation; the
        // wording is intentionally explicit now.
        toast("success",
              `Added ${added} inbound${added === 1 ? "" : "s"} — click Save to persist`,
              "Tag template: {node_name}-<country-zh>");
        // Scroll the inbound table into view so the operator sees the
        // new rows appear instead of just the picker disappearing.
        try {
          const tbl = document.getElementById("ib-table-wrap");
          if (tbl) tbl.scrollIntoView({ behavior: "smooth", block: "center" });
        } catch (_) { /* old browser */ }
        // Highlight the newly-added rows for ~3s so they stand out
        // visually against the existing rows.
        try {
          if (typeof opts.highlightLastN === "function") opts.highlightLastN(added);
        } catch (_) { /* defensive */ }
      } }, "Add inbounds"),
    );

    if (inlineSlot) {
      // Render the picker as a card-style block inside the parent modal,
      // preserving its DOM and the operator's in-progress edits.
      const card = h("div", {
        style: "border: 1px solid var(--accent, #ed8936); border-radius: 6px; "
             + "padding: 12px 14px; margin: 8px 0 12px; "
             + "background: var(--surface-alt, #f7fafc);" });
      card.appendChild(h("div", { class: "row",
        style: "align-items: center; gap: 10px; margin-bottom: 10px;" },
        h("strong", { style: "color: var(--accent, #ed8936); font-size: 13px;" },
          "Batch from Static IPs"),
        h("span", { style: "flex: 1;" }),
        h("button", { class: "btn btn-sm", type: "button",
          title: "Close picker without adding",
          onclick: () => closePicker() }, "✕")));
      card.appendChild(body);
      card.appendChild(footer);
      // Replace any prior render — re-clicking the trigger button just
      // resets the picker rather than nesting two of them.
      while (inlineSlot.firstChild) inlineSlot.removeChild(inlineSlot.firstChild);
      inlineSlot.appendChild(card);
      // Bring the picker into view so the operator sees it appear.
      try { card.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
      catch (_) { /* ignore older browsers */ }
    } else {
      Modal.open({ title: "Batch from Static IPs",
                   body, footer, size: "xlarge" });
    }
  }

  async function openImportFromXoutModal(onDone) {
    const body = h("div", null,
      h("p", { class: "muted" },
        "Pick a deployed Xout node + inbound to register as a Static IP. ",
        "Reality public_keys for VLESS inbounds are fetched live from the node — ",
        "make sure the preset has been deployed so ",
        h("code", null, "/data/preset.json.resolved"),
        " exists."),
    );
    const statusRow = h("div", { class: "muted",
      style: "font-size: 12px; margin: 8px 0;" }, "Loading available inbounds…");
    body.appendChild(statusRow);
    const tableWrap = h("div");
    body.appendChild(tableWrap);

    // Three small fetches in parallel:
    //   /api/xout/nodes   — every xout-deployed node + its current preset_id
    //   /api/xout/presets — full preset bodies (the inbounds we render from)
    //   /api/nodes        — node host strings (preset has just node_name)
    let xoutAssignments = [];
    const presetsById = {};
    const nodesByName = {};
    try {
      const [xnResp, pResp, nResp] = await Promise.all([
        api("GET", "/api/xout/nodes"),
        api("GET", "/api/xout/presets"),
        api("GET", "/api/nodes"),
      ]);
      xoutAssignments = (xnResp && xnResp.nodes) || [];
      const presetsList = (pResp && pResp.presets) || [];
      for (const p of presetsList) presetsById[p.id] = p;
      const nodesList = (nResp && nResp.nodes) || [];
      for (const n of nodesList) nodesByName[n.name] = n;
    } catch (err) {
      statusRow.textContent = "Failed to load Xout state: " + err.message;
      const footer = h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
      );
      Modal.open({ title: "Import from Xout", body, footer, size: "wide" });
      return;
    }

    // Flatten into rows: { node, preset, inbound, protocol }.
    const rows = [];
    for (const a of xoutAssignments) {
      if (!a.preset_id) continue;
      const preset = presetsById[a.preset_id];
      const node = nodesByName[a.node_name];
      if (!preset || !node) continue;
      for (const ib of (preset.inbounds || [])) {
        const proto = (ib.protocol || "").toLowerCase();
        if (!["http", "socks", "socks5", "vless"].includes(proto)) continue;
        rows.push({ node, preset, inbound: ib, protocol: proto });
      }
    }

    if (!rows.length) {
      statusRow.textContent = "No assigned Xout nodes have importable inbounds yet. "
        + "Deploy a preset to a node first.";
      const footer = h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
      );
      Modal.open({ title: "Import from Xout", body, footer, size: "wide" });
      return;
    }

    statusRow.textContent = `${rows.length} importable inbound(s).`;
    const table = h("table", { class: "data" });
    table.appendChild(h("thead", null, h("tr", null,
      h("th", null, "Node"),
      h("th", null, "Inbound tag"),
      h("th", null, "Protocol"),
      h("th", null, "Port"),
      h("th", null, "Auth"),
      h("th", null, ""),
    )));
    const tb = h("tbody");
    for (const r of rows) {
      const auth = r.inbound.auth || {};
      const authLabel = (r.protocol === "vless")
        ? "Reality"
        : (auth.user ? "user/pass" : "anonymous");
      const importBtn = h("button", { class: "btn btn-sm btn-primary",
        onclick: async (ev) => {
          const orig = ev.currentTarget.textContent;
          ev.currentTarget.textContent = "Importing…";
          ev.currentTarget.setAttribute("disabled", "true");
          try {
            const created = await api("POST", "/api/static-ips/from-xout-inbound", {
              node_name: r.node.name,
              inbound_tag: r.inbound.tag,
            });
            toast("success", "Imported", `${created.ip}:${created.port} (${created.protocol})`);
            if (onDone) onDone();
            Modal.close();
          } catch (err) {
            toast("error", "Import failed", err.message);
            ev.currentTarget.textContent = orig;
            ev.currentTarget.removeAttribute("disabled");
          }
        },
      }, "Import");
      tb.appendChild(h("tr", null,
        h("td", null, r.node.name,
          h("div", { class: "muted mono", style: "font-size: 11px;" }, r.node.host)),
        h("td", { class: "mono" }, r.inbound.tag),
        h("td", null, h("span", { class: "badge",
          style: "font-size: 10.5px;" }, r.protocol)),
        h("td", { class: "mono" }, String(r.inbound.port || "?")),
        h("td", { class: "muted", style: "font-size: 12px;" }, authLabel),
        h("td", { style: "text-align: right;" }, importBtn),
      ));
    }
    table.appendChild(tb);
    const wrap = h("div", { class: "table-wrap" });
    wrap.appendChild(table);
    tableWrap.appendChild(wrap);

    const footer = h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
    );
    Modal.open({ title: "Import from Xout", body, footer, size: "wide" });
  }

  async function openAiKeyEditor(existing, onDone) {

      placeholder: "e.g. develop-cc-prod", style: "width: 100%; padding: 6px 8px" });
    const url = h("input", { type: "text",

      style: "width: 100%; padding: 6px 8px; font-family: monospace; font-size: 12px" });

      placeholder: "sk-…", style: "width: 100%; padding: 6px 8px; font-family: monospace; font-size: 12px" });
    const desc = h("input", { type: "text",
      value: (existing && existing.description) || "",
      placeholder: "optional", style: "width: 100%; padding: 6px 8px" });
    const errorEl = h("div", { class: "muted", style: "color: var(--danger); margin-top: 8px" });

    const labelRow = (text, ctrl) => h("div", { style: "margin-bottom: 12px" },
      h("label", { style: "display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px" }, text),
      ctrl);

    const body = h("div", null,
      labelRow("Name (unique)", name),
      labelRow("Base URL", url),
      labelRow("API Key", key),
      labelRow("Description", desc),
      errorEl,
    );

    const footer = h("div", { class: "row", style: "gap: 8px" },
      h("div", { style: "flex: 1" }),
      h("button", { class: "btn", onclick: () => Modal.close() }, "Cancel"),
      h("button", { class: "btn btn-primary",
        onclick: async (e) => {
          e.preventDefault();
          errorEl.textContent = "";
          const payload = {
            name: name.value.trim(),
            url: url.value.trim() || "https://api.develop.cc/v1",
            api_key: key.value.trim(),
            description: desc.value.trim() || null,
          };
          if (!payload.name || !payload.api_key) {
            errorEl.textContent = "Name and API key are required";
            return;
          }
          e.target.disabled = true;
          e.target.textContent = "Saving…";
          try {
            if (existing) {
              await api("PATCH", `/api/ai-api-keys/${existing.id}`, payload);
              toast("success", "Saved", "");
            } else {
              await api("POST", "/api/ai-api-keys", payload);
              toast("success", "Added", "");

            Modal.close();
            if (onDone) onDone();
          } catch (err) {
            errorEl.textContent = err.message || "save failed";
            e.target.disabled = false;
            e.target.textContent = existing ? "Save" : "Add";
          }
        } }, existing ? "Save" : "Add"));

    Modal.open({ title: existing ? `Edit AI key: ${existing.name}` : "New AI key", body, footer });
  }
