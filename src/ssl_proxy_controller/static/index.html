  async function openDeploySshKeyModal(keyId, keyName, onSaved) {
    const form = h("form");
    form.appendChild(h("p", { class: "muted", style: "margin-bottom: 12px" },
      "Pick what to deploy and to which nodes. ",
      h("strong", null, "Push public key"),
      " adds this keypair to the node's ", h("span", { class: "mono" }, "~/.ssh/authorized_keys"),
      " (so clients holding the matching private key can SSH in). ",
      h("strong", null, "Push private key"),
      " writes the private+public files to the node's ",
      h("span", { class: "mono" }, "~/.ssh/" + keyName),
      " (so the node can use this identity to authenticate to GitHub or anywhere this public key is trusted). ",
      h("strong", null, "Push both"),
      " does both."));

    // Node multi-select with Select all / Clear ----------------------
    const listWrap = h("div", { class: "field" },
      h("label", null, "Nodes"));
    const toolbar = h("div", { class: "row", style: "gap: 6px; margin-bottom: 6px;" },
      h("button", { type: "button", class: "btn btn-sm",
        onclick: (e) => { e.preventDefault();
          form.querySelectorAll('input[type="checkbox"][data-node]').forEach(c => c.checked = true);
          updateCount();
        } }, "Select all"),
      h("button", { type: "button", class: "btn btn-sm",
        onclick: (e) => { e.preventDefault();
          form.querySelectorAll('input[type="checkbox"][data-node]').forEach(c => c.checked = false);
          updateCount();
        } }, "Clear"),
      h("span", { class: "muted", id: "deploy-count", style: "margin-left: 8px;" }, "0 selected"),
    );
    listWrap.appendChild(toolbar);
    const list = h("div", {
      style: "max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 6px; background: var(--surface);",
    });
    listWrap.appendChild(list);
    form.appendChild(listWrap);

    function updateCount() {
      const n = form.querySelectorAll('input[type="checkbox"][data-node]:checked').length;
      const el = document.getElementById("deploy-count");
      if (el) el.textContent = `${n} selected`;
    }

    try {
      const r = await api("GET", "/api/nodes");
      const nodes = r.nodes || [];
      if (!nodes.length) {
        list.appendChild(h("div", { class: "muted", style: "padding: 8px;" }, "No nodes registered. Add some on the Nodes page first."));
      } else {
        for (const n of nodes) {
          const id = `dn-${n.name}`;
          const row = h("label", { class: "row",
            style: "gap: 8px; padding: 4px 6px; cursor: pointer; align-items: center;",
            for: id },
            h("input", { type: "checkbox", id, "data-node": n.name, onchange: updateCount }),
            h("span", { class: "mono" }, n.name),
            h("span", { class: "muted", style: "font-size: 11.5px;" },
              ` ${n.ssh_user}@${n.host}:${n.ssh_port}`),
            h("span", { class: "badge",
              style: "margin-left: auto; font-size: 10.5px;" }, n.auth_method),
          );
          list.appendChild(row);
        }
      }
    } catch (err) { toast("error", "Could not list nodes", err.message); }

    // Deploy actions ---------------------------------------------------
    const deployBar = h("div", { class: "row",
      style: "gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);" });

    function selectedNodes() {
      return Array.from(form.querySelectorAll('input[type="checkbox"][data-node]:checked'))
        .map(c => c.getAttribute("data-node"));
    }
    async function doDeploy(mode) {
      const nodes = selectedNodes();
      if (!nodes.length) {
        toast("error", "No nodes selected", "Pick at least one node or click Select all");
        return;
      }
      const modeLabel = { public: "public key", private: "private key", both: "public + private" }[mode];
      // For destructive private-key writes, confirm first.
      if (mode === "private" || mode === "both") {
        if (!confirm(`Push ${modeLabel} to ${nodes.length} node(s)?\n\nThe private key will be written to ~/.ssh/${keyName} on each target. Anyone with shell on that node will be able to read it.`)) return;
      }
      const btns = deployBar.querySelectorAll("button");
      btns.forEach(b => b.setAttribute("disabled", "true"));
      try {
        const r = await api("POST", `/api/ssh-keys/${keyId}/deploy`,
          { nodes, mode });
        Modal.close();
        openDeployResultModal(r);
        toast(r.fail === 0 ? "success" : "info", "Deploy complete",
          `${r.success}/${r.total} ok · ${r.fail} failed`);
        if (onSaved) onSaved();
      } catch (err) {
        toast("error", "Deploy failed", err.message);
      } finally {
        btns.forEach(b => b.removeAttribute("disabled"));
      }
    }
    deployBar.appendChild(h("button", { type: "button", class: "btn",
      onclick: () => Modal.close() }, "Cancel"));
    deployBar.appendChild(h("div", { style: "flex: 1;" }));
    deployBar.appendChild(h("button", { type: "button", class: "btn",
      title: "Append public key to authorized_keys",
      onclick: () => doDeploy("public") }, "📤 Push public"));
    deployBar.appendChild(h("button", { type: "button", class: "btn",
      title: "Write private+public key files to ~/.ssh/<name>",
      onclick: () => doDeploy("private") }, "🔐 Push private"));
    deployBar.appendChild(h("button", { type: "button", class: "btn btn-primary",
      title: "Do both (push public + push private)",
      onclick: () => doDeploy("both") }, "📤🔐 Push both"));

    Modal.open({ title: `Deploy ${keyName}`, body: form, footer: deployBar });
  }

  // Delete a xout product. Server-side rejects if active subscribers
  // remain; we double-check on the client so the typical case never
  // hits the server with a guaranteed-failing request.
  async function deleteXoutProduct(product, onDone) {
    if ((product.subscriber_count || 0) > 0) {
      toast("error", "Has active subscribers",
            `${product.subscriber_count} sub(s) still active. Cancel them first or set the product inactive.`);
      return;
    }
    if (!confirm(`Permanently delete xout product "${product.code}"?\n\n` +
                 `This wipes the product row + any historical subscriptions / quotas / events. ` +
                 `Cannot be undone.`)) return;
    try {
      await api("DELETE", `/api/user-service/xout/products/${product.id}`);
      toast("success", "Product deleted", product.code);
      onDone && onDone();
    } catch (err) {
      toast("error", "Delete failed", err.message || err);
    }
  }

  async function openXoutProductEditor(existing, onDone) {
    // Show a "loading…" toast so the operator gets visible feedback
    // between the click and the modal appearing — the inbounds fetch
    // can take a second or two over WAN. Without this, slow links
    // make Edit feel non-responsive ("点击没反应").
    const loading = toast("info", "Loading xout inbounds…");
    let inbounds = { nodes: [] };
    try {
      const r = await api("GET", "/api/user-service/xout/inbounds");
      inbounds = { nodes: r.nodes || [] };
    } catch (err) {
      toast("error", "Could not load xout inbounds", err.message || err);
      return;
    } finally {
      // Best-effort dismiss; if toast() doesn't return a handle we
      // just let the info toast fade on its own timer.
      try { loading && loading.dismiss && loading.dismiss(); } catch {}
    }

    const isNew = !existing;
    const code = h("input", { class: "input", placeholder: "xout-asia",
      value: existing ? existing.code : "", disabled: !isNew });
    const periodDays = h("input", { class: "input", type: "number", min: "1",
      placeholder: "30", value: existing && existing.period_days ? String(existing.period_days) : "30" });
    const price = h("input", { class: "input", type: "number", min: "0",
      placeholder: "0 (free)", value: existing ? String(existing.price_cents || 0) : "0" });
    const nameZh = h("input", { class: "input", placeholder: "中文显示名",
      value: existing ? ((existing.name || {})["zh-CN"] || "") : "" });
    const nameEn = h("input", { class: "input", placeholder: "English display name",
      value: existing ? ((existing.name || {})["en-US"] || "") : "" });
    const active = h("input", { type: "checkbox" });
    active.checked = existing ? !!existing.active : true;

    // Selector tree: each node has its inbounds with a "include all" master + per-tag checkboxes.
    const selector = (existing && existing.inbound_selector) || { version: 1, nodes: [] };
    const currentSelectorByNode = {};
    for (const n of (selector.nodes || [])) {
      currentSelectorByNode[n.name] = (n.tags && n.tags.length > 0) ? n.tags : ["*"];
    }

    const treeRoot = h("div", { style: "max-height: 280px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 10px" });
    if (inbounds.nodes.length === 0) {
      treeRoot.appendChild(h("div", { class: "muted" },
        "No xout-deployed nodes found. Deploy xout to a node first via the Nodes page."));
    }
    const cbRefs = []; // [{node, tag, cb}]
    for (const node of inbounds.nodes) {
      const nodeBlock = h("div", { style: "margin-bottom: 8px" });
      const head = h("div", { class: "row", style: "gap: 6px; align-items: center; font-weight: 600" });
      const wildCb = h("input", { type: "checkbox" });
      wildCb.dataset.node = node.node_name;
      wildCb.dataset.tag = "*";
      const isWild = (currentSelectorByNode[node.node_name] || []).includes("*");
      wildCb.checked = isWild;
      head.appendChild(wildCb);
      head.appendChild(h("span", null,
        node.node_name,
        h("span", { class: "muted", style: "font-weight: 400; margin-left: 6px; font-size: 12px" },
          node.node_host || "")));
      nodeBlock.appendChild(head);
      cbRefs.push({ node: node.node_name, tag: "*", cb: wildCb });

      const list = h("div", { style: "margin-left: 24px; margin-top: 4px; font-size: 13px" });
      for (const ib of node.inbounds || []) {
        const row = h("label", { class: "row", style: "gap: 6px; align-items: center; padding: 1px 0" });
        const cb = h("input", { type: "checkbox" });
        cb.dataset.node = node.node_name;
        cb.dataset.tag = ib.tag;
        const proto = (ib.protocol || "").toLowerCase();
        // Server-supplied flag: only vless inbounds materialise into the
        // subscription URI. Non-vless ones (socks chain, http chain) are
        // always disabled in the picker — selecting them would silently
        // drop on /sub. Unchecked + disabled keeps the data clean.
        const isUserFacing = ib.is_user_facing !== false && proto === "vless";
        const tags = currentSelectorByNode[node.node_name] || [];
        if (!isUserFacing) {
          cb.checked = false;
          cb.disabled = true;
        } else {
          cb.checked = tags.includes(ib.tag) || isWild;
          if (isWild) cb.disabled = true;
        }
        // Only register user-facing checkboxes — non-vless ones never go
        // into the saved selector regardless of whether the wildcard is
        // toggled on.
        if (isUserFacing) {
          cbRefs.push({ node: node.node_name, tag: ib.tag, cb });
        }
        row.appendChild(cb);
        const lbl = h("span", { style: isUserFacing ? "" : "opacity: 0.55" },
          h("span", { class: "mono", style: "min-width: 60px; display: inline-block" }, String(ib.port)),
          " ",
          h("span", null, ib.tag),
          " ",
          h("span", { class: "muted", style: "font-size: 11px; margin-left: 6px" },
            isUserFacing ? "(vless ✓)" : `(${proto || "non-vless"} — internal chain, not in subscription URI)`));
        row.appendChild(lbl);
        list.appendChild(row);
      }
      nodeBlock.appendChild(list);
      treeRoot.appendChild(nodeBlock);

      // Wildcard toggle disables/enables individual tags
      wildCb.addEventListener("change", () => {
        for (const ref of cbRefs) {
          if (ref.node === node.node_name && ref.tag !== "*") {
            ref.cb.disabled = wildCb.checked;
            if (wildCb.checked) ref.cb.checked = true;
          }
        }
      });
    }

    openModal({
      title: isNew ? "New xout product" : `Edit — ${existing.code}`,
      body: h("div", { class: "form-grid" },
        h("label", null, "Code"), code,
        h("label", null, "Name (zh-CN)"), nameZh,
        h("label", null, "Name (en-US)"), nameEn,
        h("label", null, "Period days"), periodDays,
        h("label", null, "Price (cents)"), price,
        h("label", null, "Active"), h("label", { class: "row", style: "gap: 6px" }, active, h("span", { class: "muted" }, "shown in /api/products")),
        h("label", { style: "grid-column: 1/-1; margin-top: 8px" }, "Visible inbounds"),
        h("div", { style: "grid-column: 1/-1" }, treeRoot),
      ),
      onSave: async () => {
        // Collapse the cbRefs to a per-node tags list
        const byNode = {};
        for (const ref of cbRefs) {
          if (!ref.cb.checked) continue;
          const tags = byNode[ref.node] || (byNode[ref.node] = []);
          if (ref.tag === "*") {
            tags.length = 0;
            tags.push("*");
          } else if (!tags.includes("*")) {
            tags.push(ref.tag);
          }
        }
        const inboundSelector = {
          version: 1,
          nodes: Object.entries(byNode).map(([name, tags]) => ({ name, tags })),
        };
        const payload = {
          period_days: parseInt(periodDays.value, 10) || 30,
          price_cents: parseInt(price.value, 10) || 0,
          name: { "zh-CN": nameZh.value.trim(), "en-US": nameEn.value.trim() },
          active: active.checked,
          inbound_selector: inboundSelector,
        };
        if (isNew) {
          payload.code = code.value.trim();
          if (!/^[a-z][a-z0-9_-]{1,40}$/.test(payload.code)) {
            throw new Error("code must match ^[a-z][a-z0-9_-]{1,40}$");
          }
          payload.kind = "period";
          payload.currency = "USD";
          await api("POST", "/api/user-service/xout/products", payload);
          toast("success", "Xout product created", payload.code);
        } else {
          await api("PATCH", `/api/user-service/xout/products/${existing.id}`, payload);
          toast("success", "Xout product updated", existing.code);
        }
        onDone && onDone();
      },
    });
  }

  // ---------------------------------------------------------------
  // Users page — proxies to user-service /api/admin/users.
  // The proxy is in-process (admin server adds X-Admin-Service-Token),
  // so the operator never needs a separate browser session against
  // user.develop.cc. Settings → User Service must be configured first.
  // ---------------------------------------------------------------
  async function renderUsersView(root) {
    setActiveNav("users");
    root.innerHTML = "";
    root.appendChild(h("div", { class: "page-header" },
      h("div", null,
        h("h1", null, "Users"),
        h("p", { class: "lede" },
          "Sign-up, login, admin gating, and per-user subscriptions. ",
          "Backed by the user-service running at ",
          h("code", null, "user.develop.cc"), ".")),
    ));

    const card = h("div", { class: "card" });
    const search = h("input", { class: "input", placeholder: "Search by email or name", style: "max-width: 240px" });
    const refreshBtn = h("button", { class: "btn btn-sm", onclick: () => load() }, "Refresh");
    const newBtn = h("button", { class: "btn btn-sm btn-primary",
      onclick: () => openUserCreateModal(load) }, "+ New user");
    card.appendChild(h("div", { class: "card-header" },
      h("h2", null, "Users"),
      h("div", { class: "row", style: "gap: 6px; flex: 1; justify-content: flex-end" },
        search, refreshBtn, newBtn)));
    const body = h("div", { class: "card-body" });
    card.appendChild(body);
    root.appendChild(card);

    let debounce;
    search.addEventListener("input", () => {
      clearTimeout(debounce);
      debounce = setTimeout(load, 250);
    });

    async function load() {
      body.innerHTML = "";
      body.appendChild(h("div", { class: "muted" }, "Loading…"));
      try {
        const q = search.value.trim();
        const data = await api("GET", "/api/user-service/users" + (q ? `?q=${encodeURIComponent(q)}` : ""));
        body.innerHTML = "";
        const users = data.users || [];
        if (users.length === 0) {
          body.appendChild(h("div", { class: "muted" },
            "No users yet. The first user to sign up at ",
            h("code", null, "user.develop.cc"), " becomes admin automatically."));
          return;
        }
        const tbl = h("table", { class: "data" });
        tbl.appendChild(h("thead", null, h("tr", null,
          h("th", null, "Email"),
          h("th", null, "Name"),
          h("th", null, "Locale"),
          h("th", null, "Admin"),
          h("th", null, "Status"),
          h("th", null, "Active subs"),
          h("th", null, "Created"),
          h("th", null, ""))));
        const tbody = h("tbody");
        for (const u of users) {
          const tr = h("tr");
          tr.appendChild(h("td", { class: "mono" }, u.primary_email || "—"));
          tr.appendChild(h("td", null, u.display_name || h("span", { class: "muted" }, "—")));
          tr.appendChild(h("td", { class: "mono" }, u.locale || "—"));
          tr.appendChild(h("td", null, u.is_admin
            ? h("span", { class: "badge ok" }, "admin")
            : h("span", { class: "muted" }, "—")));
          tr.appendChild(h("td", null,
            u.status === "active"
              ? h("span", { class: "badge ok" }, "active")
              : h("span", { class: "badge warn" }, u.status || "—")));
          tr.appendChild(h("td", { class: "mono" }, String(u.active_subs || 0)));
          tr.appendChild(h("td", { class: "muted", style: "font-size: 12px" },
            fmtDate(u.created_at)));
          const actions = h("td", { class: "actions" },
            h("button", { class: "btn btn-sm",
              onclick: () => openUserGrantModal(u, load) }, "Grant"));
          if ((u.active_subs || 0) > 0) {
            actions.appendChild(h("button", { class: "btn btn-sm",
              title: "View and copy this user's /sub/{token} subscription URLs",
              onclick: () => openUserSubscriptionsModal(u) },
              `Subs (${u.active_subs})`));
            actions.appendChild(h("button", { class: "btn btn-sm",
              title: "Revoke a currently-active subscription",
              onclick: () => openUserRevokeModal(u, load) }, "Revoke"));
          }
          actions.appendChild(h("button", { class: "btn btn-sm",
            title: u.is_admin ? "Demote — remove admin" : "Promote — make admin",
            onclick: () => toggleUserAdmin(u, load) },
            u.is_admin ? "Demote" : "Promote"));
          tr.appendChild(actions);
          tbody.appendChild(tr);
        }
        tbl.appendChild(tbody);
        const wrap = h("div", { class: "table-wrap" });
        wrap.appendChild(tbl);
        body.appendChild(wrap);
        body.appendChild(h("div", { class: "muted", style: "margin-top: 8px" },
          `${data.total ?? users.length} total`));
      } catch (err) {
        body.innerHTML = "";
        body.appendChild(renderUserServiceError(err, load));
      }
    }
    await load();
  }

  function openUserCreateModal(onDone) {
    const email = h("input", { class: "input", type: "email", required: true,
      placeholder: "user@example.com (required)" });
    const name  = h("input", { class: "input", placeholder: "Display name (optional)" });
    const locale = h("select", { class: "select" });
    locale.appendChild(h("option", { value: "zh-CN" }, "zh-CN"));
    locale.appendChild(h("option", { value: "en-US" }, "en-US"));
    const password = h("input", { class: "input", type: "password",
      placeholder: "Password (≥ 8 chars, optional — leave empty for invite-style accounts)" });
    const isAdmin = h("input", { type: "checkbox" });
    openModal({
      title: "New user",
      body: h("div", { class: "form-grid" },
        h("label", null, "Email *"), email,
        h("label", null, "Display name"), name,
        h("label", null, "Locale"), locale,
        h("label", null, "Password"), password,
        h("label", null, "Admin"), h("label", { class: "row", style: "gap: 6px" }, isAdmin, h("span", { class: "muted" }, "is_admin = true"))),
      onSave: async () => {
        const emailVal = email.value.trim();
        if (!emailVal) {
          email.focus();
          throw new Error("Email is required");
        }
        // Lightweight client-side check; user-service still validates
        // server-side via EMAIL_RE.
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
          email.focus();
          throw new Error("Email looks invalid");
        }
        const payload = { email: emailVal };
        if (name.value.trim())     payload.display_name = name.value.trim();
        if (locale.value)          payload.locale = locale.value;
        if (password.value)        payload.password = password.value;
        if (isAdmin.checked)       payload.is_admin = true;
        await api("POST", "/api/user-service/users", payload);
        toast("success", "User created", payload.email);
        onDone && onDone();
      },
    });
  }

  async function openUserGrantModal(user, onDone) {
    // Pick from active products instead of free-text typing the code.
    let products = [];
    try {
      const r = await api("GET", "/api/user-service/products");
      products = (r.products || []).filter((p) => p.active);
    } catch (err) {
      toast("error", "Could not load products", err.message || err);
      return;
    }
    const productSel = h("select", { class: "select" });
    if (products.length === 0) {
      productSel.appendChild(h("option", { value: "" }, "(no active products — create one first)"));
    } else {
      for (const p of products) {
        const label = p.code + (p.name && p.name["zh-CN"] ? ` · ${p.name["zh-CN"]}` : "")
                      + (p.kind === "period" && p.period_days ? ` · ${p.period_days}d` : "");
        productSel.appendChild(h("option", { value: p.code }, label));
      }
    }
    // Date-only — most operator grants are "good through end of day X",
    // not a wall-clock minute. We translate to 23:59:59 UTC of that day
    // server-side so the subscription stays active through the whole day.
    const expires = h("input", { class: "input", type: "date" });
    const sourceSel = h("select", { class: "select" });
    for (const s of ["manual", "grant", "stripe"]) {
      sourceSel.appendChild(h("option", { value: s }, s));
    }
    openModal({
      title: `Grant subscription — ${user.primary_email}`,
      body: h("div", { class: "form-grid" },
        h("label", null, "Product"), productSel,
        h("label", null, "Source"), sourceSel,
        h("label", null, "Expires (optional)"), expires,
        h("div", { class: "muted", style: "grid-column: 1/-1; font-size: 12px" },
          "If product is ", h("code", null, "kind=period"),
          " and Expires is left empty, it auto-fills from period_days. ",
          "Date-only — interpreted as end-of-day UTC. ",
          "Xout products will also auto-provision the user's vless_uuid on every node in the selector.")),
      onSave: async () => {
        const code = productSel.value.trim();
        if (!code) throw new Error("pick a product");
        const payload = { product_code: code, source: sourceSel.value };
        if (expires.value) {
          // expires.value is YYYY-MM-DD — interpret as 23:59:59.999 UTC
          // so "expires May 6" stays valid through the whole of May 6.
          payload.expires_at = new Date(`${expires.value}T23:59:59.999Z`).toISOString();
        }
        await api("POST", `/api/user-service/users/${user.id}/grant`, payload);
        toast("success", "Subscription granted", `${user.primary_email} → ${code}`);
        onDone && onDone();
      },
    });
  }

  async function toggleUserAdmin(user, onDone) {
    if (!confirm(`${user.is_admin ? "Demote" : "Promote"} ${user.primary_email}?`)) return;
    try {
      await api("POST", `/api/user-service/users/${user.id}/admin`,
                { is_admin: !user.is_admin });
      toast("success", "Admin updated", user.primary_email);
      onDone && onDone();
    } catch (err) {
      toast("error", "Update failed", err.message);
    }
  }

  // Revoke an active subscription. We pull the user's current
  // subscription list to populate the picker — only `status='active'`
  // rows are revocable.
  async function openUserRevokeModal(user, onDone) {
    let subs = [];
    try {
      const r = await api("GET", `/api/user-service/users/${user.id}`);
      subs = (r.subscriptions || []).filter((s) => s.status === "active");
    } catch (err) {
      toast("error", "Could not load subscriptions", err.message || err);
      return;
    }
    if (subs.length === 0) {
      toast("info", "Nothing to revoke", "User has no active subscriptions.");
      onDone && onDone();
      return;
    }
    const sel = h("select", { class: "select" });
    for (const s of subs) {
      const label = s.product_code
                    + (s.product_name && s.product_name["zh-CN"] ? ` · ${s.product_name["zh-CN"]}` : "")
                    + (s.expires_at ? ` · expires ${fmtDate(s.expires_at)}` : "");
      sel.appendChild(h("option", { value: s.product_code }, label));
    }
    openModal({
      title: `Revoke subscription — ${user.primary_email}`,
      body: h("div", { class: "form-grid" },
        h("label", null, "Subscription"), sel,
        h("div", { class: "muted", style: "grid-column: 1/-1; font-size: 12px" },
          "Marks the row ", h("code", null, "status='canceled'"),
          " — node-side xout users will be removed on the next agent sync. ",
          "Usage history is preserved.")),
      onSave: async () => {
        const code = sel.value;
        if (!code) throw new Error("pick a subscription");
        await api("POST", `/api/user-service/users/${user.id}/revoke`,
                  { product_code: code });
        toast("success", "Subscription revoked",
              `${user.primary_email} → ${code}`);
        onDone && onDone();
      },
    });
  }

  // List a user's active subscription URLs. Each active subscription
  // gets a /sub/{token} URL that returns the subscription bundle when
  // hit by a VPN client. We surface the full URL + Copy + Open here so
  // operators can hand a link to a customer without copy-pasting from
  // the DB.
  async function openUserSubscriptionsModal(user) {
    // Fetch in parallel: the user detail (for subscriptions + tokens)
    // and the user-service base URL (so we can build absolute URLs).
    let detail = null;
    let baseUrl = "";
    try {
      const [d, cfg] = await Promise.all([
        api("GET", `/api/user-service/users/${user.id}`),
        api("GET", "/api/system-config/user_service.base_url").catch(() => ({})),
      ]);
      detail = d;
      // /api/system-config/{key} returns the value object directly
      // (e.g. {url: "https://user.develop.cc"}) — not wrapped.
      baseUrl = ((cfg && cfg.url) || "").replace(/\/+$/, "");
    } catch (err) {
      toast("error", "Could not load subscriptions", err.message || err);
      return;
    }
    const subs = (detail.subscriptions || []).filter((s) => s.status === "active");
    const body = h("div", { style: "display: flex; flex-direction: column; gap: 12px" });
    if (subs.length === 0) {
      body.appendChild(h("div", { class: "muted" },
        "No active subscriptions. Use the Grant button to add one."));
    } else if (!baseUrl) {
      body.appendChild(h("div", { class: "alert alert-warn" },
        "User Service base URL is not configured. Set it in ",
        h("strong", null, "Settings → User Service"),
        " before sharing /sub/{token} URLs."));
    }
    // Collect each subscription's card; show only the active one when
    // the user has multiple subs. With 2+ subscriptions we render a
    // product-name tab strip at the top so the operator picks which
    // subscription's URL/content to view. With a single sub there's
    // nothing to switch between, so we skip the tab strip entirely.
    // After the user-system unification (2026-05-06) the subscription
    // URL is per-user, not per-subscription -- user-service surfaces
    // it as detail.subscription_url, and also stamps each
    // subscription entry with the same URL so the existing per-row
    // controls keep working.
    const subCards = [];
    for (const s of subs) {
      const productLabel = (s.product_name && s.product_name["zh-CN"])
        ? `${s.product_code} · ${s.product_name["zh-CN"]}`
        : s.product_code;
      const baseSubUrl = s.subscription_url
        || (detail && detail.subscription_url)
        || "";
      // Active format — toggled by the [base64] [yaml] tab strip below.
      // Single source of truth, mutated by tab clicks, read by URL +
      // Copy + content fetch helpers.
      let activeFmt = "base64";
      const buildUrl = () => {
        if (!baseSubUrl) return "";
        return activeFmt === "base64" ? baseSubUrl : `${baseSubUrl}?format=${activeFmt}`;
      };
      // URL gets its own row, full-width, plus two action buttons next
      // to it (Copy URL / Open). Operators kept saying the truncated
      // 12px input was unreadable.
      const urlEl = h("input", {
        class: "input mono", readonly: true, type: "text",
        style: "font-size: 13px; flex: 1",
        value: baseSubUrl || "(no token — re-grant to issue one)",
        onclick: (e) => e.target.select(),
      });
      const copyUrlBtn = h("button", { class: "btn btn-sm",
        disabled: !baseSubUrl,
        onclick: async () => {
          const ok = await copyTextToClipboard(buildUrl());
          toast(ok ? "success" : "error",
                ok ? "URL copied" : "Copy failed",
                ok ? `${productLabel} (${activeFmt})` : "Try selecting and Cmd+C");
        },
      }, "Copy URL");
      const openBtn = h("button", { class: "btn btn-sm",
        disabled: !baseSubUrl,
        title: "Open the URL in a new tab — preview the raw response",
        onclick: () => window.open(buildUrl(), "_blank", "noopener"),
      }, "Open");
      // Tab strip + content area. Each tab fetches lazily on first
      // activation, then caches; switching tabs is instant. Fetches go
      // straight to user-service /sub/{token} (CORS-allowed) so the
      // operator sees exactly what the client will see.
      const cache = {}; // { base64: {meta, body}, clash: {meta, body} }
      const tabBar = h("div", { class: "row",
        style: "gap: 0; border-bottom: 1px solid var(--border)" });
      const contentMeta = h("div", { class: "muted",
        style: "font-size: 12px; padding: 8px 0 4px" }, "—");
      const contentPre = h("pre", { class: "mono",
        style: "max-height: 320px; overflow: auto; font-size: 11.5px; "
             + "background: var(--card-bg, #faf6ee); padding: 10px; "
             + "border: 1px solid var(--border, #ddd); margin: 0; "
             + "white-space: pre-wrap; word-break: break-all" });
      const copyContentBtn = h("button", { class: "btn btn-sm",
        disabled: !baseSubUrl,
        onclick: async () => {
          const text = (cache[activeFmt] && cache[activeFmt].body) || "";
          if (!text) {
            toast("info", "Nothing to copy", "Wait for content to load.");
            return;
          }
          const ok = await copyTextToClipboard(text);
          toast(ok ? "success" : "error",
                ok ? "Content copied" : "Copy failed",
                ok ? `${productLabel} (${activeFmt})` : "");
        },
      }, "Copy content");
      const refreshBtn = h("button", { class: "btn btn-sm",
        disabled: !baseSubUrl,
        title: "Re-fetch ignoring the cache",
        onclick: () => loadFmt(activeFmt, /*force*/ true),
      }, "Refresh");

      async function loadFmt(fmt, force = false) {
        if (!baseSubUrl) return;
        if (!force && cache[fmt]) {
          contentMeta.textContent = cache[fmt].meta;
          contentPre.textContent = cache[fmt].body;
          return;
        }
        const u = activeFmt === "base64" ? baseSubUrl : `${baseSubUrl}?format=${fmt}`;
        contentMeta.textContent = `Fetching ${u} …`;
        contentPre.textContent = "";
        try {
          const r = await fetch(u, { cache: "no-store" });
          const text = await r.text();
          const ui = r.headers.get("Subscription-Userinfo") || "";
          const meta =
            `HTTP ${r.status} · ${(r.headers.get("content-type") || "").split(";")[0]}`
            + ` · ${text.length} bytes`
            + (ui ? ` · ${ui}` : "");
          cache[fmt] = { meta, body: text };
          if (activeFmt === fmt) {
            contentMeta.textContent = meta;
            contentPre.textContent = text;
          }
        } catch (err) {
          const meta = "Fetch failed (CORS or network)";
          cache[fmt] = { meta, body: String(err && err.message || err) };
          if (activeFmt === fmt) {
            contentMeta.textContent = meta;
            contentPre.textContent = cache[fmt].body;
          }
        }
      }

      // Tab style: pill underline for active. Two tabs only — base64
      // (default, what most clients want) and yaml (Clash format).
      const tabBtn = (label, fmt) => {
        const b = h("button", {
          class: "btn btn-sm",
          style: "border: none; background: transparent; "
               + "border-bottom: 2px solid transparent; "
               + "border-radius: 0; padding: 8px 14px; font-weight: 500",
          onclick: () => {
            activeFmt = fmt;
            urlEl.value = buildUrl() || urlEl.value;
            for (const t of tabBar.children) {
              t.style.borderBottom = "2px solid transparent";
              t.style.opacity = "0.6";
            }
            b.style.borderBottom = "2px solid var(--accent, #b06c2c)";
            b.style.opacity = "1";
            loadFmt(fmt);
          },
        }, label);
        return b;
      };
      tabBar.appendChild(tabBtn("base64", "base64"));
      tabBar.appendChild(tabBtn("yaml", "clash"));
      // Speed-test tab — runs separate logic instead of fetching /sub.
      // We hide the URL/Copy/Refresh buttons + content pre when this tab
      // is active, and show a probe results table instead.
      const speedTbl = h("table", { class: "data",
        style: "width: 100%; font-size: 12.5px; display: none" });
      speedTbl.appendChild(h("thead", null, h("tr", null,
        h("th", null, "Node"),
        h("th", null, "Server:Port"),
        h("th", null, "TCP latency"),
        h("th", null, "Status"))));
      const speedTbody = h("tbody");
      speedTbl.appendChild(speedTbody);
      const probeAllBtn = h("button", { class: "btn btn-sm",
        disabled: !baseSubUrl,
        style: "display: none",
        onclick: () => runProbeAll(),
      }, "Probe all");
      // Parse Clash YAML body into [{name, host, port}, ...]. Regex —
      // not a full YAML parser, but the body is generated by us
      // (_build_clash_yaml) so we know the exact shape: each proxy
      // block has `name:`, `server:`, `port:` lines.
      function parseProxies(yamlText) {
        const out = [];
        const re = /-\s+name:\s+"?([^"\n]+)"?\s*\n[\s\S]*?server:\s+"?([^"\n]+?)"?\s*\n\s+port:\s+(\d+)/g;
        let m;
        while ((m = re.exec(yamlText)) !== null) {
          out.push({ name: m[1].trim(), host: m[2].trim(), port: parseInt(m[3], 10) });
        }
        return out;
      }
      async function runProbeAll() {
        // Make sure we have the clash body cached so we can parse it.
        if (!cache.clash) await loadFmt("clash");
        const body = (cache.clash && cache.clash.body) || "";
        const proxies = parseProxies(body);
        speedTbody.innerHTML = "";
        if (proxies.length === 0) {
          speedTbody.appendChild(h("tr", null,
            h("td", { colspan: 4, class: "muted" },
              "No nodes found — yaml content is empty.")));
          return;
        }
        // Render a row per proxy with placeholder cells we'll fill in.
        const rowEls = proxies.map((p) => {
          const lat = h("td", { class: "mono muted" }, "…");
          const st = h("td", { class: "muted" }, "queued");
          const tr = h("tr", null,
            h("td", null, p.name),
            h("td", { class: "mono", style: "font-size: 12px" },
              `${p.host}:${p.port}`),
            lat, st);
          speedTbody.appendChild(tr);
          return { p, lat, st };
        });
        probeAllBtn.disabled = true;
        probeAllBtn.textContent = "Probing…";
        try {
          // Sequential — keeps the UI responsive and avoids slamming a
          // node with 7 concurrent connect attempts (which can look
          // like an attack on a small VPS).
          for (const { p, lat, st } of rowEls) {
            st.textContent = "probing…";
            st.className = "muted";
            try {
              const r = await api("POST", "/api/probe-host",
                { host: p.host, port: p.port, timeout_ms: 4000 });
              const ms = r.latency_ms;
              lat.textContent = `${ms} ms`;
              if (r.ok) {
                lat.className = "mono " + (ms < 100 ? "" :
                  ms < 250 ? "" : "muted");
                st.innerHTML = "";
                st.appendChild(h("span", { class: "badge ok" }, "ok"));
              } else {
                lat.className = "mono muted";
                st.innerHTML = "";
                st.appendChild(h("span", { class: "badge warn" },
                  r.error || "fail"));
              }
            } catch (err) {
              lat.textContent = "—";
              st.innerHTML = "";
              st.appendChild(h("span", { class: "badge warn" },
                (err && err.message) || "error"));
            }
          }
        } finally {
          probeAllBtn.disabled = false;
          probeAllBtn.textContent = "Probe again";
        }
      }
      // Custom tab btn for speed — not a /sub format, so it bypasses
      // loadFmt + content fetch + URL update. Toggles visibility.
      const speedTabBtn = h("button", {
        class: "btn btn-sm",
        style: "border: none; background: transparent; "
             + "border-bottom: 2px solid transparent; "
             + "border-radius: 0; padding: 8px 14px; font-weight: 500",
        onclick: () => {
          activeFmt = "_speed_";
          for (const t of tabBar.children) {
            t.style.borderBottom = "2px solid transparent";
            t.style.opacity = "0.6";
          }
          speedTabBtn.style.borderBottom = "2px solid var(--accent, #b06c2c)";
          speedTabBtn.style.opacity = "1";
          // Hide normal content view, show speed view.
          contentMeta.style.display = "none";
          contentPre.style.display = "none";
          copyContentBtn.style.display = "none";
          refreshBtn.style.display = "none";
          speedTbl.style.display = "table";
          probeAllBtn.style.display = "inline-block";
          // Auto-run on first activation.
          if (speedTbody.children.length === 0) runProbeAll();
        },
      }, "speed test");
      tabBar.appendChild(speedTabBtn);
      // Wrap base64/yaml tab clicks to restore default visibility.
      for (const tab of [tabBar.children[0], tabBar.children[1]]) {
        const orig = tab.onclick;
        tab.onclick = (e) => {
          contentMeta.style.display = "";
          contentPre.style.display = "";
          copyContentBtn.style.display = "";
          refreshBtn.style.display = "";
          speedTbl.style.display = "none";
          probeAllBtn.style.display = "none";
          orig(e);
        };
      }
      // Activate the first tab — also kicks off the initial fetch.
      tabBar.children[0].click();

      const meta = [];
      meta.push(h("span", { class: "badge ok" }, "active"));
      if (s.expires_at) {
        meta.push(h("span", { class: "muted", style: "font-size: 12px" },
          `expires ${fmtDate(s.expires_at)}`));
      } else {
        meta.push(h("span", { class: "muted", style: "font-size: 12px" }, "no expiry"));
      }
      meta.push(h("span", { class: "muted", style: "font-size: 12px" },
        `kind=${s.kind || "—"}`));
      const card = h("div", { class: "card" },
        h("div", { class: "card-body",
          style: "padding: 14px; display: flex; flex-direction: column; gap: 10px" },
          // Row 1: product header
          h("div", { class: "row",
            style: "gap: 10px; align-items: center; flex-wrap: wrap" },
            h("strong", null, productLabel),
            ...meta),
          // Row 2: full-width URL + Copy URL + Open
          h("div", { class: "row", style: "gap: 6px; align-items: stretch" },
            urlEl, copyUrlBtn, openBtn),
          // Row 3+: tab strip and content body
          h("div", { class: "row",
            style: "gap: 0; align-items: flex-end; justify-content: space-between" },
            tabBar,
            h("div", { class: "row", style: "gap: 6px; padding-bottom: 4px" },
              copyContentBtn, refreshBtn, probeAllBtn)),
          contentMeta,
          contentPre,
          speedTbl));
      subCards.push({ card, label: productLabel, sub: s });
    }
    // Render: optional product-tab strip (only when 2+ subs) +
    // the active subscription's card.
    if (subCards.length > 1) {
      const productBar = h("div", { class: "row",
        style: "gap: 0; border-bottom: 1px solid var(--border); "
             + "margin-bottom: 4px; flex-wrap: wrap" });
      const showCard = (idx) => {
        for (let i = 0; i < subCards.length; i++) {
          subCards[i].card.style.display = i === idx ? "" : "none";
        }
        for (let i = 0; i < productBar.children.length; i++) {
          const t = productBar.children[i];
          t.style.borderBottom = i === idx
            ? "2px solid var(--accent, #b06c2c)"
            : "2px solid transparent";
          t.style.opacity = i === idx ? "1" : "0.6";
        }
      };
      subCards.forEach((sc, i) => {
        const tabBtn = h("button", {
          class: "btn btn-sm",
          style: "border: none; background: transparent; "
               + "border-bottom: 2px solid transparent; "
               + "border-radius: 0; padding: 8px 14px; font-weight: 500",
          onclick: () => showCard(i),
        }, sc.label);
        productBar.appendChild(tabBtn);
      });
      body.appendChild(productBar);
      for (const sc of subCards) body.appendChild(sc.card);
      // Activate the first sub by default — its content will fetch
      // automatically because the inner format-tab onclick fires when
      // its card was constructed (still queued in cache).
      showCard(0);
    } else {
      // Single sub — no product tab strip needed.
      for (const sc of subCards) body.appendChild(sc.card);
    }
    Modal.open({
      title: `Subscriptions — ${user.primary_email}`,
      body: body,
      footer: h("button", { class: "btn", onclick: () => Modal.close() }, "Close"),
    });
  }

  // ---------------------------------------------------------------
  // Products page — manage the catalog rows that user.develop.cc
  // /api/products lists publicly. Localised name/description live
  // ===========================================================================
  // SERVICE PLUGIN TEMPLATE (added 2026-05-09)
  // ---------------------------------------------------------------------------
  // Each downstream service registers ONE render function in NAV_REGISTRY and
  // builds its UI inside the supplied root using the helpers below + the
  // existing h(), Modal, toast(), api(). This keeps every service's admin
  // page visually consistent.
  //
  // Helpers (all return DOM nodes, all use CSS vars from :root):
  //   uiPageHeader(title, lede, ...actions)
  //       Standard page header with H1 + descriptive lede + right-aligned
  //       action buttons / inputs.
  //   uiCard(...children)
  //       Surface-colored block with the standard padding + border. Equivalent
  //       to <div class="card"> but composable.
  //   uiSection(title, ...children)
  //       Card + a small uppercase label at the top. Use when a single page
  //       has multiple logical sections.
  //   uiKVRow(label, value)
  //       Two-column row, dim label / regular value. Useful for inline
  //       summaries.
  //   uiToolbar(...children)
  //       Flex row, wraps, gap of 8px. For a strip of inline form controls.
  //
  // Pattern recap (look at renderBillingView below for a worked example):
  //   1. setActiveNav("<slug>")
  //   2. root.innerHTML = "" (always — the SPA reuses the same root for
  //      every view)
  //   3. root.appendChild(uiPageHeader(...))
  //   4. Async fetch via api()
  //   5. Build sections with uiCard/uiSection
  //   6. Wire events directly on the elements (no event delegation)
  // ===========================================================================
  function uiPageHeader(title, lede, ...actions) {
    return h("div", { class: "page-header" },
      h("div", null,
        h("h1", null, title),
        lede ? h("p", { class: "lede" }, lede) : null,
      ),
      actions.length ? h("div", { class: "row", style: "gap: 8px; flex-wrap: wrap;" }, ...actions) : null,
    );
  }
  function uiCard(...children) {
    return h("div", { class: "card" }, ...children);
  }
  function uiSection(title, ...children) {
    return h("div", { class: "card", style: "margin-bottom: 12px;" },
      title ? h("div", {
        style: "font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-soft); margin-bottom: 12px;"
      }, title) : null,
      ...children,
    );
  }
  function uiKVRow(label, value) {
    return h("div", { style: "display: grid; grid-template-columns: 200px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px;" },
      h("span", { style: "color: var(--text-dim);" }, label),
      h("span", { style: "color: var(--text); font-family: var(--mono);" },
        value === undefined || value === null || value === "" ? h("em", { class: "muted" }, "—") : value),
    );
  }
  function uiToolbar(...children) {
    return h("div", { class: "row", style: "gap: 8px; flex-wrap: wrap; align-items: center;" }, ...children);
  }

  // ===========================================================================
  // Billing — model pricing + tier products + global discount.
  // First example of the service-plugin template (see comments above).
  // ===========================================================================
  async function renderBillingView(root) {
    setActiveNav("billing");
    root.innerHTML = "";

    root.appendChild(uiPageHeader(
      "Billing",
      "Per-model OpenAI rates, the global discount applied to user invoices, and the monthly tier products. Lives in user-service; edits hit /api/user-service/billing/* and propagate to chatbot on the next charge.",
    ));

    // Discount factor + tier summary in two columns
    const settingsCard = uiSection("Global");
    const tiersCard = uiSection("Tiers");
    const layout = h("div", { style: "display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;" }, settingsCard, tiersCard);
    root.appendChild(layout);

    // Model pricing table
    const pricingCard = uiSection("Model pricing (USD per 1M tokens)");
    const pricingBody = h("div", null, h("p", { class: "muted" }, "Loading…"));
    pricingCard.appendChild(pricingBody);
    root.appendChild(pricingCard);

    // ---- Settings ----
    settingsCard.appendChild(h("p", { class: "muted", style: "margin-bottom: 12px;" },
      "Discount factor multiplies OpenAI's official rate before deducting from the user's daily allowance. ",
      h("strong", null, "0.8"), " means users pay 80% of the list price; ",
      h("strong", null, "0.5"), " means 50%."));
    const discountInput = h("input", {
      class: "input", type: "number", step: "0.01", min: "0", max: "2", style: "width: 120px;"
    });
    const discountSaveBtn = h("button", { class: "btn btn-primary btn-sm" }, "Save");
    settingsCard.appendChild(uiToolbar(
      h("label", { style: "color: var(--text-dim); font-size: 13px;" }, "Discount factor"),
      discountInput,
      discountSaveBtn,
    ));

    try {
      const settings = await api("GET", "/api/user-service/billing/settings");
      discountInput.value = String(settings.discount_factor ?? 0.8);
    } catch (e) {
      toast("error", "Could not load billing settings", e.message);
    }
    discountSaveBtn.addEventListener("click", async () => {
      const v = parseFloat(discountInput.value);
      if (!Number.isFinite(v) || v < 0 || v > 2) {
        toast("warning", "Discount must be between 0 and 2");
        return;
      }
      discountSaveBtn.disabled = true;
      try {
        await api("PUT", "/api/user-service/billing/settings", { discount_factor: v });
        toast("success", `Discount factor saved as ${v}× — chatbot picks up new rate within 30s`);
      } catch (e) {
        toast("error", "Save failed", e.message);
      } finally {
        discountSaveBtn.disabled = false;
      }
    });

    // ---- Tiers ----
    try {
      const { tiers } = await api("GET", "/api/user-service/billing/tiers");
      if (!tiers || !tiers.length) {
        tiersCard.appendChild(h("p", { class: "muted" }, "No tier_* products yet. Run the billing seed migration."));
      } else {
        const table = h("table", { class: "data", style: "margin-top: 4px;" });
        table.appendChild(h("thead", null, h("tr", null,
          h("th", null, "Code"),
          h("th", null, "Name"),
          h("th", { style: "text-align: right;" }, "Price/mo"),
          h("th", { style: "text-align: right;" }, "Daily / Trial"),
          h("th", { style: "text-align: center;" }, "Active"),
        )));
        const tbody = h("tbody");
        for (const t of tiers) {
          const meta = t.metadata || {};
          const dollar = (cents) => cents ? "$" + (cents / 100).toFixed(2) : "—";
          const dailyOrTrial =
            meta.daily_allowance_cents != null
              ? dollar(meta.daily_allowance_cents) + " / day"
              : meta.lifetime_trial_cents != null
                ? dollar(meta.lifetime_trial_cents) + " trial"
                : "—";
          tbody.appendChild(h("tr", null,
            h("td", null, h("code", { class: "mono" }, t.code)),
            h("td", null, (t.name && (t.name.en || Object.values(t.name)[0])) || ""),
            h("td", { style: "text-align: right; font-family: var(--mono);" }, dollar(t.price_cents)),
            h("td", { style: "text-align: right; font-family: var(--mono);" }, dailyOrTrial),
            h("td", { style: "text-align: center;" }, t.active ? "✓" : "—"),
          ));
        }
        table.appendChild(tbody);
        tiersCard.appendChild(table);
        tiersCard.appendChild(h("p", { class: "muted", style: "margin-top: 8px; font-size: 12px;" },
          "Edit tier prices/daily allowances on the ",
          h("a", { href: "#/products" }, "Products"), " page."));
      }
    } catch (e) {
      tiersCard.appendChild(h("p", { class: "muted danger" }, "Failed to load tiers: " + e.message));
    }

    // ---- Model pricing ----
    pricingBody.innerHTML = "";
    const addBtn = h("button", { class: "btn btn-primary btn-sm" }, "+ Add model");
    pricingBody.appendChild(uiToolbar(addBtn));
    const tableHost = h("div", { style: "margin-top: 12px;" });
    pricingBody.appendChild(tableHost);

    async function refreshPricing() {
      tableHost.innerHTML = "";
      tableHost.appendChild(h("p", { class: "muted" }, "Loading…"));
      try {
        const { models } = await api("GET", "/api/user-service/billing/pricing");
        tableHost.innerHTML = "";
        if (!models || !models.length) {
          tableHost.appendChild(h("p", { class: "muted" }, "No model_pricing rows yet."));
          return;
        }
        const usd = (m) => m == null ? "—" : "$" + (m / 1_000_000).toFixed(4);
        const table = h("table", { class: "data" });
        table.appendChild(h("thead", null, h("tr", null,
          h("th", null, "Model"),
          h("th", null, "Mode"),
          h("th", { style: "text-align: right;" }, "Input"),
          h("th", { style: "text-align: right;" }, "Cached"),
          h("th", { style: "text-align: right;" }, "Output"),
          h("th", { style: "text-align: center;" }, "Active"),
          h("th", { style: "text-align: right;" }, ""),
        )));
        const tbody = h("tbody");
        for (const m of models) {
          const editBtn = h("button", { class: "btn btn-sm btn-ghost" }, "Edit");
          editBtn.addEventListener("click", () => openPricingModal(m, refreshPricing));
          const delBtn = h("button", { class: "btn btn-sm btn-danger" }, "Delete");
          delBtn.addEventListener("click", async () => {
            if (!await Modal.confirm(`Delete pricing for ${m.model_id}?`,
                "Charges that reference this model will fail until you re-create it.")) return;
            try {
              await api("DELETE", `/api/user-service/billing/pricing/${m.id}`);
              toast("success", "Deleted");
              refreshPricing();
            } catch (e) { toast("error", "Delete failed", e.message); }
          });
          tbody.appendChild(h("tr", null,
            h("td", null, h("code", { class: "mono" }, m.model_id)),
            h("td", null, h("span", { class: "muted" }, m.modality + "/" + m.pricing_kind)),
            h("td", { style: "text-align: right; font-family: var(--mono);" }, usd(m.input_rate_micros)),
            h("td", { style: "text-align: right; font-family: var(--mono);" }, usd(m.cached_input_rate_micros)),
            h("td", { style: "text-align: right; font-family: var(--mono);" }, usd(m.output_rate_micros)),
            h("td", { style: "text-align: center;" }, m.active ? "✓" : "—"),
            h("td", { style: "text-align: right;" }, h("div", { class: "row", style: "gap: 4px; justify-content: flex-end;" }, editBtn, delBtn)),
          ));
        }
        table.appendChild(tbody);
        tableHost.appendChild(table);
      } catch (e) {
        tableHost.innerHTML = "";
        tableHost.appendChild(h("p", { class: "muted danger" }, "Failed to load pricing: " + e.message));
      }
    }
    addBtn.addEventListener("click", () => openPricingModal(null, refreshPricing));
    refreshPricing();
  }

  function openPricingModal(existing, onSaved) {
    const isNew = !existing;
    const modelInput = h("input", { class: "input", value: existing?.model_id ?? "" });
    const displayInput = h("input", { class: "input",
      placeholder: "GPT-5.5",
      value: existing?.display_name?.en ?? "" });
    const modalitySel = h("select", { class: "input" },
      h("option", { value: "text", selected: (existing?.modality ?? "text") === "text" }, "text"),
      h("option", { value: "image", selected: existing?.modality === "image" }, "image"),
      h("option", { value: "audio", selected: existing?.modality === "audio" }, "audio"),
      h("option", { value: "video", selected: existing?.modality === "video" }, "video"),
    );
    const m = (n) => n == null ? "" : (n / 1_000_000).toFixed(4);
    const inputRate = h("input", { class: "input", type: "number", step: "0.0001", min: "0", placeholder: "USD per 1M",
      value: m(existing?.input_rate_micros) });
    const cachedRate = h("input", { class: "input", type: "number", step: "0.0001", min: "0", placeholder: "USD per 1M",
      value: m(existing?.cached_input_rate_micros) });
    const outputRate = h("input", { class: "input", type: "number", step: "0.0001", min: "0", placeholder: "USD per 1M",
      value: m(existing?.output_rate_micros) });
    const activeChk = h("input", { type: "checkbox", checked: existing?.active !== false });
    const notesArea = h("textarea", { class: "input", rows: 2, placeholder: "OpenAI standard tier, …" }, existing?.notes ?? "");

    const field = (label, control) => h("div", { style: "margin-bottom: 12px;" },
      h("label", { style: "display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px;" }, label),
      control,
    );

    const body = h("div", { style: "display: grid; grid-template-columns: 1fr 1fr; gap: 12px;" },
      field("Model id (e.g. gpt-5.4)", modelInput),
      field("Display name (English)", displayInput),
      field("Modality", modalitySel),
      field("", h("label", { style: "display: flex; align-items: center; gap: 6px; font-size: 13px; padding-top: 22px;" }, activeChk, "Active")),
      field("Input rate (USD per 1M tokens)", inputRate),
      field("Cached-input rate", cachedRate),
      field("Output rate", outputRate),
      h("div", { style: "grid-column: 1/-1;" }, field("Notes", notesArea)),
    );

    Modal.open({
      title: isNew ? "Add model pricing" : `Edit pricing — ${existing.model_id}`,
      body,
      primary: { label: "Save", onClick: async () => {
        const toMicros = (v) => v === "" || v == null ? null : Math.round(parseFloat(v) * 1_000_000);
        const payload = {
          model_id: modelInput.value.trim(),
          display_name: displayInput.value.trim() ? { en: displayInput.value.trim() } : {},
          pricing_kind: "tokens",
          modality: modalitySel.value,
          input_rate_micros: toMicros(inputRate.value),
          cached_input_rate_micros: toMicros(cachedRate.value),
          output_rate_micros: toMicros(outputRate.value),
          active: activeChk.checked,
          notes: notesArea.value.trim() || null,
          source_url: existing?.source_url ?? "https://developers.openai.com/api/docs/pricing",
        };
        if (!payload.model_id) {
          toast("warning", "model_id is required");
          return false;
        }
        try {
          await api("POST", "/api/user-service/billing/pricing", payload);
          toast("success", `Pricing saved for ${payload.model_id}`);
          Modal.close();
          if (onSaved) onSaved();
        } catch (e) {
          toast("error", "Save failed", e.message);
        }
      } },
      secondary: { label: "Cancel" },
    });
  }

  async function renderProductsView(root) {
    setActiveNav("products");
    root.innerHTML = "";
    root.appendChild(h("div", { class: "page-header" },
      h("div", null,
        h("h1", null, "Products"),
        h("p", { class: "lede" },
          "Subscription catalog — what users can be granted or pay for. ",
          "Stored in user-service. Inactive entries stay listed here for editing but are hidden from ",
          h("code", null, "/api/products"), ".")),

            h("code", null, "xout-basic"), "."));
          return;
        }
        // Group by service_code; preserve deterministic order.
        const SERVICE_ORDER_P = ["chat", "xout", "platform"];
        const SERVICE_LABELS_P = { chat: "Chat AI", xout: "Xout VPN", platform: "Platform" };
        const grouped = {};
        for (const p of products) {

          h("th", null, "Code"),
          h("th", null, "Name (zh-CN)"),
